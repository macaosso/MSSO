name: Auto Update Typhoon Tracks

on:
  schedule:
    # 預設每 3 小時執行一次
    - cron: '0 */3 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  update-tracks:
    runs-on: ubuntu-latest
    
    # 賦予 GitHub Actions 寫入儲存庫的權限
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chinese Fonts and Update Cache
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          # 強制更新字型快取，讓系統與 Matplotlib 找得到新字型
          fc-cache -f -v
          rm -rf ~/.cache/matplotlib

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib cartopy scipy shapely

      - name: Clean output directory
        run: |
          # 確保資料夾存在並清空所有舊檔案
          mkdir -p output/TC
          rm -rf output/TC/*

      - name: Run typhoon track generation script
        run: |
          python python/TC_track.py
          
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add output/TC/
          git commit -m "Auto-update typhoon track maps [skip ci]" || exit 0
          git pull origin main --rebase
          git push origin main
