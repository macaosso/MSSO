name: Auto Update Typhoon Tracks

on:
  schedule:
    # 預設每 3 小時執行一次
    - cron: '0 */3 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  update-tracks:
    runs-on: ubuntu-latest
    
    # 賦予 GitHub Actions 寫入儲存庫的權限
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 【修正 1】必須在執行 Python 腳本之前安裝中文字型
      - name: Install Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 直接安裝您 Python 腳本中引用到的所有相依套件
          pip install pandas numpy matplotlib cartopy scipy shapely

      # 【修正 2】確保這一步驟在安裝好字型與相依套件之後才執行
      - name: Run typhoon track generation script
        run: |
          # 請確認這裡的指令碼檔名與您實際執行的檔案一致
          python python/TC_track.py
          
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 將產生的路徑圖檔案加入版控
          git add output/TC/
          
          # 提交變更，若沒有新檔案則直接結束
          git commit -m "Auto-update typhoon track maps [skip ci]" || exit 0
          
          # 推送前先拉取遠端最新變更並進行 rebase，避免拒絕推送錯誤
          git pull origin main --rebase
          
          # 推送回主分支
          git push origin main
