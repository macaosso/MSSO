name: Auto Update Typhoon Tracks

on:
  schedule:
    # 預設每 3 小時執行一次，您可以根據需求自行調整 cron 時間
    - cron: '0 */3 * * *'
  workflow_dispatch: # 允許在 GitHub 介面上手動觸發

jobs:
  update-tracks:
    runs-on: ubuntu-latest
    
    # 賦予 GitHub Actions 寫入儲存庫的權限
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # 如果您的指令碼需要額外套件，可以在此安裝，例如：
          # pip install pandas matplotlib numpy

      - name: Run typhoon track generation script
        run: |
          # 請將 'generate_track.py' 替換為您實際執行生成圖片的 Python 指令碼檔名
          python python/TC_track.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 將產生的路徑圖檔案加入版控
          git add output/TC/
          
          # 提交變更，若沒有新檔案變更則直接略過不報錯
          git commit -m "Auto-update typhoon track maps [skip ci]" || exit 0
          
          # 推送前先拉取遠端最新變更並進行 rebase，避免拒絕推送錯誤
          git pull origin main --rebase
          
          # 推送回主分支
          git push origin main
