name: fetch weather chart

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小時執行一次
  workflow_dispatch:

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for Cartopy
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib cartopy numpy requests scipy

      - name: Run Weather Fetcher
        run: python python/weather_charts.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 將產生的圖片資料夾加入 git
          git add output/weather_chart/
          
          # 檢查是否有變更，若有則提交並推送
          git commit -m "Auto-update weather charts: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
