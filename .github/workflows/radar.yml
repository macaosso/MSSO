name: Update Radar Maps

on:
  schedule:
    # Run every 12 minutes
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-maps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for Cartopy
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib scipy cartopy

      - name: Run Map Generator Script
        run: python python/radar.py

      - name: Commit and Push Updated Maps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/radar/*.png
          git diff-index --quiet HEAD || git commit -m "auto: update radar rainfall maps [skip ci]"
          git push
