name: Automated Typhoon Tracks

on:
  push:
    branches: [ main, master ]
    paths:
      - 'TCdata/**'
      - 'generate_tracks.py'
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小時自動運行一次（可依需求調整）
  workflow_dispatch:        # 支援手動觸發

jobs:
  update-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 賦予寫入權限以便自動提交生成的圖檔

    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Miniconda 環境 (支援 Cartopy)
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.10'
        channels: conda-forge, defaults
        channel-priority: strict

    - name: 安裝相依套件
      shell: bash -l {0}
      run: |
        conda install -y pandas numpy matplotlib cartopy shapely scipy pytz

    - name: 執行氣旋路徑與誤差圓錐生成腳本
      shell: bash -l {0}
      run: |
        python python/TC_tracks.py

    - name: 自動提交並推送更新的圖檔
      shell: bash -l {0}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add output/TC/
        # 檢查是否有檔案變動，有變動才提交
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update typhoon track maps [skip ci]" && git push)
