    </script>

        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.4);

        }

        .lv-颶風警報 { background: rgba(212, 17, 17, 0.15); border-left: 3px solid #d41111; }

                    </label>
                    <select id="yearFilter" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/60 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all">

                        <option value="2022">2022</option>
                        <option value="2023">2023</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>

                <div class="space-y-1.5">

                        <i class="fa-solid fa-magnifying-glass text-cyan-500"></i> 氣旋名稱搜尋 (TC Name)
                    </label>

                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-shield-halved text-cyan-500"></i> 最高警報等級 (Max Alert)
                    </label>
                    <select id="levelFilter" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/60 border border-slate-800 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all">
                        <option value="">全部 All</option>
                        <option value="注意警報">注意警報</option>
                        <option value="戒備警報">戒備警報</option>

                        <option value="暴風警報">暴風警報</option>
                        <option value="颶風警報">颶風警報</option>

                <div class="text-2xl md:text-3xl font-extrabold font-mono text-white mt-2" id="totalTC">0</div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-4 shadow-lg flex flex-col justify-between">

                <div class="text-2xl md:text-3xl font-extrabold font-mono text-cyan-400 mt-2" id="filteredTC">0</div>
            </div>
            <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-4 shadow-lg flex flex-col justify-between">

                <div class="text-2xl md:text-3xl font-extrabold font-mono text-amber-400 mt-2" id="galeCount">0</div>

            </div>
        </div>

        <div class="tc-container space-y-4" id="tcList"></div>

        function enrichTC(tc) {
            let maxRank = 0;
            let maxType = "";
            tc.alerts.forEach(a => {
                const r = levelRank[a.type];
                if(r > maxRank) {
                    maxRank = r;
                    maxType = a.type;
                }
            });
            tc.maxRaw = maxType;
            tc.maxGroup = groupMap[maxType];
            return tc;
        }
        const dataset = rawData.map(enrichTC);

        function renderStats(list) {
            document.getElementById("totalTC").textContent = dataset.length;
            document.getElementById("filteredTC").textContent = list.length;

            let hurricane = 0;
            let galeOrAbove = 0;
            list.forEach(tc => {
                if (!tc?.maxGroup) return;
                if(tc.maxGroup === "颶風警報") hurricane++;
                if(["烈風預警警報", "烈風警報", "暴風警報", "颶風警報"].includes(tc.maxGroup)) {
                    galeOrAbove++;
                }
            });

            document.getElementById("hurricaneCount").textContent = hurricane;
            document.getElementById("galeCount").textContent = galeOrAbove;
        }

        function getFilteredList() {
            const yearVal = document.getElementById("yearFilter").value;
            const nameVal = document.getElementById("nameFilter").value.trim().toLowerCase();
            const levelVal = document.getElementById("levelFilter").value;

            return dataset.filter(tc => {
                if(yearVal && String(tc.year) !== yearVal) return false;
                if(nameVal && !tc.name.toLowerCase().includes(nameVal)) return false;
                if(levelVal) {
                    if(levelVal === "烈風警報") {
                        if(tc.maxGroup !== "烈風警報" && tc.maxGroup !== "烈風預警警報") return false;
                    } else if(tc.maxGroup !== levelVal) return false;
                }
                return true;
            });
        }

        function renderList() {
            const container = document.getElementById("tcList");
            const filtered = getFilteredList();
            renderStats(filtered);

            if(filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-16 text-center text-slate-400">
                        <i class="fa-solid fa-face-sad-tear text-4xl mb-3 text-slate-600"></i>
                        <p class="text-sm">沒有符合篩選條件的熱帶氣旋記錄</p>
                    </div>
                `;
                return;
            }

            let html = "";
            filtered.forEach(tc => {
                const badgeCls = badgeClassMap[tc.maxGroup] || "bg-slate-800 text-slate-300";
                let alertRows = "";
                tc.alerts.forEach(alert => {
                    const rowCls = `lv-${alert.type}`;
                    alertRows += `
                    <div class="p-3 rounded-xl ${rowCls} flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs md:text-sm font-mono transition-all">
                        <span class="font-bold text-slate-200">${alert.type}</span>
                        <span class="text-slate-400"><i class="fa-regular fa-clock mr-1.5 text-cyan-500"></i>${alert.start} ～ ${alert.end}</span>
                    </div>
                    `;
                });

                html += `
                <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl overflow-hidden shadow-lg hover:border-slate-700 transition-all">
                    <div class="p-5 border-b border-slate-800/80 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                        <div>
                            <h2 class="text-base md:text-lg font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-wind text-cyan-400 text-sm"></i> ${tc.name}
                            </h2>
                            <p class="text-xs text-slate-400 mt-1 flex items-center gap-3">
                                <span><i class="fa-regular fa-calendar mr-1"></i>年份：${tc.year}</span>
                                ${tc.totalH ? `<span><i class="fa-solid fa-hourglass-half mr-1"></i>總時長：${tc.totalH}</span>` : ''}
                            </p>
                        </div>
                        <span class="px-3 py-1.5 rounded-xl text-xs font-bold ${badgeCls} shadow-sm">
                            最高：${tc.maxGroup}
                        </span>
                    </div>
                    <div class="p-4 space-y-2.5 bg-slate-950/30">
                        ${alertRows}
                    </div>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        document.getElementById("yearFilter").addEventListener("change", renderList);
        document.getElementById("nameFilter").addEventListener("input", renderList);
        document.getElementById("levelFilter").addEventListener("change", renderList);

        window.addEventListener("DOMContentLoaded", renderList);
    </script>
