<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>氣象警報內容發布生成器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        dark: {
                            950: '#060709',
                            900: '#0b0d13',
                            800: '#12151f',
                            700: '#1a202c',
                            600: '#283046',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        input, select, textarea { font-size: 16px !important; } /* 防止 iOS Safari 自動放大 */
    </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

    <!-- 頂部導航列 -->
    <header class="border-b border-dark-700 bg-dark-900/90 backdrop-blur sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                <i data-lucide="cloud-sun-rain" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm sm:text-base text-white flex items-center gap-1.5">
                    氣象警報生成器 <span class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-1.5 py-0.5 rounded font-mono">MST</span>
                </h1>
                <p class="text-[11px] text-slate-400">熱帶氣旋官方定義與解算</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="syncToCurrentTime()" class="flex items-center space-x-1 text-xs bg-dark-800 hover:bg-dark-700 border border-dark-700 px-2.5 py-1.5 rounded-lg text-slate-200 transition">
                <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-400"></i>
                <span class="hidden sm:inline">現時</span>
            </button>
            <button onclick="openGitHubModal()" class="flex items-center space-x-1 text-xs bg-dark-800 hover:bg-dark-700 border border-dark-700 px-2.5 py-1.5 rounded-lg text-slate-200 transition">
                <i data-lucide="github" class="w-3.5 h-3.5 text-cyan-400"></i>
                <span>GitHub 儲存</span>
            </button>
        </div>
    </header>

    <!-- 手機端頂部切換 Tab (僅在 sm 以下顯示) -->
    <div class="lg:hidden grid grid-cols-2 bg-dark-900 border-b border-dark-700 sticky top-[57px] z-40 p-1">
        <button id="tabBtnEdit" onclick="switchMobileTab('edit')" class="py-2 text-xs font-semibold rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/30">
            1. 填寫參數
        </button>
        <button id="tabBtnPreview" onclick="switchMobileTab('preview')" class="py-2 text-xs font-semibold rounded-lg text-slate-400">
            2. 預覽與複製
        </button>
    </div>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-5 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-5">
        
        <!-- 左側編輯區 (7 欄位) -->
        <div id="colEdit" class="lg:col-span-7 space-y-4">
            
            <!-- 警報類別卡片 -->
            <div class="bg-dark-900 border border-dark-700 rounded-2xl p-4 shadow-xl">
                <div class="flex items-center justify-between mb-2.5">
                    <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">警報類別</span>
                    <span class="text-xs font-mono text-cyan-400" id="currentCatBadge">熱帶氣旋警告</span>
                </div>
                <div class="grid grid-cols-4 gap-2">
                    <button type="button" onclick="setCategory('cyclone')" id="catBtn-cyclone" class="cat-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-cyan-500 bg-cyan-500/10 text-cyan-300 transition text-center">
                        <i data-lucide="wind" class="w-5 h-5 mb-1 text-cyan-400"></i>
                        <span class="text-xs font-semibold">熱帶氣旋</span>
                    </button>
                    <button type="button" onclick="setCategory('rain')" id="catBtn-rain" class="cat-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 transition text-center">
                        <i data-lucide="cloud-rain" class="w-5 h-5 mb-1 text-blue-400"></i>
                        <span class="text-xs font-semibold">降雨警報</span>
                    </button>
                    <button type="button" onclick="setCategory('heat')" id="catBtn-heat" class="cat-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 transition text-center">
                        <i data-lucide="sun" class="w-5 h-5 mb-1 text-amber-400"></i>
                        <span class="text-xs font-semibold">酷熱警報</span>
                    </button>
                    <button type="button" onclick="setCategory('cold')" id="catBtn-cold" class="cat-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 transition text-center">
                        <i data-lucide="snowflake" class="w-5 h-5 mb-1 text-indigo-400"></i>
                        <span class="text-xs font-semibold">寒冷警報</span>
                    </button>
                </div>
            </div>

            <!-- 發布狀態 (新/舊) 與 時間 -->
            <div class="bg-dark-900 border border-dark-700 rounded-2xl p-4 shadow-xl space-y-3.5">
                <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">發布模式與時間 (MST)</span>
                
                <!-- 新/舊 模式切換 -->
                <div class="grid grid-cols-2 gap-2 bg-dark-950 p-1 rounded-xl border border-dark-700">
                    <button type="button" id="modeBtnNew" onclick="setIssueMode('new')" class="py-2 rounded-lg text-xs font-bold transition bg-amber-500 text-black shadow">
                        新發出 (於本地時間...發出)
                    </button>
                    <button type="button" id="modeBtnCurrent" onclick="setIssueMode('current')" class="py-2 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white">
                        現正生效 (..., 現正生效)
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">日期 (YYYY-MM-DD)</label>
                        <input type="date" id="warnDate" onchange="updateAll()" oninput="updateAll()" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3 py-2 text-sm text-slate-100 outline-none font-mono">
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">時間 (HH:MM)</label>
                        <input type="text" id="warnTime" onchange="updateAll()" oninput="updateAll()" placeholder="HH:MM" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3 py-2 text-sm text-slate-100 outline-none font-mono">
                    </div>
                </div>
            </div>

            <!-- 熱帶氣旋詳細面板 -->
            <div id="section-cyclone" class="bg-dark-900 border border-dark-700 rounded-2xl p-4 shadow-xl space-y-4">
                <span class="text-xs font-semibold tracking-wider text-cyan-400 uppercase">熱帶氣旋參數與官方標準</span>

                <div>
                    <label class="block text-xs text-slate-300 mb-1">警告信號級別</label>
                    <select id="tc_signal" onchange="handleSignalChange()" class="w-full bg-dark-950 border border-dark-700 focus:border-cyan-500 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 outline-none font-semibold">
                        <option value="注意警報">注意警報</option>
                        <option value="戒備警報" selected>戒備警報</option>
                        <option value="強風警報">強風警報</option>
                        <option value="東北烈風警報">東北烈風警報</option>
                        <option value="東南烈風警報">東南烈風警報</option>
                        <option value="西北烈風警報">西北烈風警報</option>
                        <option value="西南烈風警報">西南烈風警報</option>
                        <option value="暴風警報">暴風警報</option>
                        <option value="𩗗風警報">𩗗風警報</option>
                    </select>
                </div>

                <!-- 注意警報 1200 / 800 選項 (僅在注意警報時顯示) -->
                <div id="box-caution-choice" class="hidden bg-dark-950 border border-amber-500/40 rounded-xl p-3 space-y-2">
                    <label class="block text-xs text-amber-300 font-medium">注意警報監測範圍定義：</label>
                    <div class="space-y-1.5">
                        <label class="flex items-start gap-2 text-xs text-slate-300 cursor-pointer">
                            <input type="radio" name="caution_range" value="1200" checked onchange="updateAll()" class="mt-0.5 accent-amber-500">
                            <span><strong>1200 公里範圍：</strong>進入澳門1200公里範圍，未來24-72小時將進入澳門800公里範圍，並對澳門構成較大威脅。</span>
                        </label>
                        <label class="flex items-start gap-2 text-xs text-slate-300 cursor-pointer">
                            <input type="radio" name="caution_range" value="800" onchange="updateAll()" class="mt-0.5 accent-amber-500">
                            <span><strong>800 公里範圍：</strong>潛在熱帶氣旋位於本澳800公里範圍內，未來24小時內將發展成熱帶氣旋，並有可能對澳門構成較大威脅。</span>
                        </label>
                    </div>
                </div>

                <!-- 官方信號含義展示 (唯讀提示) -->
                <div class="bg-dark-950/70 border border-dark-700 rounded-xl p-3 text-xs leading-relaxed text-slate-300" id="signal-definition-box">
                    <!-- 動態由 JavaScript 填入官方定義 -->
                </div>

                <!-- 氣旋名稱與風速直接反算 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">氣旋名稱</label>
                        <input type="text" id="tc_name" oninput="updateAll()" placeholder="輸入名稱 (如: 萬宜)" class="w-full bg-dark-950 border border-dark-700 focus:border-cyan-500 rounded-xl px-3 py-2 text-sm text-slate-100 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">最高持續風速 (km/h)</label>
                        <input type="number" inputmode="numeric" id="tc_wind_speed" oninput="handleWindSpeedInput()" placeholder="輸入風速 (如: 140)" class="w-full bg-dark-950 border border-dark-700 focus:border-cyan-500 rounded-xl px-3 py-2 text-sm text-slate-100 outline-none font-mono">
                    </div>
                </div>

                <!-- 強度反算標籤 -->
                <div class="bg-dark-950 border border-dark-700 rounded-xl p-2.5 flex items-center justify-between">
                    <span class="text-xs text-slate-400">風速自動計算強度：</span>
                    <span id="tc_intensity_badge" class="px-2.5 py-0.5 rounded-full text-xs font-bold font-mono tracking-wide bg-slate-800 text-slate-300 border border-slate-700">
                        未輸入風速
                    </span>
                </div>

                <!-- 當前中心座標 -->
                <div class="border-t border-dark-700 pt-3">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-medium text-cyan-400">現時中心位置（自動解算相對澳門距離與方位）</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">緯度 (°N)</label>
                            <input type="number" inputmode="decimal" step="0.1" id="tc_cur_lat" oninput="updateAll()" placeholder="如: 19.8" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3 py-2 text-sm font-mono text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">經度 (°E)</label>
                            <input type="number" inputmode="decimal" step="0.1" id="tc_cur_lon" oninput="updateAll()" placeholder="如: 115.6" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3 py-2 text-sm font-mono text-slate-100 outline-none">
                        </div>
                    </div>
                </div>

                <!-- 24小時預報點 -->
                <div class="border-t border-dark-700 pt-3">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-medium text-cyan-400">24H 預報點位置（自動計算移動方向與移速）</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">預報緯度 (°N)</label>
                            <input type="number" inputmode="decimal" step="0.1" id="tc_fc_lat" oninput="updateAll()" placeholder="如: 21.5" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3 py-2 text-sm font-mono text-slate-100 outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">預報經度 (°E)</label>
                            <input type="number" inputmode="decimal" step="0.1" id="tc_fc_lon" oninput="updateAll()" placeholder="如: 113.2" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3 py-2 text-sm font-mono text-slate-100 outline-none">
                        </div>
                    </div>
                </div>

                <!-- 解算結果條 -->
                <div class="bg-dark-950 border border-cyan-500/30 rounded-xl p-3 text-xs font-mono space-y-1 text-cyan-300">
                    <div>距澳位置：<span class="font-bold text-white" id="info_macau_dist">尚未輸入座標</span></div>
                    <div>移動趨勢：<span class="font-bold text-white" id="info_movement">尚未輸入完整24H座標</span></div>
                </div>
            </div>

            <!-- 降雨警報 / 預警面板 -->
            <div id="section-rain" class="hidden bg-dark-900 border border-dark-700 rounded-2xl p-4 shadow-xl space-y-4">
                <span class="text-xs font-semibold tracking-wider text-blue-400 uppercase">降雨警報 / 預警模板</span>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">選擇標準模板</label>
                    <select id="rain_template" onchange="updateAll()" class="w-full bg-dark-950 border border-dark-700 focus:border-blue-500 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 outline-none font-semibold">
                        <option value="rain_heavy_warn">【#大雨警報】（預料時雨量達20毫米）</option>
                        <option value="rain_storm_warn">【#暴雨警報】（預料時雨量達50毫米，低漥水浸）</option>
                        <option value="rain_super_warn">【#大暴雨警報】（預料時雨量達或接近100毫米，較嚴重水浸）</option>
                        <option value="rain_heavy_pre">【大雨預警】（受一強雷雨區影響，預計一兩小時雨勢增強）</option>
                        <option value="rain_storm_pre">【暴雨預警】（受到一道強雷雨區影響，預計未來一小時雨勢加強）</option>
                        <option value="rain_super_pre">【大暴雨預警】（預計本澳短期內雨勢會進一步加強）</option>
                    </select>
                </div>
                <div id="box_rain_pre_time" class="hidden bg-dark-950 border border-blue-500/30 rounded-xl p-3">
                    <label class="block text-xs text-blue-300 mb-1">大雨預警發出警報時間</label>
                    <input type="text" id="rain_pre_time_input" oninput="updateAll()" placeholder="如: 01時30分" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3 py-2 text-xs font-mono text-slate-100 outline-none">
                </div>
            </div>

            <!-- 酷熱警報面板 -->
            <div id="section-heat" class="hidden bg-dark-900 border border-dark-700 rounded-2xl p-4 shadow-xl space-y-4">
                <span class="text-xs font-semibold tracking-wider text-amber-400 uppercase">酷熱警報參數</span>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">警報等級</label>
                    <select id="heat_level" onchange="updateAll()" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 outline-none font-semibold">
                        <option value="酷熱">酷熱</option>
                        <option value="非常酷熱">非常酷熱</option>
                        <option value="極為酷熱">極為酷熱</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">最高氣溫 / 區間 (°C)</label>
                        <input type="text" id="heat_temp" oninput="updateAll()" placeholder="如: 34 或 33 - 34 (可留空)" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3 py-2 text-sm font-mono text-slate-100 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">部分地區氣溫 (°C)</label>
                        <input type="text" id="heat_part_temp" oninput="updateAll()" placeholder="如: 35 - 36 (可留空)" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3 py-2 text-sm font-mono text-slate-100 outline-none">
                    </div>
                </div>
            </div>

            <!-- 寒冷警報面板 -->
            <div id="section-cold" class="hidden bg-dark-900 border border-dark-700 rounded-2xl p-4 shadow-xl space-y-4">
                <span class="text-xs font-semibold tracking-wider text-indigo-400 uppercase">寒冷警報參數</span>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">警報等級</label>
                    <select id="cold_level" onchange="updateAll()" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 outline-none font-semibold">
                        <option value="寒冷">寒冷</option>
                        <option value="非常寒冷">非常寒冷</option>
                        <option value="極為寒冷">極為寒冷</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">最低氣溫 / 區間 (°C)</label>
                        <input type="text" id="cold_temp" oninput="updateAll()" placeholder="如: 10 或 9 - 10 (可留空)" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3 py-2 text-sm font-mono text-slate-100 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">部分地區低溫 (°C)</label>
                        <input type="text" id="cold_part_temp" oninput="updateAll()" placeholder="如: 7 - 8 (可留空)" class="w-full bg-dark-950 border border-dark-700 rounded-xl px-3 py-2 text-sm font-mono text-slate-100 outline-none">
                    </div>
                </div>
            </div>

        </div>

        <!-- 右側預覽與匯出 (5 欄位) -->
        <div id="colPreview" class="lg:col-span-5 space-y-4 flex flex-col">
            
            <!-- 即時預覽卡片 -->
            <div class="bg-dark-900 border border-dark-700 rounded-2xl p-4 sm:p-5 shadow-xl flex-1 flex flex-col">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                        發布視覺預覽
                    </span>
                    <span id="previewCatBadge" class="text-xs px-2 py-0.5 rounded font-mono uppercase border bg-cyan-500/20 text-cyan-300 border-cyan-500/30">
                        熱帶氣旋
                    </span>
                </div>

                <div id="previewCard" class="flex-1 min-h-[260px] rounded-xl p-5 bg-cyan-950/20 border-2 border-cyan-500/40 text-slate-100 font-sans shadow-lg flex flex-col justify-between">
                    <!-- 動態渲染預覽 -->
                </div>
            </div>

            <!-- 純文字輸出與複製操作 -->
            <div class="bg-dark-900 border border-dark-700 rounded-2xl p-4 sm:p-5 shadow-xl space-y-3">
                <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">純文字輸出 (相容剪貼簿)</span>
                <textarea id="outputText" readonly rows="8" class="w-full bg-dark-950 border border-dark-700 rounded-xl p-3 text-xs sm:text-sm font-mono text-slate-200 outline-none resize-none leading-relaxed select-all"></textarea>
                
                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="copyWarningText()" class="flex items-center justify-center space-x-1.5 bg-amber-500 hover:bg-amber-400 active:scale-95 text-black font-bold px-3 py-2.5 rounded-xl text-xs sm:text-sm transition shadow-lg shadow-amber-500/20">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                        <span>複製警報文字</span>
                    </button>
                    <button onclick="downloadWarningText()" class="flex items-center justify-center space-x-1.5 bg-dark-800 hover:bg-dark-700 active:scale-95 text-slate-200 border border-dark-600 font-medium px-3 py-2.5 rounded-xl text-xs sm:text-sm transition">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span>下載 .TXT 檔</span>
                    </button>
                </div>
            </div>

        </div>

    </main>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-6 right-6 bg-dark-800 border border-amber-500/60 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2.5 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
        <i data-lucide="check-circle" class="w-5 h-5 text-amber-400"></i>
        <span id="toastMsg" class="text-xs font-medium">已成功複製！</span>
    </div>

    <!-- 腳本主邏輯 -->
    <script>
        const MACAU_LAT = 22.1595;
        const MACAU_LON = 113.5685;

        let activeCategory = 'cyclone';
        let issueMode = 'new'; // 'new' (發出) 或 'current' (現正生效)

        // 澳門官方熱帶氣旋強度標準表
        const TC_INTENSITY_TABLE = [
            {"code": "Ex",   "name": "溫帶氣旋",     "max_wind": -1,   "rangeText": "-",            "color": "#64748b"},
            {"code": "LPA",  "name": "低壓區",       "max_wind": 40,   "rangeText": "≤ 40 km/h",    "color": "#64748b"},
            {"code": "TD",   "name": "熱帶低氣壓",   "max_wind": 62,   "rangeText": "41 - 62 km/h", "color": "#0284c7"},
            {"code": "TS",   "name": "熱帶風暴",     "max_wind": 87,   "rangeText": "63 - 87 km/h", "color": "#16a34a"},
            {"code": "STS",  "name": "強烈熱帶風暴", "max_wind": 117,  "rangeText": "88 - 117 km/h","color": "#ca8a04"},
            {"code": "TY",   "name": "颱風",         "max_wind": 149,  "rangeText": "118 - 149 km/h","color": "#ea580c"},
            {"code": "STY",  "name": "強颱風",       "max_wind": 184,  "rangeText": "150 - 184 km/h","color": "#dc2626"},
            {"code": "SuTY", "name": "超強颱風",     "max_wind": 9999, "rangeText": "≥ 185 km/h",   "color": "#9333ea"}
        ];

        // 官方信號含義與風力定義
        function getSignalOfficialDefinition(signal) {
            if (signal === '注意警報') {
                const cautionRange = document.querySelector('input[name="caution_range"]:checked')?.value || '1200';
                if (cautionRange === '1200') {
                    return '表示有一熱帶氣旋進入澳門1200公里範圍，未來24-72小時將進入澳門800公里範圍，並對澳門構成較大威脅。';
                } else {
                    return '表示有一潛在熱帶氣旋位於本澳800公里範圍內，未來24小時內將發展成熱帶氣旋，並有可能對澳門構成較大威脅。';
                }
            } else if (signal === '戒備警報') {
                return '表示有一熱帶氣旋進入澳門800公里範圍，未來24-48小時內將逐漸影響澳門。';
            } else if (signal === '強風警報') {
                return '表示受熱帶氣旋影響，預料澳門平均風速為每小時41至62公里，陣風約為每小時63至87公里，橋上或空曠地方風力可能更大。';
            } else if (signal.includes('烈風警報')) {
                let dir = '吹東南';
                if (signal.includes('東北')) dir = '吹東北';
                if (signal.includes('西北')) dir = '吹西北';
                if (signal.includes('西南')) dir = '吹西南';
                return `表示受熱帶氣旋影響，預料澳門${dir}風，平均風速為每小時63至87公里，陣風約為每小時88至117公里，橋上或空曠地方風力可能更大。`;
            } else if (signal === '暴風警報') {
                return '表示受熱帶氣旋影響，預料澳門平均風速為每小時88至117公里，陣風約為每小時118至133公里，橋上或空曠地方風力可能更大，且風力可能在短時間內顯著增強。';
            } else if (signal === '𩗗風警報' || signal === '颶風警報') {
                return '表示受颱風或以上級別的熱帶氣旋影響，預料澳門平均風速超過每小時118公里，陣風超過每小時133公里。';
            }
            return '';
        }

        // 風速判定強度
        function getIntensityByWind(speedVal) {
            const speed = parseFloat(speedVal);
            if (isNaN(speed) || speed < 0) return null;
            if (speed <= 40) return TC_INTENSITY_TABLE[1];
            if (speed <= 62) return TC_INTENSITY_TABLE[2];
            if (speed <= 87) return TC_INTENSITY_TABLE[3];
            if (speed <= 117) return TC_INTENSITY_TABLE[4];
            if (speed <= 149) return TC_INTENSITY_TABLE[5];
            if (speed <= 184) return TC_INTENSITY_TABLE[6];
            return TC_INTENSITY_TABLE[7];
        }

        // 時段中文轉換：（凌晨0-4）（清晨5-6）（早上7-11）（正午12）（下午1-6）（晚上7-11）時
        function getTimePeriodWord(hh) {
            const h = parseInt(hh, 10);
            if (isNaN(h)) return '';
            if (h >= 0 && h <= 4) return `凌晨${h}時`;
            if (h >= 5 && h <= 6) return `清晨${h}時`;
            if (h >= 7 && h <= 11) return `早上${h}時`;
            if (h === 12) return `正午12時`;
            if (h >= 13 && h <= 18) return `下午${h - 12}時`;
            if (h >= 19 && h <= 23) return `晚上${h - 12}時`;
            return `${h}時`;
        }

        // 兩點距離 (公里)
        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // 16 方位角計算
        function calcBearing16(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            let θ = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

            const dirs = ['北', '東北偏北', '東北', '東北偏東', '東', '東南偏東', '東南', '東南偏南',
                          '南', '西南偏南', '西南', '西南偏西', '西', '西北偏西', '西北', '西北偏北'];
            return dirs[Math.round(θ / 22.5) % 16];
        }

        // 切換新／舊模式
        function setIssueMode(mode) {
            issueMode = mode;
            const btnNew = document.getElementById('modeBtnNew');
            const btnCur = document.getElementById('modeBtnCurrent');
            if (mode === 'new') {
                btnNew.className = "py-2 rounded-lg text-xs font-bold transition bg-amber-500 text-black shadow";
                btnCur.className = "py-2 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white";
            } else {
                btnCur.className = "py-2 rounded-lg text-xs font-bold transition bg-amber-500 text-black shadow";
                btnNew.className = "py-2 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white";
            }
            updateAll();
        }

        // 同步現時 MST
        function syncToCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('warnDate').value = `${year}-${month}-${day}`;
            document.getElementById('warnTime').value = `${hours}:${minutes}`;
            updateAll();
        }

        // 切換類別
        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 transition text-center";
            });

            document.getElementById('section-cyclone').classList.add('hidden');
            document.getElementById('section-rain').classList.add('hidden');
            document.getElementById('section-heat').classList.add('hidden');
            document.getElementById('section-cold').classList.add('hidden');

            const btn = document.getElementById(`catBtn-${cat}`);
            const badge = document.getElementById('currentCatBadge');

            if (cat === 'cyclone') {
                btn.className = "cat-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-cyan-500 bg-cyan-500/10 text-cyan-300 transition text-center";
                document.getElementById('section-cyclone').classList.remove('hidden');
                badge.innerText = "熱帶氣旋警告";
            } else if (cat === 'rain') {
                btn.className = "cat-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-blue-500 bg-blue-500/10 text-blue-300 transition text-center";
                document.getElementById('section-rain').classList.remove('hidden');
                badge.innerText = "降雨警報 / 預警";
            } else if (cat === 'heat') {
                btn.className = "cat-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-amber-500 bg-amber-500/10 text-amber-300 transition text-center";
                document.getElementById('section-heat').classList.remove('hidden');
                badge.innerText = "酷熱警報";
            } else if (cat === 'cold') {
                btn.className = "cat-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-indigo-500 bg-indigo-500/10 text-indigo-300 transition text-center";
                document.getElementById('section-cold').classList.remove('hidden');
                badge.innerText = "寒冷警報";
            }
            updateAll();
        }

        // 熱帶氣旋警告信號切換
        function handleSignalChange() {
            const signal = document.getElementById('tc_signal').value;
            const cautionBox = document.getElementById('box-caution-choice');
            if (signal === '注意警報') {
                cautionBox.classList.remove('hidden');
            } else {
                cautionBox.classList.add('hidden');
            }
            updateAll();
        }

        // 風速輸入時直接反算等級
        function handleWindSpeedInput() {
            const speed = document.getElementById('tc_wind_speed').value;
            const intensity = getIntensityByWind(speed);
            const badge = document.getElementById('tc_intensity_badge');
            if (intensity) {
                badge.innerText = `${intensity.name} (${intensity.code}) [${intensity.rangeText}]`;
                badge.style.color = intensity.color;
                badge.style.borderColor = intensity.color + '60';
                badge.style.backgroundColor = intensity.color + '20';
            } else {
                badge.innerText = "未輸入風速";
                badge.style.color = "#94a3b8";
                badge.style.borderColor = "#334155";
                badge.style.backgroundColor = "#1e293b";
            }
            updateAll();
        }

        // 重新解算與渲染核心
        function updateAll() {
            const dateStr = document.getElementById('warnDate').value || 'YYYY-MM-DD';
            const timeStr = document.getElementById('warnTime').value || 'HH:MM';
            const [year, month, day] = dateStr.split('-');
            const [hh, mm] = timeStr.split(':');
            const m = month || 'xx';
            const d = day || 'xx';
            const h = hh || 'xx';
            const min = mm || 'xx';

            let outputText = '';
            let title = '';
            let bodyLead = '';
            let defText = '';
            let detailText = '';

            if (activeCategory === 'cyclone') {
                const signal = document.getElementById('tc_signal').value;
                title = `【#${signal}】`;
                defText = getSignalOfficialDefinition(signal);
                document.getElementById('signal-definition-box').innerHTML = `
                    <span class="text-cyan-400 font-semibold">【信號定義】</span>${defText}
                `;

                if (issueMode === 'new') {
                    bodyLead = `${signal}於本地時間${m}月${d}日${h}時${min}分發出。`;
                } else {
                    bodyLead = `${signal}，現正生效。`;
                }

                // 氣象要素解算
                const tcName = document.getElementById('tc_name').value.trim();
                const windSpeed = document.getElementById('tc_wind_speed').value.trim();
                const intensityObj = getIntensityByWind(windSpeed);
                const intensityName = intensityObj ? intensityObj.name : '';

                const curLat = parseFloat(document.getElementById('tc_cur_lat').value);
                const curLon = parseFloat(document.getElementById('tc_cur_lon').value);
                const fcLat = parseFloat(document.getElementById('tc_fc_lat').value);
                const fcLon = parseFloat(document.getElementById('tc_fc_lon').value);

                let hasCurrentPos = !isNaN(curLat) && !isNaN(curLon);
                let hasFcPos = hasCurrentPos && !isNaN(fcLat) && !isNaN(fcLon);

                let timePeriod = getTimePeriodWord(h);
                let posDesc = '';
                let moveDesc = '';

                if (hasCurrentPos) {
                    const distMacau = calcDistance(MACAU_LAT, MACAU_LON, curLat, curLon);
                    const dirMacau = calcBearing16(MACAU_LAT, MACAU_LON, curLat, curLon);
                    document.getElementById('info_macau_dist').innerText = `${dirMacau}約 ${distMacau} 公里 (北緯${curLat.toFixed(1)}度，東經${curLon.toFixed(1)}度)`;
                    posDesc = `集結在本澳${dirMacau}約${distMacau}公里，即在北緯${curLat.toFixed(1)}度，東經${curLon.toFixed(1)}度附近`;
                } else {
                    document.getElementById('info_macau_dist').innerText = `尚未輸入中心座標`;
                }

                if (hasFcPos) {
                    const moveDist = calcDistance(curLat, curLon, fcLat, fcLon);
                    const moveSpeed = Math.round(moveDist / 24);
                    const moveDir = calcBearing16(curLat, curLon, fcLat, fcLon);
                    document.getElementById('info_movement').innerText = `向${moveDir}移動，時速約 ${moveSpeed} 公里`;
                    moveDesc = `向${moveDir}移動，時速約${moveSpeed}公里`;
                } else {
                    document.getElementById('info_movement').innerText = `尚未輸入完整24H座標`;
                }

                let tcCore = '';
                if (tcName || intensityName) {
                    tcCore = `${intensityName}${tcName}`;
                } else {
                    tcCore = '熱帶氣旋';
                }

                if (hasCurrentPos) {
                    detailText = `${timePeriod}，${tcCore}${posDesc}`;
                    if (windSpeed) {
                        detailText += `，其中心附近最高持續風速約為每小時${windSpeed}公里`;
                    }
                    if (hasFcPos) {
                        detailText += `，${moveDesc}。`;
                    } else {
                        detailText += `。`;
                    }
                }

                outputText = `${title}
${dateStr}${timeStr} MST

${bodyLead}${defText}${detailText ? '\n' + detailText : ''}`.trim();

                renderPreview(title, `${dateStr}${timeStr} MST`, bodyLead, defText, detailText, 'bg-cyan-950/20 border-cyan-500/50 text-cyan-300');

            } else if (activeCategory === 'rain') {
                const rainTpl = document.getElementById('rain_template').value;
                const preTimeDiv = document.getElementById('box_rain_pre_time');
                if (rainTpl === 'rain_heavy_pre') {
                    preTimeDiv.classList.remove('hidden');
                } else {
                    preTimeDiv.classList.add('hidden');
                }

                if (rainTpl === 'rain_heavy_warn') {
                    title = `【#大雨警報】`;
                    bodyLead = issueMode === 'new' ? `大雨警報於本地時間${m}月${d}日${h}時${min}分發出。` : `大雨警報，現正生效。`;
                    defText = `預料每小時雨量將會達到20毫米。市民應留在室內安全地方，注意天氣狀況。`;
                } else if (rainTpl === 'rain_storm_warn') {
                    title = `【#暴雨警報】`;
                    bodyLead = issueMode === 'new' ? `暴雨警報於本地時間${m}月${d}日${h}時${min}分發出。` : `暴雨警報，現正生效。`;
                    defText = `預料雨勢將會增強，每小時雨量將會達到50毫米，部分低漥地區將出現水浸。請市民留意最新天氣訊息，在安全地方暫避。`;
                } else if (rainTpl === 'rain_super_warn') {
                    title = `【#大暴雨警報】`;
                    bodyLead = issueMode === 'new' ? `大暴雨報告於本地時間${m}月${d}日${h}時${min}分發出。` : `大暴雨報告，現正生效。`;
                    defText = `預料雨勢將會維持，每小時雨量將會達到或接近100毫米，低漥地區將出現較嚴重水浸。請市民留意最新天氣訊息，在安全地方暫避。`;
                } else if (rainTpl === 'rain_super_pre') {
                    title = `【大暴雨預警】`;
                    bodyLead = ``;
                    defText = `預計本澳短期內雨勢會進一步加強，改發大暴雨警報之可能性存在。請市民密切留意最新天氣訊息，留在室內安全地方，並注意天氣狀況。`;
                } else if (rainTpl === 'rain_storm_pre') {
                    title = `【暴雨預警】`;
                    bodyLead = ``;
                    defText = `受到一道強雷雨區影響，預計本澳未來一小時雨勢會進一步加強，改發暴雨報告之可能性存在。請市民密切留意最新天氣訊息，留在室內安全地方，並注意天氣狀況。`;
                } else if (rainTpl === 'rain_heavy_pre') {
                    title = `【大雨預警】`;
                    const expectedTime = document.getElementById('rain_pre_time_input').value.trim() || `${h}時${min}分`;
                    bodyLead = `受一強雷雨區影響，預計本澳未來一兩小時雨勢將會增強。`;
                    defText = `本台將於${expectedTime}或之前發出大雨警報。請市民密切留意最新天氣訊息，留在室內安全地方，並注意天氣狀況。`;
                }

                outputText = `${title}
${dateStr}  ${timeStr} MST

${bodyLead ? bodyLead + '\n' : ''}${defText}`.trim();

                renderPreview(title, `${dateStr}  ${timeStr} MST`, bodyLead, defText, '', 'bg-blue-950/20 border-blue-500/50 text-blue-300');

            } else if (activeCategory === 'heat') {
                const heatLevel = document.getElementById('heat_level').value;
                title = `【#酷熱警報】`;
                bodyLead = issueMode === 'new' ? `酷熱警報於本地時間${m}月${d}日${h}時${min}分發出。` : `酷熱警報，現正生效。`;
                
                const tempVal = document.getElementById('heat_temp').value.trim();
                const partVal = document.getElementById('heat_part_temp').value.trim();
                let segs = [];
                if (tempVal) segs.push(`最高氣溫約${tempVal}度`);
                if (partVal) segs.push(`部分地區約${partVal}度`);
                let tempStr = segs.length > 0 ? `，${segs.join('，')}。` : '。';

                defText = `預料本澳今日天氣${heatLevel}${tempStr}市民應減少長時間在陽光下曝曬，多補充水分，預防中暑。`;

                outputText = `${title}
${dateStr}  ${timeStr} MST

${bodyLead}
${defText}`;
                renderPreview(title, `${dateStr}  ${timeStr} MST`, bodyLead, defText, '', 'bg-amber-950/20 border-amber-500/50 text-amber-300');

            } else if (activeCategory === 'cold') {
                const coldLevel = document.getElementById('cold_level').value;
                title = `【#寒冷警報】`;
                bodyLead = issueMode === 'new' ? `寒冷警報於本地時間${m}月${d}日${h}時${min}分發出。` : `寒冷警報，現正生效。`;

                const tempVal = document.getElementById('cold_temp').value.trim();
                const partVal = document.getElementById('cold_part_temp').value.trim();
                let segs = [];
                if (tempVal) segs.push(`最低氣溫約${tempVal}度`);
                if (partVal) segs.push(`部分地區約${partVal}度`);
                let tempStr = segs.length > 0 ? `，${segs.join('，')}。` : '。';

                defText = `受強烈冬季季候風影響，預料本澳天氣${coldLevel}${tempStr}市民應注意保暖，慎防感冒。`;

                outputText = `${title}
${dateStr}  ${timeStr} MST

${bodyLead}
${defText}`;
                renderPreview(title, `${dateStr}  ${timeStr} MST`, bodyLead, defText, '', 'bg-indigo-950/20 border-indigo-500/50 text-indigo-300');
            }

            document.getElementById('outputText').value = outputText;
        }

        // 渲染預覽視窗
        function renderPreview(title, timeHeader, bodyLead, defText, detailText, styleClass) {
            const card = document.getElementById('previewCard');
            card.className = `flex-1 min-h-[260px] rounded-xl p-5 ${styleClass} border-2 shadow-lg flex flex-col justify-between`;

            card.innerHTML = `
                <div class="space-y-3">
                    <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
                        <span class="font-bold tracking-wide text-sm sm:text-base text-white">${title}</span>
                        <span class="text-xs font-mono bg-white/10 text-slate-200 px-2 py-0.5 rounded-full">${timeHeader}</span>
                    </div>
                    <div class="text-xs sm:text-sm leading-relaxed space-y-2">
                        ${bodyLead ? `<p class="font-bold text-amber-300 text-sm">${bodyLead}</p>` : ''}
                        <p class="text-slate-200">${defText}</p>
                        ${detailText ? `<p class="text-slate-100 font-mono bg-black/30 p-2.5 rounded-lg border border-white/5">${detailText}</p>` : ''}
                    </div>
                </div>
                <div class="pt-3 border-t border-white/10 flex items-center justify-between text-[11px] text-slate-400">
                    <span>澳門地球物理氣象局官方警報規格</span>
                    <span class="font-mono">MST (UTC+8)</span>
                </div>
            `;
            document.getElementById('previewCatBadge').innerText = title.replace(/[【】#]/g, '');
        }

        // 手機 Tab 切換
        function switchMobileTab(tab) {
            const colEdit = document.getElementById('colEdit');
            const colPreview = document.getElementById('colPreview');
            const tabBtnEdit = document.getElementById('tabBtnEdit');
            const tabBtnPreview = document.getElementById('tabBtnPreview');

            if (tab === 'edit') {
                colEdit.classList.remove('hidden');
                colPreview.classList.add('hidden');
                tabBtnEdit.className = "py-2 text-xs font-semibold rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/30";
                tabBtnPreview.className = "py-2 text-xs font-semibold rounded-lg text-slate-400";
            } else {
                colEdit.classList.add('hidden');
                colPreview.classList.remove('hidden');
                tabBtnPreview.className = "py-2 text-xs font-semibold rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/30";
                tabBtnEdit.className = "py-2 text-xs font-semibold rounded-lg text-slate-400";
            }
        }

        // 複製純文字
        function copyWarningText() {
            const text = document.getElementById('outputText').value;
            if (!text) return;
            const el = document.createElement('textarea');
            el.value = text;
            el.style.position = 'fixed';
            el.style.opacity = '0';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("警報文字已成功複製！");
        }

        // 下載 .TXT
        function downloadWarningText() {
            const text = document.getElementById('outputText').value;
            if (!text) return;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `macau_meteo_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("警報文件 (.txt) 已下載！");
        }

        // GitHub 彈窗控制
        function openGitHubModal() {
            document.getElementById('gh_token').value = localStorage.getItem('gh_token') || '';
            document.getElementById('gh_repo').value = localStorage.getItem('gh_repo') || '';
            document.getElementById('gh_path').value = localStorage.getItem('gh_path') || 'meteo_warnings.json';
            document.getElementById('githubModal').classList.remove('hidden');
        }

        function closeGitHubModal() {
            document.getElementById('githubModal').classList.add('hidden');
        }

        // 上傳當前警報紀錄至 GitHub
        async function saveCurrentToGitHub() {
            const token = document.getElementById('gh_token').value.trim();
            const repo = document.getElementById('gh_repo').value.trim();
            const path = document.getElementById('gh_path').value.trim();
            const statusEl = document.getElementById('gh_status');

            if (!token || !repo || !path) {
                alert('請填妥 GitHub Token, 倉庫名及檔案路徑！');
                return;
            }

            localStorage.setItem('gh_token', token);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_path', path);

            statusEl.innerText = '正在連線 GitHub...';

            const record = {
                timestamp: new Date().toISOString(),
                category: activeCategory,
                mode: issueMode,
                date: document.getElementById('warnDate').value,
                time: document.getElementById('warnTime').value,
                formattedText: document.getElementById('outputText').value
            };

            const url = `https://api.github.com/repos/${repo}/contents/${path}`;

            try {
                let sha = null;
                let existingData = [];

                // 檢查檔案是否已存在以取得 SHA
                const getRes = await fetch(url, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (getRes.status === 200) {
                    const fileJson = await getRes.json();
                    sha = fileJson.sha;
                    const contentStr = decodeURIComponent(escape(atob(fileJson.content)));
                    try {
                        existingData = JSON.parse(contentStr);
                        if (!Array.isArray(existingData)) existingData = [existingData];
                    } catch (e) {
                        existingData = [];
                    }
                }

                existingData.unshift(record);
                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(existingData, null, 2))));

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Add meteorological warning record [${record.date} ${record.time}]`,
                        content: updatedContent,
                        sha: sha || undefined
                    })
                });

                if (putRes.ok) {
                    statusEl.innerText = '儲存成功！已同步至 GitHub';
                    showToast('已成功上傳紀錄至 GitHub！');
                    setTimeout(closeGitHubModal, 1200);
                } else {
                    const err = await putRes.json();
                    statusEl.innerText = '上傳失敗：' + (err.message || '請確認權限');
                }
            } catch (err) {
                statusEl.innerText = '錯誤：' + err.message;
            }
        }

        // Toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        // 頁面載入
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            syncToCurrentTime();
            handleSignalChange();
            // 在手機螢幕寬度下預設顯示編輯頁
            if (window.innerWidth < 1024) {
                switchMobileTab('edit');
            }
        });
    </script>
