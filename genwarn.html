<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>氣象警報內容發布與 GitHub 管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        dark: {
                            950: '#07090e',
                            900: '#0e121b',
                            850: '#121722',
                            800: '#161c28',
                            700: '#222b3d',
                            600: '#2f3b52',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        input, textarea, button { font-size: 14px; }
        @media (max-width: 640px) {
            input, textarea { font-size: 16px !important; }
        }
        /* Custom scrollbar for record list */
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0e121b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #222b3d; border-radius: 4px; }
    </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

    <!-- 頂部導航 -->
    <header class="border-b border-dark-700 bg-dark-900/95 sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
                <i data-lucide="cloud-sun-rain" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm sm:text-base text-white">氣象警報生成器</h1>
                <p class="text-[10px] text-slate-400 font-mono">MACAU MST (UTC+8) &bull; GITHUB SYNC</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button type="button" onclick="syncCurrentTime()" class="flex items-center gap-1 text-xs bg-dark-800 hover:bg-dark-700 border border-dark-700 px-2.5 py-1.5 rounded-lg text-slate-200 transition">
                <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-400"></i>
                <span>校正現時</span>
            </button>
            <button type="button" onclick="toggleGithubModal(true)" class="flex items-center gap-1.5 text-xs bg-teal-500/10 hover:bg-teal-500/20 border border-teal-500/30 px-3 py-1.5 rounded-lg text-teal-300 transition">
                <i data-lucide="github" class="w-3.5 h-3.5 text-teal-400"></i>
                <span class="font-medium">GitHub 紀錄庫</span>
                <span id="navGhIndicator" class="w-2 h-2 rounded-full bg-slate-500"></span>
            </button>
        </div>
    </header>

    <!-- 手機端頂部模式切換 -->
    <div class="lg:hidden grid grid-cols-2 bg-dark-900 border-b border-dark-700 sticky top-[57px] z-40 p-1.5 gap-2">
        <button type="button" id="tabBtnEdit" onclick="switchTab('edit')" class="py-2 text-xs font-semibold rounded-lg bg-amber-500/15 text-amber-300 border border-amber-500/40">
            1. 設定參數
        </button>
        <button type="button" id="tabBtnPreview" onclick="switchTab('preview')" class="py-2 text-xs font-semibold rounded-lg text-slate-400 border border-transparent">
            2. 檢視與複製
        </button>
    </div>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-5 grid grid-cols-1 lg:grid-cols-12 gap-5">
        
        <!-- 左側配置區 (7 欄位) -->
        <div id="panelEdit" class="lg:col-span-7 space-y-4">
            
            <!-- 編輯模式狀態條 (當正在編輯舊紀錄時顯示) -->
            <div id="editingBanner" class="hidden bg-amber-500/10 border border-amber-500/40 rounded-xl p-3 flex items-center justify-between">
                <div class="flex items-center space-x-2 text-xs text-amber-300">
                    <i data-lucide="edit-3" class="w-4 h-4 text-amber-400"></i>
                    <span>正在編輯歷史紀錄：<strong id="editingRecordTitle" class="font-mono">#ID</strong></span>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="cancelEditingMode()" class="text-xs bg-dark-800 hover:bg-dark-700 text-slate-300 px-2.5 py-1 rounded-lg border border-dark-600 transition">取消載入</button>
                    <button type="button" onclick="saveEditedRecordBackToGithub()" class="text-xs bg-amber-500 hover:bg-amber-400 text-black font-semibold px-2.5 py-1 rounded-lg transition shadow">更新至 GitHub</button>
                </div>
            </div>

            <!-- 1. 警報主類別 (平鋪按鈕) -->
            <div class="bg-dark-900 border border-dark-700 rounded-xl p-3.5 shadow-sm space-y-2">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">選擇警報類別</span>
                <div class="grid grid-cols-5 gap-1.5 sm:gap-2">
                    <button type="button" onclick="selectCategory('surge')" id="cat-surge" class="cat-pill py-2.5 px-1 rounded-lg border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-semibold transition text-center flex flex-col items-center justify-center">
                        <i data-lucide="waves" class="w-4 h-4 mb-1"></i>
                        <span>風暴潮</span>
                    </button>
                    <button type="button" onclick="selectCategory('cyclone')" id="cat-cyclone" class="cat-pill py-2.5 px-1 rounded-lg border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-semibold transition text-center flex flex-col items-center justify-center">
                        <i data-lucide="wind" class="w-4 h-4 mb-1"></i>
                        <span>氣旋</span>
                    </button>
                    <button type="button" onclick="selectCategory('rain')" id="cat-rain" class="cat-pill py-2.5 px-1 rounded-lg border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-semibold transition text-center flex flex-col items-center justify-center">
                        <i data-lucide="cloud-rain" class="w-4 h-4 mb-1"></i>
                        <span>降雨</span>
                    </button>
                    <button type="button" onclick="selectCategory('heat')" id="cat-heat" class="cat-pill py-2.5 px-1 rounded-lg border border-amber-500 bg-amber-500/15 text-amber-300 text-xs font-semibold transition text-center flex flex-col items-center justify-center shadow">
                        <i data-lucide="sun" class="w-4 h-4 mb-1"></i>
                        <span>酷熱</span>
                    </button>
                    <button type="button" onclick="selectCategory('cold')" id="cat-cold" class="cat-pill py-2.5 px-1 rounded-lg border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-semibold transition text-center flex flex-col items-center justify-center">
                        <i data-lucide="snowflake" class="w-4 h-4 mb-1"></i>
                        <span>寒冷</span>
                    </button>
                </div>
            </div>

            <!-- 2. 發布狀態 (新/舊) 與 時間 (獨立 Responsive 排版防重疊) -->
            <div class="bg-dark-900 border border-dark-700 rounded-xl p-3.5 shadow-sm space-y-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">發布模式與時間 (MST)</span>
                
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btnModeNew" onclick="selectIssueMode('new')" class="py-2 px-3 rounded-lg text-xs font-bold transition border border-amber-500 bg-amber-500 text-black shadow">
                        發出
                    </button>
                    <button type="button" id="btnModeCur" onclick="selectIssueMode('current')" class="py-2 px-3 rounded-lg text-xs font-bold transition border border-dark-700 bg-dark-800 text-slate-400 hover:text-white">
                        延長生效/更新
                    </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <div class="flex flex-col">
                        <label class="text-[11px] text-slate-400 mb-1.5 font-medium">發布日期 (YYYY-MM-DD)</label>
                        <input type="date" id="inputDate" oninput="renderWarning()" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-3 py-2 text-sm text-slate-100 outline-none font-mono">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-[11px] text-slate-400 mb-1.5 font-medium">發布時間 (HH:MM)</label>
                        <input type="text" id="inputTime" oninput="renderWarning()" placeholder="08:20" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-3 py-2 text-sm text-slate-100 outline-none font-mono">
                    </div>
                </div>
            </div>

            <!-- 3. 酷熱警報模組 -->
            <div id="module-heat" class="bg-dark-900 border border-dark-700 rounded-xl p-3.5 shadow-sm space-y-3">
                <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider">酷熱警報等級</span>
                
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="selectHeatLevel('酷熱')" id="btn-heat-酷熱" class="heat-btn p-2.5 rounded-lg border border-amber-500 bg-amber-500/15 text-amber-300 text-center text-xs font-bold transition shadow">酷熱</button>
                    <button type="button" onclick="selectHeatLevel('非常酷熱')" id="btn-heat-非常酷熱" class="heat-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-center text-xs font-bold transition">非常酷熱</button>
                    <button type="button" onclick="selectHeatLevel('極為酷熱')" id="btn-heat-極為酷熱" class="heat-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-center text-xs font-bold transition">極為酷熱</button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                    <div class="flex flex-col">
                        <label class="text-[11px] text-slate-400 mb-1">預計最高氣溫 (°C)</label>
                        <input type="text" id="heatTemp" oninput="renderWarning()" placeholder="如 34 或 33 - 34" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none font-mono">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-[11px] text-slate-400 mb-1">部分地區氣溫 (°C)</label>
                        <input type="text" id="heatPartTemp" oninput="renderWarning()" placeholder="如 35 - 36" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none font-mono">
                    </div>
                </div>
            </div>

            <!-- 4. 降雨警報模組 -->
            <div id="module-rain" class="hidden bg-dark-900 border border-dark-700 rounded-xl p-3.5 shadow-sm space-y-3">
                <span class="text-xs font-semibold text-blue-400 uppercase tracking-wider">降雨警報 / 預警模板</span>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    <button type="button" onclick="selectRainSignal('rain_heavy_warn')" id="btn-rain-rain_heavy_warn" class="rain-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-left text-xs font-bold transition">
                        大雨警報
                    </button>
                    <button type="button" onclick="selectRainSignal('rain_storm_warn')" id="btn-rain-rain_storm_warn" class="rain-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-left text-xs font-bold transition">
                        暴雨警報
                    </button>
                    <button type="button" onclick="selectRainSignal('rain_super_warn')" id="btn-rain-rain_super_warn" class="rain-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-left text-xs font-bold transition">
                        大暴雨警報
                    </button>
                    <button type="button" onclick="selectRainSignal('rain_heavy_pre')" id="btn-rain-rain_heavy_pre" class="rain-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-left text-xs font-bold transition">
                        大雨預警
                    </button>
                    <button type="button" onclick="selectRainSignal('rain_storm_pre')" id="btn-rain-rain_storm_pre" class="rain-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-left text-xs font-bold transition">
                        暴雨預警
                    </button>
                    <button type="button" onclick="selectRainSignal('rain_super_pre')" id="btn-rain-rain_super_pre" class="rain-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-left text-xs font-bold transition">
                        大暴雨預警
                    </button>
                </div>

                <div id="rainPreTimeBox" class="hidden bg-dark-950 border border-blue-500/30 rounded-lg p-3 space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label class="text-[11px] text-blue-300 font-medium" id="rainPreTimeLabel">預警指定發出時間 (HH:MM)</label>
                        <span class="text-[10px] text-slate-400 font-mono">留空則顯示可能性</span>
                    </div>
                    <input type="text" id="rainPreExpectedTime" oninput="renderWarning()" placeholder="留空 或 輸入如 01:30" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none font-mono">
                </div>
            </div>

            <!-- 5. 風暴潮模組 -->
            <div id="module-surge" class="hidden bg-dark-900 border border-dark-700 rounded-xl p-3.5 shadow-sm space-y-3">
                <span class="text-xs font-semibold text-teal-400 uppercase tracking-wider">風暴潮級別</span>
                
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="selectSurgeSignal('watch')" id="btn-surge-watch" class="surge-btn p-2.5 rounded-lg border border-teal-500 bg-teal-500/15 text-teal-300 text-left text-xs transition flex flex-col justify-between shadow">
                        <span class="font-bold">風暴潮觀察</span>
                        <span class="text-[10px] opacity-70">3.3 ~ 3.6m</span>
                    </button>
                    <button type="button" onclick="selectSurgeSignal('advisory')" id="btn-surge-advisory" class="surge-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-left text-xs transition flex flex-col justify-between">
                        <span class="font-bold">風暴潮戒備</span>
                        <span class="text-[10px] opacity-70">3.6 ~ 4.3m</span>
                    </button>
                    <button type="button" onclick="selectSurgeSignal('warning')" id="btn-surge-warning" class="surge-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-left text-xs transition flex flex-col justify-between">
                        <span class="font-bold">風暴潮危險</span>
                        <span class="text-[10px] opacity-70">≥ 4.3m</span>
                    </button>
                </div>

                <div class="border-t border-dark-700/80 pt-3 space-y-2.5">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-slate-300">天文潮疊加增水數值 (選填)</span>
                        <span class="text-[10px] font-mono text-teal-400" id="surgeDayBadge">比對為：今日</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">潮汐日期</label>
                            <input type="date" id="surgeTideDate" oninput="renderWarning()" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none font-mono">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">高潮時間</label>
                            <input type="text" id="surgeTideTime" oninput="renderWarning()" placeholder="如 08:30" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none font-mono">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">天文潮 (m)</label>
                            <input type="number" step="0.01" inputmode="decimal" id="surgeTideH" oninput="renderWarning()" placeholder="2.30" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none font-mono">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">增水下限 (m)</label>
                            <input type="number" step="0.01" inputmode="decimal" id="surgeRangeL" oninput="renderWarning()" placeholder="1.10" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none font-mono">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">增水上限 (m)</label>
                            <input type="number" step="0.01" inputmode="decimal" id="surgeRangeH" oninput="renderWarning()" placeholder="1.50" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none font-mono">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">影響起始 (時)</label>
                            <input type="number" min="0" max="23" id="surgeHourS" oninput="renderWarning()" placeholder="06" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none font-mono">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1">影響結束 (時)</label>
                            <input type="number" min="0" max="23" id="surgeHourE" oninput="renderWarning()" placeholder="11" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none font-mono">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 6. 熱帶氣旋模組 -->
            <div id="module-cyclone" class="hidden bg-dark-900 border border-dark-700 rounded-xl p-3.5 shadow-sm space-y-3">
                <span class="text-xs font-semibold text-cyan-400 uppercase tracking-wider">熱帶氣旋警報信號</span>

                <div class="grid grid-cols-3 sm:grid-cols-5 gap-1.5">
                    <button type="button" onclick="selectCycloneSignal('注意警報')" id="btn-tc-注意警報" class="tc-btn p-2 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-xs font-bold transition text-center">注意警報</button>
                    <button type="button" onclick="selectCycloneSignal('戒備警報')" id="btn-tc-戒備警報" class="tc-btn p-2 rounded-lg border border-cyan-500 bg-cyan-500/15 text-cyan-300 text-xs font-bold transition text-center shadow">戒備警報</button>
                    <button type="button" onclick="selectCycloneSignal('強風警報')" id="btn-tc-強風警報" class="tc-btn p-2 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-xs font-bold transition text-center">強風警報</button>
                    <button type="button" onclick="selectCycloneSignal('東北烈風警報')" id="btn-tc-東北烈風警報" class="tc-btn p-2 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-xs font-bold transition text-center">東北烈風</button>
                    <button type="button" onclick="selectCycloneSignal('東南烈風警報')" id="btn-tc-東南烈風警報" class="tc-btn p-2 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-xs font-bold transition text-center">東南烈風</button>
                    <button type="button" onclick="selectCycloneSignal('西北烈風警報')" id="btn-tc-西北烈風警報" class="tc-btn p-2 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-xs font-bold transition text-center">西北烈風</button>
                    <button type="button" onclick="selectCycloneSignal('西南烈風警報')" id="btn-tc-西南烈風警報" class="tc-btn p-2 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-xs font-bold transition text-center">西南烈風</button>
                    <button type="button" onclick="selectCycloneSignal('暴風警報')" id="btn-tc-暴風警報" class="tc-btn p-2 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-xs font-bold transition text-center">暴風警報</button>
                    <button type="button" onclick="selectCycloneSignal('𩗗風警報')" id="btn-tc-𩗗風警報" class="tc-btn p-2 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-xs font-bold transition text-center col-span-1 sm:col-span-2">𩗗風警報</button>
                </div>

                <div id="cautionRangeBox" class="hidden bg-dark-950 border border-amber-500/30 rounded-lg p-2.5 space-y-1.5">
                    <span class="text-xs text-amber-300 font-semibold block">注意警報範圍：</span>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" id="btn-c1200" onclick="selectCautionRange('1200')" class="py-1.5 px-2 rounded border border-amber-500 bg-amber-500/20 text-amber-300 text-xs font-bold">1200 公里範圍</button>
                        <button type="button" id="btn-c800" onclick="selectCautionRange('800')" class="py-1.5 px-2 rounded border border-dark-700 bg-dark-800 text-slate-400 text-xs font-bold">800 公里範圍</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">氣旋名稱</label>
                        <input type="text" id="tcName" oninput="renderWarning()" placeholder="如 萬宜" class="w-full bg-dark-950 border border-dark-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">中心風速 (km/h)</label>

    <!-- JavaScript 核心邏輯 -->
    <script>
        const MACAU_LAT = 22.1595;
        const MACAU_LON = 113.5685;

        // 當前介面狀態
        let curCat = 'heat';
        let curMode = 'new';
        let curSurge = 'watch';
        let curCyclone = '戒備警報';
        let curCautionRange = '1200';
        let curRain = 'rain_heavy_warn';
        let curHeat = '酷熱';
        let curCold = '寒冷';

        // GitHub 紀錄庫快取與編輯識別
        let githubRecordsCache = [];
        let githubFileSha = null;
        let editingRecordId = null; // 當正在編輯某筆紀錄時，記錄該筆 ID

        // 澳門熱帶氣旋強度對照表
        const TC_INTENSITIES = [
            { code: 'Ex',   name: '溫帶氣旋',     max: -1,   text: '-',          color: '#64748b' },
            { code: 'LPA',  name: '低壓區',       max: 40,   text: '≤ 40 km/h',  color: '#64748b' },
            { code: 'TD',   name: '熱帶低氣壓',   max: 62,   text: '41-62 km/h', color: '#0284c7' },
            { code: 'TS',   name: '熱帶風暴',     max: 87,   text: '63-87 km/h', color: '#16a34a' },
            { code: 'STS',  name: '強烈熱帶風暴', max: 117,  text: '88-117 km/h',color: '#ca8a04' },
            { code: 'TY',   name: '颱風',         max: 149,  text: '118-149 km/h',color: '#ea580c' },
            { code: 'STY',  name: '強颱風',       max: 184,  text: '150-184 km/h',color: '#dc2626' },
            { code: 'SuTY', name: '超強颱風',     max: 9999, text: '≥ 185 km/h', color: '#9333ea' }
        ];

        // 酷熱警報三大等級官方文案配置
        const HEAT_OFFICIAL_ADVICE = {
            '酷熱': `長時間暴露在陽光下或進行體力活動可能導致中暑、肌肉抽筋和熱衰竭。建議市民減少劇烈戶外活動、穿著輕便及淺色的衣物、補充足夠水分。`,
            '非常酷熱': `極可能發生中暑、熱痙攣和熱衰竭。長時間暴露在陽光下或進行體力活動有可能發生嚴重中暑。建議市民避免戶外劇烈活動、穿著輕便及淺色的衣物、補充足夠水分，特別關注易受影響的族群。`,
            '極為酷熱': `市民應在烈日當空之下避免進行戶外活動，避免長時間在陽光下曝曬，以免受太陽紫外線曬傷，且應盡量留在室內地方及多補充水份，慎防中暑及熱衰竭提防中暑。

在戶外活動的人士，應留意身體健康狀況，帶備食水及防曬用品，並減少長時間在陽光下曝曬。市民亦應留意本台最新消息。

長者、孕婦、嬰兒及小童、慢性病如心臟病或高血壓患者，以及過胖人士均較易中暑，應及時觀察是否出現中暑徵兆。在極為酷熱天氣下，更應時常留意身體健康狀況，確保有充分休息，保持體溫正常，避免身體過份受熱。`
        };

        // 1. 類別切換
        function selectCategory(cat) {
            curCat = cat;

            document.querySelectorAll('.cat-pill').forEach(btn => {
                btn.className = "cat-pill py-2.5 px-1 rounded-lg border border-dark-700 bg-dark-800 hover:bg-dark-700 text-slate-300 text-xs font-semibold transition text-center flex flex-col items-center justify-center";
            });

            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                if (cat === 'surge') activeBtn.className = "cat-pill py-2.5 px-1 rounded-lg border border-teal-500 bg-teal-500/15 text-teal-300 text-xs font-semibold transition text-center flex flex-col items-center justify-center shadow";
                else if (cat === 'cyclone') activeBtn.className = "cat-pill py-2.5 px-1 rounded-lg border border-cyan-500 bg-cyan-500/15 text-cyan-300 text-xs font-semibold transition text-center flex flex-col items-center justify-center shadow";
                else if (cat === 'rain') activeBtn.className = "cat-pill py-2.5 px-1 rounded-lg border border-blue-500 bg-blue-500/15 text-blue-300 text-xs font-semibold transition text-center flex flex-col items-center justify-center shadow";
                else if (cat === 'heat') activeBtn.className = "cat-pill py-2.5 px-1 rounded-lg border border-amber-500 bg-amber-500/15 text-amber-300 text-xs font-semibold transition text-center flex flex-col items-center justify-center shadow";
                else if (cat === 'cold') activeBtn.className = "cat-pill py-2.5 px-1 rounded-lg border border-indigo-500 bg-indigo-500/15 text-indigo-300 text-xs font-semibold transition text-center flex flex-col items-center justify-center shadow";
            }

            ['surge', 'cyclone', 'rain', 'heat', 'cold'].forEach(c => {
                const el = document.getElementById(`module-${c}`);
                if (el) el.classList.toggle('hidden', c !== cat);
            });

            renderWarning();
        }

        // 2. 發布模式切換 (新 / 舊)
        function selectIssueMode(mode) {
            curMode = mode;
            const btnNew = document.getElementById('btnModeNew');
            const btnCur = document.getElementById('btnModeCur');

            if (mode === 'new') {
                btnNew.className = "py-2 px-3 rounded-lg text-xs font-bold transition border border-amber-500 bg-amber-500 text-black shadow";
                btnCur.className = "py-2 px-3 rounded-lg text-xs font-bold transition border border-dark-700 bg-dark-800 text-slate-400 hover:text-white";
            } else {
                btnCur.className = "py-2 px-3 rounded-lg text-xs font-bold transition border border-amber-500 bg-amber-500 text-black shadow";
                btnNew.className = "py-2 px-3 rounded-lg text-xs font-bold transition border border-dark-700 bg-dark-800 text-slate-400 hover:text-white";
            }
            renderWarning();
        }

        // 3. 酷熱等級切換
        function selectHeatLevel(level) {
            curHeat = level;
            document.querySelectorAll('.heat-btn').forEach(btn => {
                btn.className = "heat-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-center text-xs font-bold transition";
            });
            const active = document.getElementById(`btn-heat-${level}`);
            if (active) {
                active.className = "heat-btn p-2.5 rounded-lg border border-amber-500 bg-amber-500/15 text-amber-300 text-center text-xs font-bold transition shadow";
            }
            renderWarning();
        }

        // 4. 降雨模板切換
        function selectRainSignal(tplKey) {
            curRain = tplKey;
            document.querySelectorAll('.rain-btn').forEach(btn => {
                btn.className = "rain-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-left text-xs font-bold transition";
            });
            const active = document.getElementById(`btn-rain-${tplKey}`);
            if (active) {
                active.className = "rain-btn p-2.5 rounded-lg border border-blue-500 bg-blue-500/15 text-blue-300 text-left text-xs font-bold transition shadow";
            }

            const preBox = document.getElementById('rainPreTimeBox');
            const preLabel = document.getElementById('rainPreTimeLabel');
            if (preBox) {
                const isPreWarning = ['rain_heavy_pre', 'rain_storm_pre', 'rain_super_pre'].includes(tplKey);
                preBox.classList.toggle('hidden', !isPreWarning);
                if (isPreWarning) {
                    if (tplKey === 'rain_heavy_pre') preLabel.innerText = '大雨預警指定發出時間 (HH:MM)';
                    else if (tplKey === 'rain_storm_pre') preLabel.innerText = '暴雨預警指定發出時間 (HH:MM)';
                    else if (tplKey === 'rain_super_pre') preLabel.innerText = '大暴雨預警指定發出時間 (HH:MM)';
                }
            }

            renderWarning();
        }

        // 5. 風暴潮級別切換
        function selectSurgeSignal(signalKey) {
            curSurge = signalKey;
            document.querySelectorAll('.surge-btn').forEach(btn => {
                btn.className = "surge-btn p-2.5 rounded-lg border border-dark-700 bg-dark-800 text-slate-300 text-left text-xs transition flex flex-col justify-between";
            });
            const active = document.getElementById(`btn-surge-${signalKey}`);
            if (active) {
                active.className = "surge-btn p-2.5 rounded-lg border border-teal-500 bg-teal-500/15 text-teal-300 text-left text-xs transition flex flex-col justify-between shadow";
            }
            renderWarning();
        }

        // 6. 熱帶氣旋信號切換
        function selectCycloneSignal(sigName) {
            curCyclone = sigName;

        function getIntensityObj(windVal) {
            const wind = parseFloat(windVal);
            if (isNaN(wind) || wind < 0) return null;
            if (wind <= 40) return TC_INTENSITIES[1];
            if (wind <= 62) return TC_INTENSITIES[2];
            if (wind <= 87) return TC_INTENSITIES[3];
            if (wind <= 117) return TC_INTENSITIES[4];

            if (wind <= 184) return TC_INTENSITIES[6];
            return TC_INTENSITIES[7];
        }

        function getTimePeriodWord(hh) {
            const h = parseInt(hh, 10);
            if (isNaN(h)) return '';
            if (h >= 0 && h <= 4) return `凌晨${h}時`;
            if (h >= 5 && h <= 6) return `清晨${h}時`;
            if (h >= 7 && h <= 11) return `早上${h}時`;
            if (h === 12) return `正午12時`;
            if (h >= 13 && h <= 18) return `下午${h - 12}時`;
            if (h >= 19 && h <= 23) return `晚上${h - 12}時`;
            return `${h}時`;
        }

        function calcDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function calcBearing16(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            let θ = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
            const dirs = ['北', '東北偏北', '東北', '東北偏東', '東', '東南偏東', '東南', '東南偏南',
                          '南', '西南偏南', '西南', '西南偏西', '西', '西北偏西', '西北', '西北偏北'];
            return dirs[Math.round(θ / 22.5) % 16];
        }

        function getRelativeDay(issueD, tideD) {
            if (!issueD || !tideD) return '今日/明日';
            const d1 = new Date(issueD + 'T00:00:00');
            const d2 = new Date(tideD + 'T00:00:00');
            const diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
            if (diff === 0) return '今日';
            if (diff === 1) return '明日';
            return '今日/明日';
        }

        function formatExpectedTimeText(rawInput) {
            const str = (rawInput || '').trim();
            if (!str) return '';
            if (str.includes(':')) {

                    const h = parts[0].padStart(2, '0');
                    const m = parts[1].padStart(2, '0');
                    return `${h}時${m}分`;
                }
            }
            return str;
        }

                    tcWind: document.getElementById('tcWind').value,
                    tcCurLat: document.getElementById('tcCurLat').value,
                    tcCurLon: document.getElementById('tcCurLon').value,
                    tcFcLat: document.getElementById('tcFcLat').value,
                    tcFcLon: document.getElementById('tcFcLon').value,
                    curCold,
                    coldTemp: document.getElementById('coldTemp').value,
                    coldPartTemp: document.getElementById('coldPartTemp').value
                }
            };
        }

        // ================= GITHUB 雲端儲存庫管理系統 =================

        function toggleGithubModal(show) {
            const modal = document.getElementById('modalGithub');
            modal.classList.toggle('hidden', !show);
            if (show) {
                document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
                document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';
                document.getElementById('ghPath').value = localStorage.getItem('gh_path') || 'meteo_warnings.json';
                updateGhIndicator();
                if (localStorage.getItem('gh_token') && localStorage.getItem('gh_repo')) {
                    fetchGithubRecords(false);
                }
            }
        }

        function toggleConnectionFields() {
            const fields = document.getElementById('connectionFields');
            fields.classList.toggle('hidden');
        }

        function updateGhIndicator() {
            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_repo');
            const dot = document.getElementById('navGhIndicator');
            if (token && repo) {
                dot.className = "w-2 h-2 rounded-full bg-emerald-400";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-slate-500";
            }
        }

        function saveGithubConfig(triggerFetch = true) {
            const token = document.getElementById('ghToken').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const path = document.getElementById('ghPath').value.trim() || 'meteo_warnings.json';

            if (!token || !repo) {
                showToast("請輸入完整的 GitHub Token 與 Repo！");
                return;
            }

            localStorage.setItem('gh_token', token);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_path', path);
            updateGhIndicator();

            if (triggerFetch) {
                fetchGithubRecords(true);
            }
        }

        // 從 GitHub 讀取所有警報紀錄
        async function fetchGithubRecords(showNotification = true) {
            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_repo');
            const path = localStorage.getItem('gh_path') || 'meteo_warnings.json';
            const statusEl = document.getElementById('ghStatus');
            const listEl = document.getElementById('ghRecordList');

            if (!token || !repo) {
                statusEl.innerText = '請先填寫連線設定。';
                return;
            }

            statusEl.innerText = '正在連線 GitHub...';
            listEl.innerHTML = `<div class="py-12 text-center text-teal-400 text-xs flex items-center justify-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>讀取資料庫中...</span></div>`;
            lucide.createIcons();

            const url = `https://api.github.com/repos/${repo}/contents/${path}`;

            try {
                const res = await fetch(url, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (res.status === 200) {
                    const data = await res.json();
                    githubFileSha = data.sha;
                    const decoded = decodeURIComponent(escape(atob(data.content)));
                    try {
                        githubRecordsCache = JSON.parse(decoded);
                        if (!Array.isArray(githubRecordsCache)) githubRecordsCache = [githubRecordsCache];
                    } catch (e) {
                        githubRecordsCache = [];
                    }
                    statusEl.innerText = `已連線（共 ${githubRecordsCache.length} 筆）`;
                    renderGithubRecordsList();
                    if (showNotification) showToast("已成功同步 GitHub 紀錄！");
                } else if (res.status === 404) {
                    githubFileSha = null;
                    githubRecordsCache = [];
                    statusEl.innerText = '檔案尚未建立（存入首筆警報時將自動初始化）';
                    renderGithubRecordsList();
                    if (showNotification) showToast("倉庫中尚未建立此 JSON，隨時可上傳首筆紀錄。");
                } else {
                    const err = await res.json();
                    statusEl.innerText = '連線失敗: ' + (err.message || '請確認權限');
                    listEl.innerHTML = `<div class="py-8 text-center text-red-400 text-xs">連線失敗：${err.message || '權限或倉庫名稱錯誤'}</div>`;
                }
            } catch (err) {
                statusEl.innerText = '網路或連線錯誤：' + err.message;
                listEl.innerHTML = `<div class="py-8 text-center text-red-400 text-xs">連線異常：${err.message}</div>`;
            }
        }

        // 渲染 GitHub 紀錄列表
        function renderGithubRecordsList() {
            const listEl = document.getElementById('ghRecordList');
            const countBadge = document.getElementById('ghCountBadge');
            countBadge.innerText = `${githubRecordsCache.length} 筆紀錄`;
            countBadge.classList.remove('hidden');

            if (githubRecordsCache.length === 0) {
                listEl.innerHTML = `<div class="py-12 text-center text-slate-500 text-xs">目前暫無警報紀錄。可點選「存入目前警報」新增第一筆。</div>`;
                return;
            }

            listEl.innerHTML = githubRecordsCache.map((rec, idx) => {
                const firstLine = (rec.formattedText || '').split('\n')[0] || '【#氣象警報】';
                const timeLine = `${rec.date || ''} ${rec.time || ''} MST`;
                const isEditing = (rec.id === editingRecordId);

                return `
                    <div class="p-3 bg-dark-900 border ${isEditing ? 'border-amber-500 bg-amber-500/5' : 'border-dark-700'} hover:border-teal-500/50 rounded-xl transition flex items-center justify-between gap-3">
                        <div class="overflow-hidden flex-1 min-w-0 cursor-pointer" onclick="viewRecordDetail(${idx})">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs text-white truncate">${firstLine}</span>
                                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-dark-800 text-slate-300 border border-dark-700 shrink-0">${timeLine}</span>
                                ${isEditing ? '<span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1.5 py-0.2 rounded font-mono shrink-0">編輯中</span>' : ''}
                            </div>
                            <p class="text-[11px] text-slate-400 truncate mt-1">${(rec.formattedText || '').replace(/\n+/g, ' ')}</p>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button type="button" onclick="viewRecordDetail(${idx})" title="查看全文" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-dark-800 transition">
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                            <button type="button" onclick="loadRecordToEditor(${idx})" title="載入編輯" class="p-1.5 rounded-lg text-amber-400 hover:text-amber-300 hover:bg-amber-500/10 transition">
                                <i data-lucide="edit-2" class="w-4 h-4"></i>
                            </button>
                            <button type="button" onclick="deleteRecordFromGithub(${idx})" title="刪除紀錄" class="p-1.5 rounded-lg text-red-400 hover:text-red-300 hover:bg-red-500/10 transition">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // 將當前編輯器中的警報上傳新增到 GitHub
        async function uploadCurrentToGithub() {
            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_repo');
            const path = localStorage.getItem('gh_path') || 'meteo_warnings.json';

            if (!token || !repo) {
                toggleGithubModal(true);
                showToast("請先輸入並儲存 GitHub Token 與 Repo！");
                return;
            }

            const newSnapshot = captureCurrentSnapshot();
            newSnapshot.id = 'warn_' + Date.now(); // 保證唯一
            
            showToast("正在上傳至 GitHub...");

            // 加入至陣列最前端
            const updatedList = [newSnapshot, ...githubRecordsCache];
            await commitListToGithub(updatedList, `新增警報紀錄 [${newSnapshot.date} ${newSnapshot.time}]`);
        }

        // 載入指定紀錄回編輯面板
        function loadRecordToEditor(index) {
            const rec = githubRecordsCache[index];
            if (!rec) return;

            editingRecordId = rec.id;
            document.getElementById('editingBanner').classList.remove('hidden');
            document.getElementById('editingRecordTitle').innerText = `${rec.category || '警報'} (${rec.date} ${rec.time})`;

            // 恢復基礎時間與模式
            if (rec.mode) selectIssueMode(rec.mode);
            if (rec.date) document.getElementById('inputDate').value = rec.date;
            if (rec.time) document.getElementById('inputTime').value = rec.time;

            // 恢復大類別
            if (rec.category) selectCategory(rec.category);

            // 恢復詳細各模組參數
            const p = rec.params || {};
            if (rec.category === 'heat') {
                if (p.curHeat) selectHeatLevel(p.curHeat);
                document.getElementById('heatTemp').value = p.heatTemp || '';
                document.getElementById('heatPartTemp').value = p.heatPartTemp || '';
            } else if (rec.category === 'rain') {
                if (p.curRain) selectRainSignal(p.curRain);
                document.getElementById('rainPreExpectedTime').value = p.rainPreExpectedTime || '';
            } else if (rec.category === 'surge') {
                if (p.curSurge) selectSurgeSignal(p.curSurge);
                document.getElementById('surgeTideDate').value = p.surgeTideDate || '';
                document.getElementById('surgeTideTime').value = p.surgeTideTime || '';
                document.getElementById('surgeTideH').value = p.surgeTideH || '';
                document.getElementById('surgeRangeL').value = p.surgeRangeL || '';
                document.getElementById('surgeRangeH').value = p.surgeRangeH || '';
                document.getElementById('surgeHourS').value = p.surgeHourS || '';
                document.getElementById('surgeHourE').value = p.surgeHourE || '';
            } else if (rec.category === 'cyclone') {
                if (p.curCyclone) selectCycloneSignal(p.curCyclone);
                if (p.curCautionRange) selectCautionRange(p.curCautionRange);
                document.getElementById('tcName').value = p.tcName || '';
                document.getElementById('tcWind').value = p.tcWind || '';
                document.getElementById('tcCurLat').value = p.tcCurLat || '';
                document.getElementById('tcCurLon').value = p.tcCurLon || '';
                document.getElementById('tcFcLat').value = p.tcFcLat || '';
                document.getElementById('tcFcLon').value = p.tcFcLon || '';
                handleWindChange();
            } else if (rec.category === 'cold') {
                if (p.curCold) selectColdLevel(p.curCold);
                document.getElementById('coldTemp').value = p.coldTemp || '';
                document.getElementById('coldPartTemp').value = p.coldPartTemp || '';
            }

            renderWarning();
            toggleGithubModal(false);
            showToast("歷史紀錄已成功載入至左側編輯面板！");
        }

        // 取消編輯模式
        function cancelEditingMode() {
            editingRecordId = null;
            document.getElementById('editingBanner').classList.add('hidden');
            showToast("已退出歷史紀錄編輯狀態。");
        }

        // 將編輯後內容覆蓋更新回 GitHub 原紀錄
        async function saveEditedRecordBackToGithub() {
            if (!editingRecordId) return;

            const idx = githubRecordsCache.findIndex(r => r.id === editingRecordId);
            if (idx === -1) {
                showToast("找不到原始紀錄，將改為新增一筆。");
                uploadCurrentToGithub();
                return;
            }

            showToast("正在更新 GitHub 紀錄...");
            const updatedRecord = captureCurrentSnapshot();
            updatedRecord.id = editingRecordId; // 保留原始 ID
            updatedRecord.updatedAt = new Date().toISOString();

            const cloneList = [...githubRecordsCache];
            cloneList[idx] = updatedRecord;

            const success = await commitListToGithub(cloneList, `更新警報紀錄 [${updatedRecord.date} ${updatedRecord.time}]`);
            if (success) {
                cancelEditingMode();
            }
        }

        // 刪除 GitHub 上指定的紀錄
        async function deleteRecordFromGithub(index) {
            const rec = githubRecordsCache[index];
            if (!rec) return;

            const confirmMsg = `確定要從 GitHub 刪除這筆紀錄嗎？\n\n${rec.date} ${rec.time} - ${rec.category || '警報'}`;
            // Custom modal confirm or soft check
            if (!confirm(confirmMsg)) return;

            showToast("正在刪除紀錄...");
            const filtered = githubRecordsCache.filter((_, i) => i !== index);
            await commitListToGithub(filtered, `刪除警報紀錄 [${rec.date} ${rec.time}]`);
        }

        // 提交整份 JSON 陣列至 GitHub Contents API (UTF-8 安全)
        async function commitListToGithub(newList, commitMessage) {
            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_repo');
            const path = localStorage.getItem('gh_path') || 'meteo_warnings.json';
            const statusEl = document.getElementById('ghStatus');

            if (!token || !repo) {
                showToast("請先完成 GitHub 連線配置！");
                return false;
            }

            const url = `https://api.github.com/repos/${repo}/contents/${path}`;

            try {
                // 如果先前沒有 SHA，先嘗試取得最新的 SHA
                if (!githubFileSha) {
                    const checkRes = await fetch(url, {
                        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                    });
                    if (checkRes.status === 200) {
                        const checkData = await checkRes.json();
                        githubFileSha = checkData.sha;
                    }
                }

                // 採用 encodeURIComponent -> unescape -> btoa 保證繁體中文字符不亂碼
                const jsonString = JSON.stringify(newList, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: commitMessage,
                        content: encodedContent,
                        sha: githubFileSha || undefined
                    })
                });

                if (putRes.ok) {
                    const putData = await putRes.json();
                    githubFileSha = putData.content?.sha || githubFileSha;
                    githubRecordsCache = newList;
                    statusEl.innerText = `同步成功（共 ${githubRecordsCache.length} 筆）`;
                    renderGithubRecordsList();
                    showToast("GitHub 資料庫同步成功！");
                    return true;
                } else {
                    const err = await putRes.json();
                    statusEl.innerText = '儲存失敗：' + (err.message || '請確認權限');
                    showToast(`上傳失敗：${err.message || '權限受阻'}`);
                    return false;
                }
            } catch (err) {
                statusEl.innerText = '網路異常：' + err.message;
                showToast("連線至 GitHub 發生錯誤。");
                return false;
            }
        }

        // 彈出全文詳情視窗
        function viewRecordDetail(index) {
            const rec = githubRecordsCache[index];
            if (!rec) return;

            document.getElementById('viewModalTitle').innerText = `${rec.category || '警報'}（${rec.date} ${rec.time} MST）`;
            document.getElementById('viewModalBody').value = rec.formattedText || '';
            document.getElementById('modalViewRecord').classList.remove('hidden');
        }

        function closeViewModal() {
            document.getElementById('modalViewRecord').classList.add('hidden');
        }

        function copyViewModalContent() {
            const body = document.getElementById('viewModalBody').value;
            if (!body) return;
            const el = document.createElement('textarea');
            el.value = body;
            el.style.position = 'fixed';
            el.style.opacity = '0';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("已複製警報詳情內容！");
        }

        // 匯出全部為 JSON 備份檔
        function exportRecordsJson() {
            const dataStr = JSON.stringify(githubRecordsCache, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `meteo_backup_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("已匯出本機 JSON 備份檔！");
        }

        // ================= 工具與輔助函數 =================

        function syncCurrentTime() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('inputDate').value = `${y}-${m}-${d}`;
            document.getElementById('inputTime').value = `${hh}:${mm}`;
            if (!document.getElementById('surgeTideDate').value) {
                document.getElementById('surgeTideDate').value = `${y}-${m}-${d}`;
            }
            renderWarning();
        }

        function switchTab(tab) {
            const pEdit = document.getElementById('panelEdit');
            const pPrev = document.getElementById('panelPreview');
            const bEdit = document.getElementById('tabBtnEdit');
            const bPrev = document.getElementById('tabBtnPreview');

            if (tab === 'edit') {
                pEdit.classList.remove('hidden');
                pPrev.classList.add('hidden');
                bEdit.className = "py-2 text-xs font-semibold rounded-lg bg-amber-500/15 text-amber-300 border border-amber-500/40";
                bPrev.className = "py-2 text-xs font-semibold rounded-lg text-slate-400 border border-transparent";
            } else {
                pEdit.classList.add('hidden');
                pPrev.classList.remove('hidden');
                bPrev.className = "py-2 text-xs font-semibold rounded-lg bg-amber-500/15 text-amber-300 border border-amber-500/40";
                bEdit.className = "py-2 text-xs font-semibold rounded-lg text-slate-400 border border-transparent";
            }
        }

        function copyWarningText() {
            const val = document.getElementById('outputText').value;
            if (!val) return;
            const el = document.createElement('textarea');
            el.value = val;
            el.style.position = 'fixed';
            el.style.opacity = '0';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("已成功複製警報文字！");
        }

        function downloadWarningText() {
            const val = document.getElementById('outputText').value;
            if (!val) return;
            const blob = new Blob([val], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `macau_meteo_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("已下載 .txt 檔案！");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 2500);
        }

        // 頁面初始化
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            syncCurrentTime();
            selectCategory('heat');
            selectHeatLevel('酷熱');
            selectSurgeSignal('watch');
            selectCycloneSignal('戒備警報');
            selectRainSignal('rain_heavy_warn');
            selectColdLevel('寒冷');

            updateGhIndicator();

            if (window.innerWidth < 1024) {
                switchTab('edit');
            }
        });
    </script>
