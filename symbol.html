<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天氣符號與定義指南 (0-99) - 澳門天氣</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(100, 116, 139, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.4);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-sky-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center p-4 md:p-8 transition-colors duration-200">

    <!-- 容器 -->
    <div class="w-full max-w-7xl space-y-6">
        
        <!-- 標頭 -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-book-atlas text-cyan-500 dark:text-cyan-400"></i> 天氣符號與定義指南 (0-99)
                </h1>
                <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">完整收錄 WMO 國際氣象組織 0 至 99 號所有氣象代碼與圖示對照</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                <!-- 返回主頁按鈕 -->
                <a href="index.html" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors text-sm font-medium flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-arrow-left"></i> 返回儀表板
                </a>
                <!-- 主題切換按鈕 -->
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors shadow-sm" title="切換主題">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
            </div>
        </header>

        <!-- 搜尋與篩選列 -->
        <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-4 md:p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="search-input" placeholder="搜尋天氣名稱或代碼 (如 95)..." class="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800/80 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 dark:focus:border-cyan-400 transition-colors">
            </div>
            <div id="category-filters" class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="filterCategory('all')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cyan-500 text-white shadow-sm transition-all" data-category="all">全部 (0-99)</button>
                <button onclick="filterCategory('晴朗與能見度')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="晴朗與能見度">晴朗與能見度</button>
                <button onclick="filterCategory('前期天氣')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="前期天氣">前期天氣 (20-29)</button>
                <button onclick="filterCategory('沙塵與吹雪')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="沙塵與吹雪">沙塵與吹雪 (30-39)</button>
                <button onclick="filterCategory('霧與結霜霧')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="霧與結霜霧">霧與結霜 (40-49)</button>
                <button onclick="filterCategory('毛毛雨')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="毛毛雨">毛毛雨 (50-59)</button>
                <button onclick="filterCategory('降雨')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="降雨">降雨 (60-69)</button>
                <button onclick="filterCategory('固態降水')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="固態降水">固態降水 (70-79)</button>
                <button onclick="filterCategory('陣性降水')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="陣性降水">陣性降水 (80-89)</button>
                <button onclick="filterCategory('雷暴與極端')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="雷暴與極端">雷暴極端 (90-99)</button>
            </div>
        </section>

        <!-- 符號卡片列表區塊 -->
        <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
            <div id="symbols-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- 動態載入 -->
            </div>
            <div id="no-result" class="hidden text-center py-16 text-slate-400">
                <i class="fa-solid fa-triangle-exclamation text-3xl mb-2 text-cyan-500"></i>
                <p>找不到符合條件的天氣符號</p>
            </div>
        </section>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 主題切換邏輯
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        // 完整 0-99 天氣符號資料庫
        const weatherSymbols = [
            // 0 - 19: 晴朗、能見度與特殊天象

            { code: 1, category: '晴朗與能見度', name: '晴空少雲', icon: 'fas fa-cloud-sun text-yellow-400', desc: '雲層消散中，晴淡雲稀。' },
            { code: 2, category: '晴朗與能見度', name: '局部多雲', icon: 'fas fa-cloud-sun text-yellow-300', desc: '天空狀況基本維持多雲。' },
            { code: 3, category: '晴朗與能見度', name: '陰天', icon: 'fas fa-cloud text-slate-400', desc: '雲層正在形成，陰沉無陽光。' },
            { code: 4, category: '晴朗與能見度', name: '煙霾', icon: 'fas fa-smog text-neutral-400', desc: '煙霧瀰漫，能見度受阻。' },
            { code: 5, category: '晴朗與能見度', name: '霾', icon: 'fas fa-wind text-stone-400', desc: '空氣中懸浮乾塵粒，能見度偏低。' },
            { code: 6, category: '晴朗與能見度', name: '浮塵', icon: 'fas fa-wind text-amber-600/70', desc: '微塵浮游於空中。' },
            { code: 7, category: '晴朗與能見度', name: '揚沙', icon: 'fas fa-wind text-amber-700', desc: '風吹揚沙或吹沙天氣。' },
            { code: 8, category: '晴朗與能見度', name: '塵捲風', icon: 'fas fa-tornado text-amber-800', desc: '小範圍強風捲起塵土。' },
            { code: 9, category: '晴朗與能見度', name: '沙塵暴現象', icon: 'fas fa-wind text-amber-900', desc: '觀測時或過去一小時內有沙塵暴。' },
            { code: 10, category: '晴朗與能見度', name: '輕霧', icon: 'fas fa-smog text-slate-300', desc: '微量水汽懸浮，輕霧影響能見度。' },

            { code: 13, category: '晴朗與能見度', name: '遠處閃電', icon: 'fas fa-bolt text-yellow-400', desc: '可見閃電，但聽不到雷聲。' },
            { code: 14, category: '晴朗與能見度', name: '雨幡', icon: 'fas fa-cloud text-blue-300/60', desc: '降水未著地，雨絲在空中蒸發。' },

            { code: 17, category: '晴朗與能見度', name: '旱雷', icon: 'fas fa-cloud-bolt text-amber-400', desc: '有雷暴發生，但無降水。' },

            { code: 24, category: '前期天氣', name: '前一小時有凍雨', icon: 'fas fa-icicles text-blue-300', desc: '觀測前一小時曾出現凍雨。' },
            { code: 25, category: '前期天氣', name: '前一小時有陣雨', icon: 'fas fa-cloud-showers-heavy text-blue-400', desc: '觀測前一小時曾有陣雨。' },

            { code: 34, category: '沙塵與吹雪', name: '無明顯變化強沙塵暴', icon: 'fas fa-wind text-amber-900', desc: '強沙塵暴無明顯變化。' },
            { code: 35, category: '沙塵與吹雪', name: '增強中強沙塵暴', icon: 'fas fa-wind text-amber-950', desc: '強沙塵暴正在增強。' },
            { code: 36, category: '沙塵與吹雪', name: '低吹雪（輕/中）', icon: 'fas fa-wind text-sky-100', desc: '低吹雪（輕度或中度）。' },
            { code: 37, category: '沙塵與吹雪', name: '低吹雪（重）', icon: 'fas fa-wind text-sky-200', desc: '低吹雪（重度）。' },
            { code: 38, category: '沙塵與吹雪', name: '高吹雪（輕/中）', icon: 'fas fa-snowflake text-sky-300', desc: '高吹雪（輕度或中度）。' },
            { code: 39, category: '沙塵與吹雪', name: '高吹雪（重）', icon: 'fas fa-snowflake text-sky-400', desc: '高吹雪（重度）。' },

            // 40 - 49: 霧或結霜霧
            { code: 41, category: '霧與結霜霧', name: '分散薄霧', icon: 'fas fa-smog text-slate-300', desc: '分散性薄霧。' },

            { code: 47, category: '霧與結霜霧', name: '天空不明的增強霧', icon: 'fas fa-smog text-slate-550', desc: '霧增強中，天空無法辨認。' },

            { code: 53, category: '毛毛雨', name: '連續性中毛毛雨', icon: 'fas fa-cloud-rain text-blue-400', desc: '持續的中等毛毛雨。' },
            { code: 54, category: '毛毛雨', name: '間歇性濃毛毛雨', icon: 'fas fa-cloud-showers-heavy text-blue-450', desc: '濃密毛毛雨間歇出現。' },

            { code: 56, category: '毛毛雨', name: '輕微凍毛毛雨', icon: 'fas fa-icicles text-cyan-200', desc: '微細的凍毛毛雨。' },

            { code: 71, category: '固態降水', name: '連續性小雪', icon: 'fas fa-snowflake text-sky-200', desc: '持續的小雪降水。' },
            { code: 72, category: '固態降水', name: '間歇性中雪', icon: 'fas fa-snowflake text-sky-300', desc: '中雪間歇出現。' },
            { code: 73, category: '固態降水', name: '連續性中雪', icon: 'fas fa-snowflake text-sky-400', desc: '持續的中雪降水。' },
            { code: 74, category: '固態降水', name: '間歇性大雪', icon: 'fas fa-snowflake text-blue-200', desc: '大雪間歇出現。' },
            { code: 75, category: '固態降水', name: '連續性大雪', icon: 'fas fa-snowflake text-blue-300', desc: '持續的大雪暴雪。' },
            { code: 76, category: '固態降水', name: '冰針/鑽石塵', icon: 'fas fa-snowflake text-cyan-100', desc: '冰針或鑽石塵現象。' },
            { code: 77, category: '固態降水', name: '米雪/雪粒', icon: 'fas fa-snowflake text-cyan-200', desc: '米雪或雪粒降水。' },
            { code: 78, category: '固態降水', name: '孤立星狀雪花', icon: 'fas fa-snowflake text-sky-100', desc: '孤立的星狀雪花。' },
            { code: 79, category: '固態降水', name: '冰粒', icon: 'fas fa-cloud-hail text-cyan-400', desc: '冰粒降水。' },

            // 80 - 89: 陣性降水（陣雨、陣雪、陣性冰雹）
            { code: 80, category: '陣性降水', name: '小陣雨', icon: 'fas fa-cloud-sun-rain text-blue-400', desc: '來得快去得快的小規模陣雨。' },
            { code: 81, category: '陣性降水', name: '中或強陣雨', icon: 'fas fa-cloud-showers-heavy text-blue-500', desc: '雨勢猛烈的中或強陣雨。' },
            { code: 82, category: '陣性降水', name: '極大陣雨（暴雨）', icon: 'fas fa-cloud-showers-water text-blue-600', desc: '極大雨量的陣雨或暴雨。' },
            { code: 83, category: '陣性降水', name: '輕陣雨夾雪', icon: 'fas fa-cloud-meatball text-blue-200', desc: '輕微的陣雨夾雪。' },
            { code: 84, category: '陣性降水', name: '中或強陣雨夾雪', icon: 'fas fa-cloud-meatball text-blue-400', desc: '中度或強烈的陣雨夾雪。' },
            { code: 85, category: '陣性降水', name: '小陣雪', icon: 'fas fa-snowflake text-sky-200', desc: '規模較小的陣雪。' },
            { code: 86, category: '陣性降水', name: '中或強陣雪', icon: 'fas fa-snowflake text-sky-400', desc: '中度或強烈的陣雪。' },
            { code: 87, category: '陣性降水', name: '輕微陣性霰/冰粒', icon: 'fas fa-cloud-hail text-cyan-200', desc: '輕微的陣性霰或冰粒。' },
            { code: 88, category: '陣性降水', name: '中或強陣性霰/冰粒', icon: 'fas fa-cloud-hail text-cyan-400', desc: '中度或強烈的陣性霰或冰粒。' },
            { code: 89, category: '陣性降水', name: '小陣性冰雹', icon: 'fas fa-cloud-hail text-amber-600', desc: '伴隨小冰雹的陣性降水。' },

            { code: 90, category: '雷暴與極端', name: '強陣性冰雹', icon: 'fas fa-cloud-hail text-amber-700', desc: '伴隨強烈冰雹的陣降水。' },

            { code: 93, category: '雷暴與極端', name: '雷暴過後的輕雪/冰雹', icon: 'fas fa-cloud-bolt text-sky-300', desc: '雷暴過後伴隨輕雪或冰雹。' },

            { code: 95, category: '雷暴與極端', name: '輕度或中度雷雨', icon: 'fas fa-cloud-bolt text-amber-400', desc: '伴隨雷電與降雨的對流天氣。' },
            { code: 96, category: '雷暴與極端', name: '雷雨伴隨小冰雹', icon: 'fas fa-cloud-bolt text-amber-500', desc: '雷雨交加並伴隨小冰雹。' },
            { code: 97, category: '雷暴與極端', name: '大雷雨（強烈雷暴）', icon: 'fas fa-cloud-bolt text-red-500 dark:text-amber-500', desc: '劇烈雷電、強風豪雨的強烈對流。' },
            { code: 98, category: '雷暴與極端', name: '雷暴伴隨沙塵暴', icon: 'fas fa-cloud-bolt text-amber-800', desc: '雷暴系統與沙塵暴同時發生。' },
            { code: 99, category: '雷暴與極端', name: '大雷雨伴隨強冰雹', icon: 'fas fa-cloud-bolt text-red-600 dark:text-orange-500', desc: '極端劇烈的大雷雨並伴隨強冰雹。' }
        ];

        let currentCategory = 'all';
        let searchQuery = '';

        function renderSymbols() {
            const grid = document.getElementById('symbols-grid');
            const noResult = document.getElementById('no-result');
            grid.innerHTML = '';

            const filtered = weatherSymbols.filter(item => {
                const matchCat = currentCategory === 'all' || item.category === currentCategory;
                const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || String(item.code).includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                noResult.classList.remove('hidden');
                return;
            } else {
                noResult.classList.add('hidden');
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800/80 p-4 rounded-xl flex flex-col justify-between hover:border-cyan-500/50 transition-all";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-cyan-100 text-cyan-800 dark:bg-cyan-950 dark:text-cyan-300 border border-cyan-200 dark:border-cyan-800">代碼: ${item.code}</span>
                            <span class="text-[11px] text-slate-400">${item.category}</span>
                        </div>
                        <div class="flex items-center gap-3 my-2">
                            <div class="text-3xl w-10 text-center"><i class="${item.icon}"></i></div>
                            <div>
                                <div class="font-bold text-sm text-slate-800 dark:text-white">${item.name}</div>
                            </div>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">${item.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-category') === cat) {
                    btn.className = "cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cyan-500 text-white shadow-sm transition-all";
                } else {
                    btn.className = "cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all";
                }
            });
            renderSymbols();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderSymbols();
        });

        // 初始化渲染
        renderSymbols();
    </script>
</body>
</html>
