<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天氣符號與定義指南 - 澳門天氣</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(100, 116, 139, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.4);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-sky-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center p-4 md:p-8 transition-colors duration-200">

    <!-- 容器 -->
    <div class="w-full max-w-7xl space-y-6">
        
        <!-- 標頭 -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-book-atlas text-cyan-500 dark:text-cyan-400"></i> 天氣符號與定義指南
                </h1>
                <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">本系統採用之所有 WMO 氣象代碼與圖示對照表</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                <!-- 返回主頁按鈕 -->
                <a href="index.html" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors text-sm font-medium flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-arrow-left"></i> 返回儀表板
                </a>
                <!-- 主題切換按鈕 -->
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors shadow-sm" title="切換主題">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
            </div>
        </header>

        <!-- 搜尋與篩選列 -->
        <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-4 md:p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="search-input" placeholder="搜尋天氣名稱或代碼..." class="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800/80 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 dark:focus:border-cyan-400 transition-colors">
            </div>
            <div id="category-filters" class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="filterCategory('all')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cyan-500 text-white shadow-sm transition-all" data-category="all">全部</button>
                <button onclick="filterCategory('晴朗與雲量')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="晴朗與雲量">晴朗與雲量</button>
                <button onclick="filterCategory('霧霾與能見度')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="霧霾與能見度">霧霾與能見度</button>
                <button onclick="filterCategory('特殊天象與前期')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="特殊天象與前期">特殊天象</button>
                <button onclick="filterCategory('毛毛雨與降雨')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="毛毛雨與降雨">降雨</button>
                <button onclick="filterCategory('陣雨與雷暴')" class="cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all" data-category="陣雨與雷暴">陣雨與雷暴</button>
            </div>
        </section>

        <!-- 符號卡片列表區塊 -->
        <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
            <div id="symbols-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- 動態載入 -->
            </div>
            <div id="no-result" class="hidden text-center py-16 text-slate-400">
                <i class="fa-solid fa-triangle-exclamation text-3xl mb-2 text-cyan-500"></i>
                <p>找不到符合條件的天氣符號</p>
            </div>
        </section>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 主題切換邏輯
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        // 天氣符號資料庫
        const weatherSymbols = [
            switch (code) {
                // ==========================================
                // 00 - 19: 無降水、無霧、無沙塵（特殊大氣現象）
                // ==========================================
                case 0: // 碧空無雲
                    return isNight 
                        ? { text: '晴朗無雲', icon: 'fas fa-moon text-indigo-400' } 
                        : { text: '晴朗無雲', icon: 'fas fa-sun text-yellow-500 dark:text-yellow-400' };
                case 1: // 雲層消散中
                    return isNight 
                        ? { text: '晴淡雲稀', icon: 'fas fa-cloud-moon text-indigo-300' } 
                        : { text: '晴空少雲', icon: 'fas fa-cloud-sun text-yellow-400' };
                case 2: // 天空狀況基本不變
                    return isNight 
                        ? { text: '多雲', icon: 'fas fa-cloud-moon text-indigo-200' } 
                        : { text: '局部多雲', icon: 'fas fa-cloud-sun text-yellow-300' };
                case 3: // 雲層正在形成
                    return { text: '陰天', icon: 'fas fa-cloud text-slate-400' };
                case 4: // 煙霧（能見度受阻）
                    return { text: '煙霾', icon: 'fas fa-smog text-neutral-400' };
                case 5: // 霾
                    return { text: '霾', icon: 'fas fa-wind text-stone-400' };
                case 6: // 浮塵
                    return { text: '浮塵', icon: 'fas fa-wind text-amber-600/70' };
                case 7: // 揚沙/吹沙
                    return { text: '揚沙', icon: 'fas fa-wind text-amber-700' };
                case 8: // 塵捲風
                    return { text: '塵捲風', icon: 'fas fa-tornado text-amber-800' };
                case 9: // 觀測時或過去一小時內有沙塵暴
                    return { text: '沙塵暴現象', icon: 'fas fa-wind text-amber-900' };
                case 10: // 輕霧
                    return { text: '輕霧', icon: 'fas fa-smog text-slate-300' };
                case 11: // 淺霧（片狀）
                    return { text: '薄霧', icon: 'fas fa-smog text-slate-350' };
                case 12: // 淺霧（連續）
                    return { text: '低霧', icon: 'fas fa-smog text-slate-400' };
                case 13: // 可見閃電，聽不到雷聲
                    return { text: '遠處閃電', icon: 'fas fa-bolt text-yellow-400' };
                case 14: // 降水未著地（雨幡）
                    return { text: '雨幡', icon: 'fas fa-cloud text-blue-300/60' };
                case 15: // 遠處有降水（>5公里）
                    return { text: '遠處降水', icon: 'fas fa-cloud-sun-rain text-blue-300' };
                case 16: // 近處有降水（<5公里，但未到測站）
                    return { text: '近處降水', icon: 'fas fa-cloud-rain text-blue-400' };
                case 17: // 雷暴，但無降水
                    return { text: '旱雷', icon: 'fas fa-cloud-bolt text-amber-400' };
                case 18: // 颮（強風）
                    return { text: '颮風', icon: 'fas fa-wind text-blue-600' };
                case 19: // 漏斗雲（龍捲風/水龍捲）
                    return { text: '龍捲風趨勢', icon: 'fas fa-tornado text-slate-700' };
            
                // ==========================================
                // 20 - 29: 過去一小時內有降水或霧，但觀測時已停
                // ==========================================
                case 20: return { text: '前一小時有毛毛雨', icon: 'fas fa-cloud text-blue-200' };
                case 21: return { text: '前一小時有雨', icon: 'fas fa-cloud-rain text-blue-300' };
                case 22: return { text: '前一小時有雪', icon: 'fas fa-snowflake text-sky-200' };
                case 23: return { text: '前一小時有雨夾雪', icon: 'fas fa-cloud-meatball text-sky-300' };
                case 24: return { text: '前一小時有凍雨', icon: 'fas fa-icicles text-blue-300' };
                case 25: return { text: '前一小時有陣雨', icon: 'fas fa-cloud-showers-heavy text-blue-400' };
                case 26: return { text: '前一小時有陣雪', icon: 'fas fa-snowflake text-blue-200' };
                case 27: return { text: '前一小時有冰雹', icon: 'fas fa-cloud-hail text-blue-300' };
                case 28: return { text: '前一小時有霧', icon: 'fas fa-smog text-slate-400' };
                case 29: return { text: '前一小時有雷暴', icon: 'fas fa-cloud-bolt text-amber-500' };
            
                // ==========================================
                // 30 - 39: 沙塵暴、吹雪或漂雪
                // ==========================================
                case 30: return { text: '減弱中沙塵暴', icon: 'fas fa-wind text-amber-700/80' };
                case 31: return { text: '無明顯變化沙塵暴', icon: 'fas fa-wind text-amber-700' };
                case 32: return { text: '增強中沙塵暴', icon: 'fas fa-wind text-amber-800' };
                case 33: return { text: '減弱中強沙塵暴', icon: 'fas fa-wind text-amber-850' };
                case 34: return { text: '無明顯變化強沙塵暴', icon: 'fas fa-wind text-amber-900' };
                case 35: return { text: '增強中強沙塵暴', icon: 'fas fa-wind text-amber-950' };
                case 36: return { text: '低吹雪（輕/中）', icon: 'fas fa-wind text-sky-100' };
                case 37: return { text: '低吹雪（重）', icon: 'fas fa-wind text-sky-200' };
                case 38: return { text: '高吹雪（輕/中）', icon: 'fas fa-snowflake text-sky-300' };
                case 39: return { text: '高吹雪（重）', icon: 'fas fa-snowflake text-sky-400' };
            
                // ==========================================
                // 40 - 49: 霧或結霜霧
                // ==========================================
                case 41: return { text: '分散薄霧', icon: 'fas fa-smog text-slate-300' };
                case 42: return { text: '天空可辨的減弱霧', icon: 'fas fa-smog text-slate-350' };
                case 43: return { text: '天空不明的減弱霧', icon: 'fas fa-smog text-slate-400' };
                case 44: return { text: '天空可辨的無變化霧', icon: 'fas fa-smog text-slate-400' };
                case 45: return { text: '大霧（天空不明且無變化）', icon: 'fas fa-smog text-slate-450' };
                case 46: return { text: '天空可辨的增強霧', icon: 'fas fa-smog text-slate-450' };
                case 47: return { text: '天空不明的增強霧', icon: 'fas fa-smog text-slate-550' };
                case 48: return { text: '結霜霧（天空可辨）', icon: 'fas fa-icicles text-slate-300' };
                case 49: return { text: '結霜霧（天空不明）', icon: 'fas fa-icicles text-slate-400' };
            
                // ==========================================
                // 50 - 59: 毛毛雨（液態及凍結性）
                // ==========================================
                case 50: return { text: '間歇性輕毛毛雨', icon: 'fas fa-cloud-rain text-blue-200' };
                case 51: return { text: '連續性輕毛毛雨', icon: 'fas fa-cloud-rain text-blue-300' };
                case 52: return { text: '間歇性中毛毛雨', icon: 'fas fa-cloud-rain text-blue-350' };
                case 53: return { text: '連續性中毛毛雨', icon: 'fas fa-cloud-rain text-blue-400' };
                case 54: return { text: '間歇性濃毛毛雨', icon: 'fas fa-cloud-showers-heavy text-blue-450' };
                case 55: return { text: '連續性濃毛毛雨', icon: 'fas fa-cloud-showers-heavy text-blue-500' };
                case 56: return { text: '輕微凍毛毛雨', icon: 'fas fa-icicles text-cyan-200' };
                case 57: return { text: '中或濃凍毛毛雨', icon: 'fas fa-icicles text-cyan-400' };
                case 58: return { text: '毛毛雨夾輕雨', icon: 'fas fa-cloud-rain text-blue-400' };
                case 59: return { text: '毛毛雨夾中大雨', icon: 'fas fa-cloud-showers-heavy text-blue-500' };
            
                // ==========================================
                // 60 - 69: 雨（液態及凍結性）
                // ==========================================
                case 60: return { text: '間歇性小雨', icon: 'fas fa-cloud-rain text-blue-300' };
                case 61: return { text: '連續性小雨', icon: 'fas fa-cloud-rain text-blue-400' };
                case 62: return { text: '間歇性中雨', icon: 'fas fa-cloud-showers-heavy text-blue-400' };
                case 63: return { text: '連續性中雨', icon: 'fas fa-cloud-showers-heavy text-blue-500' };
                case 64: return { text: '間歇性大雨', icon: 'fas fa-cloud-showers-heavy text-blue-600' };
                case 65: return { text: '連續性大雨', icon: 'fas fa-cloud-showers-heavy text-blue-700 dark:text-blue-500' };
                case 66: return { text: '輕微凍雨', icon: 'fas fa-snowflake text-cyan-300' };
                case 67: return { text: '中或大凍雨', icon: 'fas fa-icicles text-cyan-500' };
                case 68: return { text: '輕雨夾雪', icon: 'fas fa-cloud-meatball text-blue-200' };
                case 69: return { text: '中或大雨夾雪', icon: 'fas fa-cloud-meatball text-blue-400' };
            
                // ==========================================
                // 70 - 79: 固態降水（雪、雪粒、冰粒）
                // ==========================================
                case 70: return { text: '間歇性小雪', icon: 'fas fa-snowflake text-sky-100' };
                case 71: return { text: '連續性小雪', icon: 'fas fa-snowflake text-sky-200' };
                case 72: return { text: '間歇性中雪', icon: 'fas fa-snowflake text-sky-300' };
                case 73: return { text: '連續性中雪', icon: 'fas fa-snowflake text-sky-400' };
                case 74: return { text: '間歇性大雪', icon: 'fas fa-snowflake text-blue-200' };
                case 75: return { text: '連續性大雪', icon: 'fas fa-snowflake text-blue-300' };
                case 76: return { text: '冰針/鑽石塵', icon: 'fas fa-snowflake text-cyan-100' };
                case 77: return { text: '米雪/雪粒', icon: 'fas fa-snowflake text-cyan-200' };
                case 78: return { text: '孤立星狀雪花', icon: 'fas fa-snowflake text-sky-100' };
                case 79: return { text: '冰粒', icon: 'fas fa-cloud-hail text-cyan-400' };
            
                // ==========================================
                // 80 - 89: 陣性降水（陣雨、陣雪、陣性冰雹）
                // ==========================================
                case 80: return { text: '小陣雨', icon: 'fas fa-cloud-sun-rain text-blue-400' };
                case 81: return { text: '中或強陣雨', icon: 'fas fa-cloud-showers-heavy text-blue-500' };
                case 82: return { text: '極大陣雨（暴雨）', icon: 'fas fa-cloud-showers-water text-blue-600' };
                case 83: return { text: '輕陣雨夾雪', icon: 'fas fa-cloud-meatball text-blue-200' };
                case 84: return { text: '中或強陣雨夾雪', icon: 'fas fa-cloud-meatball text-blue-400' };
                case 85: return { text: '小陣雪', icon: 'fas fa-snowflake text-sky-200' };
                case 86: return { text: '中或強陣雪', icon: 'fas fa-snowflake text-sky-400' };
                case 87: return { text: '輕微陣性霰/冰粒', icon: 'fas fa-cloud-hail text-cyan-200' };
                case 88: return { text: '中或強陣性霰/冰粒', icon: 'fas fa-cloud-hail text-cyan-400' };
                case 89: return { text: '小陣性冰雹', icon: 'fas fa-cloud-hail text-amber-600' };
            
                // ==========================================
                // 90 - 99: 雷暴與伴隨現象
                // ==========================================
                case 90: return { text: '強陣性冰雹', icon: 'fas fa-cloud-hail text-amber-700' };
                case 91: return { text: '雷暴過後的小雨', icon: 'fas fa-cloud-bolt text-blue-400' };
                case 92: return { text: '雷暴過後的中大雨', icon: 'fas fa-cloud-bolt text-blue-500' };
                case 93: return { text: '雷暴過後的輕雪/冰雹', icon: 'fas fa-cloud-bolt text-sky-300' };
                case 94: return { text: '雷暴過後的大雪/冰雹', icon: 'fas fa-cloud-bolt text-sky-500' };
                case 95: return { text: '輕度或中度雷雨', icon: 'fas fa-cloud-bolt text-amber-400' };
                case 96: return { text: '雷雨伴隨小冰雹', icon: 'fas fa-cloud-bolt text-amber-500' };
                case 97: return { text: '大雷雨（強烈雷暴）', icon: 'fas fa-cloud-bolt text-red-500 dark:text-amber-500' };
                case 98: return { text: '雷暴伴隨沙塵暴', icon: 'fas fa-cloud-bolt text-amber-800' };
                case 99: return { text: '大雷雨伴隨強冰雹', icon: 'fas fa-cloud-bolt text-red-600 dark:text-orange-500' };
            
                default: 
                    return { text: '未知天氣', icon: 'fas fa-question-circle text-slate-400' };
            }

        ];

        let currentCategory = 'all';
        let searchQuery = '';

        function renderSymbols() {
            const grid = document.getElementById('symbols-grid');
            const noResult = document.getElementById('no-result');
            grid.innerHTML = '';

            const filtered = weatherSymbols.filter(item => {
                const matchCat = currentCategory === 'all' || item.category === currentCategory;
                const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || String(item.code).includes(searchQuery);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                noResult.classList.remove('hidden');
                return;
            } else {
                noResult.classList.add('hidden');
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800/80 p-4 rounded-xl flex flex-col justify-between hover:border-cyan-500/50 transition-all";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-cyan-100 text-cyan-800 dark:bg-cyan-950 dark:text-cyan-300 border border-cyan-200 dark:border-cyan-800">代碼: ${item.code}</span>
                            <span class="text-[11px] text-slate-400">${item.category}</span>
                        </div>
                        <div class="flex items-center gap-3 my-2">
                            <div class="text-3xl w-10 text-center"><i class="${item.icon}"></i></div>
                            <div>
                                <div class="font-bold text-sm text-slate-800 dark:text-white">${item.name}</div>
                            </div>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">${item.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-category') === cat) {
                    btn.className = "cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-cyan-500 text-white shadow-sm transition-all";
                } else {
                    btn.className = "cat-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all";
                }
            });
            renderSymbols();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderSymbols();
        });

        // 初始化渲染
        renderSymbols();
    </script>
</body>
</html>
