            for (let item of TC_INTENSITY_TABLE) {

        const MACAU_COORDS = [113.5685, 22.1595];

        function getDistanceAndDirectionToMacau(tLon, tLat) {
            const R = 6371;
            const dLat = (tLat - MACAU_COORDS[1]) * Math.PI / 180;
            const dLon = (tLon - MACAU_COORDS[0]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(MACAU_COORDS[1] * Math.PI / 180) * Math.cos(tLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            let dist = R * c;
            dist = Math.round(dist / 10) * 10;

            const lat1Rad = MACAU_COORDS[1] * Math.PI / 180;
            const lat2Rad = tLat * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;

            const directions = [
                "正北", "北北東", "東北", "東北偏東",
                "正東", "東南偏東", "東南", "南南東",
                "正南", "南南西", "西南", "西南偏西",
                "正西", "西北偏西", "西北", "北北西"
            ];
            const index = Math.round((brng % 360) / 22.5) % 16;
            return `${directions[index]} ${dist}公里`;
        }

        function generateCircleCoords(centerLon, centerLat, radiusKm, numPoints = 64) {
            const coords = [];
            const R = 6371;
            for (let i = 0; i <= numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                const dLat = (radiusKm / R) * (180 / Math.PI);
                const dLon = (radiusKm / R) * (180 / Math.PI) / Math.cos(centerLat * Math.PI / 180);
                const lon = centerLon + dLon * Math.cos(angle);
                const lat = centerLat + dLat * Math.sin(angle);
                coords.push([lon, lat]);
            }
            return coords;
        }

        // ================= 錐狀誤差圈邏輯 (Turf.js 整合) =================
        function generateConePoints(points, stepsPerSegment = 25) {
            const valid = points.filter(p => p.radius !== null && p.radius !== undefined && !isNaN(p.radius));
            if (valid.length < 2) return [];

            let result = [];
            for (let i = 0; i < valid.length - 1; i++) {
                const p1 = valid[i];
                const p2 = valid[i + 1];
                const maxJ = (i === valid.length - 2) ? stepsPerSegment : stepsPerSegment - 1;

                for (let j = 0; j <= maxJ; j++) {
                    const t = j / stepsPerSegment;
                    const lat = p1.lat + t * (p2.lat - p1.lat);
                    const lon = p1.lon + t * (p2.lon - p1.lon);
                    const hour = p1.hour + t * (p2.hour - p1.hour);
                    const radius = p1.radius + t * (p2.radius - p1.radius);

                    result.push({ lat, lon, hour, radius });
                }
            }
            return result;
        }

        function safeUnion(p1, p2) {
            if (!p1) return p2;
            if (!p2) return p1;
            try {
                return turf.union(turf.featureCollection([p1, p2]));
            } catch (e) {
                try { return turf.union(p1, p2); } catch (err) { return p1; }
            }
        }

        function makeSplitCone(points) {
            const interpolated = generateConePoints(points, 25);
            if (interpolated.length < 2) return { fullCone: null, cone72: null };

            let circlesFull = [];
            let circles72 = [];

            for (let p of interpolated) {
                if (p.radius > 0) {
                    const circle = turf.buffer(turf.point([p.lon, p.lat]), p.radius, { units: "kilometers", steps: 32 });
                    circlesFull.push(circle);
                    if (p.hour <= 72) {
                        circles72.push(circle);
                    }
                }
            }

            if (circlesFull.length === 0) return { fullCone: null, cone72: null };

            let fullCone = circlesFull[0];
            for (let i = 1; i < circlesFull.length; i++) {
                fullCone = safeUnion(fullCone, circlesFull[i]);
            }

            let cone72 = null;
            if (circles72.length > 0) {
                cone72 = circles72[0];
                for (let i = 1; i < circles72.length; i++) {
                    cone72 = safeUnion(cone72, circles72[i]);
                }
            }

            return { fullCone, cone72 };
        }

                    { coord: [142.0, 8.0], wind: 35 },
                    { coord: [140.2, 9.1], wind: 55 },
                    { coord: [138.5, 10.2], wind: 75 }
                ],
                pastCoordsOnly: [
                    [142.0, 8.0], [140.2, 9.1], [138.5, 10.2]
                ],
                forecast: [
                    [138.5, 10.2], [136.0, 11.8], [133.5, 13.5]
                ],
                forecastPoints: [
                    { lon: 138.5, lat: 10.2, hour: 0, radius: 15 },
                    { lon: 136.0, lat: 11.8, hour: 24, radius: 90 },
                    { lon: 133.5, lat: 13.5, hour: 48, radius: 150 }
                ],
                nodes: [
                    { coord: [142.0, 8.0], time: "5月26日 00:00", wind: "35 km/h", type: "LPA" },
                    { coord: [140.2, 9.1], time: "5月26日 06:00", wind: "55 km/h", type: "TD" },
                    { coord: [138.5, 10.2], time: "5月26日 12:00", wind: "75 km/h (中心)", type: "TS" },
                    { coord: [136.0, 11.8], time: "5月27日 00:00 (預報)", wind: "90 km/h", type: "STS" },
                    { coord: [133.5, 13.5], time: "5月27日 12:00 (預報)", wind: "105 km/h", type: "STS" }
                ]
            }
        };

        let currentStormKey = 'all';
        let myChart = null;
        let mapLoaded = false;

        function getStormBounds(stKey) {
            if (stKey === 'all') {
                return { center: [122, 20], zoom: 4.2 };
            }
            const st = typhoons[stKey];
            let allCoords = [];
            if (st.pastCoordsOnly) allCoords = allCoords.concat(st.pastCoordsOnly);
            if (st.forecast) allCoords = allCoords.concat(st.forecast);
            if (allCoords.length === 0) return { center: [122, 20], zoom: 5.5 };

            let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
            allCoords.forEach(c => {
                if (c[0] < minLon) minLon = c[0];
                if (c[0] > maxLon) maxLon = c[0];
                if (c[1] < minLat) minLat = c[1];
                if (c[1] > maxLat) maxLat = c[1];
            });
            const center = [(minLon + maxLon) / 2, (minLat + maxLat) / 2];
            const lonSpan = maxLon - minLon;
            const latSpan = maxLat - minLat;
            const maxSpan = Math.max(lonSpan, latSpan, 1.0);
            
            let zoom = Math.min(10.0, Math.max(6.0, 360 / (maxSpan * 3.8)));
            return { center, zoom };
        }

        const tcCountryMap = {
            "China": "中國", "Taiwan": "台灣", "Japan": "日本", "Philippines": "菲律賓",
            "Vietnam": "越南", "South Korea": "韓國", "North Korea": "朝鮮", "Russia": "俄羅斯",
            "India": "印度", "Thailand": "泰國", "Malaysia": "馬來西亞", "Indonesia": "印尼",
            "Cambodia": "柬埔寨", "Laos": "寮國", "Myanmar": "緬甸", "Singapore": "新加坡",
            "Brunei": "汶萊", "Australia": "澳洲", "New Zealand": "紐西蘭"
        };

        async function initVectorMap() {
            const chartDom = document.getElementById('echarts-map');
            myChart = echarts.init(chartDom);

            myChart.showLoading({
                text: '載入 GIS 向量圖資與 Turf.js 拓樸...',
                color: '#3b82f6',
                textColor: '#cbd5e1',
                maskColor: 'rgba(8, 16, 26, 0.9)',
                zlevel: 0
            });

            try {
                const response = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson');
                const worldJson = await response.json();
                
                if (worldJson && worldJson.features) {
                    worldJson.features.forEach(feat => {
                        if (feat.properties) {
                            const engName = feat.properties.ADMIN || feat.properties.name || feat.properties.NAME || '';
                            feat.properties.name = tcCountryMap[engName] || engName;
                        }
                    });
                }

                echarts.registerMap('world50m', worldJson);
                mapLoaded = true;
                myChart.hideLoading();
                renderChart(true);
            } catch (e) {
                console.error('Failed to load Natural Earth GeoJSON, attempting fallback...', e);
                try {
                    const fallbackResp = await fetch('https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/world.json');
                    const fallbackJson = await fallbackResp.json();
                    echarts.registerMap('world50m', fallbackJson);
                    mapLoaded = true;
                    myChart.hideLoading();
                    renderChart(true);
                } catch (err2) {
                    console.error('All map sources failed', err2);
                    echarts.registerMap('world50m', { type: 'FeatureCollection', features: [] });
                    mapLoaded = true;
                    myChart.hideLoading();
                    renderChart(true);
                }
            }

            window.addEventListener('resize', () => {
                myChart.resize();
            });
        }

        function addTurfPolygonSeries(turfPoly, seriesList, styleOpts) {
            if (!turfPoly || !turfPoly.geometry) return;
            const geom = turfPoly.geometry;
            const coordsList = geom.type === 'Polygon' ? [geom.coordinates[0]] : 
                               geom.type === 'MultiPolygon' ? geom.coordinates.map(poly => poly[0]) : [];
            
            coordsList.forEach(ring => {
                seriesList.push({
                    type: 'custom',
                    coordinateSystem: 'geo',
                    z: 2.5,
                    data: [[0]],
                    renderItem: function(params, api) {
                        const points = ring.map(coord => api.coord(coord));
                        if (!points || points.some(p => !p || isNaN(p[0]) || isNaN(p[1]))) return;
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: styleOpts
                        };
                    },
                    silent: true
                });
            });
        }

        function renderChart(isStormSwitch = false) {
            if (!myChart) return;
            
            const showPast = document.getElementById('layer-past').checked;
            const showForecast = document.getElementById('layer-forecast').checked;
            const showEnvelope = document.getElementById('layer-envelope').checked;
            const showNodes = document.getElementById('layer-nodes').checked;
            const showRings = document.getElementById('layer-rings').checked;
            const showMacau = document.getElementById('layer-macau').checked;
            const showGrid = document.getElementById('layer-grid').checked;

            const seriesList = [];

            // 1. 全球經緯網格
            if (showGrid) {
                const minorLines = [];
                for (let lon = -180; lon <= 180; lon += 5) {
                    minorLines.push({ coords: [[lon, -90], [lon, 90]] });
                }
                for (let lat = -90; lat <= 90; lat += 5) {
                    minorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 1,
                    polyline: true,
                    lineStyle: { color: 'rgba(255, 255, 255, 0.05)', width: 0.15, type: 'dashed' },
                    data: minorLines,
                    silent: true
                });

                const majorLines = [];
                for (let lon = -180; lon <= 180; lon += 30) {
                    majorLines.push({ coords: [[lon, -90], [lon, 90]] });
                }
                for (let lat = -90; lat <= 90; lat += 15) {
                    majorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    lineStyle: { color: 'rgba(255, 255, 255, 0.18)', width: 0.6, type: 'dashed' },
                    data: majorLines,
                    silent: true
                });

                const gridLabels = [];
                for (let lon = -180; lon <= 180; lon += 30) {
                    if (lon === 180 || lon === -180) continue;
                    gridLabels.push({ name: `${Math.abs(lon)}°${lon < 0 ? 'W' : 'E'}`, value: [lon, 0, 1], itemStyle: { opacity: 0 } });
                }
                for (let lat = -90; lat <= 90; lat += 15) {
                    if (lat === 0 || lat === 90 || lat === -90) continue;
                    gridLabels.push({ name: `${Math.abs(lat)}°${lat < 0 ? 'S' : 'N'}`, value: [0, lat, 1], itemStyle: { opacity: 0 } });
                }
                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 3,
                    data: gridLabels,
                    label: { show: true, formatter: '{b}', color: 'rgba(255, 255, 255, 0.4)', fontSize: 9, fontFamily: 'monospace' },
                    silent: true
                });
            }

            // 2. Macau Distance Rings
            if (showRings) {
                const ringDistances = [100, 200, 400, 800];
                const ringLines = [];
                const ringLabels = [];

                ringDistances.forEach(dist => {
                    const coords = generateCircleCoords(MACAU_COORDS[0], MACAU_COORDS[1], dist, 64);
                    ringLines.push({
                        coords: coords,
                        lineStyle: { color: '#949494', width: 0.8, type: 'dashed', opacity: 0.7 }
                    });

                    const latOffset = (dist / 6371) * (180 / Math.PI);
                    ringLabels.push({
                        name: `${dist}公里`,
                        value: [MACAU_COORDS[0], MACAU_COORDS[1] - latOffset, 1],
                        itemStyle: { opacity: 0 }
                    });
                });

                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    data: ringLines,
                    silent: true
                });

                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 3,
                    data: ringLabels,
                    label: { show: true, formatter: '{b}', color: '#cbd5e1', opacity: 0.8, fontSize: 9, fontFamily: 'sans-serif', position: 'bottom' },
                    silent: true
                });
            }

            const renderTyphoonTracks = (st) => {
                if (!st.pastCoordsOnly) return;

                if (showEnvelope && st.forecastPoints) {
                    const cones = makeSplitCone(st.forecastPoints);
                    if (cones.fullCone) {
                        addTurfPolygonSeries(cones.fullCone, seriesList, {
                            fill: 'rgba(56, 189, 248, 0.12)',
                            stroke: 'rgba(56, 189, 248, 0.45)',
                            lineWidth: 1.2,
                            lineDash: [3, 3]
                        });
                    }
                }

                if (showPast) {
                    seriesList.push({
                        type: 'lines',
                        coordinateSystem: 'geo',
                        z: 3,
                        polyline: true,
                        lineStyle: { color: '#ffffff', width: 1.8, opacity: 0.95 },
                        data: [{ coords: st.pastCoordsOnly }],
                        silent: true
                    });

                    const pastScatterData = st.past.map(pt => {
                        const intensity = getIntensity(pt.wind);
                        return {
                            name: `${st.name} 過往位置 - ${pt.wind} km/h`,
                            value: [...pt.coord, 1],
                            itemStyle: { color: intensity.color },
                            symbolSize: 7,
                            windVal: pt.wind,
                            intensityObj: intensity
                        };
                    });

                    // 移除過往點的 tooltip 互動
                    seriesList.push({
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        z: 4,
                        data: pastScatterData,
                        symbol: 'circle',
                        silent: true
                    });
                }

                if (showForecast && st.forecast) {
                    seriesList.push({
                        type: 'lines',
                        coordinateSystem: 'geo',
                        z: 3,
                        polyline: true,
                        effect: {
                            show: true,
                            period: 4,
                            trailLength: 0.2,
                            color: '#ffffff',
                            symbol: 'circle',
                            symbolSize: 4
                        },
                        lineStyle: { color: '#ffffff', width: 2.2, type: 'dashed', opacity: 0.9 },
                        data: [{ coords: st.forecast }],
                        silent: true
                    });
                }

                if (showNodes && st.nodes) {
                    const scatterData = st.nodes.map((node, idx) => {
                        const intensity = getIntensity(parseInt(node.wind));
                        const isEye = (idx === st.past.length - 1);

                        return {
                            name: `${st.name} - ${node.time}`,
                            value: [...node.coord, 1],
                            itemStyle: { color: intensity.color },
                            symbolSize: isEye ? 16 : 9,
                            isEye: isEye,
                            nodeInfo: node,
                            intensityObj: intensity
                        };
                    });

                    // 移除一般預報節點的 tooltip 互動
                    seriesList.push({
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        z: 5,
                        data: scatterData.filter(d => !d.isEye),
                        symbol: 'circle',
                        silent: true
                    });

                    const eyeData = scatterData.filter(d => d.isEye);
                    // 移除颱風眼脈衝點的 tooltip 互動
                    seriesList.push({
                        type: 'effectScatter',
                        coordinateSystem: 'geo',
                        z: 6,
                        data: eyeData,
                        symbolSize: 20,
                        rippleEffect: { brushType: 'stroke', scale: 4, period: 2 },
                        itemStyle: { color: '#ef4444', shadowBlur: 12, shadowColor: '#ef4444' },
                        silent: true
                    });
                }
            };

            if (currentStormKey === 'all') {
                renderTyphoonTracks(typhoons.maliksi);
                renderTyphoonTracks(typhoons.gaemi);
                renderTyphoonTracks(typhoons.prapiroon);
            } else if (typhoons[currentStormKey]) {
                renderTyphoonTracks(typhoons[currentStormKey]);
            }

            if (showMacau) {
                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 7,
                    data: [{
                        name: '澳門',
                        value: [113.5685, 22.1595, 1],
                        itemStyle: { color: '#ffffff' },
                        symbolSize: 7
                    }],
                    label: {
                        show: true,
                        formatter: '{b}',
                        position: 'right',
                        color: '#ffffff',
                        fontSize: 11,
                        fontWeight: 'bold',
                        backgroundColor: 'rgba(11, 19, 34, 0.85)',
                        padding: [3, 6],
                        borderRadius: 4
                    },
                    tooltip: {
                        formatter: function(params) {
                            return `<div style="font-weight:bold; color:#ffffff;"><i class="fa-solid fa-location-dot text-cyan-400"></i> 澳門</div>
                                    <div style="font-size:11px; color:#cbd5e1; font-family:monospace;">經緯度: 22.1595°N, 113.5685°E</div>`;
                        }
                    }
                });
            }

            const bounds = getStormBounds(currentStormKey);

            const option = {
                backgroundColor: '#08101a',
                geo: {
                    map: 'world50m',
                    roam: true,
                    ...(isStormSwitch ? { center: bounds.center, zoom: bounds.zoom } : {}),
                    aspectScale: 1.0,
                    label: { show: false },
                    itemStyle: { areaColor: '#132238', borderColor: '#4d729d', borderWidth: 0.8 },
                    emphasis: {
                        focus: 'self',
                        itemStyle: { areaColor: '#1c3354', borderColor: '#7ea9db', borderWidth: 1.2 },
                        label: { show: false }
                    },
                    select: { disabled: true }
                },
                tooltip: {
                    trigger: 'item',
                    backgroundColor: '#0b1322',
                    borderColor: '#334155',
                    textStyle: { color: '#f8fafc', fontSize: 12 },
                    formatter: function(params) {
                        if (params.componentType === 'geo') {
                            const countryName = params.name || '';
                            if (!countryName) return '';
                            return `<div style="font-weight:bold; color:#38bdf8; font-size:13px;"><i class="fa-solid fa-earth-asia"></i> ${countryName}</div>`;
                        }
                        return params.name || '';
                    }
                },
                series: seriesList
            };

            try {
                myChart.setOption(option, true);
            } catch (err) {
                console.error("ECharts setOption error:", err);
            }

            const stormStatsContent = document.getElementById('storm-stats-content');
            
            if (currentStormKey === 'all') {
                document.getElementById('storm-name').innerText = "活動颱風系統 (全部)";
                document.getElementById('storm-category').innerText = "共 3 個系統監控中";
                
                let listHtml = '<div class="space-y-2 max-h-56 overflow-y-auto pr-1">';
                ['maliksi', 'gaemi', 'prapiroon'].forEach(key => {
                    const st = typhoons[key];
                    const tLon = st.pastCoordsOnly[st.pastCoordsOnly.length - 1][0];
                    const tLat = st.pastCoordsOnly[st.pastCoordsOnly.length - 1][1];
                    const dist = getDistanceAndDirectionToMacau(tLon, tLat);
                    listHtml += `
                        <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-2.5 text-xs space-y-1">
                            <div class="flex justify-between items-center font-bold text-white">
                                <span>${st.name}</span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30">${st.category}</span>
                            </div>
                            <div class="grid grid-cols-3 gap-1 text-[10px] text-slate-300 font-mono">
                                <div>風速: <span class="text-amber-400 font-bold">${st.wind}</span></div>
                                <div>座標: <span class="text-slate-200">${st.coords}</span></div>
                                <div>距澳: <span class="text-cyan-400 font-bold">${dist}</span></div>
                            </div>
                        </div>
                    `;
                });
                listHtml += '</div>';
                stormStatsContent.innerHTML = listHtml;
            } else {
                const storm = typhoons[currentStormKey];
                document.getElementById('storm-name').innerText = storm.name;
                document.getElementById('storm-category').innerText = storm.category;
                
                const tLon = storm.pastCoordsOnly[storm.pastCoordsOnly.length - 1][0];
                const tLat = storm.pastCoordsOnly[storm.pastCoordsOnly.length - 1][1];
                const dist = getDistanceAndDirectionToMacau(tLon, tLat);

                stormStatsContent.innerHTML = `
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                            <span class="text-slate-400 block text-[10px]">最大風速</span>
                            <span class="font-mono text-amber-400 font-bold text-sm">${storm.wind}</span>
                        </div>
                        <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                            <span class="text-slate-400 block text-[10px]">當前座標</span>
                            <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.coords}</span>
                        </div>
                        <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                            <span class="text-slate-400 block text-[10px]">移動路徑</span>
                            <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.movement}</span>
                        </div>
                        <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                            <span class="text-slate-400 block text-[10px]">距離澳門</span>
                            <span class="font-mono text-cyan-400 font-bold text-[11px]">${dist}</span>
                        </div>
                    </div>
                `;
            }
        }

        function switchStorm(key) {
            currentStormKey = key;
            renderChart(true);
        }

        function updateChartLayers() {
            renderChart(false);
        }

        function resetMapView() {
            const bounds = getStormBounds(currentStormKey);
            if (myChart) {
                myChart.setOption({
                    geo: {
                        center: bounds.center,
                        zoom: bounds.zoom
                    }
                }, false);
            }
        }

        window.onload = function() {
            initVectorMap();
        };
    </script>
</body>
</html>
