<!DOCTYPE html>
<html lang="zh-TW" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSSO GIS 颱風監控與氣旋檔案系統 - v4.1.3</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- Turf.js Spatial Analysis Library for Cone Envelopes -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        #echarts-map {
            width: 100%;
            height: 100%;
            min-height: 450px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.25);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.45);
        }

        /* Animations */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.5); opacity: 0.15; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }
        .pulse-beacon {
            animation: pulse-ring 2s infinite ease-in-out;
        }

        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(6px) scale(0.995); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .animate-view-fade {
            animation: viewFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .dark .glass-panel {
            background: rgba(10, 18, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(30, 41, 59, 0.7);
        }

        .glass-card {
            background: rgba(248, 250, 252, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.9);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(30, 41, 59, 0.8);
        }

        /* Active Nav Tab Indicator */
        .nav-tab {
            position: relative;
            transition: all 0.2s ease;
        }
        .nav-tab.active {
            color: #0284c7;
            font-weight: 700;
        }
        .dark .nav-tab.active {
            color: #38bdf8;
        }
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: #0284c7;
            border-radius: 2px;
            box-shadow: 0 0 8px #0284c7;
        }
        .dark .nav-tab.active::after {
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-100 dark:bg-[#070f1a] text-slate-800 dark:text-slate-200 transition-colors duration-300">

    <!-- 頂部導航欄 (v4.1.3 升級版) -->
    <header class="glass-panel h-16 flex items-center justify-between px-4 sm:px-6 z-35 shrink-0 transition-all duration-300 shadow-sm border-b">
        <div class="flex items-center space-x-4 sm:space-x-6">
            <div class="flex items-center space-x-3">
                <div class="relative flex items-center justify-center bg-gradient-to-br from-blue-500/20 to-cyan-500/20 dark:from-blue-600/30 dark:to-cyan-600/30 border border-blue-500/30 p-2 rounded-xl text-blue-600 dark:text-blue-400 shadow-sm">
                    <i class="fa-solid fa-hurricane text-xl animate-spin" style="animation-duration: 9s; animation-direction: reverse;"></i>
                    <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-blue-500 animate-ping opacity-75"></span>
                </div>
                <div>
                    <h1 class="text-sm sm:text-base font-extrabold tracking-wide text-slate-900 dark:text-white flex items-center gap-2">
                        MSSO 熱帶氣旋 GIS 
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-500/10 dark:bg-blue-400/15 text-blue-600 dark:text-blue-400 border border-blue-500/20 dark:border-blue-400/30 font-mono">v4.1.3</span>
                    </h1>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 hidden lg:block font-mono tracking-tight">實時及歷史熱帶氣旋 GIS 監控系統</p>
                </div>
            </div>
            
            <!-- 導航分頁選項 -->
            <div class="hidden xl:flex items-center space-x-1 pl-4 border-l border-slate-200 dark:border-slate-800 text-xs font-semibold">
                <button id="nav-btn-map" onclick="switchView('map')" class="nav-tab active px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition">
                    <i class="fa-solid fa-map-location-dot mr-1.5 opacity-80"></i>地圖
                </button>
                <button id="nav-btn-stats" onclick="switchView('stats')" class="nav-tab px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition">

                <button id="nav-btn-tables" onclick="switchView('tables')" class="nav-tab px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition">

        </div>

        <div class="flex items-center space-x-2.5 sm:space-x-3">
            <!-- 年份與洋區選擇快捷標籤 -->
            <div class="hidden sm:flex items-center space-x-2 bg-slate-200/60 dark:bg-slate-900/80 border border-slate-300/60 dark:border-slate-800/80 px-3 py-1.5 rounded-xl text-xs font-medium">
                <span class="text-slate-500 dark:text-slate-400 text-[11px]">年份</span>

            <!-- 系統時間 -->

    <!-- 主內容區塊 -->
    <div class="flex-1 flex relative overflow-hidden">

        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 z-30 w-80 sm:w-88 glass-panel md:bg-white md:dark:bg-[#0a1220] flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0 shadow-2xl shrink-0 border-r border-slate-200 dark:border-slate-800/80">
            
            <!-- 搜尋與控制表單區 -->
            <div class="p-4 border-b border-slate-200 dark:border-slate-800/80 space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-700 dark:text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-folder-open text-blue-500 dark:text-blue-400"></i> 熱帶氣旋檔案庫
                    </h2>
                    <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">

                        <label class="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400 tracking-wider">活動颱風系統</label>
                        <select id="storm-select" onchange="switchStorm(this.value)" class="w-full bg-slate-100 dark:bg-slate-900/90 border border-slate-300/80 dark:border-slate-700 rounded-xl px-2.5 py-1.5 text-xs font-semibold text-slate-800 dark:text-slate-100 focus:outline-none focus:border-blue-500 transition cursor-pointer">

                    <button onclick="filterByIntensity('SuTY')" class="px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 font-semibold shrink-0 hover:bg-slate-300 dark:hover:bg-slate-700 transition">SuTY</button>
                    <button onclick="filterByIntensity('STY')" class="px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 font-semibold shrink-0 hover:bg-slate-300 dark:hover:bg-slate-700 transition">STY</button>
                    <button onclick="filterByIntensity('TY')" class="px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 font-semibold shrink-0 hover:bg-slate-300 dark:hover:bg-slate-700 transition">TY</button>
                    <button onclick="filterByIntensity('STS')" class="px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 font-semibold shrink-0 hover:bg-slate-300 dark:hover:bg-slate-700 transition">STS</button>

                    <button onclick="filterByIntensity('TD')" class="px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 font-semibold shrink-0 hover:bg-slate-300 dark:hover:bg-slate-700 transition">TD</button>

            <!-- 颱風詳情統計與動態清單卡片區 -->

            </div>

            <div class="p-3 border-t border-slate-200 dark:border-slate-800/80 text-center text-[11px] text-slate-400 dark:text-slate-500 font-mono flex items-center justify-between px-4">
                <span>MSSO GIS 向量引擎</span>
                <span class="px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-500 font-bold">v4.1.3</span>
            </div>
        </aside>

        <!-- 主內容畫布區 (包含 地圖、統計圖表、數據列表 檢視切換) -->

                <!-- 強度分級圖例 (右下角升級版) -->

                    <div class="font-extrabold text-slate-800 dark:text-slate-100 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-palette text-blue-500 dark:text-blue-400"></i> 強度分級</span>

            <!-- 2. 統計圖表放大檢視 -->
            <div id="stats-view-container" class="w-full h-full flex-1 p-4 sm:p-6 overflow-y-auto hidden flex-col space-y-4 animate-view-fade">

                    <h2 class="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-emerald-500"></i> 風速變化歷史圖表
                    </h2>
                    <button onclick="switchView('map')" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-xs px-3.5 py-1.5 rounded-xl transition font-bold active:scale-95 flex items-center gap-1.5">

                </div>
            </div>

            <!-- 3. 數據列表檢視 -->
            <div id="tables-view-container" class="w-full h-full flex-1 p-4 sm:p-6 overflow-y-auto hidden flex-col space-y-6 animate-view-fade">
                <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                    <h2 class="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-table text-blue-500"></i> 氣旋詳細數據列表
                    </h2>
                    <button onclick="switchView('map')" class="bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-xs px-3.5 py-1.5 rounded-xl transition font-bold active:scale-95 flex items-center gap-1.5">

                    </button>

                    <!-- 動態填入表格 -->
                </div>

    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const gmt8 = new Date(utc + (3600000 * 8));
            const hours = String(gmt8.getHours()).padStart(2, '0');
            const minutes = String(gmt8.getMinutes()).padStart(2, '0');
            const seconds = String(gmt8.getSeconds()).padStart(2, '0');
            const clockEl = document.getElementById('utc-clock');
            if (clockEl) {
                clockEl.innerText = `${hours}:${minutes}:${seconds}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('-translate-x-full');
        }

        // 初始化主題（預設 dark）
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        // 主題切換邏輯
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                renderChart(false);
                if (currentView === 'stats') renderLargeIntensityGraph();
            });
        }

        const TC_INTENSITY_TABLE = [
            {"code": "Ex",   "name": "溫帶氣旋",         "engName": "Extra-tropical Cyclone", "max_wind": -1,   "rangeText": "-",            "color": "#64748b"},
            {"code": "LPA",  "name": "低壓區",           "engName": "Low Pressure Area",      "max_wind": 40,   "rangeText": "≤ 40 km/h",    "color": "#64748b"},
            {"code": "TD",   "name": "熱帶低氣壓",       "engName": "Tropical Depression",    "max_wind": 62,   "rangeText": "41 - 62 km/h", "color": "#0284c7"},
            {"code": "TS",   "name": "熱帶風暴",         "engName": "Tropical Storm",         "max_wind": 87,   "rangeText": "63 - 87 km/h", "color": "#16a34a"},
            {"code": "STS",  "name": "強烈熱帶風暴",     "engName": "Severe Tropical Storm",  "max_wind": 117,  "rangeText": "88 - 117 km/h","color": "#ca8a04"},
            {"code": "TY",   "name": "颱風",             "engName": "Typhoon",                "max_wind": 149,  "rangeText": "118 - 149 km/h","color": "#ea580c"},
            {"code": "STY",  "name": "強颱風",           "engName": "Severe Typhoon",         "max_wind": 184,  "rangeText": "150 - 184 km/h","color": "#dc2626"},
            {"code": "SuTY", "name": "超強颱風",         "engName": "Super Typhoon",          "max_wind": 9999, "rangeText": "≥ 185 km/h",   "color": "#9333ea"},
        ];

        function getIntensity(windInput, isEx) {
            if (isEx || (typeof windInput === 'string' && windInput.toUpperCase() === 'EX')) {
                return TC_INTENSITY_TABLE[0];
            }
            const windKmh = parseFloat(windInput) || 0;
            for (let i = 1; i < TC_INTENSITY_TABLE.length; i++) {
                let item = TC_INTENSITY_TABLE[i];
                if (windKmh <= item.max_wind) return item;
            }
            return TC_INTENSITY_TABLE[TC_INTENSITY_TABLE.length - 1];
        }

        const legendContainer = document.getElementById('intensity-legend');
        if (legendContainer) {
            legendContainer.innerHTML = '';
            TC_INTENSITY_TABLE.forEach(item => {
                const div = document.createElement('div');

                `;
                legendContainer.appendChild(div);

        const MACAU_COORDS = [113.5685, 22.1595];

        function getDistanceAndDirectionToMacau(tLon, tLat) {
            if (tLon === undefined || tLat === undefined || isNaN(tLon) || isNaN(tLat)) {
                return "未知距離";
            }
            const R = 6371;
            const dLat = (tLat - MACAU_COORDS[1]) * Math.PI / 180;
            const dLon = (tLon - MACAU_COORDS[0]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(MACAU_COORDS[1] * Math.PI / 180) * Math.cos(tLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            let dist = R * c;
            dist = Math.round(dist / 10) * 10;

            const lat1Rad = MACAU_COORDS[1] * Math.PI / 180;
            const lat2Rad = tLat * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;

            const directions = [
                "N", "NNE", "NE", "ENE",
                "E", "ESE", "SE", "SSE",
                "S", "SSW", "SW", "WSW",
                "W", "WNW", "NW", "NNW"
            ];
            const index = Math.round((brng % 360) / 22.5) % 16;
            return `${directions[index]} ${dist} km`;
        }

        function getDirection(lon1, lat1, lon2, lat2) {
            if (lon1 === undefined || lat1 === undefined || lon2 === undefined || lat2 === undefined) {
                return "靜止";
            }
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const lat2Rad = lat2 * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;
            const directions = [
                "N", "NNE", "NE", "ENE",
                "E", "ESE", "SE", "SSE",
                "S", "SSW", "SW", "WSW",
                "W", "WNW", "NW", "NNW"
            ];
            return directions[Math.round((brng % 360) / 22.5) % 16];
        }

        function calculatePastMovement(pastNodes, currentIndex) {
            const curr = pastNodes[currentIndex];
            if (!curr || !curr.time) return "-";
            const currTime = new Date(curr.time).getTime();
            if (isNaN(currTime)) return "-";

            let targetNode = null;
            for (let j = currentIndex + 1; j < pastNodes.length; j++) {
                const nextTime = new Date(pastNodes[j].time).getTime();
                if (!isNaN(nextTime)) {
                    const diffHours = (nextTime - currTime) / (3600 * 1000);
                    if (Math.abs(diffHours - 6) < 0.5) {
                        targetNode = pastNodes[j];
                        break;
                    }
                }
            }

            if (!targetNode) {
                for (let j = currentIndex + 1; j < pastNodes.length; j++) {
                    const nextTime = new Date(pastNodes[j].time).getTime();
                    if (!isNaN(nextTime)) {
                        const diffHours = (nextTime - currTime) / (3600 * 1000);
                        if (diffHours > 0 && diffHours <= 9) {
                            targetNode = pastNodes[j];
                            break;
                        }
                    }
                }
            }

            if (!targetNode && currentIndex >= 2) {
                for (let j = currentIndex - 1; j >= 0; j--) {
                    const prevTime = new Date(pastNodes[j].time).getTime();
                    if (!isNaN(prevTime)) {
                        const diffHours = (currTime - prevTime) / (3600 * 1000);
                        if (Math.abs(diffHours - 6) < 0.5) {
                            const dist = turf.distance(turf.point([pastNodes[j].lon, pastNodes[j].lat]), turf.point([curr.lon, curr.lat]), { units: 'kilometers' });
                            const direction = getDirection(pastNodes[j].lon, pastNodes[j].lat, curr.lon, curr.lat);
                            const speed = Math.round(dist / 6);
                            return `${direction} ${speed} km/h`;
                        }
                    }
                }
            }

            if (targetNode) {
                const dist = turf.distance(turf.point([curr.lon, curr.lat]), turf.point([targetNode.lon, targetNode.lat]), { units: 'kilometers' });
                const currTimeNum = new Date(curr.time).getTime();
                const targetTimeNum = new Date(targetNode.time).getTime();
                const hoursDiff = (targetTimeNum - currTimeNum) / (3600 * 1000);
                const actualHours = hoursDiff > 0 ? hoursDiff : 6;
                const direction = getDirection(curr.lon, curr.lat, targetNode.lon, targetNode.lat);
                const speed = Math.round(dist / actualHours);
                return `${direction} ${speed} km/h`;
            }

            return "-";
        }

        function generateCircleCoords(centerLon, centerLat, radiusKm, numPoints = 64) {
            const coords = [];
            const R = 6371;
            for (let i = 0; i <= numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                const dLat = (radiusKm / R) * (180 / Math.PI);
                const dLon = (radiusKm / R) * (180 / Math.PI) / Math.cos(centerLat * Math.PI / 180);
                const lon = centerLon + dLon * Math.cos(angle);
                const lat = centerLat + dLat * Math.sin(angle);
                coords.push([lon, lat]);
            }
            return coords;
        }

        function smoothLineCatmullRom(coords, samplesPerSegment = 20) {
            if (!coords || coords.length < 2) return coords;
            
            let pts = [coords[0], ...coords, coords[coords.length - 1]];
            let smooth = [];

            for (let i = 1; i < pts.length - 2; i++) {
                let p0 = pts[i - 1];
                let p1 = pts[i];
                let p2 = pts[i + 1];
                let p3 = pts[i + 2];

                for (let t = 0; t < samplesPerSegment; t++) {
                    let st = t / samplesPerSegment;
                    let t2 = st * st;
                    let t3 = t2 * st;

                    let x = 0.5 * ((2 * p1[0]) +
                        (-p0[0] + p2[0]) * st +
                        (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
                        (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);

                    let y = 0.5 * ((2 * p1[1]) +
                        (-p0[1] + p2[1]) * st +
                        (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
                        (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);

                    smooth.push([x, y]);
                }
            }
            smooth.push(coords[coords.length - 1]);
            return smooth;
        }

        const ERROR_HOURS = [0, 3, 6, 12, 18, 24, 36, 48, 60, 72, 96, 120];
        const ERROR_RADII_KM = [15, 26, 36, 58, 79, 100, 135, 170, 212.5, 255, 345, 465];

        function getRadiusForHour(hour) {
            if (hour <= ERROR_HOURS[0]) return ERROR_RADII_KM[0];
            if (hour >= ERROR_HOURS[ERROR_HOURS.length - 1]) return ERROR_RADII_KM[ERROR_RADII_KM.length - 1];

            for (let i = 0; i < ERROR_HOURS.length - 1; i++) {
                if (hour >= ERROR_HOURS[i] && hour <= ERROR_HOURS[i + 1]) {
                    const h1 = ERROR_HOURS[i], h2 = ERROR_HOURS[i + 1];
                    const r1 = ERROR_RADII_KM[i], r2 = ERROR_RADII_KM[i + 1];
                    const factor = (hour - h1) / (h2 - h1);
                    return r1 + factor * (r2 - r1);
                }
            }
            return ERROR_RADII_KM[ERROR_RADII_KM.length - 1];
        }

        function safeUnion(p1, p2) {
            if (!p1) return p2;
            if (!p2) return p1;
            try {
                return turf.union(turf.featureCollection([p1, p2]));
            } catch (e) {
                try { return turf.union(p1, p2); } catch (err) { return p1; }
            }
        }

        function makeSplitCone(points, forecastCoords) {
            if (!forecastCoords || forecastCoords.length < 2) return { fullCone: null };

            const smoothCoords = smoothLineCatmullRom(forecastCoords, 30);

            let origDistances = [0];
            for (let i = 1; i < points.length; i++) {
                const d = turf.distance(turf.point([points[i-1].lon, points[i-1].lat]), turf.point([points[i].lon, points[i].lat]), {units: 'kilometers'});
                origDistances.push(origDistances[i-1] + d);
            }
            const totalOrigDist = origDistances[origDistances.length - 1] || 1;

            let smoothDistances = [0];
            for (let i = 1; i < smoothCoords.length; i++) {
                const d = turf.distance(turf.point(smoothCoords[i-1]), turf.point(smoothCoords[i]), {units: 'kilometers'});
                smoothDistances.push(smoothDistances[i-1] + d);
            }
            const totalSmoothDist = smoothDistances[smoothDistances.length - 1] || 1;

            let circlesFull = [];

            for (let i = 0; i < smoothCoords.length; i++) {
                const coord = smoothCoords[i];
                const distAlong = smoothDistances[i];
                const fraction = totalSmoothDist === 0 ? 0 : distAlong / totalSmoothDist;
                const correspondingOrigDist = fraction * totalOrigDist;

                let hour = 0;
                for (let j = 0; j < points.length - 1; j++) {
                    if (correspondingOrigDist >= origDistances[j] && correspondingOrigDist <= origDistances[j+1]) {
                        const segDist = origDistances[j+1] - origDistances[j];
                        const segFactor = segDist === 0 ? 0 : (correspondingOrigDist - origDistances[j]) / segDist;
                        hour = points[j].hour + segFactor * (points[j+1].hour - points[j].hour);
                        break;
                    } else if (j === points.length - 2 && correspondingOrigDist > origDistances[j+1]) {
                        hour = points[points.length - 1].hour;
                    }
                }

                const radius = getRadiusForHour(hour);
                if (radius > 0) {
                    const circle = turf.buffer(turf.point(coord), radius, { units: "kilometers", steps: 64 });
                    circlesFull.push(circle);
                }
            }

            if (circlesFull.length === 0) return { fullCone: null };

            let fullCone = circlesFull[0];
            for (let i = 1; i < circlesFull.length; i++) {
                fullCone = safeUnion(fullCone, circlesFull[i]);
            }

            return { fullCone };
        }

        function calculateMovementStr(forecastPoints, forecastCoords, pastCoordsOnly) {
            let coordsToUse = forecastCoords;
            let pointsToUse = forecastPoints;

            if (!coordsToUse || coordsToUse.length < 2) {
                if (pastCoordsOnly && pastCoordsOnly.length >= 2) {
                    coordsToUse = pastCoordsOnly.slice(-2);
                    pointsToUse = null;
                } else {
                    return "-";
                }
            }
            
            let h24Coords = [];
            let h24Hours = 24;

            if (pointsToUse && pointsToUse.length >= 2) {
                let startH = pointsToUse[0].hour || 0;
                let ptsUpTo24 = [];
                for (let i = 0; i < pointsToUse.length; i++) {
                    ptsUpTo24.push([pointsToUse[i].lon, pointsToUse[i].lat]);
                    if (pointsToUse[i].hour >= startH + 24) {
                        h24Hours = pointsToUse[i].hour - startH;
                        break;
                    }
                }
                if (ptsUpTo24.length >= 2) {
                    h24Coords = ptsUpTo24;
                }
            }

            if (h24Coords.length < 2) {
                if (coordsToUse.length >= 2) {
                    h24Coords = coordsToUse.slice(0, 2);
                } else {
                    return "靜止 0 km/h";
                }
            }

            const pStart = h24Coords[0];
            const pEnd = h24Coords[1] || h24Coords[0];
            const direction = getDirection(pStart[0], pStart[1], pEnd[0], pEnd[1]);

            const samplesPerSegment = 30;
            const smoothCoords = smoothLineCatmullRom(h24Coords, samplesPerSegment);
            let curveDist = 0;
            for (let i = 0; i < smoothCoords.length - 1; i++) {
                curveDist += turf.distance(turf.point(smoothCoords[i]), turf.point(smoothCoords[i+1]), {units: 'kilometers'});
            }
            
            if (h24Hours <= 0) h24Hours = 24;
            const speed = Math.round(curveDist / h24Hours);
            return `${direction} ${speed} km/h`;
        }

        let typhoons = {};
        let currentStormKey = 'all';
        let currentSelectedYear = 'current';
        let myChart = null;
        let mapLoaded = false;
        let activeIntensityFilter = 'all';
        let currentView = 'map'; // 'map', 'stats', 'tables'

        function getHourFromCategory(cat) {
            const catLower = String(cat).toLowerCase();
            if (catLower === 'current' || catLower === '0h' || catLower === '0') return 0;
            return parseFloat(catLower.replace(/h/g, '')) || 0;
        }

        function parseCSVToTyphoon(csvText, letter) {
            const lines = csvText.split('\n');
            let currentMeta = null;
            let rows = [];

            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#') || line.toLowerCase().startsWith('category')) continue;
                const cols = line.split(',').map(c => c.trim());
                if (cols.length < 6) continue;

                const category = cols[0].toLowerCase();
                const time = cols[1];
                const rowName = cols[2];
                const lat = parseFloat(cols[3]);
                const lon = parseFloat(cols[4]);
                const rawWind = cols[5];

                if (isNaN(lat) || isNaN(lon)) continue;

                let isEx = false;
                let windVal = 0;
                if (rawWind && rawWind.toUpperCase() === 'EX') {
                    isEx = true;
                } else {
                    windVal = parseFloat(rawWind) || 0;
                }

                if (category === 'current' || category === '0h' || category === '0') {
                    currentMeta = { name: rowName || `Typhoon ${letter.toUpperCase()}`, time, lat, lon, wind: windVal, isEx };
                }

                rows.push({ category, time, name: rowName, lat, lon, wind: windVal, isEx, rawWind });
            }

            if (rows.length === 0) return null;

            if (!currentMeta) {
                const anchor = rows.find(r => r.category === '0h' || r.category === 'current' || r.category === '0') || rows[0];
                currentMeta = { name: anchor.name || `Typhoon ${letter.toUpperCase()}`, time: anchor.time, lat: anchor.lat, lon: anchor.lon, wind: anchor.wind, isEx: anchor.isEx };
            }

            const name = currentMeta.name;
            const intensityObj = getIntensity(currentMeta.wind, currentMeta.isEx);
            const categoryDesc = `${intensityObj.name}`;

            let past = [];
            let pastCoordsOnly = [];
            let forecastCoords = [];
            let forecastPoints = [];
            let pastNodes = [];
            let forecastNodes = [];

            let tempForecastRows = rows.filter(r => {
                const cat = r.category.toLowerCase();
                return cat === 'current' || cat === '0h' || cat === '0' || cat.includes('h') || !isNaN(parseInt(cat));
            });

            if (tempForecastRows.length === 0 && rows.length > 0) {
                tempForecastRows = rows;
            }

            let fPointsForCalc = [];
            let fCoordsForCalc = [];
            tempForecastRows.forEach(fr => {
                let hour = getHourFromCategory(fr.category);
                fCoordsForCalc.push([fr.lon, fr.lat]);
                fPointsForCalc.push({
                    lon: fr.lon,
                    lat: fr.lat,
                    hour: hour,
                    radius: getRadiusForHour(hour)
                });
            });

            let pastRows = rows.filter(r => r.category === 'past' || r.category === 'current' || r.category === '0h' || r.category === '0');
            if (pastRows.length === 0 && rows.length > 0) {
                pastRows = [rows[0]];
            }

            pastRows.forEach((r) => {
                const intensity = getIntensity(r.wind, r.isEx);
                pastNodes.push({
                    category: r.category,
                    time: r.time,
                    categoryCode: intensity.code,
                    categoryName: intensity.name,
                    color: intensity.color,
                    wind: r.isEx ? '-' : `${r.wind} km/h`,
                    windVal: r.wind,
                    isEx: r.isEx,
                    coordStr: `${r.lat.toFixed(1)}°N, ${r.lon.toFixed(1)}°E`,
                    lat: r.lat,
                    lon: r.lon,
                    coord: [r.lon, r.lat],
                    movementDir: '-',
                    distToMacau: getDistanceAndDirectionToMacau(r.lon, r.lat),
                    isPast: true
                });
            });

            pastNodes.forEach((node, idx) => {
                node.movementDir = calculatePastMovement(pastNodes, idx);
            });

            rows.forEach((r) => {
                const intensity = getIntensity(r.wind, r.isEx);
                let movementStr = '-';
                const catLower = String(r.category).toLowerCase();
                const isPast = catLower === 'past';
                
                if (!isPast) {
                    const fIndex = tempForecastRows.findIndex(fr => fr === r);
                    if (fIndex !== -1) {
                        let nextFr = tempForecastRows[fIndex + 1];
                        let prevFr = (fIndex + 1 >= tempForecastRows.length && fIndex > 0) ? tempForecastRows[fIndex - 1] : null;
                        
                        if (nextFr) {
                            let hA = getHourFromCategory(r.category);
                            let hB = getHourFromCategory(nextFr.category);
                            let dt = hB - hA;
                            if (dt <= 0) dt = 3; 
                            
                            let dist = turf.distance(
                                turf.point([r.lon, r.lat]),
                                turf.point([nextFr.lon, nextFr.lat]),
                                { units: 'kilometers' }
                            );
                            let direction = getDirection(r.lon, r.lat, nextFr.lon, nextFr.lat);
                            let speed = Math.round(dist / dt);
                            movementStr = `${direction} ${speed} km/h`;
                        } else if (prevFr) {
                            let hA = getHourFromCategory(prevFr.category);
                            let hB = getHourFromCategory(r.category);
                            let dt = hB - hA;
                            if (dt <= 0) dt = 3;
                            
                            let dist = turf.distance(
                                turf.point([prevFr.lon, prevFr.lat]),
                                turf.point([r.lon, r.lat]),
                                { units: 'kilometers' }
                            );
                            let direction = getDirection(prevFr.lon, prevFr.lat, r.lon, r.lat);
                            let speed = Math.round(dist / dt);
                            movementStr = `${direction} ${speed} km/h`;
                        }
                    }
                }

                if (isPast) return;

                const nodeInfo = {
                    category: r.category,
                    time: r.time,
                    categoryCode: intensity.code,
                    categoryName: intensity.name,
                    color: intensity.color,
                    wind: r.isEx ? '-' : `${r.wind} km/h`,
                    windVal: r.wind,
                    isEx: r.isEx,
                    coordStr: `${r.lat.toFixed(1)}°N, ${r.lon.toFixed(1)}°E`,
                    lat: r.lat,
                    lon: r.lon,
                    coord: [r.lon, r.lat],
                    movementDir: movementStr,
                    distToMacau: getDistanceAndDirectionToMacau(r.lon, r.lat),
                    isPast: false
                };
                forecastNodes.push(nodeInfo);
            });

            pastRows.forEach(pt => {
                past.push({ coord: [pt.lon, pt.lat], wind: pt.wind, isEx: pt.isEx });
                pastCoordsOnly.push([pt.lon, pt.lat]);
            });

            forecastCoords = fCoordsForCalc;
            forecastPoints = fPointsForCalc;

            const lastCoord = pastCoordsOnly[pastCoordsOnly.length - 1] || forecastCoords[0] || [currentMeta.lon, currentMeta.lat];
            const coordsStr = lastCoord ? `${lastCoord[1].toFixed(1)}°N, ${lastCoord[0].toFixed(1)}°E` : `${currentMeta.lat.toFixed(1)}°N, ${currentMeta.lon.toFixed(1)}°E`;
            const fCoordsForStorm = forecastCoords.length > 0 ? forecastCoords : [lastCoord];
            const movementStr = calculateMovementStr(forecastPoints, fCoordsForStorm, pastCoordsOnly);

            let nodeMap = new Map();
            [...pastNodes, ...forecastNodes].forEach(node => {
                nodeMap.set(node.time + "_" + node.coordStr, node);
            });
            let nodes = Array.from(nodeMap.values());

            return {
                name,
                category: categoryDesc,
                intensityObj,
                wind: currentMeta.isEx ? '-' : `${currentMeta.wind} km/h`,
                time: currentMeta.time,
                movement: movementStr,
                coords: coordsStr,
                past,
                pastCoordsOnly,
                forecast: forecastCoords.length > 0 ? forecastCoords : [lastCoord],
                forecastPoints,
                nodes,
                pastNodes,
                forecastNodes
            };
        }

        function parseHistoricalCSVToTyphoon(csvText, fileId, year) {
            const lines = csvText.split('\n');
            let rows = [];
            let currentStormName = `Typhoon ${fileId.toUpperCase()} (${year})`;

            for (let line of lines) {
                line = line.trim();

                const time = cols[0];

                }

                rows.push({ time, name: currentStormName, lat, lon, wind: windVal, isEx });

            if (rows.length === 0) return null;

            const name = rows.find(r => r.name && r.name !== `Typhoon ${fileId.toUpperCase()} (${year})`)?.name || currentStormName;
            const lastRow = rows[rows.length - 1];
            const maxWind = Math.max(...rows.map(r => r.wind));
            const intensityObj = getIntensity(maxWind, false);
            const categoryDesc = `${intensityObj.name}`;

            let past = [];
            let pastCoordsOnly = [];
            let pastNodes = [];

            rows.forEach((r) => {
                const intensity = getIntensity(r.wind, r.isEx);
                pastNodes.push({
                    category: 'past',
                    time: r.time,
                    categoryCode: intensity.code,
                    categoryName: intensity.name,
                    color: intensity.color,
                    wind: r.isEx ? '-' : `${r.wind} km/h`,
                    windVal: r.wind,
                    isEx: r.isEx,
                    coordStr: `${r.lat.toFixed(1)}°N, ${r.lon.toFixed(1)}°E`,
                    lat: r.lat,
                    lon: r.lon,
                    coord: [r.lon, r.lat],
                    movementDir: '-',
                    distToMacau: getDistanceAndDirectionToMacau(r.lon, r.lat),
                    isPast: true
                });
            });

            pastNodes.forEach((node, idx) => {
                node.movementDir = calculatePastMovement(pastNodes, idx);
            });

            pastNodes.forEach(node => {
                past.push({ coord: [node.lon, node.lat], wind: node.windVal, isEx: node.isEx });
                pastCoordsOnly.push([node.lon, node.lat]);
            });

            let closestDist = "-";
            let closestCoords = "-";
            let closestTime = "-";
            let minDist = Infinity;
            let closestNode = null;
            pastNodes.forEach(node => {
                const d = turf.distance(turf.point([node.lon, node.lat]), turf.point(MACAU_COORDS), { units: 'kilometers' });
                if (d < minDist) {
                    minDist = d;
                    closestNode = node;
                }
            });
            if (closestNode) {
                closestDist = closestNode.distToMacau;
                closestCoords = closestNode.coordStr;
                closestTime = closestNode.time;
            }

            const lastCoord = pastCoordsOnly[pastCoordsOnly.length - 1] || [113.5685, 22.1595];
            const coordsStr = `${lastCoord[1].toFixed(1)}°N, ${lastCoord[0].toFixed(1)}°E`;

            return {
                name,
                category: categoryDesc,
                intensityObj,
                wind: `${maxWind} km/h`,
                time: lastRow.time,
                movement: "-",
                coords: coordsStr,
                past,
                pastCoordsOnly,
                forecast: [lastCoord],
                forecastPoints: [],
                nodes: pastNodes,
                pastNodes,
                forecastNodes: [],
                closestDist,
                closestCoords,
                closestTime
            };
        }

        async function loadTyphoonCSVsForYear(year) {
            let loaded = {};
            
            if (year === 'current') {
                const files = ['A', 'B', 'C', 'D', 'E', 'F'];
                const promises = files.map(async (f) => {
                    try {
                        const response = await fetch(`TCdata/${f}.csv`);
                        if (!response.ok) return null;
                        const text = await response.text();
                        if (!text || text.trim() === '') return null;
                        const stormData = parseCSVToTyphoon(text, f);
                        return { key: f.toLowerCase(), data: stormData };
                    } catch (err) {
                        return null;
                    }
                });

                const results = await Promise.all(promises);
                results.forEach(res => {
                    if (res && res.data) {
                        loaded[res.key] = res.data;
                    }
                });
            } else {
                const yy = year.slice(2);
                let files = [];
                for (let i = 1; i <= 40; i++) {
                    files.push(yy + String(i).padStart(2, '0'));
                }
                for (let i = 1; i <= 15; i++) {
                    files.push(yy + 'TD' + i);
                }

                const promises = files.map(async (f) => {
                    try {
                        const response = await fetch(`TCdata/pastTC/${year}/${f}.csv`);
                        if (!response.ok) return null;
                        const text = await response.text();
                        if (!text || text.trim() === '') return null;
                        const stormData = parseHistoricalCSVToTyphoon(text, f, year);
                        return { key: f.toLowerCase(), data: stormData };
                    } catch (err) {
                        return null;
                    }
                });

                const results = await Promise.all(promises);
                results.forEach(res => {
                    if (res && res.data) {
                        loaded[res.key] = res.data;
                    }
                });
            }
            return loaded;
        }

        function getStormBounds(stKey) {
            const keys = Object.keys(typhoons);
            if (stKey === 'all' || keys.length === 0) {
                return { center: [130, 15], zoom: 4.2 };
            }
            const st = typhoons[stKey] || typhoons[keys[0]];
            if (!st) return { center: [130, 15], zoom: 4.2 };
            
            let allCoords = [];
            if (st.pastCoordsOnly) allCoords = allCoords.concat(st.pastCoordsOnly);
            if (st.forecast) allCoords = allCoords.concat(st.forecast);
            if (allCoords.length === 0) return { center: [130, 15], zoom: 5.5 };

            let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
            allCoords.forEach(c => {
                if (!c || isNaN(c[0]) || isNaN(c[1])) return;
                if (c[0] < minLon) minLon = c[0];
                if (c[0] > maxLon) maxLon = c[0];
                if (c[1] < minLat) minLat = c[1];
                if (c[1] > maxLat) maxLat = c[1];
            });
            if (minLon === Infinity || maxLon === -Infinity) return { center: [130, 15], zoom: 4.2 };

            const center = [(minLon + maxLon) / 2, (minLat + maxLat) / 2];
            const lonSpan = maxLon - minLon;
            const latSpan = maxLat - minLat;
            const maxSpan = Math.max(lonSpan, latSpan, 1.0);
            
            let zoom = Math.min(10.0, Math.max(6.0, 360 / (maxSpan * 3.8)));
            return { center, zoom };
        }

        function addTurfPolygonSeries(turfPoly, seriesList, styleOpts) {
            if (!turfPoly || !turfPoly.geometry) return;
            const geom = turfPoly.geometry;
            const coordsList = geom.type === 'Polygon' ? [geom.coordinates[0]] : 
                               geom.type === 'MultiPolygon' ? geom.coordinates.map(poly => poly[0]) : [];
            
            coordsList.forEach(ring => {
                seriesList.push({
                    type: 'custom',
                    coordinateSystem: 'geo',
                    z: 2.5,
                    data: [[0]],
                    renderItem: function(params, api) {
                        const points = ring.map(coord => api.coord(coord));
                        if (!points || points.some(p => !p || isNaN(p[0]) || isNaN(p[1]))) {
                            return { type: 'group', silent: true };
                        }
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: styleOpts,
                            silent: true
                        };
                    },
                    silent: true
                });
            });
        }

        function renderLargeIntensityGraph() {
            setTimeout(() => {
                const chartDom = document.getElementById('large-wind-speed-chart');
                if (!chartDom) return;
                
                const keys = Object.keys(typhoons);
                if (keys.length === 0) {
                    chartDom.innerHTML = '<div class="text-center text-slate-400 py-20 text-sm font-medium">無可用的氣旋數據</div>';
                    return;
                }
                const stormKey = (currentStormKey === 'all' || !typhoons[currentStormKey]) ? keys[0] : currentStormKey;
                const storm = typhoons[stormKey];
                if (!storm) return;

                let pastNodes = storm.pastNodes || [];
                let forecastNodes = storm.forecastNodes || [];

                // 篩選出純未來的預報節點（排除與 pastNodes 末點重複的 current / 0h 錨點）
                let futureForecastNodes = [];
                if (currentSelectedYear === 'current' && forecastNodes.length > 0) {
                    futureForecastNodes = forecastNodes.filter(fn => {
                        const cat = String(fn.category).toLowerCase();
                        if (cat === 'current' || cat === '0h' || cat === '0') return false;
                        if (pastNodes.length > 0) {
                            const lastPast = pastNodes[pastNodes.length - 1];
                            if (fn.time === lastPast.time && fn.lat === lastPast.lat && fn.lon === lastPast.lon) return false;
                        }
                        return true;
                    });
                }

                let chartTimes = [];
                let pastData = [];
                let forecastData = [];

                // 1. 處理歷史 / 實時數據點
                pastNodes.forEach(n => {
                    const timeDisplay = n.time || n.category;
                    chartTimes.push(timeDisplay);
                    let wNum = parseFloat(n.windVal) || 0;
                    if (n.isEx) wNum = 0;
                    let intensity = getIntensity(n.windVal, n.isEx);
                    pastData.push({
                        value: wNum,
                        itemStyle: { color: intensity.color },
                        intensityObj: intensity,
                        nodeInfo: n,
                        isForecast: false
                    });
                    forecastData.push('-');
                });

                // 2. 處理預報數據點 (即時監控模式下)
                if (futureForecastNodes.length > 0) {
                    // 接縫點：將歷史實時線的最後一點設為預報虛線的起點，確保折線平滑無縫連接
                    if (pastNodes.length > 0) {
                        const junctionNode = pastNodes[pastNodes.length - 1];
                        let jWind = parseFloat(junctionNode.windVal) || 0;
                        if (junctionNode.isEx) jWind = 0;
                        let jIntensity = getIntensity(jWind, junctionNode.isEx);
                        
                        forecastData[forecastData.length - 1] = {
                            value: jWind,
                            itemStyle: { color: jIntensity.color },

                            isForecast: true,

                            nodeInfo: n,

                    minorLines.push({ coords: [[lon, -90], [lon, 90]] });

                for (let lat = -90; lat <= 90; lat += 5) {
                    minorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',

                    polyline: true,
                    lineStyle: { color: gridMinorColor, width: 0.15, type: 'dashed' },

                });

                const majorLines = [];
                for (let lon = -180; lon <= 180; lon += 30) {
                    majorLines.push({ coords: [[lon, -90], [lon, 90]] });
                }
                for (let lat = -90; lat <= 90; lat += 15) {
                    majorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    lineStyle: { color: gridMajorColor, width: 0.6, type: 'dashed' },
                    data: majorLines,
                    silent: true
                });

                const gridLabels = [];
                for (let lon = -180; lon <= 180; lon += 30) {
                    if (lon === 180 || lon === -180) continue;
                    gridLabels.push({ name: `${Math.abs(lon)}°${lon < 0 ? 'W' : 'E'}`, value: [lon, 0, 1], itemStyle: { opacity: 0 } });

                    ringLines.push({
                        coords: coords,
                        lineStyle: { color: ringColor, width: 0.8, type: 'dashed', opacity: 0.7 }

                    const latOffset = (dist / 6371) * (180 / Math.PI);
                    ringLabels.push({

                        itemStyle: { opacity: 0 }

                const smoothForecastCoords = smoothLineCatmullRom(st.forecast, 30);

                if (showEnvelope && st.forecastPoints && st.forecastPoints.length > 1) {
                    const cones = makeSplitCone(st.forecastPoints, st.forecast);
                    if (cones.fullCone) {
                        addTurfPolygonSeries(cones.fullCone, seriesList, {
                            fill: isDark ? 'rgba(56, 189, 248, 0.12)' : 'rgba(2, 132, 199, 0.1)',
                            stroke: isDark ? 'rgba(56, 189, 248, 0.45)' : 'rgba(2, 132, 199, 0.4)',
                            lineWidth: 1.2,
                            lineDash: [3, 3]
                        });
                    }
                }

                if (showPast && st.pastCoordsOnly && st.pastCoordsOnly.length >= 2) {
                    const validPastCoords = st.pastCoordsOnly.filter(c => c && !isNaN(c[0]) && !isNaN(c[1]));
                    if (validPastCoords.length >= 2) {
                        seriesList.push({
                            type: 'lines',
                            coordinateSystem: 'geo',
                            z: 3,
                            polyline: true,
                            lineStyle: { color: isDark ? '#ffffff' : '#334155', width: 1.8, opacity: 0.95 },
                            data: [{ coords: validPastCoords }],
                            silent: true
                        });
                    }
                }

                const pastScatterData = st.past.map(pt => {
                    const intensity = getIntensity(pt.wind, pt.isEx);
                    return {
                        name: `${st.name} 軌跡點`,
                        value: pt.coord ? [...pt.coord, 1] : [MACAU_COORDS[0], MACAU_COORDS[1], 1],
                        itemStyle: { color: intensity.color },
                        symbolSize: 7,
                        windVal: pt.wind,
                        isEx: pt.isEx,
                        stormName: st.name,
                        intensityObj: intensity
                    };
                });

                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 4,
                    data: pastScatterData,
                    symbol: 'circle'
                });

                if (showForecast && smoothForecastCoords && smoothForecastCoords.length >= 2 && currentSelectedYear === 'current') {
                    const validForecastCoords = smoothForecastCoords.filter(c => c && !isNaN(c[0]) && !isNaN(c[1]));
                    if (validForecastCoords.length >= 2) {
                        seriesList.push({
                            type: 'lines',
                            coordinateSystem: 'geo',
                            z: 3,
                            polyline: true,
                            effect: {
                                show: true,
                                period: 4,
                                trailLength: 0.2,
                                color: isDark ? '#ffffff' : '#334155',
                                symbol: 'circle',
                                symbolSize: 4
                            },
                            lineStyle: { color: isDark ? '#ffffff' : '#334155', width: 2.2, type: 'dashed', opacity: 0.9 },
                            data: [{ coords: validForecastCoords }],
                            silent: true
                        });
                    }
                }

                if (showNodes && st.nodes) {
                    const scatterData = st.nodes.map((node) => {
                        const intensity = getIntensity(node.windVal, node.isEx);
                        const isEye = (currentSelectedYear === 'current') && (node.time === st.time || (st.pastNodes && st.pastNodes.length > 0 && node.time === st.pastNodes[st.pastNodes.length - 1].time));

                        return {
                            name: `${st.name} - ${node.time}`,
                            value: node.coord ? [...node.coord, 1] : [MACAU_COORDS[0], MACAU_COORDS[1], 1],
                            itemStyle: { color: intensity.color },
                            symbolSize: isEye ? 16 : 9,
                            isEye: isEye,
                            nodeInfo: node,
                            stormName: st.name,
                            intensityObj: intensity
                        };
                    });

                    seriesList.push({
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        z: 5,
                        data: scatterData,
                        symbol: 'circle'
                    });
                }
            };

            if (currentStormKey === 'all') {
                filteredKeys.forEach(k => {
                    if (typhoons[k]) renderTyphoonTracks(typhoons[k]);
                });
            } else {
                if (typhoons[currentStormKey]) renderTyphoonTracks(typhoons[currentStormKey]);
            }

            if (showMacau) {
                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 6,
                    data: [{
                        name: '澳門 Macao',
                        value: [...MACAU_COORDS, 1]
                    }],
                    symbol: 'pin',
                    symbolSize: 28,
                    itemStyle: { color: '#ef4444' },
                    label: {
                        show: true,
                        formatter: '澳門',
                        position: 'top',
                        color: macauTextColor,
                        backgroundColor: macauBg,
                        padding: [3, 6],
                        borderRadius: 6,
                        borderColor: '#ef4444',
                        borderWidth: 1,
                        fontSize: 10,
                        fontWeight: 'bold',
                        fontFamily: '"Plus Jakarta Sans", sans-serif'
                    }
                });
            }

            const bounds = getStormBounds(currentStormKey);

            const option = {
                backgroundColor: mapBgColor,
                tooltip: {
                    trigger: 'item',
                    backgroundColor: tooltipBg,
                    borderColor: tooltipBorder,
                    borderRadius: 12,
                    padding: [10, 14],
                    textStyle: { color: tooltipText, fontSize: 12 },
                    formatter: function (params) {
                        if (!params.data) return '';
                        if (params.seriesType === 'scatter' && params.data.nodeInfo) {
                            const node = params.data.nodeInfo;
                            const isPast = node.isPast;
                            const typeTag = isPast ? '<span class="text-emerald-500 font-bold">[實時/歷史]</span>' : '<span class="text-amber-500 font-bold">[預報]</span>';
                            return `<div style="font-weight:bold; margin-bottom:4px; font-family:'JetBrains Mono';">${params.data.stormName || ''} - ${node.time} ${typeTag}</div>
                                    <div>強度: <span style="color:${node.color}; font-weight:bold;">${node.categoryCode} (${node.categoryName})</span></div>
                                    <div>風速: <span class="font-bold">${node.wind}</span></div>
                                    <div>位置: <span class="font-mono">${node.coordStr}</span></div>
                                    <div>距離澳門: <span class="font-mono">${node.distToMacau}</span></div>
                                    <div>移動方向: <span class="font-mono">${node.movementDir}</span></div>`;
                        } else if (params.seriesType === 'scatter' && params.data.name === '澳門 Macao') {
                            return `<div style="font-weight:bold; font-family:'Plus Jakarta Sans';">澳門特別行政區</div><div>坐標: 113.57°E, 22.16°N</div>`;
                        }
                        return params.name;
                    }
                },
                geo: {
                    map: 'world50m',
                    roam: true,
                    center: isStormSwitch ? bounds.center : undefined,
                    zoom: isStormSwitch ? bounds.zoom : undefined,
                    itemStyle: {
                        areaColor: areaColor,
                        borderColor: borderColor,
                        borderWidth: 0.8
                    },
                    emphasis: {
                        itemStyle: {
                            areaColor: emphAreaColor,
                            borderColor: emphBorderColor,
                            borderWidth: 1.2
                        },
                        label: { show: false }
                    }
                },
                series: seriesList
            };

            myChart.setOption(option, isStormSwitch);
        }

        window.addEventListener('load', () => {
            initVectorMap();
        });
    </script>
</body>
</html>
