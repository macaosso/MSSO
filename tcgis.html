            <div class="p-3 border-t border-slate-800 text-center text-[11px] text-slate-500">

        <!-- 主地圖畫布區 -->
        <main class="flex-1 relative h-full bg-[#08101a] min-h-0 min-w-0 flex flex-col">
            <div id="echarts-map" class="w-full h-full flex-1"></div>

            <!-- 強度分級圖例 -->
            <div class="absolute bottom-6 right-6 z-20 bg-[#0b1322]/90 backdrop-blur-md border border-slate-800 p-3.5 rounded-xl shadow-xl text-xs space-y-2 pointer-events-none hidden sm:block max-w-xs">
                <div class="font-bold text-slate-200 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-palette text-blue-400"></i> 強度分級 (自動風速對應)
                </div>

    <script>
        setInterval(() => {
            const now = new Date();
            document.getElementById('utc-clock').innerText = now.toUTCString().slice(17, 25) + " UTC";
        }, 1000);

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        const TC_INTENSITY_TABLE = [
            {"code": "LPA",  "name": "低壓區",           "engName": "Low Pressure Area",      "max_wind": 40,   "rangeText": "≤ 40 km/h",    "color": "#DDDFE2"},
            {"code": "TD",   "name": "熱帶低氣壓",       "engName": "Tropical Depression",    "max_wind": 62,   "rangeText": "41 - 62 km/h", "color": "#6DD8FA"},
            {"code": "TS",   "name": "熱帶風暴",         "engName": "Tropical Storm",         "max_wind": 87,   "rangeText": "63 - 87 km/h", "color": "#9DD79C"},
            {"code": "STS",  "name": "強烈熱帶風暴",     "engName": "Severe Tropical Storm",  "max_wind": 117,  "rangeText": "88 - 117 km/h","color": "#FFD363"},
            {"code": "TY",   "name": "颱風",             "engName": "Typhoon",                "max_wind": 149,  "rangeText": "118 - 149 km/h","color": "#F78A31"},
            {"code": "STY",  "name": "強颱風",           "engName": "Severe Typhoon",         "max_wind": 184,  "rangeText": "150 - 184 km/h","color": "#FF6F6F"},
            {"code": "SuTY", "name": "超強颱風",         "engName": "Super Typhoon",          "max_wind": 9999, "rangeText": "≥ 185 km/h",   "color": "#DE82FF"}
        ];

        function getIntensity(windKmh) {
            for (let item of TC_INTENSITY_TABLE) {
                if (windKmh <= item.max_wind) return item;
            }
            return TC_INTENSITY_TABLE[TC_INTENSITY_TABLE.length - 1];
        }

        const legendContainer = document.getElementById('intensity-legend');
        TC_INTENSITY_TABLE.forEach(item => {
            const div = document.createElement('div');
            div.className = "flex items-center justify-between space-x-3";
            div.innerHTML = `
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full inline-block shadow shrink-0" style="background-color: ${item.color};"></span>
                    <span class="text-slate-300 font-medium">${item.code} - ${item.name}</span>
                </div>
                <span class="text-slate-400 font-mono text-[10px] shrink-0">${item.rangeText}</span>
            `;
            legendContainer.appendChild(div);
        });

        const MACAU_COORDS = [113.5685, 22.1595];

        function getDistanceAndDirectionToMacau(tLon, tLat) {
            const R = 6371;
            const dLat = (tLat - MACAU_COORDS[1]) * Math.PI / 180;
            const dLon = (tLon - MACAU_COORDS[0]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(MACAU_COORDS[1] * Math.PI / 180) * Math.cos(tLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            let dist = R * c;
            dist = Math.round(dist / 10) * 10;

            const lat1Rad = MACAU_COORDS[1] * Math.PI / 180;
            const lat2Rad = tLat * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;

            const directions = [
                "正北", "北北東", "東北", "東北偏東",
                "正東", "東南偏東", "東南", "南南東",
                "正南", "南南西", "西南", "西南偏西",
                "正西", "西北偏西", "西北", "北北西"
            ];
            const index = Math.round((brng % 360) / 22.5) % 16;
            return `${directions[index]} ${dist}公里`;
        }

        function generateCircleCoords(centerLon, centerLat, radiusKm, numPoints = 64) {
            const coords = [];
            const R = 6371;
            for (let i = 0; i <= numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                const dLat = (radiusKm / R) * (180 / Math.PI);
                const dLon = (radiusKm / R) * (180 / Math.PI) / Math.cos(centerLat * Math.PI / 180);
                const lon = centerLon + dLon * Math.cos(angle);
                const lat = centerLat + dLat * Math.sin(angle);
                coords.push([lon, lat]);
            }
            return coords;
        }

        // ================= 錐狀誤差圈邏輯 (Turf.js 整合) =================
        function generateConePoints(points, stepsPerSegment = 25) {
            const valid = points.filter(p => p.radius !== null && p.radius !== undefined && !isNaN(p.radius));
            if (valid.length < 2) return [];

            let result = [];
            for (let i = 0; i < valid.length - 1; i++) {
                const p1 = valid[i];
                const p2 = valid[i + 1];
                const maxJ = (i === valid.length - 2) ? stepsPerSegment : stepsPerSegment - 1;

                for (let j = 0; j <= maxJ; j++) {
                    const t = j / stepsPerSegment;
                    const lat = p1.lat + t * (p2.lat - p1.lat);
                    const lon = p1.lon + t * (p2.lon - p1.lon);
                    const hour = p1.hour + t * (p2.hour - p1.hour);
                    const radius = p1.radius + t * (p2.radius - p1.radius);

                    result.push({ lat, lon, hour, radius });
                }
            }
            return result;
        }

        function safeUnion(p1, p2) {
            if (!p1) return p2;
            if (!p2) return p1;
            try {
                return turf.union(turf.featureCollection([p1, p2]));
            } catch (e) {
                try { return turf.union(p1, p2); } catch (err) { return p1; }
            }
        }

        function makeSplitCone(points) {
            const interpolated = generateConePoints(points, 25);
            if (interpolated.length < 2) return { fullCone: null };

            let circlesFull = [];

            for (let p of interpolated) {
                if (p.radius > 0) {
                    const circle = turf.buffer(turf.point([p.lon, p.lat]), p.radius, { units: "kilometers", steps: 32 });
                    circlesFull.push(circle);
                }
            }

            if (circlesFull.length === 0) return { fullCone: null };

            let fullCone = circlesFull[0];
            for (let i = 1; i < circlesFull.length; i++) {
                fullCone = safeUnion(fullCone, circlesFull[i]);
            }

            return { fullCone };
        }
        // =========================================================================

        let typhoons = {};
        let currentStormKey = 'all';
        let myChart = null;
        let mapLoaded = false;

        // 解析新版簡化 CSV 轉換成颱風資料結構
        function parseCSVToTyphoon(csvText, letter) {
            const lines = csvText.split('\n');
            let currentMeta = null;
            let rows = [];

            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#') || line.toLowerCase().startsWith('category')) continue;
                const cols = line.split(',').map(c => c.trim());
                if (cols.length < 6) continue;

                const category = cols[0].toLowerCase();
                const time = cols[1];
                const rowName = cols[2];
                const lat = parseFloat(cols[3]);
                const lon = parseFloat(cols[4]);
                const windVal = parseFloat(cols[5]) || 0;

                if (isNaN(lat) || isNaN(lon)) continue;

                if (category === 'current') {
                    currentMeta = { name: rowName || `Typhoon ${letter.toUpperCase()}`, time, lat, lon, wind: windVal };
                }

                rows.push({ category, time, name: rowName, lat, lon, wind: windVal });
            }

            if (rows.length === 0) return null;

            if (!currentMeta) {
                const last = rows[rows.length - 1];
                currentMeta = { name: last.name || `Typhoon ${letter.toUpperCase()}`, time: last.time, lat: last.lat, lon: last.lon, wind: last.wind };
            }

            const name = currentMeta.name;
            const wind = `${currentMeta.wind} km/h`;
            const intensityObj = getIntensity(currentMeta.wind);
            const categoryDesc = `${intensityObj.name} (${intensityObj.code})`;

            let past = [];
            let pastCoordsOnly = [];
            let forecastCoords = [];
            let forecastPoints = [];
            let nodes = [];

            // 1. 處理 past 與 current 軌跡 (current 也包含在 past 終點)
            let pastRows = rows.filter(r => r.category === 'past' || r.category === 'current');
            pastRows.forEach(pt => {
                past.push({ coord: [pt.lon, pt.lat], wind: pt.wind });
                pastCoordsOnly.push([pt.lon, pt.lat]);
                nodes.push({ coord: [pt.lon, pt.lat], time: pt.time, wind: `${pt.wind} km/h`, type: getIntensity(pt.wind).code });
            });

            // 2. 處理 forecast 軌跡 (current 為 0H，加上所有 XH 預報)
            let forecastRows = rows.filter(r => r.category === 'current' || r.category.includes('h'));
            forecastRows.forEach(fr => {
                let hour = 0;
                if (fr.category !== 'current') {
                    hour = parseInt(fr.category.replace('h', '').replace('H', '')) || 0;
                }

                forecastCoords.push([fr.lon, fr.lat]);

                // HTML 中自動依預報時效賦予誤差半徑 (例如基礎 40km 隨小時遞增)
                let defaultRadius = 45 + (hour * 0.6);

                forecastPoints.push({
                    lon: fr.lon,
                    lat: fr.lat,
                    hour: hour,
                    radius: defaultRadius
                });

                if (fr.category !== 'current' && !nodes.some(n => n.time === fr.time)) {
                    nodes.push({ coord: [fr.lon, fr.lat], time: fr.time, wind: `${fr.wind} km/h`, type: getIntensity(fr.wind).code });
                }
            });

            const lastCoord = pastCoordsOnly[pastCoordsOnly.length - 1];
            const coordsStr = lastCoord ? `${lastCoord[1].toFixed(1)}°N, ${lastCoord[0].toFixed(1)}°E` : '';

            return {
                name,
                category: categoryDesc,
                wind,
                movement: "西北 @ 22 km/h",
                coords: coordsStr,
                past,
                pastCoordsOnly,
                forecast: forecastCoords.length > 0 ? forecastCoords : pastCoordsOnly.slice(-1),
                forecastPoints,
                nodes
            };
        }

        // 載入 A 到 F 的 CSV 檔案
        async function loadAllTyphoonCSVs() {
            const files = ['A', 'B', 'C', 'D', 'E', 'F'];
            let loaded = {};

            for (let f of files) {
                try {
                    const response = await fetch(`TCdata/${f}.csv`);
                    if (!response.ok) continue;
                    const text = await response.text();
                    if (!text || text.trim() === '') continue;

                    const stormData = parseCSVToTyphoon(text, f);
                    if (stormData) {
                        loaded[f.toLowerCase()] = stormData;
                    }
                } catch (err) {
                    console.log(`TC_data/${f}.csv 無內容或略過`);
                }
            }
            return loaded;
        }

        function getStormBounds(stKey) {
            if (stKey === 'all' || Object.keys(typhoons).length === 0) {
                return { center: [130, 15], zoom: 4.2 };
            }
            const st = typhoons[stKey];
            if (!st) return { center: [130, 15], zoom: 4.2 };
            
            let allCoords = [];
            if (st.pastCoordsOnly) allCoords = allCoords.concat(st.pastCoordsOnly);
            if (st.forecast) allCoords = allCoords.concat(st.forecast);
            if (allCoords.length === 0) return { center: [130, 15], zoom: 5.5 };

            let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
            allCoords.forEach(c => {
                if (c[0] < minLon) minLon = c[0];
                if (c[0] > maxLon) maxLon = c[0];
                if (c[1] < minLat) minLat = c[1];
                if (c[1] > maxLat) maxLat = c[1];
            });
            const center = [(minLon + maxLon) / 2, (minLat + maxLat) / 2];
            const lonSpan = maxLon - minLon;
            const latSpan = maxLat - minLat;
            const maxSpan = Math.max(lonSpan, latSpan, 1.0);
            
            let zoom = Math.min(10.0, Math.max(6.0, 360 / (maxSpan * 3.8)));
            return { center, zoom };
        }

        const tcCountryMap = {
            "China": "中國", "Taiwan": "台灣", "Japan": "日本", "Philippines": "菲律賓",
            "Vietnam": "越南", "South Korea": "韓國", "North Korea": "朝鮮", "Russia": "俄羅斯",
            "India": "印度", "Thailand": "泰國", "Malaysia": "馬來西亞", "Indonesia": "印尼",
            "Cambodia": "柬埔寨", "Laos": "寮國", "Myanmar": "緬甸", "Singapore": "新加坡",
            "Brunei": "汶萊", "Australia": "澳洲", "New Zealand": "紐西蘭"
        };

        async function initVectorMap() {
            const chartDom = document.getElementById('echarts-map');
            myChart = echarts.init(chartDom);

            myChart.showLoading({
                text: '載入 GIS 向量圖資與解析 CSV 檔案...',
                color: '#3b82f6',
                textColor: '#cbd5e1',
                maskColor: 'rgba(8, 16, 26, 0.9)',
                zlevel: 0
            });

            try {
                const [worldResp, csvTyphoons] = await Promise.all([
                    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson'),
                    loadAllTyphoonCSVs()
                ]);

                const worldJson = await worldResp.json();
                if (worldJson && worldJson.features) {
                    worldJson.features.forEach(feat => {
                        if (feat.properties) {
                            const engName = feat.properties.ADMIN || feat.properties.name || feat.properties.NAME || '';
                            feat.properties.name = tcCountryMap[engName] || engName;
                        }
                    });
                }

                echarts.registerMap('world50m', worldJson);
                typhoons = csvTyphoons;
                mapLoaded = true;
                myChart.hideLoading();
                
                updateStormSelectUI();
                renderChart(true);
            } catch (e) {
                console.error('初始化失敗:', e);
                myChart.hideLoading();
                typhoons = {};
                updateStormSelectUI();
                renderChart(true);
            }

            window.addEventListener('resize', () => {
                myChart.resize();
            });
        }

        function updateStormSelectUI() {
            const selectEl = document.getElementById('storm-select');
            selectEl.innerHTML = '';

            const keys = Object.keys(typhoons);
            if (keys.length === 0) {
                selectEl.innerHTML = `<option value="none">無活躍系統</option>`;
                return;
            }

            selectEl.innerHTML = `<option value="all" selected>活動颱風系統 (全部 - ${keys.length}個)</option>`;
            keys.forEach(k => {
                const st = typhoons[k];
                selectEl.innerHTML += `<option value="${k}">${st.name} - ${st.category}</option>`;
            });
        }

        function addTurfPolygonSeries(turfPoly, seriesList, styleOpts) {
            if (!turfPoly || !turfPoly.geometry) return;
            const geom = turfPoly.geometry;
            const coordsList = geom.type === 'Polygon' ? [geom.coordinates[0]] : 
                               geom.type === 'MultiPolygon' ? geom.coordinates.map(poly => poly[0]) : [];
            
            coordsList.forEach(ring => {
                seriesList.push({
                    type: 'custom',
                    coordinateSystem: 'geo',
                    z: 2.5,
                    data: [[0]],
                    renderItem: function(params, api) {
                        const points = ring.map(coord => api.coord(coord));
                        if (!points || points.some(p => !p || isNaN(p[0]) || isNaN(p[1]))) return;
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: styleOpts
                        };
                    },
                    silent: true
                });
            });
        }

        function renderChart(isStormSwitch = false) {
            if (!myChart) return;
            
            const showPast = document.getElementById('layer-past').checked;
            const showForecast = document.getElementById('layer-forecast').checked;
            const showEnvelope = document.getElementById('layer-envelope').checked;
            const showNodes = document.getElementById('layer-nodes').checked;
            const showRings = document.getElementById('layer-rings').checked;
            const showMacau = document.getElementById('layer-macau').checked;
            const showGrid = document.getElementById('layer-grid').checked;

            const seriesList = [];
            const keys = Object.keys(typhoons);

            // 1. 全球經緯網格
            if (showGrid) {
                const minorLines = [];
                for (let lon = -180; lon <= 180; lon += 5) {
                    minorLines.push({ coords: [[lon, -90], [lon, 90]] });
                }
                for (let lat = -90; lat <= 90; lat += 5) {
                    minorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 1,
                    polyline: true,
                    lineStyle: { color: 'rgba(255, 255, 255, 0.05)', width: 0.15, type: 'dashed' },
                    data: minorLines,
                    silent: true
                });

                const majorLines = [];
                for (let lon = -180; lon <= 180; lon += 30) {
                    majorLines.push({ coords: [[lon, -90], [lon, 90]] });
                }
                for (let lat = -90; lat <= 90; lat += 15) {
                    majorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    lineStyle: { color: 'rgba(255, 255, 255, 0.18)', width: 0.6, type: 'dashed' },
                    data: majorLines,
                    silent: true
                });

                const gridLabels = [];
                for (let lon = -180; lon <= 180; lon += 30) {
                    if (lon === 180 || lon === -180) continue;
                    gridLabels.push({ name: `${Math.abs(lon)}°${lon < 0 ? 'W' : 'E'}`, value: [lon, 0, 1], itemStyle: { opacity: 0 } });
                }
                for (let lat = -90; lat <= 90; lat += 15) {
                    if (lat === 0 || lat === 90 || lat === -90) continue;
                    gridLabels.push({ name: `${Math.abs(lat)}°${lat < 0 ? 'S' : 'N'}`, value: [0, lat, 1], itemStyle: { opacity: 0 } });
                }
                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 3,
                    data: gridLabels,
                    label: { show: true, formatter: '{b}', color: 'rgba(255, 255, 255, 0.4)', fontSize: 9, fontFamily: 'monospace' },
                    silent: true
                });
            }

            // 2. Macau Distance Rings
            if (showRings) {
                const ringDistances = [100, 200, 400, 800];
                const ringLines = [];
                const ringLabels = [];

                ringDistances.forEach(dist => {
                    const coords = generateCircleCoords(MACAU_COORDS[0], MACAU_COORDS[1], dist, 64);
                    ringLines.push({
                        coords: coords,
                        lineStyle: { color: '#949494', width: 0.8, type: 'dashed', opacity: 0.7 }
                    });

                    const latOffset = (dist / 6371) * (180 / Math.PI);
                    ringLabels.push({
                        name: `${dist}公里`,
                        value: [MACAU_COORDS[0], MACAU_COORDS[1] - latOffset, 1],
                        itemStyle: { opacity: 0 }
                    });
                });

                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    data: ringLines,
                    silent: true
                });

                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 3,
                    data: ringLabels,
                    label: { show: true, formatter: '{b}', color: '#cbd5e1', opacity: 0.8, fontSize: 9, fontFamily: 'sans-serif', position: 'bottom' },
                    silent: true
                });
            }

            const renderTyphoonTracks = (st) => {
                if (!st.pastCoordsOnly) return;

                if (showEnvelope && st.forecastPoints && st.forecastPoints.length > 1) {
                    const cones = makeSplitCone(st.forecastPoints);
                    if (cones.fullCone) {
                        addTurfPolygonSeries(cones.fullCone, seriesList, {
                            fill: 'rgba(56, 189, 248, 0.12)',
                            stroke: 'rgba(56, 189, 248, 0.45)',
                            lineWidth: 1.2,
                            lineDash: [3, 3]
                        });
                    }
                }

                if (showPast) {
                    seriesList.push({
                        type: 'lines',
                        coordinateSystem: 'geo',
                        z: 3,
                        polyline: true,
                        lineStyle: { color: '#ffffff', width: 1.8, opacity: 0.95 },
                        data: [{ coords: st.pastCoordsOnly }],
                        silent: true
                    });

                    const pastScatterData = st.past.map(pt => {
                        const intensity = getIntensity(pt.wind);
                        return {
                            name: `${st.name} 軌跡點`,
                            value: [...pt.coord, 1],
                            itemStyle: { color: intensity.color },
                            symbolSize: 7,
                            windVal: pt.wind,
                            stormName: st.name,
                            intensityObj: intensity
                        };
                    });

                    seriesList.push({
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        z: 4,
                        data: pastScatterData,
                        symbol: 'circle'
                    });
                }

                if (showForecast && st.forecast && st.forecast.length > 0) {
                    seriesList.push({
                        type: 'lines',
                        coordinateSystem: 'geo',
                        z: 3,
                        polyline: true,
                        effect: {
                            show: true,
                            period: 4,
                            trailLength: 0.2,
                            color: '#ffffff',
                            symbol: 'circle',
                            symbolSize: 4
                        },
                        lineStyle: { color: '#ffffff', width: 2.2, type: 'dashed', opacity: 0.9 },
                        data: [{ coords: st.forecast }],
                        silent: true
                    });
                }

                if (showNodes && st.nodes) {
                    const scatterData = st.nodes.map((node, idx) => {
                        const intensity = getIntensity(parseInt(node.wind));
                        const isEye = (idx === st.past.length - 1);

                        return {
                            name: `${st.name} - ${node.time}`,
                            value: [...node.coord, 1],
                            itemStyle: { color: intensity.color },
                            symbolSize: isEye ? 16 : 9,
                            isEye: isEye,
                            nodeInfo: node,
                            stormName: st.name,
                            intensityObj: intensity
                        };
                    });

                    seriesList.push({
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        z: 5,
                        data: scatterData.filter(d => !d.isEye),
                        symbol: 'circle'
                    });

                    const eyeData = scatterData.filter(d => d.isEye);
                    seriesList.push({
                        type: 'effectScatter',
                        coordinateSystem: 'geo',
                        z: 6,
                        data: eyeData,
                        symbolSize: 20,
                        rippleEffect: { brushType: 'stroke', scale: 4, period: 2 },
                        itemStyle: { color: '#ef4444', shadowBlur: 12, shadowColor: '#ef4444' }
                    });
                }
            };

            if (keys.length > 0) {
                if (currentStormKey === 'all') {
                    keys.forEach(k => renderTyphoonTracks(typhoons[k]));
                } else if (typhoons[currentStormKey]) {
                    renderTyphoonTracks(typhoons[currentStormKey]);
                }
            }

            if (showMacau) {
                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 7,
                    data: [{
                        name: '澳門',
                        value: [113.5685, 22.1595, 1],
                        itemStyle: { color: '#ffffff' },
                        symbolSize: 7
                    }],
                    label: {
                        show: true,
                        formatter: '{b}',
                        position: 'right',
                        color: '#ffffff',
                        fontSize: 11,
                        fontWeight: 'bold',
                        backgroundColor: 'rgba(11, 19, 34, 0.85)',
                        padding: [3, 6],
                        borderRadius: 4
                    }
                });
            }

            const bounds = getStormBounds(currentStormKey);

            let graphicItems = [];
            if (keys.length === 0) {
                graphicItems = [{
                    type: 'text',
                    left: 'center',
                    top: 'center',
                    style: {
                        text: '當前西北太平洋沒有熱帶氣旋活躍',
                        fill: '#94a3b8',
                        fontSize: 18,
                        fontWeight: 'bold',
                        fontFamily: 'sans-serif'
                    }
                }];
            }

            const option = {
                backgroundColor: '#08101a',
                graphic: graphicItems,
                geo: {
                    map: 'world50m',
                    roam: true,
                    ...(isStormSwitch ? { center: bounds.center, zoom: bounds.zoom } : {}),
                    aspectScale: 1.0,
                    label: { show: false },
                    itemStyle: { areaColor: '#132238', borderColor: '#4d729d', borderWidth: 0.8 },
                    emphasis: {
                        focus: 'self',
                        itemStyle: { areaColor: '#1c3354', borderColor: '#7ea9db', borderWidth: 1.2 },
                        label: { show: false }
                    },
                    select: { disabled: true }
                },
                tooltip: {
                    trigger: 'item',
                    backgroundColor: '#0b1322',
                    borderColor: '#334155',
                    textStyle: { color: '#f8fafc', fontSize: 12 },
                    formatter: function(params) {
                        if (params.componentType === 'geo') {
                            const countryName = params.name || '';
                            if (!countryName) return '';
                            return `<div style="font-weight:bold; color:#38bdf8; font-size:13px;"><i class="fa-solid fa-earth-asia"></i> ${countryName}</div>`;
                        }
                        const d = params.data;
                        if (!d) return params.name || '';
                        
                        if (d.name === '澳門') {
                            return `<div style="font-weight:bold; color:#ffffff;"><i class="fa-solid fa-location-dot text-cyan-400"></i> 澳門</div>
                                    <div style="font-size:11px; color:#cbd5e1; font-family:monospace;">經緯度: 22.1595°N, 113.5685°E</div>`;
                        }
                        
                        if (d.nodeInfo) {
                            return `<div style="font-weight:bold; color:#38bdf8; margin-bottom:4px;">${d.stormName || ''}</div>
                                    <div style="font-size:11px; color:#cbd5e1;">時間: <span style="color:#ffffff; font-weight:bold;">${d.nodeInfo.time}</span></div>
                                    <div style="font-size:11px; color:#cbd5e1;">風速: <span style="color:#fbbf24; font-weight:bold;">${d.nodeInfo.wind}</span></div>
                                    <div style="font-size:11px; color:#cbd5e1;">級別: <span style="color:${d.intensityObj.color}; font-weight:bold;">${d.intensityObj.code} - ${d.intensityObj.name}</span></div>`;
                        }
                        
                        if (d.windVal) {
                            return `<div style="font-weight:bold; color:#38bdf8; margin-bottom:4px;">${d.stormName || ''} (軌跡點)</div>
                                    <div style="font-size:11px; color:#cbd5e1;">風速: <span style="color:#fbbf24; font-weight:bold;">${d.windVal} km/h</span></div>
                                    <div style="font-size:11px; color:#cbd5e1;">級別: <span style="color:${d.intensityObj.color}; font-weight:bold;">${d.intensityObj.code} - ${d.intensityObj.name}</span></div>`;
                        }

                        return params.name || '';
                    }
                },
                series: seriesList
            };

            try {
                myChart.setOption(option, true);
            } catch (err) {
                console.error("ECharts setOption error:", err);
            }

            const stormStatsContent = document.getElementById('storm-stats-content');
            
            if (keys.length === 0) {
                document.getElementById('storm-name').innerText = "無活動系統";
                document.getElementById('storm-category').innerText = "正常";
                stormStatsContent.innerHTML = `<div class="text-center text-slate-400 py-3 text-xs">當前西北太平洋沒有熱帶氣旋活躍</div>`;
                return;
            }

            if (currentStormKey === 'all') {
                document.getElementById('storm-name').innerText = "活動颱風系統 (全部)";
                document.getElementById('storm-category').innerText = `共 ${keys.length} 個系統監控中`;
                
                let listHtml = '<div class="space-y-2 max-h-56 overflow-y-auto pr-1">';
                keys.forEach(key => {
                    const st = typhoons[key];
                    const tLon = st.pastCoordsOnly[st.pastCoordsOnly.length - 1][0];
                    const tLat = st.pastCoordsOnly[st.pastCoordsOnly.length - 1][1];
                    const dist = getDistanceAndDirectionToMacau(tLon, tLat);
                    listHtml += `
                        <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-2.5 text-xs space-y-1">
                            <div class="flex justify-between items-center font-bold text-white">
                                <span>${st.name}</span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30">${st.category}</span>
                            </div>
                            <div class="grid grid-cols-3 gap-1 text-[10px] text-slate-300 font-mono">
                                <div>風速: <span class="text-amber-400 font-bold">${st.wind}</span></div>
                                <div>座標: <span class="text-slate-200">${st.coords}</span></div>
                                <div>距澳: <span class="text-cyan-400 font-bold">${dist}</span></div>
                            </div>
                        </div>
                    `;
                });
                listHtml += '</div>';
                stormStatsContent.innerHTML = listHtml;
            } else {
                const storm = typhoons[currentStormKey];
                if (!storm) return;
                document.getElementById('storm-name').innerText = storm.name;
                document.getElementById('storm-category').innerText = storm.category;
                
                const tLon = storm.pastCoordsOnly[storm.pastCoordsOnly.length - 1][0];
                const tLat = storm.pastCoordsOnly[storm.pastCoordsOnly.length - 1][1];
                const dist = getDistanceAndDirectionToMacau(tLon, tLat);

                stormStatsContent.innerHTML = `
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                            <span class="text-slate-400 block text-[10px]">當前風速</span>
                            <span class="font-mono text-amber-400 font-bold text-sm">${storm.wind}</span>
                        </div>
                        <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                            <span class="text-slate-400 block text-[10px]">當前座標</span>
                            <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.coords}</span>
                        </div>
                        <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                            <span class="text-slate-400 block text-[10px]">預報路徑</span>
                            <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.movement}</span>
                        </div>
                        <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                            <span class="text-slate-400 block text-[10px]">距離澳門</span>
                            <span class="font-mono text-cyan-400 font-bold text-[11px]">${dist}</span>
                        </div>
                    </div>
                `;
            }
        }

        function switchStorm(key) {
            currentStormKey = key;
            renderChart(true);
        }

        function updateChartLayers() {
            renderChart(false);
        }

        function resetMapView() {
            const bounds = getStormBounds(currentStormKey);
            if (myChart) {
                myChart.setOption({
                    geo: {
                        center: bounds.center,
                        zoom: bounds.zoom
                    }
                }, false);
            }
        }

        window.onload = function() {
            initVectorMap();
        };
    </script>
</body>
</html>
