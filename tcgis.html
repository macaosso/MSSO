        // 72小時預報誤差半徑 (km) 對應級距
        const FORECAST_RADII_KM = [15, 100, 170, 255, 345, 465];

        function getIntensity(windKmh) {
            for (let item of TC_INTENSITY_TABLE) {
                if (windKmh <= item.max_wind) return item;
            }
            return TC_INTENSITY_TABLE[TC_INTENSITY_TABLE.length - 1];

            legendContainer.appendChild(div);
        });

        // Macau Reference Point
        const MACAU_COORDS = [113.5685, 22.1595];

        // Haversine Distance & Direction Calculator (Rounded to 10km)
        function getDistanceAndDirectionToMacau(tLon, tLat) {
            const R = 6371; // Earth radius in km
            const dLat = (tLat - MACAU_COORDS[1]) * Math.PI / 180;
            const dLon = (tLon - MACAU_COORDS[0]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(MACAU_COORDS[1] * Math.PI / 180) * Math.cos(tLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            let dist = R * c;
            dist = Math.round(dist / 10) * 10;

            const lat1Rad = MACAU_COORDS[1] * Math.PI / 180;
            const lat2Rad = tLat * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;

            const directions = [
                "正北", "北北東", "東北", "東北偏東",
                "正東", "東南偏東", "東南", "南南東",
                "正南", "南南西", "西南", "西南偏西",
                "正西", "西北偏西", "西北", "北北西"
            ];
            const index = Math.round((brng % 360) / 22.5) % 16;
            return `${directions[index]} ${dist}公里`;
        }

        // Helper to generate circle coordinates for Macau distance rings
        function generateCircleCoords(centerLon, centerLat, radiusKm, numPoints = 64) {
            const coords = [];
            const R = 6371;
            for (let i = 0; i <= numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                const dLat = (radiusKm / R) * (180 / Math.PI);
                const dLon = (radiusKm / R) * (180 / Math.PI) / Math.cos(centerLat * Math.PI / 180);
                const lon = centerLon + dLon * Math.cos(angle);
                const lat = centerLat + dLat * Math.sin(angle);
                coords.push([lon, lat]);
            }
            return coords;
        }

        // Helper to generate Error Envelope Polygon along forecast track
        function generateErrorEnvelopePolygon(forecastCoords, radii) {
            if (!forecastCoords || forecastCoords.length === 0) return [];
            const leftSide = [];
            const rightSide = [];
            const R_earth = 6371;

            for (let i = 0; i < forecastCoords.length; i++) {
                const [lon, lat] = forecastCoords[i];
                const r = radii[i] || radii[radii.length - 1];
                
                let angle = 0;
                if (i < forecastCoords.length - 1) {
                    const [nextLon, nextLat] = forecastCoords[i+1];
                    angle = Math.atan2(nextLat - lat, nextLon - lon);
                } else if (i > 0) {
                    const [prevLon, prevLat] = forecastCoords[i-1];
                    angle = Math.atan2(lat - prevLat, lon - prevLon);
                }
                
                const perpAngle = angle + Math.PI / 2;
                const dLat = (r / R_earth) * (180 / Math.PI);
                const dLon = (r / R_earth) * (180 / Math.PI) / Math.cos(lat * Math.PI / 180);
                
                const leftLon = lon + dLon * Math.cos(perpAngle);
                const leftLat = lat + dLat * Math.sin(perpAngle);
                const rightLon = lon - dLon * Math.cos(perpAngle);
                const rightLat = lat - dLat * Math.sin(perpAngle);
                
                leftSide.push([leftLon, leftLat]);
                rightSide.unshift([rightLon, rightLat]);
            }
            
            const startPoint = forecastCoords[0];
            const startCircle = generateCircleCoords(startPoint[0], startPoint[1], radii[0] || 15, 16);
            const endPoint = forecastCoords[forecastCoords.length - 1];
            const endCircle = generateCircleCoords(endPoint[0], endPoint[1], radii[forecastCoords.length - 1] || 465, 16);
            
            return [...leftSide, ...endCircle, ...rightSide, ...startCircle];
        }

                    { coord: [130.0, 17.5], time: "5月27日 00:00 (預報)", wind: "195 km/h", type: "SuTY" },
                    { coord: [127.5, 19.2], time: "5月27日 12:00 (預報)", wind: "170 km/h", type: "STY" },
                    { coord: [125.0, 21.0], time: "5月28日 00:00 (預報)", wind: "140 km/h", type: "TY" }
                ]
            },
            prapiroon: {
                name: "PRAPIROON (2026-05)",
                category: "熱帶風暴 (TS)",
                wind: "75 km/h",
                movement: "西北 @ 25 km/h",
                coords: "10.2°N, 138.5°E",
                past: [
                    { coord: [142.0, 8.0], wind: 35 },
                    { coord: [140.2, 9.1], wind: 55 },
                    { coord: [138.5, 10.2], wind: 75 }
                ],
                pastCoordsOnly: [
                    [142.0, 8.0], [140.2, 9.1], [138.5, 10.2]
                ],
                forecast: [
                    [138.5, 10.2], [136.0, 11.8], [133.5, 13.5]
                ],
                nodes: [
                    { coord: [142.0, 8.0], time: "5月26日 00:00", wind: "35 km/h", type: "LPA" },
                    { coord: [140.2, 9.1], time: "5月26日 06:00", wind: "55 km/h", type: "TD" },
                    { coord: [138.5, 10.2], time: "5月26日 12:00", wind: "75 km/h (中心)", type: "TS" },
                    { coord: [136.0, 11.8], time: "5月27日 00:00 (預報)", wind: "90 km/h", type: "STS" },
                    { coord: [133.5, 13.5], time: "5月27日 12:00 (預報)", wind: "105 km/h", type: "STS" }
                ]
            }
        };

        // 預設為全部系統
        let currentStormKey = 'all';
        let myChart = null;
        let mapLoaded = false;

        // 計算特定颱風包含過往與預報軌跡的最適邊界與最大縮放
        function getStormBounds(stKey) {
            if (stKey === 'all') {
                return { center: [135, 25], zoom: 1.2 };
            }
            const st = typhoons[stKey];
            let allCoords = [];
            if (st.pastCoordsOnly) allCoords = allCoords.concat(st.pastCoordsOnly);
            if (st.forecast) allCoords = allCoords.concat(st.forecast);
            if (allCoords.length === 0) return { center: [135, 25], zoom: 2.5 };

            let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
            allCoords.forEach(c => {
                if (c[0] < minLon) minLon = c[0];
                if (c[0] > maxLon) maxLon = c[0];
                if (c[1] < minLat) minLat = c[1];
                if (c[1] > maxLat) maxLat = c[1];
            });
            const center = [(minLon + maxLon) / 2, (minLat + maxLat) / 2];
            const lonSpan = maxLon - minLon;
            const latSpan = maxLat - minLat;
            const maxSpan = Math.max(lonSpan, latSpan, 1.5);
            // 螢幕最大化容納過往與預報軌跡
            let zoom = Math.min(6.0, Math.max(2.2, 360 / (maxSpan * 11)));
            return { center, zoom };
        }

        const tcCountryMap = {
            "China": "中國", "Taiwan": "台灣", "Japan": "日本", "Philippines": "菲律賓",
            "Vietnam": "越南", "South Korea": "韓國", "North Korea": "朝鮮", "Russia": "俄羅斯",
            "India": "印度", "Thailand": "泰國", "Malaysia": "馬來西亞", "Indonesia": "印尼",
            "Cambodia": "柬埔寨", "Laos": "寮國", "Myanmar": "緬甸", "Singapore": "新加坡",
            "Brunei": "汶萊", "Australia": "澳洲", "New Zealand": "紐西蘭"
        };

        async function initVectorMap() {
            const chartDom = document.getElementById('echarts-map');
            myChart = echarts.init(chartDom);

            myChart.showLoading({
                text: '載入 GIS 向量圖資 (50m 高解析度)...',
                color: '#3b82f6',
                textColor: '#cbd5e1',
                maskColor: 'rgba(8, 16, 26, 0.9)',
                zlevel: 0
            });

            try {
                const response = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson');
                const worldJson = await response.json();
                
                if (worldJson && worldJson.features) {
                    worldJson.features.forEach(feat => {
                        if (feat.properties) {
                            const engName = feat.properties.ADMIN || feat.properties.name || feat.properties.NAME || '';
                            feat.properties.name = tcCountryMap[engName] || engName;
                        }
                    });
                }

                echarts.registerMap('world50m', worldJson);
                mapLoaded = true;
                myChart.hideLoading();
                renderChart(true); // 初始化時採用預設視圖
            } catch (e) {
                console.error('Failed to load Natural Earth GeoJSON, attempting fallback...', e);
                try {
                    const fallbackResp = await fetch('https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/world.json');
                    const fallbackJson = await fallbackResp.json();
                    echarts.registerMap('world50m', fallbackJson);
                    mapLoaded = true;
                    myChart.hideLoading();
                    renderChart(true);
                } catch (err2) {
                    console.error('All map sources failed', err2);
                    echarts.registerMap('world50m', { type: 'FeatureCollection', features: [] });
                    mapLoaded = true;
                    myChart.hideLoading();
                    renderChart(true);
                }
            }

            window.addEventListener('resize', () => {
                myChart.resize();
            });
        }

        function renderChart(isStormSwitch = false) {
            if (!myChart) return;
            
            const storm = typhoons[currentStormKey];
            const showPast = document.getElementById('layer-past').checked;
            const showForecast = document.getElementById('layer-forecast').checked;
            const showEnvelope = document.getElementById('layer-envelope').checked;
            const showNodes = document.getElementById('layer-nodes').checked;
            const showRings = document.getElementById('layer-rings').checked;
            const showMacau = document.getElementById('layer-macau').checked;
            const showGrid = document.getElementById('layer-grid').checked;

            const seriesList = [];

            // 1. Gridlines (1° minor dashed and 5° major gridlines spanning 90°E-180°E, 0°N-50°N)
            if (showGrid) {
                const minorLines = [];
                for (let lon = 90; lon <= 180; lon += 1) {
                    minorLines.push({ coords: [[lon, 0], [lon, 50]] });
                }
                for (let lat = 0; lat <= 50; lat += 1) {
                    minorLines.push({ coords: [[90, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 1,
                    polyline: true,
                    lineStyle: { color: 'rgba(255, 255, 255, 0.08)', width: 0.15, type: 'dashed' },
                    data: minorLines,
                    silent: true
                });

                const majorLines = [];
                for (let lon = 90; lon <= 180; lon += 5) {
                    majorLines.push({ coords: [[lon, 0], [lon, 50]] });
                }
                for (let lat = 0; lat <= 50; lat += 5) {
                    majorLines.push({ coords: [[90, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    lineStyle: { color: 'rgba(255, 255, 255, 0.22)', width: 0.6, type: 'dashed' },
                    data: majorLines,
                    silent: true
                });

                const gridLabels = [];
                for (let lon = 90; lon <= 180; lon += 10) {
                    gridLabels.push({ name: `${lon}°E`, value: [lon, 1, 1], itemStyle: { opacity: 0 } });
                }
                for (let lat = 0; lat <= 50; lat += 10) {
                    if (lat === 0) continue;
                    gridLabels.push({ name: `${lat}°N`, value: [91, lat, 1], itemStyle: { opacity: 0 } });
                }
                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 3,
                    data: gridLabels,
                    label: { show: true, formatter: '{b}', color: 'rgba(255, 255, 255, 0.5)', fontSize: 9, fontFamily: 'monospace' },
                    silent: true
                });
            }

            // 2. Macau Distance Rings (100 km, 200 km, 400 km, 800 km)
            if (showRings) {
                const ringDistances = [100, 200, 400, 800];
                const ringLines = [];
                const ringLabels = [];

                ringDistances.forEach(dist => {
                    const coords = generateCircleCoords(MACAU_COORDS[0], MACAU_COORDS[1], dist, 64);
                    ringLines.push({
                        coords: coords,
                        lineStyle: { color: '#949494', width: 0.8, type: 'dashed', opacity: 0.7 }
                    });

                    const latOffset = (dist / 6371) * (180 / Math.PI);
                    ringLabels.push({
                        name: `${dist}公里`,
                        value: [MACAU_COORDS[0], MACAU_COORDS[1] - latOffset, 1],
                        itemStyle: { opacity: 0 }
                    });
                });

                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    data: ringLines,
                    silent: true
                });

                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 3,
                    data: ringLabels,
                    label: { show: true, formatter: '{b}', color: '#cbd5e1', opacity: 0.8, fontSize: 9, fontFamily: 'sans-serif', position: 'bottom' },
                    silent: true
                });
            }

            // Helper to render typhoon tracks & error envelopes
            const renderTyphoonTracks = (st) => {
                if (!st.pastCoordsOnly) return;

                // Error Envelope (Cone of Uncertainty) using FORECAST_RADII_KM
                if (showEnvelope && st.forecast) {
                    const envelopeCoords = generateErrorEnvelopePolygon(st.forecast, FORECAST_RADII_KM);
                    if (envelopeCoords.length > 0) {
                        seriesList.push({
                            type: 'custom',
                            coordinateSystem: 'geo',
                            z: 2.5,
                            data: [[0]], // Pass a dummy data row so renderItem executes once
                            renderItem: function(params, api) {
                                // Map the pre-calculated envelope coordinates to pixel space
                                const points = envelopeCoords.map(coord => api.coord(coord));
                                if (!points || points.some(p => !p || isNaN(p[0]) || isNaN(p[1]))) return;
                                
                                return {
                                    type: 'polygon',
                                    shape: { points: points },
                                    style: {
                                        fill: 'rgba(59, 130, 246, 0.15)',
                                        stroke: 'rgba(59, 130, 246, 0.45)',
                                        lineWidth: 1.2,
                                        lineDash: [4, 4]
                                    }
                                };
                            },
                            silent: true
                        });
                    }
                }

                // Past Track Line (White)
                if (showPast) {
                    seriesList.push({
                        type: 'lines',
                        coordinateSystem: 'geo',
                        z: 3,
                        polyline: true,
                        lineStyle: { color: '#ffffff', width: 1.8, opacity: 0.95 },
                        data: [{ coords: st.pastCoordsOnly }],
                        silent: true
                    });

                    const pastScatterData = st.past.map(pt => {
                        const intensity = getIntensity(pt.wind);
                        return {
                            name: `${st.name} 過往位置 - ${pt.wind} km/h`,
                            value: [...pt.coord, 1],
                            itemStyle: { color: intensity.color },
                            symbolSize: 7,
                            windVal: pt.wind,
                            intensityObj: intensity
                        };
                    });

                    seriesList.push({
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        z: 4,
                        data: pastScatterData,
                        symbol: 'circle',
                        tooltip: {
                            formatter: function(params) {
                                if (!params.data || !params.data.intensityObj) return '';
                                return `<div style="font-weight:bold; color:#f8fafc; margin-bottom:4px;">${st.name}</div>
                                        <div style="font-size:11px; color:#cbd5e1;">強度等級: <span style="color:${params.data.itemStyle.color}; font-weight:bold;">${params.data.intensityObj.code} (${params.data.intensityObj.name})</span></div>
                                        <div style="font-size:11px; color:#cbd5e1;">持續風速: <span style="color:#f59e0b; font-family:monospace;">${params.data.windVal} km/h</span></div>`;
                            }
                        }
                    });
                }

                // Forecast Track Line (White, Dashed)
                if (showForecast && st.forecast) {
                    seriesList.push({
                        type: 'lines',
                        coordinateSystem: 'geo',
                        z: 3,
                        polyline: true,
                        effect: {
                            show: true,
                            period: 4,
                            trailLength: 0.2,
                            color: '#ffffff',
                            symbol: 'circle',
                            symbolSize: 4
                        },
                        lineStyle: { color: '#ffffff', width: 2.2, type: 'dashed', opacity: 0.9 },
                        data: [{ coords: st.forecast }],
                        silent: true
                    });
                }

                // Typhoon Nodes & Eye Pulsing Beacons
                if (showNodes && st.nodes) {
                    const scatterData = st.nodes.map((node, idx) => {
                        const intensity = getIntensity(parseInt(node.wind));
                        const isEye = (idx === st.past.length - 1);

                        return {
                            name: `${st.name} - ${node.time}`,
                            value: [...node.coord, 1],
                            itemStyle: { color: intensity.color },
                            symbolSize: isEye ? 16 : 9,
                            isEye: isEye,
                            nodeInfo: node,
                            intensityObj: intensity
                        };
                    });

                    seriesList.push({
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        z: 5,
                        data: scatterData.filter(d => !d.isEye),
                        symbol: 'circle',
                        tooltip: {
                            formatter: function(params) {
                                if (!params.data || !params.data.nodeInfo) return '';
                                return `<div style="font-weight:bold; color:#f8fafc; margin-bottom:4px;">${params.data.name}</div>
                                        <div style="font-size:11px; color:#cbd5e1;">強度: <span style="color:${params.data.itemStyle.color}; font-weight:bold;">${params.data.intensityObj.code} (${params.data.intensityObj.name})</span></div>
                                        <div style="font-size:11px; color:#cbd5e1;">風速: <span style="color:#f59e0b; font-family:monospace;">${params.data.nodeInfo.wind}</span></div>`;
                            }
                        }
                    });

                    const eyeData = scatterData.filter(d => d.isEye);
                    seriesList.push({
                        type: 'effectScatter',
                        coordinateSystem: 'geo',
                        z: 6,
                        data: eyeData,
                        symbolSize: 20,
                        rippleEffect: { brushType: 'stroke', scale: 4, period: 2 },
                        itemStyle: { color: '#ef4444', shadowBlur: 12, shadowColor: '#ef4444' },
                        tooltip: {
                            formatter: function(params) {
                                if (!params.data || !params.data.nodeInfo) return '';
                                return `<div style="font-weight:bold; color:#ef4444; margin-bottom:4px;"><i class="fa-solid fa-hurricane"></i> ${params.data.name} (中心)</div>
                                        <div style="font-size:11px; color:#cbd5e1;">強度: <span style="color:${params.data.itemStyle.color}; font-weight:bold;">${params.data.intensityObj.code} (${params.data.intensityObj.name})</span></div>
                                        <div style="font-size:11px; color:#cbd5e1;">風速: <span style="color:#f59e0b; font-family:monospace;">${params.data.nodeInfo.wind}</span></div>`;
                            }
                        }
                    });
                }
            };

            if (currentStormKey === 'all') {
                renderTyphoonTracks(typhoons.maliksi);
                renderTyphoonTracks(typhoons.gaemi);
                renderTyphoonTracks(typhoons.prapiroon);
            } else {
                renderTyphoonTracks(storm);
            }

            // Macau Reference Point Marker
            if (showMacau) {
                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 7,
                    data: [{
                        name: '澳門',
                        value: [113.5685, 22.1595, 1],
                        itemStyle: { color: '#ffffff' },
                        symbolSize: 7
                    }],
                    label: {
                        show: true,
                        formatter: '{b}',
                        position: 'right',
                        color: '#ffffff',
                        fontSize: 11,
                        fontWeight: 'bold',
                        backgroundColor: 'rgba(11, 19, 34, 0.85)',
                        padding: [3, 6],
                        borderRadius: 4
                    },
                    tooltip: {
                        formatter: function(params) {
                            return `<div style="font-weight:bold; color:#ffffff;"><i class="fa-solid fa-location-dot text-cyan-400"></i> 澳門</div>
                                    <div style="font-size:11px; color:#cbd5e1; font-family:monospace;">經緯度: 22.1595°N, 113.5685°E</div>`;
                        }
                    }
                });
            }

            const bounds = getStormBounds(currentStormKey);

            const option = {
                backgroundColor: '#08101a',
                geo: {
                    map: 'world50m',
                    roam: true,
                    // 僅在明確切換颱風或重置視圖時更新 center/zoom，切換圖層時保持使用者當前互動縮放
                    ...(isStormSwitch ? { center: bounds.center, zoom: bounds.zoom } : {}),
                    aspectScale: 1.0,
                    label: { show: false },
                    itemStyle: { areaColor: '#132238', borderColor: '#4d729d', borderWidth: 0.8 },
                    emphasis: {
                        focus: 'self',
                        itemStyle: { areaColor: '#1c3354', borderColor: '#7ea9db', borderWidth: 1.2 },
                        label: { show: false }
                    },
                    select: { disabled: true }
                },
                tooltip: {
                    trigger: 'item',
                    backgroundColor: '#0b1322',
                    borderColor: '#334155',
                    textStyle: { color: '#f8fafc', fontSize: 12 },
                    formatter: function(params) {
                        if (params.componentType === 'geo') {
                            const countryName = params.name || '';
                            if (!countryName) return '';
                            return `<div style="font-weight:bold; color:#38bdf8; font-size:13px;"><i class="fa-solid fa-earth-asia"></i> ${countryName}</div>`;
                        }
                        if (params.seriesType === 'scatter' || params.seriesType === 'effectScatter') {
                            if (params.data && params.data.tooltip && typeof params.data.tooltip.formatter === 'function') {
                                return params.data.tooltip.formatter(params);
                            }
                            if (params.tooltip && typeof params.tooltip.formatter === 'function') {
                                return params.tooltip.formatter(params);
                            }
                        }
                        return params.name || '';
                    }
                },
                series: seriesList
            };

            try {
                myChart.setOption(option, false); // false 確保不重置未更新的設定與當前 roam 狀態
            } catch (err) {
                console.error("ECharts setOption error:", err);
            }

            // Update Sidebar Stats Card
            document.getElementById('storm-name').innerText = storm.name;
            document.getElementById('storm-category').innerText = storm.category;
            document.getElementById('stat-wind').innerText = storm.wind;
            document.getElementById('stat-coords').innerText = storm.coords;
            document.getElementById('stat-movement').innerText = storm.movement;

            if (currentStormKey === 'all') {
                document.getElementById('stat-distance').innerText = "多系統區域預覽";
            } else {
                const tLon = storm.pastCoordsOnly[storm.pastCoordsOnly.length - 1][0];
                const tLat = storm.pastCoordsOnly[storm.pastCoordsOnly.length - 1][1];
                document.getElementById('stat-distance').innerText = getDistanceAndDirectionToMacau(tLon, tLat);
            }
        }

        function switchStorm(key) {
            currentStormKey = key;
            renderChart(true); // 切換颱風時觸發自適應最大化縮放
        }

        function updateChartLayers() {
            renderChart(false); // 切換圖層時保持當前縮放等級不變
        }

        function resetMapView() {
            const bounds = getStormBounds(currentStormKey);
            if (myChart) {
                myChart.setOption({
                    geo: {
                        center: bounds.center,
                        zoom: bounds.zoom
                    }
                });
            }
        }

        window.onload = function() {
            initVectorMap();
        };
    </script>
</body>
</html>
