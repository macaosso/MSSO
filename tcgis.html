<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMCA GIS 颱風監控系統 - 簡化 CSV 引擎 v7.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- Turf.js Spatial Analysis Library for Cone Envelopes -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <style>
        body {
            background-color: #08101a;
            color: #cbd5e1;
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #08101a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.9; }
            50% { transform: scale(1.6); opacity: 0.1; }
            100% { transform: scale(0.9); opacity: 0.9; }
        }
        .pulse-beacon {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden">

    <header class="bg-[#0b1322] border-b border-slate-800/80 h-16 flex items-center justify-between px-4 sm:px-6 z-35 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600/20 border border-blue-500/40 p-2 rounded-lg text-blue-400">
                <i class="fa-solid fa-hurricane text-xl animate-spin" style="animation-duration: 8s; animation-direction: reverse;"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-bold tracking-wider text-white flex items-center gap-2">
                    SMCA GIS <span class="text-xs px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">簡化 CSV 引擎 v7.4</span>
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">氣象監視、精準節點插值平滑與高密度誤差圈系統</p>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <div class="hidden md:flex items-center space-x-2 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-lg text-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-slate-300 font-medium">系統時間: <span id="utc-clock" class="font-mono text-cyan-400">00:00 MST</span></span>
            </div>
            <button onclick="toggleMobileSidebar()" class="md:hidden bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-sm border border-slate-700 transition">
                <i class="fa-solid fa-bars mr-1"></i> 控制面板
            </button>
            <button onclick="resetMapView()" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow-md transition flex items-center gap-1.5">
                <i class="fa-solid fa-compass"></i> 置中視圖
            </button>
        </div>
    </header>

    <div class="flex-1 flex relative overflow-hidden">
        
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 z-30 w-80 bg-[#0b1322]/95 md:bg-[#0b1322] backdrop-blur-md border-r border-slate-800 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0 shadow-2xl shrink-0">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-blue-500"></i> GIS 系統控制
                </h2>
                <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Storm Selector -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold uppercase text-slate-400 tracking-wider">活動颱風系統 (自動偵測)</label>
                    <select id="storm-select" onchange="switchStorm(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500 transition">
                        <option value="all" selected>載入中...</option>
                    </select>
                </div>

                <!-- Storm Stats Card -->
                <div class="bg-slate-900/70 border border-slate-800/80 rounded-xl p-3 space-y-3 shadow-inner">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span id="storm-name" class="font-bold text-white text-sm">檢查中...</span>
                        <span id="storm-category" class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30">狀態</span>
                    </div>
                    <div id="storm-stats-content">
                        <!-- 動態填充統計或清單 -->
                    </div>
                </div>
            </div>

            <div class="p-3 border-t border-slate-800 text-center text-[11px] text-slate-500">
                SMCA GIS 向量引擎 • 嚴格穿過節點平滑運算
            </div>
        </aside>

        <!-- 主地圖畫布區 -->
        <main class="flex-1 relative h-full bg-[#08101a] min-h-0 min-w-0 flex flex-col">
            <div id="echarts-map" class="w-full h-full flex-1"></div>

            <!-- 強度分級圖例 -->
            <div class="absolute bottom-6 right-6 z-20 bg-[#0b1322]/90 backdrop-blur-md border border-slate-800 p-3.5 rounded-xl shadow-xl text-xs space-y-2 pointer-events-none hidden sm:block max-w-xs">
                <div class="font-bold text-slate-200 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-palette text-blue-400"></i> 強度分級 (自動風速對應)
                </div>
                <div id="intensity-legend" class="grid grid-cols-1 gap-1.5 text-[11px]"></div>
            </div>
        </main>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const gmt8 = new Date(utc + (3600000 * 8));
            const hours = String(gmt8.getHours()).padStart(2, '0');
            const minutes = String(gmt8.getMinutes()).padStart(2, '0');
            document.getElementById('utc-clock').innerText = `${hours}:${minutes} MST`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        const TC_INTENSITY_TABLE = [
            {"code": "LPA",  "name": "低壓區",           "engName": "Low Pressure Area",      "max_wind": 40,   "rangeText": "≤ 40 km/h",    "color": "#DDDFE2"},
            {"code": "TD",   "name": "熱帶低氣壓",       "engName": "Tropical Depression",    "max_wind": 62,   "rangeText": "41 - 62 km/h", "color": "#6DD8FA"},
            {"code": "TS",   "name": "熱帶風暴",         "engName": "Tropical Storm",         "max_wind": 87,   "rangeText": "63 - 87 km/h", "color": "#9DD79C"},
            {"code": "STS",  "name": "強烈熱帶風暴",     "engName": "Severe Tropical Storm",  "max_wind": 117,  "rangeText": "88 - 117 km/h","color": "#FFD363"},
            {"code": "TY",   "name": "颱風",             "engName": "Typhoon",                "max_wind": 149,  "rangeText": "118 - 149 km/h","color": "#F78A31"},
            {"code": "STY",  "name": "強颱風",           "engName": "Severe Typhoon",         "max_wind": 184,  "rangeText": "150 - 184 km/h","color": "#FF6F6F"},
            {"code": "SuTY", "name": "超強颱風",         "engName": "Super Typhoon",          "max_wind": 9999, "rangeText": "≥ 185 km/h",   "color": "#DE82FF"}
        ];

        function getIntensity(windKmh) {
            for (let item of TC_INTENSITY_TABLE) {
                if (windKmh <= item.max_wind) return item;
            }
            return TC_INTENSITY_TABLE[TC_INTENSITY_TABLE.length - 1];
        }

        const legendContainer = document.getElementById('intensity-legend');
        TC_INTENSITY_TABLE.forEach(item => {
            const div = document.createElement('div');
            div.className = "flex items-center justify-between space-x-3";
            div.innerHTML = `
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full inline-block shadow shrink-0" style="background-color: ${item.color};"></span>
                    <span class="text-slate-300 font-medium">${item.code} - ${item.name}</span>
                </div>
                <span class="text-slate-400 font-mono text-[10px] shrink-0">${item.rangeText}</span>
            `;
            legendContainer.appendChild(div);
        });

        const MACAU_COORDS = [113.5685, 22.1595];

        function getBearingDirection(lon1, lat1, lon2, lat2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const lat2Rad = lat2 * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;

            const directions = [
                "正北", "北北東", "東北", "東北偏東",
                "正東", "東南偏東", "東南", "南南東",
                "正南", "南南西", "西南", "西南偏西",
                "正西", "西北偏西", "西北", "北北西"
            ];
            const index = Math.round((brng % 360) / 22.5) % 16;
            return directions[index];
        }

        function getDistanceAndDirectionToMacau(tLon, tLat) {
            const R = 6371;
            const dLat = (tLat - MACAU_COORDS[1]) * Math.PI / 180;
            const dLon = (tLon - MACAU_COORDS[0]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(MACAU_COORDS[1] * Math.PI / 180) * Math.cos(tLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            let dist = R * c;
            dist = Math.round(dist / 10) * 10;
            const direction = getBearingDirection(MACAU_COORDS[0], MACAU_COORDS[1], tLon, tLat);
            return `${direction} ${dist}公里`;
        }

        // ================= 動態計算 0H 至 24H 曲線路徑移動方向與速度 =================
        function calculateDynamicMovement(forecastPoints, forecastCoords) {
            if (!forecastPoints || forecastPoints.length < 2) return "西北 @ 22 km/h";

            const p0 = forecastPoints.find(p => p.hour === 0) || forecastPoints[0];
            const p24 = forecastPoints.find(p => p.hour === 24) || forecastPoints[1];

            if (!p0 || !p24) return "西北 @ 22 km/h";

            // 使用平滑曲線計算軌跡
            const smoothCoords = smoothLineCatmullRom(forecastCoords, 30);
            let foundStart = false;
            let subCoords = [];

            for (let coord of smoothCoords) {
                if (!foundStart) {
                    if (Math.abs(coord[0] - p0.lon) < 0.02 && Math.abs(coord[1] - p0.lat) < 0.02) {
                        foundStart = true;
                        subCoords.push(coord);
                    }
                } else {
                    subCoords.push(coord);
                    if (Math.abs(coord[0] - p24.lon) < 0.02 && Math.abs(coord[1] - p24.lat) < 0.02) {
                        break;
                    }
                }
            }

            let dist = 0;
            if (subCoords.length < 2) {
                dist = turf.distance(turf.point([p0.lon, p0.lat]), turf.point([p24.lon, p24.lat]), { units: 'kilometers' });
            } else {
                for (let i = 1; i < subCoords.length; i++) {
                    dist += turf.distance(turf.point(subCoords[i-1]), turf.point(subCoords[i]), { units: 'kilometers' });
                }
            }

            const speed = Math.round(dist / 24);
            const direction = getBearingDirection(p0.lon, p0.lat, p24.lon, p24.lat);
            return `${direction} @ ${speed} km/h`;
        }

        function generateCircleCoords(centerLon, centerLat, radiusKm, numPoints = 64) {
            const coords = [];
            const R = 6371;
            for (let i = 0; i <= numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                const dLat = (radiusKm / R) * (180 / Math.PI);
                const dLon = (radiusKm / R) * (180 / Math.PI) / Math.cos(centerLat * Math.PI / 180);
                const lon = centerLon + dLon * Math.cos(angle);
                const lat = centerLat + dLat * Math.sin(angle);
                coords.push([lon, lat]);
            }
            return coords;
        }

        function smoothLineCatmullRom(coords, samplesPerSegment = 20) {
            if (!coords || coords.length < 2) return coords;
            let pts = [coords[0], ...coords, coords[coords.length - 1]];
            let smooth = [];

            for (let i = 1; i < pts.length - 2; i++) {
                let p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2];
                for (let t = 0; t < samplesPerSegment; t++) {
                    let st = t / samplesPerSegment, t2 = st * st, t3 = t2 * st;
                    let x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * st + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
                    let y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * st + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
                    smooth.push([x, y]);
                }
            }
            smooth.push(coords[coords.length - 1]);
            return smooth;
        }

        const ERROR_HOURS = [0, 24, 48, 72, 96, 120];
        const ERROR_RADII_KM = [15, 100, 170, 255, 345, 465];

        function getRadiusForHour(hour) {
            if (hour <= ERROR_HOURS[0]) return ERROR_RADII_KM[0];
            if (hour >= ERROR_HOURS[ERROR_HOURS.length - 1]) return ERROR_RADII_KM[ERROR_RADII_KM.length - 1];
            for (let i = 0; i < ERROR_HOURS.length - 1; i++) {
                if (hour >= ERROR_HOURS[i] && hour <= ERROR_HOURS[i + 1]) {
                    const h1 = ERROR_HOURS[i], h2 = ERROR_HOURS[i + 1];
                    const r1 = ERROR_RADII_KM[i], r2 = ERROR_RADII_KM[i + 1];
                    return r1 + ((hour - h1) / (h2 - h1)) * (r2 - r1);
                }
            }
            return ERROR_RADII_KM[ERROR_RADII_KM.length - 1];
        }

        function safeUnion(p1, p2) {
            if (!p1) return p2;
            if (!p2) return p1;
            try { return turf.union(turf.featureCollection([p1, p2])); } catch (e) {
                try { return turf.union(p1, p2); } catch (err) { return p1; }
            }
        }

        function makeSplitCone(points, forecastCoords) {
            if (!forecastCoords || forecastCoords.length < 2) return { fullCone: null };
            const smoothCoords = smoothLineCatmullRom(forecastCoords, 30);
            let origDistances = [0];
            for (let i = 1; i < points.length; i++) {
                const d = turf.distance(turf.point([points[i-1].lon, points[i-1].lat]), turf.point([points[i].lon, points[i].lat]), {units: 'kilometers'});
                origDistances.push(origDistances[i-1] + d);
            }
            const totalOrigDist = origDistances[origDistances.length - 1] || 1;
            let smoothDistances = [0];
            for (let i = 1; i < smoothCoords.length; i++) {
                const d = turf.distance(turf.point(smoothCoords[i-1]), turf.point(smoothCoords[i]), {units: 'kilometers'});
                smoothDistances.push(smoothDistances[i-1] + d);
            }
            const totalSmoothDist = smoothDistances[smoothDistances.length - 1] || 1;

            let circlesFull = [];
            for (let i = 0; i < smoothCoords.length; i++) {
                const coord = smoothCoords[i];
                const fraction = totalSmoothDist === 0 ? 0 : smoothDistances[i] / totalSmoothDist;
                const correspondingOrigDist = fraction * totalOrigDist;
                let hour = 0;
                for (let j = 0; j < points.length - 1; j++) {
                    if (correspondingOrigDist >= origDistances[j] && correspondingOrigDist <= origDistances[j+1]) {
                        const segDist = origDistances[j+1] - origDistances[j];
                        const segFactor = segDist === 0 ? 0 : (correspondingOrigDist - origDistances[j]) / segDist;
                        hour = points[j].hour + segFactor * (points[j+1].hour - points[j].hour);
                        break;
                    }
                }
                const radius = getRadiusForHour(hour);
                if (radius > 0) circlesFull.push(turf.buffer(turf.point(coord), radius, { units: "kilometers", steps: 64 }));
            }
            if (circlesFull.length === 0) return { fullCone: null };
            let fullCone = circlesFull[0];
            for (let i = 1; i < circlesFull.length; i++) fullCone = safeUnion(fullCone, circlesFull[i]);
            return { fullCone };
        }

        let typhoons = {};
        let currentStormKey = 'all';
        let myChart = null;

        function parseCSVToTyphoon(csvText, letter) {
            const lines = csvText.split('\n');
            let currentMeta = null;
            let rows = [];

            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#') || line.toLowerCase().startsWith('category')) continue;
                const cols = line.split(',').map(c => c.trim());
                if (cols.length < 6) continue;

                const category = cols[0].toLowerCase();
                const time = cols[1];
                const rowName = cols[2];
                const lat = parseFloat(cols[3]);
                const lon = parseFloat(cols[4]);
                const windVal = parseFloat(cols[5]) || 0;

                if (isNaN(lat) || isNaN(lon)) continue;
                if (category === 'current') {
                    currentMeta = { name: rowName || `Typhoon ${letter.toUpperCase()}`, time, lat, lon, wind: windVal };
                }
                rows.push({ category, time, name: rowName, lat, lon, wind: windVal });
            }

            if (rows.length === 0) return null;
            if (!currentMeta) {
                const last = rows[rows.length - 1];
                currentMeta = { name: last.name || `Typhoon ${letter.toUpperCase()}`, time: last.time, lat: last.lat, lon: last.lon, wind: last.wind };
            }

            const name = currentMeta.name;
            const intensityObj = getIntensity(currentMeta.wind);
            const categoryDesc = `${intensityObj.name} (${intensityObj.code})`;

            let past = [], pastCoordsOnly = [], forecastCoords = [], forecastPoints = [], nodes = [], pastNodes = [], forecastNodes = [];

            rows.forEach(r => {
                const intensity = getIntensity(r.wind);
                const nodeInfo = {
                    time: r.time,
                    categoryCode: intensity.code,
                    categoryName: intensity.name,
                    color: intensity.color,
                    wind: `${r.wind} km/h`,
                    coordStr: `${r.lat.toFixed(1)}°N, ${r.lon.toFixed(1)}°E`,
                    lat: r.lat,
                    lon: r.lon
                };
                if (r.category === 'past' || r.category === 'current') pastNodes.push(nodeInfo);
                if (r.category === 'current' || r.category.toLowerCase().includes('h')) forecastNodes.push(nodeInfo);
            });

            rows.filter(r => r.category === 'past' || r.category === 'current').forEach(pt => {
                past.push({ coord: [pt.lon, pt.lat], wind: pt.wind });
                pastCoordsOnly.push([pt.lon, pt.lat]);
                nodes.push({ coord: [pt.lon, pt.lat], time: pt.time, wind: `${pt.wind} km/h`, type: getIntensity(pt.wind).code });
            });

            rows.filter(r => r.category === 'current' || r.category.toLowerCase().includes('h')).forEach(fr => {
                let hour = fr.category === 'current' ? 0 : (parseInt(fr.category.replace(/h/gi, '')) || 0);
                forecastCoords.push([fr.lon, fr.lat]);
                forecastPoints.push({ lon: fr.lon, lat: fr.lat, hour: hour, radius: getRadiusForHour(hour) });
                if (fr.category !== 'current' && !nodes.some(n => n.time === fr.time)) {
                    nodes.push({ coord: [fr.lon, fr.lat], time: fr.time, wind: `${fr.wind} km/h`, type: getIntensity(fr.wind).code });
                }
            });

            const lastCoord = pastCoordsOnly[pastCoordsOnly.length - 1];
            const coordsStr = lastCoord ? `${lastCoord[1].toFixed(1)}°N, ${lastCoord[0].toFixed(1)}°E` : '';
            
            // 動態計算移動方向與速度 (0H 至 24H 曲線路徑)
            const calculatedMovement = calculateDynamicMovement(forecastPoints, forecastCoords);

            return {
                name,
                category: categoryDesc,
                intensityObj,
                wind: `${currentMeta.wind} km/h`,
                time: currentMeta.time,
                movement: calculatedMovement,
                coords: coordsStr,
                past,
                pastCoordsOnly,
                forecast: forecastCoords.length > 0 ? forecastCoords : pastCoordsOnly.slice(-1),
                forecastPoints,
                nodes,
                pastNodes,
                forecastNodes
            };
        }

        async function loadAllTyphoonCSVs() {
            const files = ['A', 'B', 'C', 'D', 'E', 'F'];
            let loaded = {};
            for (let f of files) {
                try {
                    const response = await fetch(`TCdata/${f}.csv`);
                    if (!response.ok) continue;
                    const text = await response.text();
                    if (!text || text.trim() === '') continue;
                    const stormData = parseCSVToTyphoon(text, f);
                    if (stormData) loaded[f.toLowerCase()] = stormData;
                } catch (err) { console.log(`TCdata/${f}.csv 無內容或略過`); }
            }
            return loaded;
        }

        function getStormBounds(stKey) {
            const keys = Object.keys(typhoons);
            if (stKey === 'all' || keys.length === 0) return { center: [130, 15], zoom: 4.2 };
            const st = typhoons[stKey] || typhoons[keys[0]];
            if (!st) return { center: [130, 15], zoom: 4.2 };
            let allCoords = [...(st.pastCoordsOnly || []), ...(st.forecast || [])];
            if (allCoords.length === 0) return { center: [130, 15], zoom: 5.5 };
            let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
            allCoords.forEach(c => {
                minLon = Math.min(minLon, c[0]); maxLon = Math.max(maxLon, c[0]);
                minLat = Math.min(minLat, c[1]); maxLat = Math.max(maxLat, c[1]);
            });
            const maxSpan = Math.max(maxLon - minLon, maxLat - minLat, 1.0);
            return { center: [(minLon + maxLon) / 2, (minLat + maxLat) / 2], zoom: Math.min(10.0, Math.max(6.0, 360 / (maxSpan * 3.8))) };
        }

        const tcCountryMap = {
            "China": "中國", "Taiwan": "台灣", "Japan": "日本", "Philippines": "菲律賓",
            "Vietnam": "越南", "South Korea": "韓國", "North Korea": "朝鮮", "Russia": "俄羅斯"
        };

        async function initVectorMap() {
            const chartDom = document.getElementById('echarts-map');
            myChart = echarts.init(chartDom);
            myChart.showLoading({ text: '載入 GIS 向量圖資與解析 CSV 檔案...', color: '#3b82f6', textColor: '#cbd5e1', maskColor: 'rgba(8, 16, 26, 0.9)' });

            try {
                const [worldResp, csvTyphoons] = await Promise.all([
                    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson'),
                    loadAllTyphoonCSVs()
                ]);
                const worldJson = await worldResp.json();
                if (worldJson && worldJson.features) {
                    worldJson.features.forEach(feat => {
                        if (feat.properties) {
                            const engName = feat.properties.ADMIN || feat.properties.name || '';
                            feat.properties.name = tcCountryMap[engName] || engName;
                        }
                    });
                }
                echarts.registerMap('world50m', worldJson);
                typhoons = csvTyphoons;
                myChart.hideLoading();
                currentStormKey = Object.keys(typhoons).length === 1 ? Object.keys(typhoons)[0] : 'all';
                updateStormSelectUI();
                renderChart(true);
            } catch (e) {
                myChart.hideLoading();
                typhoons = {};
                updateStormSelectUI();
                renderChart(true);
            }
            window.addEventListener('resize', () => myChart.resize());
        }

        function updateStormSelectUI() {
            const selectEl = document.getElementById('storm-select');
            const keys = Object.keys(typhoons);
            if (keys.length === 0) { selectEl.innerHTML = `<option value="none">無活躍系統</option>`; return; }
            if (keys.length === 1) {
                const st = typhoons[keys[0]];
                selectEl.innerHTML = `<option value="${keys[0]}" selected>${st.name} - ${st.category}</option>`;
                return;
            }
            let html = `<option value="all" ${currentStormKey === 'all' ? 'selected' : ''}>活動颱風系統 (全部 - ${keys.length}個)</option>`;
            keys.forEach(k => {
                const st = typhoons[k];
                html += `<option value="${k}" ${currentStormKey === k ? 'selected' : ''}>${st.name} - ${st.category}</option>`;
            });
            selectEl.innerHTML = html;
        }

        function addTurfPolygonSeries(turfPoly, seriesList, styleOpts) {
            if (!turfPoly || !turfPoly.geometry) return;
            const geom = turfPoly.geometry;
            const coordsList = geom.type === 'Polygon' ? [geom.coordinates[0]] : geom.type === 'MultiPolygon' ? geom.coordinates.map(p => p[0]) : [];
            coordsList.forEach(ring => {
                seriesList.push({
                    type: 'custom',
                    coordinateSystem: 'geo',
                    z: 2.5,
                    data: [[0]],
                    renderItem: function(params, api) {
                        const points = ring.map(coord => api.coord(coord));
                        if (!points || points.some(p => !p || isNaN(p[0]) || isNaN(p[1]))) return;
                        return { type: 'polygon', shape: { points: points }, style: styleOpts };
                    },
                    silent: true
                });
            });
        }

        function renderChart(isStormSwitch = false) {
            if (!myChart) return;
            const seriesList = [];
            const keys = Object.keys(typhoons);

            // 渲染軌跡與誤差圈
            const renderTyphoonTracks = (st) => {
                if (!st.pastCoordsOnly) return;
                const smoothForecastCoords = smoothLineCatmullRom(st.forecast, 30);
                if (st.forecastPoints && st.forecastPoints.length > 1) {
                    const cones = makeSplitCone(st.forecastPoints, st.forecast);
                    if (cones.fullCone) {
                        addTurfPolygonSeries(cones.fullCone, seriesList, { fill: 'rgba(56, 189, 248, 0.12)', stroke: 'rgba(56, 189, 248, 0.45)', lineWidth: 1.2, lineDash: [3, 3] });
                    }
                }
                seriesList.push({
                    type: 'lines', coordinateSystem: 'geo', z: 3, polyline: true,
                    lineStyle: { color: '#ffffff', width: 1.8, opacity: 0.95 },
                    data: [{ coords: st.pastCoordsOnly }], silent: true
                });
                seriesList.push({
                    type: 'scatter', coordinateSystem: 'geo', z: 4,
                    data: st.past.map(pt => ({ value: [...pt.coord, 1], itemStyle: { color: getIntensity(pt.wind).color }, symbolSize: 7, windVal: pt.wind, stormName: st.name, intensityObj: getIntensity(pt.wind) }))
                });
                if (smoothForecastCoords && smoothForecastCoords.length > 0) {
                    seriesList.push({
                        type: 'lines', coordinateSystem: 'geo', z: 3, polyline: true,
                        effect: { show: true, period: 4, trailLength: 0.2, color: '#ffffff', symbol: 'circle', symbolSize: 4 },
                        lineStyle: { color: '#ffffff', width: 2.2, type: 'dashed', opacity: 0.9 },
                        data: [{ coords: smoothForecastCoords }], silent: true
                    });
                }
                if (st.nodes) {
                    const scatterData = st.nodes.map((node, idx) => ({
                        value: [...node.coord, 1],
                        itemStyle: { color: getIntensity(parseInt(node.wind)).color },
                        symbolSize: (idx === st.past.length - 1) ? 16 : 9,
                        isEye: (idx === st.past.length - 1),
                        nodeInfo: node,
                        stormName: st.name,
                        intensityObj: getIntensity(parseInt(node.wind))
                    }));
                    seriesList.push({ type: 'scatter', coordinateSystem: 'geo', z: 5, data: scatterData.filter(d => !d.isEye), symbol: 'circle' });
                    seriesList.push({ type: 'effectScatter', coordinateSystem: 'geo', z: 6, data: scatterData.filter(d => d.isEye), symbolSize: 20, rippleEffect: { brushType: 'stroke', scale: 4, period: 2 }, itemStyle: { color: '#ef4444', shadowBlur: 12, shadowColor: '#ef4444' } });
                }
            };

            if (keys.length > 0) {
                if (currentStormKey === 'all' && keys.length > 1) {
                    keys.forEach(k => renderTyphoonTracks(typhoons[k]));
                } else {
                    renderTyphoonTracks(typhoons[typhoons[currentStormKey] ? currentStormKey : keys[0]]);
                }
            }

            // 澳門位置標註
            seriesList.push({
                type: 'scatter', coordinateSystem: 'geo', z: 7,
                data: [{ name: '澳門', value: [113.5685, 22.1595, 1], itemStyle: { color: '#ffffff' }, symbolSize: 7 }],
                label: { show: true, formatter: '{b}', position: 'right', color: '#ffffff', fontSize: 11, fontWeight: 'bold', backgroundColor: 'rgba(11, 19, 34, 0.85)', padding: [3, 6], borderRadius: 4 }
            });

            const bounds = getStormBounds(currentStormKey);
            const option = {
                backgroundColor: '#08101a',
                geo: { map: 'world50m', roam: true, ...(isStormSwitch ? { center: bounds.center, zoom: bounds.zoom } : {}), itemStyle: { areaColor: '#132238', borderColor: '#4d729d', borderWidth: 0.8 } },
                tooltip: {
                    trigger: 'item',
                    backgroundColor: '#0b1322',
                    borderColor: '#334155',
                    textStyle: { color: '#f8fafc', fontSize: 12 },
                    formatter: function(params) {
                        const d = params.data;
                        if (!d) return params.name || '';
                        if (d.name === '澳門') return `<div style="font-weight:bold; color:#ffffff;">澳門</div>`;
                        if (d.nodeInfo) return `<div style="font-weight:bold; color:#38bdf8;">${d.stormName}</div>時間: ${d.nodeInfo.time}<br>風速: ${d.nodeInfo.wind}`;
                        return params.name || '';
                    }
                },
                series: seriesList
            };
            myChart.setOption(option, true);

            // 更新側邊欄面板資訊（套用對應名稱）
            const stormStatsContent = document.getElementById('storm-stats-content');
            if (keys.length === 0) {
                document.getElementById('storm-name').innerText = "無活動系統";
                stormStatsContent.innerHTML = `<div class="text-center text-slate-400 py-3 text-xs">當前沒有熱帶氣旋活躍</div>`;
                return;
            }

            if (currentStormKey === 'all' && keys.length > 1) {
                document.getElementById('storm-name').innerText = "活動颱風系統 (全部)";
                document.getElementById('storm-category').innerText = `共 ${keys.length} 個系統`;
                let listHtml = '<div class="space-y-2 max-h-56 overflow-y-auto pr-1">';
                keys.forEach(key => {
                    const st = typhoons[key];
                    const tLon = st.pastCoordsOnly[st.pastCoordsOnly.length - 1][0];
                    const tLat = st.pastCoordsOnly[st.pastCoordsOnly.length - 1][1];
                    const dist = getDistanceAndDirectionToMacau(tLon, tLat);
                    listHtml += `
                        <div class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-2.5 text-xs space-y-1.5">
                            <div class="font-bold text-white">${st.name}</div>
                            <div class="font-mono text-[11px] text-slate-300">
                                預報時間: ${st.time || '-'}<br>
                                中心最大風速: ${st.wind}<br>
                                位置: ${st.coords}<br>
                                移動方向: ${st.movement}
                            </div>
                        </div>`;
                });
                stormStatsContent.innerHTML = listHtml + '</div>';
            } else {
                const storm = typhoons[typhoons[currentStormKey] ? currentStormKey : keys[0]];
                if (!storm) return;
                document.getElementById('storm-name').innerText = storm.name;
                const catEl = document.getElementById('storm-category');
                catEl.innerText = storm.category;
                catEl.style.backgroundColor = `${storm.intensityObj.color}22`;
                catEl.style.color = storm.intensityObj.color;

                stormStatsContent.innerHTML = `
                    <div class="space-y-3">
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                                <span class="text-slate-400 block text-[10px]">預報時間</span>
                                <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.time || '-'}</span>
                            </div>
                            <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                                <span class="text-slate-400 block text-[10px]">中心最大風速</span>
                                <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.wind}</span>
                            </div>
                            <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                                <span class="text-slate-400 block text-[10px]">位置</span>
                                <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.coords}</span>
                            </div>
                            <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                                <span class="text-slate-400 block text-[10px]">移動方向</span>
                                <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.movement}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function switchStorm(key) { currentStormKey = key; renderChart(true); }
        function resetMapView() { const bounds = getStormBounds(currentStormKey); myChart.setOption({ geo: { center: bounds.center, zoom: bounds.zoom } }, false); }
        window.onload = function() { initVectorMap(); };
    </script>
</body>
</html>
