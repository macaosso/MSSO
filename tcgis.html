<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSSO GIS 颱風監控系統 - v8.0.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- Turf.js Spatial Analysis Library for Cone Envelopes -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <style>
        body {
            background-color: #08101a;
            color: #cbd5e1;
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #08101a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.9; }
            50% { transform: scale(1.6); opacity: 0.1; }
            100% { transform: scale(0.9); opacity: 0.9; }
        }
        .pulse-beacon {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden">

    <header class="bg-[#0b1322] border-b border-slate-800/80 h-16 flex items-center justify-between px-4 sm:px-6 z-35 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600/20 border border-blue-500/40 p-2 rounded-lg text-blue-400">
                <i class="fa-solid fa-hurricane text-xl animate-spin" style="animation-duration: 8s; animation-direction: reverse;"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-bold tracking-wider text-white flex items-center gap-2">
                    MSSO GIS <span class="text-xs px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30"> v8.0.3</span>
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">氣象監視、精準節點插值平滑與高密度誤差圈系統</p>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <div class="hidden md:flex items-center space-x-2 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-lg text-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-slate-300 font-medium">系統時間: <span id="utc-clock" class="font-mono text-cyan-400">00:00 MST</span></span>
            </div>
            <button onclick="toggleMobileSidebar()" class="md:hidden bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-sm border border-slate-700 transition">
                <i class="fa-solid fa-bars mr-1"></i> 控制面板
            </button>
            <a href="https://macaosso.github.io/MSSO/index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow-md transition flex items-center gap-1.5" title="首頁">
                <i class="fa-solid fa-house"></i> 首頁
            </a>
            <div class="flex items-center gap-4">
                <!-- 主題切換按鈕 -->
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors shadow-sm" title="切換主題">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="flex-1 flex relative overflow-hidden">
        
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 z-30 w-80 bg-[#0b1322]/95 md:bg-[#0b1322] backdrop-blur-md border-r border-slate-800 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0 shadow-2xl shrink-0">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-blue-500"></i> GIS 系統控制
                </h2>
                <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Storm Selector -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold uppercase text-slate-400 tracking-wider">活動颱風系統 (自動偵測)</label>
                    <select id="storm-select" onchange="switchStorm(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500 transition">
                        <option value="all" selected>載入中...</option>
                    </select>
                </div>

                <!-- Storm Stats Card -->
                <div class="bg-slate-900/70 border border-slate-800/80 rounded-xl p-3 space-y-3 shadow-inner">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span id="storm-name" class="font-bold text-white text-sm">檢查中...</span>
                        <span id="storm-category" class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30">狀態</span>
                    </div>
                    <div id="storm-stats-content">
                        <!-- 動態填充統計或清單 -->
                    </div>
                </div>
            </div>

            <div class="p-3 border-t border-slate-800 text-center text-[11px] text-slate-500">
                MSSO GIS 向量引擎 • v8.0.3 節點動態時速運算
            </div>
        </aside>

        <!-- 主地圖畫布區 -->
        <main class="flex-1 relative h-full bg-[#08101a] min-h-0 min-w-0 flex flex-col">
            <div id="echarts-map" class="w-full h-full flex-1"></div>

            <!-- 強度分級圖例 -->
            <div class="absolute bottom-6 right-6 z-20 bg-[#0b1322]/90 backdrop-blur-md border border-slate-800 p-3.5 rounded-xl shadow-xl text-xs space-y-2 pointer-events-none hidden sm:block max-w-xs">
                <div class="font-bold text-slate-200 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                    <i class="fa-solid fa-palette text-blue-400"></i> 強度分級 (自動風速對應)
                </div>
                <div id="intensity-legend" class="grid grid-cols-1 gap-1.5 text-[11px]"></div>
            </div>
        </main>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const gmt8 = new Date(utc + (3600000 * 8));
            const hours = String(gmt8.getHours()).padStart(2, '0');
            const minutes = String(gmt8.getMinutes()).padStart(2, '0');
            document.getElementById('utc-clock').innerText = `${hours}:${minutes} MST`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        // 主題切換邏輯
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        const TC_INTENSITY_TABLE = [
            {"code": "LPA",  "name": "低壓區",           "engName": "Low Pressure Area",      "max_wind": 40,   "rangeText": "≤ 40 km/h",    "color": "#DDDFE2"},
            {"code": "TD",   "name": "熱帶低氣壓",       "engName": "Tropical Depression",    "max_wind": 62,   "rangeText": "41 - 62 km/h", "color": "#6DD8FA"},
            {"code": "TS",   "name": "熱帶風暴",         "engName": "Tropical Storm",         "max_wind": 87,   "rangeText": "63 - 87 km/h", "color": "#9DD79C"},
            {"code": "STS",  "name": "強烈熱帶風暴",     "engName": "Severe Tropical Storm",  "max_wind": 117,  "rangeText": "88 - 117 km/h","color": "#FFD363"},
            {"code": "TY",   "name": "颱風",             "engName": "Typhoon",                "max_wind": 149,  "rangeText": "118 - 149 km/h","color": "#F78A31"},
            {"code": "STY",  "name": "強颱風",           "engName": "Severe Typhoon",         "max_wind": 184,  "rangeText": "150 - 184 km/h","color": "#FF6F6F"},
            {"code": "SuTY", "name": "超強颱風",         "engName": "Super Typhoon",          "max_wind": 9999, "rangeText": "≥ 185 km/h",   "color": "#DE82FF"}
        ];

        function getIntensity(windKmh) {
            for (let item of TC_INTENSITY_TABLE) {
                if (windKmh <= item.max_wind) return item;
            }
            return TC_INTENSITY_TABLE[TC_INTENSITY_TABLE.length - 1];
        }

        const legendContainer = document.getElementById('intensity-legend');
        TC_INTENSITY_TABLE.forEach(item => {
            const div = document.createElement('div');
            div.className = "flex items-center justify-between space-x-3";
            div.innerHTML = `
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full inline-block shadow shrink-0" style="background-color: ${item.color};"></span>
                    <span class="text-slate-300 font-medium">${item.code} - ${item.name}</span>
                </div>
                <span class="text-slate-400 font-mono text-[10px] shrink-0">${item.rangeText}</span>
            `;
            legendContainer.appendChild(div);
        });

        const MACAU_COORDS = [113.5685, 22.1595];

        function getDistanceAndDirectionToMacau(tLon, tLat) {
            if (tLon === undefined || tLat === undefined || isNaN(tLon) || isNaN(tLat)) {
                return "未知距離";
            }
            const R = 6371;
            const dLat = (tLat - MACAU_COORDS[1]) * Math.PI / 180;
            const dLon = (tLon - MACAU_COORDS[0]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(MACAU_COORDS[1] * Math.PI / 180) * Math.cos(tLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            let dist = R * c;
            dist = Math.round(dist / 10) * 10;

            const lat1Rad = MACAU_COORDS[1] * Math.PI / 180;
            const lat2Rad = tLat * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;

            const directions = [
                "N", "NNE", "NE", "ENE",
                "E", "ESE", "SE", "SSE",
                "S", "SSW", "SW", "WSW",
                "W", "WNW", "NW", "NNW"
            ];
            const index = Math.round((brng % 360) / 22.5) % 16;
            return `${directions[index]} ${dist}公里`;
        }

        function getDirection(lon1, lat1, lon2, lat2) {
            if (lon1 === undefined || lat1 === undefined || lon2 === undefined || lat2 === undefined) {
                return "靜止";
            }
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const lat2Rad = lat2 * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;
            const directions = [
                "N", "NNE", "NE", "ENE",
                "E", "ESE", "SE", "SSE",
                "S", "SSW", "SW", "WSW",
                "W", "WNW", "NW", "NNW"
            ];
            return directions[Math.round((brng % 360) / 22.5) % 16];
        }

        function generateCircleCoords(centerLon, centerLat, radiusKm, numPoints = 64) {
            const coords = [];
            const R = 6371;
            for (let i = 0; i <= numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                const dLat = (radiusKm / R) * (180 / Math.PI);
                const dLon = (radiusKm / R) * (180 / Math.PI) / Math.cos(centerLat * Math.PI / 180);
                const lon = centerLon + dLon * Math.cos(angle);
                const lat = centerLat + dLat * Math.sin(angle);
                coords.push([lon, lat]);
            }
            return coords;
        }

        function smoothLineCatmullRom(coords, samplesPerSegment = 20) {
            if (!coords || coords.length < 2) return coords;
            
            let pts = [coords[0], ...coords, coords[coords.length - 1]];
            let smooth = [];

            for (let i = 1; i < pts.length - 2; i++) {
                let p0 = pts[i - 1];
                let p1 = pts[i];
                let p2 = pts[i + 1];
                let p3 = pts[i + 2];

                for (let t = 0; t < samplesPerSegment; t++) {
                    let st = t / samplesPerSegment;
                    let t2 = st * st;
                    let t3 = t2 * st;

                    let x = 0.5 * ((2 * p1[0]) +
                        (-p0[0] + p2[0]) * st +
                        (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
                        (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);

                    let y = 0.5 * ((2 * p1[1]) +
                        (-p0[1] + p2[1]) * st +
                        (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
                        (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);

                    smooth.push([x, y]);
                }
            }
            smooth.push(coords[coords.length - 1]);
            return smooth;
        }

        const ERROR_HOURS = [0, 24, 48, 72, 96, 120];
        const ERROR_RADII_KM = [15, 100, 170, 255, 345, 465];

        function getRadiusForHour(hour) {
            if (hour <= ERROR_HOURS[0]) return ERROR_RADII_KM[0];
            if (hour >= ERROR_HOURS[ERROR_HOURS.length - 1]) return ERROR_RADII_KM[ERROR_RADII_KM.length - 1];

            for (let i = 0; i < ERROR_HOURS.length - 1; i++) {
                if (hour >= ERROR_HOURS[i] && hour <= ERROR_HOURS[i + 1]) {
                    const h1 = ERROR_HOURS[i], h2 = ERROR_HOURS[i + 1];
                    const r1 = ERROR_RADII_KM[i], r2 = ERROR_RADII_KM[i + 1];
                    const factor = (hour - h1) / (h2 - h1);
                    return r1 + factor * (r2 - r1);
                }
            }
            return ERROR_RADII_KM[ERROR_RADII_KM.length - 1];
        }

        function safeUnion(p1, p2) {
            if (!p1) return p2;
            if (!p2) return p1;
            try {
                return turf.union(turf.featureCollection([p1, p2]));
            } catch (e) {
                try { return turf.union(p1, p2); } catch (err) { return p1; }
            }
        }

        function makeSplitCone(points, forecastCoords) {
            if (!forecastCoords || forecastCoords.length < 2) return { fullCone: null };

            const smoothCoords = smoothLineCatmullRom(forecastCoords, 30);

            let origDistances = [0];
            for (let i = 1; i < points.length; i++) {
                const d = turf.distance(turf.point([points[i-1].lon, points[i-1].lat]), turf.point([points[i].lon, points[i].lat]), {units: 'kilometers'});
                origDistances.push(origDistances[i-1] + d);
            }
            const totalOrigDist = origDistances[origDistances.length - 1] || 1;

            let smoothDistances = [0];
            for (let i = 1; i < smoothCoords.length; i++) {
                const d = turf.distance(turf.point(smoothCoords[i-1]), turf.point(smoothCoords[i]), {units: 'kilometers'});
                smoothDistances.push(smoothDistances[i-1] + d);
            }
            const totalSmoothDist = smoothDistances[smoothDistances.length - 1] || 1;

            let circlesFull = [];

            for (let i = 0; i < smoothCoords.length; i++) {
                const coord = smoothCoords[i];
                const distAlong = smoothDistances[i];
                const fraction = totalSmoothDist === 0 ? 0 : distAlong / totalSmoothDist;
                const correspondingOrigDist = fraction * totalOrigDist;

                let hour = 0;
                for (let j = 0; j < points.length - 1; j++) {
                    if (correspondingOrigDist >= origDistances[j] && correspondingOrigDist <= origDistances[j+1]) {
                        const segDist = origDistances[j+1] - origDistances[j];
                        const segFactor = segDist === 0 ? 0 : (correspondingOrigDist - origDistances[j]) / segDist;
                        hour = points[j].hour + segFactor * (points[j+1].hour - points[j].hour);
                        break;
                    } else if (j === points.length - 2 && correspondingOrigDist > origDistances[j+1]) {
                        hour = points[points.length - 1].hour;
                    }
                }

                const radius = getRadiusForHour(hour);
                if (radius > 0) {
                    const circle = turf.buffer(turf.point(coord), radius, { units: "kilometers", steps: 64 });
                    circlesFull.push(circle);
                }
            }

            if (circlesFull.length === 0) return { fullCone: null };

            let fullCone = circlesFull[0];
            for (let i = 1; i < circlesFull.length; i++) {
                fullCone = safeUnion(fullCone, circlesFull[i]);
            }

            return { fullCone };
        }

        function calculateMovementStr(forecastPoints, forecastCoords, pastCoordsOnly) {
            let coordsToUse = forecastCoords;
            if (!coordsToUse || coordsToUse.length < 2) {
                if (pastCoordsOnly && pastCoordsOnly.length >= 2) {
                    coordsToUse = pastCoordsOnly.slice(-2);
                } else {
                    return "靜止 0 km/h";
                }
            }
            
            const pStart = coordsToUse[0];
            const pEnd = coordsToUse[1] || coordsToUse[0];
            const direction = getDirection(pStart[0], pStart[1], pEnd[0], pEnd[1]);

            const samplesPerSegment = 30;
            const smoothCoords = smoothLineCatmullRom(coordsToUse, samplesPerSegment);
            let curveDist = 0;
            for (let i = 0; i < smoothCoords.length - 1; i++) {
                curveDist += turf.distance(turf.point(smoothCoords[i]), turf.point(smoothCoords[i+1]), {units: 'kilometers'});
            }
            
            let totalHours = 24;
            if (forecastPoints && forecastPoints.length >= 2) {
                const hStart = forecastPoints[0].hour || 0;
                const hEnd = forecastPoints[forecastPoints.length - 1].hour || 24;
                if (hEnd > hStart) totalHours = hEnd - hStart;
            }
            
            const speed = Math.round(curveDist / (totalHours > 0 ? totalHours : 24));
            return `${direction} ${speed} km/h`;
        }

        let typhoons = {};
        let currentStormKey = 'all';
        let myChart = null;
        let mapLoaded = false;

        function parseCSVToTyphoon(csvText, letter) {
            const lines = csvText.split('\n');
            let currentMeta = null;
            let rows = [];

            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#') || line.toLowerCase().startsWith('category')) continue;
                const cols = line.split(',').map(c => c.trim());
                if (cols.length < 6) continue;

                const category = cols[0].toLowerCase();
                const time = cols[1];
                const rowName = cols[2];
                const lat = parseFloat(cols[3]);
                const lon = parseFloat(cols[4]);
                const windVal = parseFloat(cols[5]) || 0;

                if (isNaN(lat) || isNaN(lon)) continue;

                if (category === 'current' || category === '0h' || category === '0') {
                    currentMeta = { name: rowName || `Typhoon ${letter.toUpperCase()}`, time, lat, lon, wind: windVal };
                }

                rows.push({ category, time, name: rowName, lat, lon, wind: windVal });
            }

            if (rows.length === 0) return null;

            if (!currentMeta) {
                const anchor = rows.find(r => r.category === '0h' || r.category === 'current' || r.category === '0') || rows[0];
                currentMeta = { name: anchor.name || `Typhoon ${letter.toUpperCase()}`, time: anchor.time, lat: anchor.lat, lon: anchor.lon, wind: anchor.wind };
            }

            const name = currentMeta.name;
            const intensityObj = getIntensity(currentMeta.wind);
            const categoryDesc = `${intensityObj.name}`;

            let past = [];
            let pastCoordsOnly = [];
            let forecastCoords = [];
            let forecastPoints = [];
            let pastNodes = [];
            let forecastNodes = [];

            rows.forEach((r, idx) => {
                const intensity = getIntensity(r.wind);
                
                // 動態計算節點移動方向與時速 (movementDir)
                let moveDir = '靜止';
                let speedKmh = 0;
                const nextRow = rows[idx + 1] || rows[idx - 1];
                if (nextRow) {
                    const lon1 = idx < rows.length - 1 ? r.lon : rows[idx - 1].lon;
                    const lat1 = idx < rows.length - 1 ? r.lat : rows[idx - 1].lat;
                    const lon2 = idx < rows.length - 1 ? rows[idx + 1].lon : r.lon;
                    const lat2 = idx < rows.length - 1 ? rows[idx + 1].lat : r.lat;
                    
                    moveDir = getDirection(lon1, lat1, lon2, lat2);
                    const dist = turf.distance(turf.point([lon1, lat1]), turf.point([lon2, lat2]), {units: 'kilometers'});
                    
                    let hours = 24;
                    if (idx < rows.length - 1 && rows[idx+1].category && r.category) {
                        const h1 = parseInt(r.category.replace(/[^0-9]/g, '')) || 0;
                        const h2 = parseInt(rows[idx+1].category.replace(/[^0-9]/g, '')) || 0;
                        if (h2 > h1) hours = h2 - h1;
                    }
                    if (hours <= 0) hours = 24;
                    speedKmh = Math.round(dist / hours);
                }
                const movementStr = `${moveDir} ${speedKmh} km/h`;

                const nodeInfo = {
                    time: r.time,
                    categoryCode: intensity.code,
                    categoryName: intensity.name,
                    color: intensity.color,
                    wind: `${r.wind} km/h`,
                    coordStr: `${r.lat.toFixed(1)}°N, ${r.lon.toFixed(1)}°E`,
                    lat: r.lat,
                    lon: r.lon,
                    coord: [r.lon, r.lat],
                    movementDir: movementStr,
                    distToMacau: getDistanceAndDirectionToMacau(r.lon, r.lat)
                };

                if (r.category === 'past' || r.category === 'current' || r.category === '0h' || r.category === '0') {
                    pastNodes.push(nodeInfo);
                }
                if (r.category === 'current' || r.category === '0h' || r.category === '0' || r.category.toLowerCase().includes('h')) {
                    forecastNodes.push(nodeInfo);
                }
            });

            let pastRows = rows.filter(r => r.category === 'past' || r.category === 'current' || r.category === '0h' || r.category === '0');
            if (pastRows.length === 0 && rows.length > 0) {
                pastRows = [rows[0]];
            }
            pastRows.forEach(pt => {
                past.push({ coord: [pt.lon, pt.lat], wind: pt.wind });
                pastCoordsOnly.push([pt.lon, pt.lat]);
            });

            let forecastRows = rows.filter(r => r.category === 'current' || r.category === '0h' || r.category === '0' || r.category.toLowerCase().includes('h'));
            if (forecastRows.length === 0 && rows.length > 0) {
                forecastRows = rows;
            }
            forecastRows.forEach(fr => {
                let hour = 0;
                if (fr.category !== 'current' && fr.category !== '0h' && fr.category !== '0') {
                    hour = parseInt(fr.category.replace('h', '').replace('H', '')) || 0;
                }

                forecastCoords.push([fr.lon, fr.lat]);
                let defaultRadius = getRadiusForHour(hour);

                forecastPoints.push({
                    lon: fr.lon,
                    lat: fr.lat,
                    hour: hour,
                    radius: defaultRadius
                });
            });

            const lastCoord = pastCoordsOnly[pastCoordsOnly.length - 1] || forecastCoords[0] || [currentMeta.lon, currentMeta.lat];
            const coordsStr = lastCoord ? `${lastCoord[1].toFixed(1)}°N, ${lastCoord[0].toFixed(1)}°E` : `${currentMeta.lat.toFixed(1)}°N, ${currentMeta.lon.toFixed(1)}°E`;
            const fCoordsForCalc = forecastCoords.length > 0 ? forecastCoords : [lastCoord];
            const movementStr = calculateMovementStr(forecastPoints, fCoordsForCalc, pastCoordsOnly);

            let nodeMap = new Map();
            [...pastNodes, ...forecastNodes].forEach(node => {
                nodeMap.set(node.time + "_" + node.coordStr, node);
            });
            let nodes = Array.from(nodeMap.values());

            return {
                name,
                category: categoryDesc,
                intensityObj,
                wind: `${currentMeta.wind} km/h`,
                time: currentMeta.time,
                movement: movementStr,
                coords: coordsStr,
                past,
                pastCoordsOnly,
                forecast: forecastCoords.length > 0 ? forecastCoords : [lastCoord],
                forecastPoints,
                nodes,
                pastNodes,
                forecastNodes
            };
        }

        async function loadAllTyphoonCSVs() {
            const files = ['A', 'B', 'C', 'D', 'E', 'F'];
            let loaded = {};

            for (let f of files) {
                try {
                    const response = await fetch(`TCdata/${f}.csv`);
                    if (!response.ok) continue;
                    const text = await response.text();
                    if (!text || text.trim() === '') continue;

                    const stormData = parseCSVToTyphoon(text, f);
                    if (stormData) {
                        loaded[f.toLowerCase()] = stormData;
                    }
                } catch (err) {
                    console.log(`TCdata/${f}.csv 無內容或略過`);
                }
            }
            return loaded;
        }

        function getStormBounds(stKey) {
            const keys = Object.keys(typhoons);
            if (stKey === 'all' || keys.length === 0) {
                return { center: [130, 15], zoom: 4.2 };
            }
            const st = typhoons[stKey] || typhoons[keys[0]];
            if (!st) return { center: [130, 15], zoom: 4.2 };
            
            let allCoords = [];
            if (st.pastCoordsOnly) allCoords = allCoords.concat(st.pastCoordsOnly);
            if (st.forecast) allCoords = allCoords.concat(st.forecast);
            if (allCoords.length === 0) return { center: [130, 15], zoom: 5.5 };

            let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
            allCoords.forEach(c => {
                if (c[0] < minLon) minLon = c[0];
                if (c[0] > maxLon) maxLon = c[0];
                if (c[1] < minLat) minLat = c[1];
                if (c[1] > maxLat) maxLat = c[1];
            });
            const center = [(minLon + maxLon) / 2, (minLat + maxLat) / 2];
            const lonSpan = maxLon - minLon;
            const latSpan = maxLat - minLat;
            const maxSpan = Math.max(lonSpan, latSpan, 1.0);
            
            let zoom = Math.min(10.0, Math.max(6.0, 360 / (maxSpan * 3.8)));
            return { center, zoom };
        }

        };

        async function initVectorMap() {
            const chartDom = document.getElementById('echarts-map');
            myChart = echarts.init(chartDom);

            myChart.showLoading({
                text: '載入 GIS 向量圖資與解析 CSV 檔案...',
                color: '#3b82f6',
                textColor: '#cbd5e1',
                maskColor: 'rgba(8, 16, 26, 0.9)',
                zlevel: 0
            });

            try {
                const [worldResp, csvTyphoons] = await Promise.all([
                    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson'),
                    loadAllTyphoonCSVs()
                ]);

                const worldJson = await worldResp.json();
                if (worldJson && worldJson.features) {
                    worldJson.features.forEach(feat => {
                        if (feat.properties) {
                            const engName = feat.properties.ADMIN || feat.properties.name || feat.properties.NAME || '';
                            feat.properties.name = tcCountryMap[engName] || engName;
                        }
                    });
                }

                echarts.registerMap('world50m', worldJson);
                typhoons = csvTyphoons;
                mapLoaded = true;
                myChart.hideLoading();
                
                const keys = Object.keys(typhoons);
                if (keys.length === 1) {
                    currentStormKey = keys[0];
                } else {
                    currentStormKey = 'all';
                }

                updateStormSelectUI();
                renderChart(true);
            } catch (e) {
                console.error('初始化失敗:', e);
                myChart.hideLoading();
                typhoons = {};
                updateStormSelectUI();
                renderChart(true);
            }

            window.addEventListener('resize', () => {
                myChart.resize();
            });
        }

        function updateStormSelectUI() {
            const selectEl = document.getElementById('storm-select');
            selectEl.innerHTML = '';

            const keys = Object.keys(typhoons);
            if (keys.length === 0) {
                selectEl.innerHTML = `<option value="none">無活躍系統</option>`;
                return;
            }

            if (keys.length === 1) {
                if (!typhoons[currentStormKey]) currentStormKey = keys[0];
                const st = typhoons[keys[0]];
                selectEl.innerHTML = `<option value="${keys[0]}" selected>${st.category} ${st.name}</option>`;
                return;
            }

            let html = `<option value="all" ${currentStormKey === 'all' ? 'selected' : ''}>活動颱風系統 (全部 - ${keys.length}個)</option>`;
            keys.forEach(k => {
                const st = typhoons[k];
                html += `<option value="${k}" ${currentStormKey === k ? 'selected' : ''}>${st.category} ${st.name}</option>`;
            });
            selectEl.innerHTML = html;
        }

        function addTurfPolygonSeries(turfPoly, seriesList, styleOpts) {
            if (!turfPoly || !turfPoly.geometry) return;
            const geom = turfPoly.geometry;
            const coordsList = geom.type === 'Polygon' ? [geom.coordinates[0]] : 
                               geom.type === 'MultiPolygon' ? geom.coordinates.map(poly => poly[0]) : [];
            
            coordsList.forEach(ring => {
                seriesList.push({
                    type: 'custom',
                    coordinateSystem: 'geo',
                    z: 2.5,
                    data: [[0]],
                    renderItem: function(params, api) {
                        const points = ring.map(coord => api.coord(coord));
                        if (!points || points.some(p => !p || isNaN(p[0]) || isNaN(p[1]))) return;
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: styleOpts
                        };
                    },
                    silent: true
                });
            });
        }

        function renderChart(isStormSwitch = false) {
            if (!myChart) return;
            
            const showPast = true;
            const showForecast = true;
            const showEnvelope = true;
            const showNodes = true;
            const showRings = true;
            const showMacau = true;
            const showGrid = true;

            const seriesList = [];
            const keys = Object.keys(typhoons);

            if (showGrid) {
                const minorLines = [];
                for (let lon = -180; lon <= 180; lon += 5) {
                    minorLines.push({ coords: [[lon, -90], [lon, 90]] });
                }
                for (let lat = -90; lat <= 90; lat += 5) {
                    minorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 1,
                    polyline: true,
                    lineStyle: { color: 'rgba(255, 255, 255, 0.05)', width: 0.15, type: 'dashed' },
                    data: minorLines,
                    silent: true
                });

                const majorLines = [];
                for (let lon = -180; lon <= 180; lon += 30) {
                    majorLines.push({ coords: [[lon, -90], [lon, 90]] });
                }
                for (let lat = -90; lat <= 90; lat += 15) {
                    majorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    lineStyle: { color: 'rgba(255, 255, 255, 0.18)', width: 0.6, type: 'dashed' },
                    data: majorLines,
                    silent: true

                const gridLabels = [];

                    if (lon === 180 || lon === -180) continue;
                    gridLabels.push({ name: `${Math.abs(lon)}°${lon < 0 ? 'W' : 'E'}`, value: [lon, 0, 1], itemStyle: { opacity: 0 } });
                }
                for (let lat = -90; lat <= 90; lat += 15) {
                    if (lat === 0 || lat === 90 || lat === -90) continue;

                }

                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 3,
                    data: gridLabels,

                    silent: true

                    coordinateSystem: 'geo',

            const renderTyphoonTracks = (st) => {

                if (showPast) {

                    const pastScatterData = st.past.map(pt => {

                if (showForecast && smoothForecastCoords && smoothForecastCoords.length > 0) {

                if (showNodes && st.nodes) {

                    storm.pastNodes.forEach(node => {
                        pastTableRows += `
                            <tr class="hover:bg-slate-800/40">
                                <td class="py-1 px-1 text-slate-300">${node.time}</td>
                                <td class="py-1 px-1"><span class="px-1 py-0.5 rounded text-[9px] font-bold border" style="background-color: ${node.color}22; border-color: ${node.color}55; color: ${node.color};">${node.categoryCode}</span></td>
                                <td class="py-1 px-1 text-slate-200">${node.wind}</td>
                                <td class="py-1 px-1 text-slate-200">${node.coordStr}</td>
                            </tr>
                        `;
                    });
                }

                stormStatsContent.innerHTML = `
                    <div class="space-y-3">
                        <div class="space-y-2 text-xs">
                            <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                                <span class="text-slate-400 block text-[10px]">預報時間</span>
                                <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.time || '-'}</span>
                            </div>
                            <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                                <span class="text-slate-400 block text-[10px]">中心最大風速</span>
                                <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.wind}</span>
                            </div>
                            <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                                <span class="text-slate-400 block text-[10px]">位置</span>
                                <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.coords}</span>
                            </div>
                            <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                                <span class="text-slate-400 block text-[10px]">移動方向 (時速)</span>
                                <span class="font-mono text-slate-200 font-bold text-[11px]">${storm.movement}</span>
                            </div>
                            <div class="bg-slate-800/50 p-2 rounded-lg border border-slate-800">
                                <span class="text-slate-400 block text-[10px]">距離澳門</span>
                                <span class="font-mono text-slate-200 font-bold text-[11px]">${dist}</span>
                            </div>
                        </div>

                        <!-- 預報路徑表 -->
                        <details open class="group bg-slate-800/40 border border-slate-800/80 rounded-lg overflow-hidden">
                            <summary class="p-2 text-xs font-bold text-slate-200 cursor-pointer select-none bg-slate-800/70 hover:bg-slate-700/70 flex justify-between items-center transition">
                                <span><i class="fa-solid fa-route text-blue-400 mr-1.5"></i> 預報路徑表</span>
                                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform group-open:rotate-180"></i>
                            </summary>
                            <div class="p-2 overflow-x-auto max-h-40 overflow-y-auto">
                                <table class="w-full text-left text-[11px] font-mono">
                                    <thead>
                                        <tr class="border-b border-slate-700/60 text-slate-400 text-[10px]">
                                            <th class="pb-1 px-1">時間</th>
                                            <th class="pb-1 px-1">級別</th>
                                            <th class="pb-1 px-1">風速</th>
                                            <th class="pb-1 px-1">座標</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800/50">
                                        ${forecastTableRows}
                                    </tbody>
                                </table>
                            </div>
                        </details>

                        <!-- 歷史軌跡表 -->
                        <details class="group bg-slate-800/40 border border-slate-800/80 rounded-lg overflow-hidden">
                            <summary class="p-2 text-xs font-bold text-slate-200 cursor-pointer select-none bg-slate-800/70 hover:bg-slate-700/70 flex justify-between items-center transition">
                                <span><i class="fa-solid fa-history text-cyan-400 mr-1.5"></i> 歷史軌跡表</span>
                                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform group-open:rotate-180"></i>
                            </summary>
                            <div class="p-2 overflow-x-auto max-h-40 overflow-y-auto">
                                <table class="w-full text-left text-[11px] font-mono">
                                    <thead>
                                        <tr class="border-b border-slate-700/60 text-slate-400 text-[10px]">
                                            <th class="pb-1 px-1">時間</th>
                                            <th class="pb-1 px-1">級別</th>
                                            <th class="pb-1 px-1">風速</th>
                                            <th class="pb-1 px-1">座標</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800/50">
                                        ${pastTableRows}
                                    </tbody>
                                </table>
                            </div>
                        </details>
                    </div>
                `;
            }
        }

        function switchStorm(key) {
            currentStormKey = key;
            renderChart(true);
        }

        window.onload = function() {
            initVectorMap();
        };
    </script>
</body>
</html>
