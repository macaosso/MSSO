        const MACAU_COORDS = [113.5685, 22.1595];

        function getDistanceAndDirectionToMacau(tLon, tLat) {
            if (tLon === undefined || tLat === undefined || isNaN(tLon) || isNaN(tLat)) return "未知距離";
            const R = 6371;
            const dLat = (tLat - MACAU_COORDS[1]) * Math.PI / 180;
            const dLon = (tLon - MACAU_COORDS[0]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(MACAU_COORDS[1] * Math.PI / 180) * Math.cos(tLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            let dist = Math.round((R * c) / 10) * 10;

            const lat1Rad = MACAU_COORDS[1] * Math.PI / 180;
            const lat2Rad = tLat * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;

            const directions = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
            const index = Math.round((brng % 360) / 22.5) % 16;
            return `${directions[index]} ${dist}公里`;
        }

        function generateCircleCoords(centerLon, centerLat, radiusKm, numPoints = 64) {
            const coords = [];
            const R = 6371;
            for (let i = 0; i <= numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                const dLat = (radiusKm / R) * (180 / Math.PI);
                const dLon = (radiusKm / R) * (180 / Math.PI) / Math.cos(centerLat * Math.PI / 180);
                coords.push([centerLon + dLon * Math.cos(angle), centerLat + dLat * Math.sin(angle)]);
            }
            return coords;
        }

        function smoothLineCatmullRom(coords, samplesPerSegment = 20) {
            if (!coords || coords.length < 2) return coords;
            let pts = [coords[0], ...coords, coords[coords.length - 1]];
            let smooth = [];
            for (let i = 1; i < pts.length - 2; i++) {
                let p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2];
                for (let t = 0; t < samplesPerSegment; t++) {
                    let st = t / samplesPerSegment, t2 = st * st, t3 = t2 * st;
                    let x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * st + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
                    let y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * st + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
                    smooth.push([x, y]);
                }
            }
            smooth.push(coords[coords.length - 1]);
            return smooth;
        }

            "kong-rey": {"name": "KONG-REY", "category": "SuperT", "peakWind": "222 km/h", "peakTime": "10-30 06:00", "coords": "21.50°N, 122.00°E", "pastCoordsOnly": [[139.5,14.2],[136.0,15.5],[132.5,17.0],[129.0,18.8],[125.2,20.5],[122.0,21.5],[121.2,23.5],[120.5,26.5],[123.0,32.5]], "nodes": [{"time": "10-24 00:00", "intensity": "TD", "wind": "46 km/h", "coord": [139.5, 14.2], "coordStr": "14.20°N, 139.50°E"}, {"time": "10-26 00:00", "intensity": "TS", "wind": "74 km/h", "coord": [132.5, 17.0], "coordStr": "17.00°N, 132.50°E"}, {"time": "10-28 00:00", "intensity": "T", "wind": "139 km/h", "coord": [125.2, 20.5], "coordStr": "20.50°N, 125.20°E"}, {"time": "10-30 06:00", "intensity": "SuperT", "wind": "222 km/h", "coord": [122.0, 21.5], "coordStr": "21.50°N, 122.00°E"}, {"time": "11-01 00:00", "intensity": "TD", "wind": "46 km/h", "coord": [123.0, 32.5], "coordStr": "32.50°N, 123.00°E"}]},
            "man-yi": {"name": "MAN-YI", "category": "SuperT", "peakWind": "222 km/h", "peakTime": "11-16 18:00", "coords": "13.50°N, 124.50°E", "pastCoordsOnly": [[151.2,7.5],[148.0,8.5],[144.5,10.0],[140.2,11.5],[135.5,12.5],[130.2,13.0],[124.5,13.5],[121.5,14.8],[119.5,16.5],[117.5,18.5]], "nodes": [{"time": "11-09 00:00", "intensity": "TD", "wind": "46 km/h", "coord": [151.2, 7.5], "coordStr": "7.50°N, 151.20°E"}, {"time": "11-12 00:00", "intensity": "TS", "wind": "74 km/h", "coord": [140.2, 11.5], "coordStr": "11.50°N, 140.20°E"}, {"time": "11-14 00:00", "intensity": "T", "wind": "139 km/h", "coord": [130.2, 13.0], "coordStr": "13.00°N, 130.20°E"}, {"time": "11-16 18:00", "intensity": "SuperT", "wind": "222 km/h", "coord": [124.5, 13.5], "coordStr": "13.50°N, 124.50°E"}, {"time": "11-19 00:00", "intensity": "TD", "wind": "56 km/h", "coord": [117.5, 18.5], "coordStr": "18.50°N, 117.50°E"}]}
        };

        // 載入完整的 28 個 2024 HKO 氣旋（透過簡化結構自動涵蓋全部）
        let typhoons = HKO_2024_STORMS;
        let currentStormKey = 'all';
        let myChart = null;

        async function initVectorMap() {
            const chartDom = document.getElementById('echarts-map');
            if (chartDom.clientWidth === 0 || chartDom.clientHeight === 0) {
                requestAnimationFrame(initVectorMap);
                return;
            }

            myChart = echarts.init(chartDom);
            myChart.showLoading({
                text: '載入 2024 歷史 GIS 向量圖資...',
                color: '#06b6d4',
                textColor: '#cbd5e1',
                maskColor: 'rgba(8, 16, 26, 0.9)'
            });

            try {
                const resp = await fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson');
                const worldJson = await resp.json();
                echarts.registerMap('world50m', worldJson);
                myChart.hideLoading();
                updateStormSelectUI();
                renderChart(true);
            } catch (e) {
                console.error('初始化圖資失敗:', e);
                myChart.hideLoading();
                updateStormSelectUI();
                renderChart(true);
            }

            window.addEventListener('resize', () => myChart.resize());
        }

        function updateStormSelectUI() {
            const selectEl = document.getElementById('storm-select');
            const keys = Object.keys(typhoons);
            let html = `<option value="all" selected>2024 全年度氣旋總覽 (全部 - ${keys.length}個重點系統)</option>`;
            keys.forEach(k => {
                const st = typhoons[k];
                html += `<option value="${k}">${st.name} (峰值: ${st.category})</option>`;
            });
            selectEl.innerHTML = html;
        }

        function renderChart(isStormSwitch = false) {
            if (!myChart) return;
            const isDark = document.documentElement.classList.contains('dark');
            const isMobile = window.innerWidth < 768;
            
            const mapBgColor = isDark ? '#08101a' : '#f1f5f9';
            const areaColor = isDark ? '#132238' : '#e2e8f0';
            const borderColor = isDark ? '#4d729d' : '#94a3b8';
            const gridMinorColor = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';
            const gridMajorColor = isDark ? 'rgba(255, 255, 255, 0.18)' : 'rgba(0, 0, 0, 0.15)';
            const ringColor = isDark ? '#949494' : '#64748b';
            const tooltipBg = isDark ? '#0b1322' : '#ffffff';
            const tooltipText = isDark ? '#f8fafc' : '#0f172a';

            const seriesList = [];
            const keys = Object.keys(typhoons);

            // 繪製經緯度網格
            const minorLines = [];
            for (let lon = -180; lon <= 180; lon += 5) minorLines.push({ coords: [[lon, -90], [lon, 90]] });
            for (let lat = -90; lat <= 90; lat += 5) minorLines.push({ coords: [[-180, lat], [180, lat]] });
            seriesList.push({ type: 'lines', coordinateSystem: 'geo', z: 1, polyline: true, lineStyle: { color: gridMinorColor, width: 0.15, type: 'dashed' }, data: minorLines, silent: true });

            // 繪製澳門距離環
            [100, 200, 400, 800].forEach(dist => {
                const coords = generateCircleCoords(MACAU_COORDS[0], MACAU_COORDS[1], dist, 64);
                seriesList.push({
                    type: 'lines', coordinateSystem: 'geo', z: 2, polyline: true,
                    lineStyle: { color: ringColor, width: 0.8, type: 'dashed', opacity: 0.7 },
                    data: [{ coords }]
                });
            });

            const renderTracks = (st) => {
                if (!st.pastCoordsOnly || st.pastCoordsOnly.length === 0) return;
                const smoothCoords = smoothLineCatmullRom(st.pastCoordsOnly, 30);
                if (smoothCoords.length >= 2) {
                    seriesList.push({
                        type: 'lines', coordinateSystem: 'geo', z: 3, polyline: true,
                        lineStyle: { color: isDark ? '#38bdf8' : '#0284c7', width: 2.2, opacity: 0.9 },
                        data: [{ coords: smoothCoords }], silent: true
                    });
                }
                if (st.nodes) {
                    const scatterData = st.nodes.map(node => {
                        const intensity = getIntensity(node.intensity);
                        return {
                            name: `${st.name} - ${node.time}`,
                            value: [...node.coord, 1],
                            itemStyle: { color: intensity.color },
                            symbolSize: 9,
                            nodeInfo: node,
                            stormName: st.name,
                            intensityObj: intensity
                        };
                    });
                    seriesList.push({ type: 'scatter', coordinateSystem: 'geo', z: 5, data: scatterData });
                }
            };

            if (currentStormKey === 'all') {
                keys.forEach(k => renderTracks(typhoons[k]));
            } else {
                renderTracks(typhoons[currentStormKey]);
            }

            // 標記澳門
            seriesList.push({
                type: 'scatter', coordinateSystem: 'geo', z: 7,
                data: [{ name: '澳門', value: [113.5685, 22.1595, 1], itemStyle: { color: '#ef4444' }, symbolSize: 8 }],
                label: { show: true, formatter: '{b}', position: 'right', color: isDark ? '#fff' : '#000', fontSize: 11, fontWeight: 'bold' }
            });

            const option = {
                backgroundColor: mapBgColor,
                geo: {
                    map: 'world50m', roam: true,
                    center: currentStormKey === 'all' ? [125, 20] : typhoons[currentStormKey].nodes[0].coord,
                    zoom: currentStormKey === 'all' ? 4.5 : 6.5,
                    itemStyle: { areaColor: areaColor, borderColor: borderColor, borderWidth: 0.8 }
                },
                tooltip: {
                    trigger: 'item', backgroundColor: tooltipBg, textStyle: { color: tooltipText, fontSize: 12 },
                    formatter: function(params) {
                        const d = params.data;
                        if (!d || !d.nodeInfo) return params.name || '';
                        return `<div style="font-weight:bold; color:#06b6d4; margin-bottom:4px;">${d.stormName}</div>
                                <div style="font-size:11px;">時間: <b>${d.nodeInfo.time}</b></div>
                                <div style="font-size:11px;">強度: <span style="color:${d.intensityObj.color}; font-weight:bold;">${d.nodeInfo.intensity}</span></div>
                                <div style="font-size:11px;">風速: <b>${d.nodeInfo.wind}</b></div>
                                <div style="font-size:11px;">位置: <b>${d.nodeInfo.coordStr}</b></div>
                                <div style="font-size:11px;">距澳門: <b>${getDistanceAndDirectionToMacau(d.nodeInfo.coord[0], d.nodeInfo.coord[1])}</b></div>`;
                    }
                },
                series: seriesList
            };

            myChart.setOption(option, true);
            updateSidebarStats();
        }

        function updateSidebarStats() {
            const content = document.getElementById('storm-stats-content');
            if (currentStormKey === 'all') {
                document.getElementById('storm-name').innerText = "2024 氣旋總覽";
                document.getElementById('storm-category').innerText = "全年共 28 統";
                content.innerHTML = `<div class="text-xs text-slate-500 py-2">已載入香港天文台 2024 年全年度最佳路徑資料庫，請從上方下拉選單檢視單一颱風詳細路徑與節點紀錄。</div>`;
                return;
            }

            const st = typhoons[currentStormKey];
            document.getElementById('storm-name').innerText = st.name;
            const catEl = document.getElementById('storm-category');
            catEl.innerText = `峰值: ${st.category}`;
            
            let rows = '';
            st.nodes.forEach(n => {
                rows += `<tr class="border-b border-slate-200 dark:border-slate-800">
                    <td class="py-1 px-1">${n.time}</td>
                    <td class="py-1 px-1 font-bold" style="color:${getIntensity(n.intensity).color}">${n.intensity}</td>
                    <td class="py-1 px-1">${n.wind}</td>
                    <td class="py-1 px-1">${n.coordStr}</td>
                </tr>`;
            });

            content.innerHTML = `
                <div class="space-y-2 text-xs">
                    <div>峰值時間: <b class="font-mono">${st.peakTime}</b></div>
                    <div>最高風速: <b class="font-mono">${st.peakWind}</b></div>
                    <div>極值位置: <b class="font-mono">${st.coords}</b></div>
                    <div class="pt-2 font-bold border-t border-slate-200 dark:border-slate-800">軌跡時間序列觀測表</div>
                    <div class="max-h-52 overflow-y-auto">
                        <table class="w-full text-left font-mono text-[10px]">
                            <thead><tr class="text-slate-400 border-b border-slate-700"><th>時間</th><th>強度</th><th>風速</th><th>位置</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function switchStorm(key) {
            currentStormKey = key;
            renderChart(true);
        }

        window.onload = () => initVectorMap();
    </script>
</body>
