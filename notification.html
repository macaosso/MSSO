<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macau Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center py-8 px-4">

    <!-- Container -->
    <div class="w-full max-w-4xl space-y-6">
        
        <!-- Header & Notification Control -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-cloud-sun text-amber-400"></i> Macau Weather
                </h1>
                <p class="text-slate-400 text-sm mt-1" id="last-updated">Loading live data...</p>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="notify-btn" onclick="toggleNotifications()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-bell"></i> Enable Notifications
                </button>
                <button onclick="testNotification()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl transition text-sm">
                    Test Alert
                </button>
            </div>
        </header>

        <!-- Current Weather Card -->
        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div id="current-card" class="md:col-span-1 bg-gradient-to-br from-indigo-950 to-slate-900 border border-indigo-900/50 p-6 rounded-2xl shadow-xl flex flex-col justify-between">
                <div>
                    <span class="text-xs uppercase tracking-wider bg-indigo-500/20 text-indigo-300 font-semibold px-3 py-1 rounded-full">Current Weather</span>
                    <div class="my-6 flex items-center justify-between">
                        <div>
                            <h2 id="current-temp" class="text-5xl font-extrabold tracking-tight">--°C</h2>
                            <p id="weather-desc" class="text-slate-400 mt-2 font-medium">Fetching conditions...</p>
                        </div>
                        <div id="weather-icon" class="text-5xl text-amber-400">
                            <i class="fa-solid fa-sun"></i>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-800 text-sm">
                    <div>
                        <span class="text-slate-400 block">Feels Like</span>
                        <strong id="feels-like" class="text-base">--°C</strong>
                    </div>
                    <div>
                        <span class="text-slate-400 block">Humidity</span>
                        <strong id="humidity" class="text-base">--%</strong>
                    </div>
                </div>
            </div>

            <!-- Details & Highlights -->
            <div class="md:col-span-2 grid grid-cols-2 sm:grid-cols-3 gap-4">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col justify-center">
                    <span class="text-slate-400 text-sm flex items-center gap-2"><i class="fa-solid fa-wind text-sky-400"></i> Wind Speed</span>
                    <strong id="wind-speed" class="text-xl font-bold mt-2">-- km/h</strong>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col justify-center">
                    <span class="text-slate-400 text-sm flex items-center gap-2"><i class="fa-solid fa-sun text-yellow-400"></i> UV Index</span>
                    <strong id="uv-index" class="text-xl font-bold mt-2">--</strong>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col justify-center col-span-2 sm:col-span-1">
                    <span class="text-slate-400 text-sm flex items-center gap-2"><i class="fa-solid fa-temperature-three-quarters text-rose-400"></i> Tomorrow High</span>
                    <strong id="tomorrow-high" class="text-xl font-bold mt-2">--°C</strong>
                </div>
            </div>
        </main>

        <!-- 7-Day Forecast Section -->
        <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-calendar-days text-indigo-400"></i> Daily Forecast</h3>
            <div id="forecast-list" class="space-y-3">
                <!-- Populated via JS -->
            </div>
        </section>

    </div>

    <!-- Script Logic -->
    <script>
        const LAT = 22.214016;
        const LON = 113.546198;
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,apparent_temperature,wind_speed_10m,uv_index&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,weather_code,precipitation_probability_max,precipitation_sum&timezone=Asia/Macau&past_days=1`;

        let weatherDataGlobal = null;

        const weatherCodes = {
            0: { label: "Clear Sky", icon: "fa-sun text-amber-400" },
            1: { label: "Mainly Clear", icon: "fa-cloud-sun text-amber-300" },
            2: { label: "Partly Cloudy", icon: "fa-cloud-sun text-slate-300" },
            3: { label: "Overcast", icon: "fa-cloud text-slate-400" },
            51: { label: "Light Drizzle", icon: "fa-cloud-rain text-sky-400" },
            61: { label: "Rain", icon: "fa-cloud-showers-heavy text-blue-500" },
            95: { label: "Thunderstorm", icon: "fa-cloud-bolt text-purple-400" }
        };

        async function fetchWeather() {
            try {
                const response = await fetch(weatherUrl);
                const data = await response.json();
                weatherDataGlobal = data;
                renderWeather(data);
                checkNotificationStatus();
            } catch (error) {
                console.error("Failed to fetch weather data:", error);
            }
        }

        function renderWeather(data) {
            const current = data.current;
            const daily = data.daily;

            document.getElementById('current-temp').innerText = `${Math.round(current.temperature_2m)}°C`;
            document.getElementById('feels-like').innerText = `${Math.round(current.apparent_temperature)}°C`;
            document.getElementById('humidity').innerText = `${current.relative_humidity_2m}%`;
            document.getElementById('wind-speed').innerText = `${current.wind_speed_10m} km/h`;
            document.getElementById('uv-index').innerText = current.uv_index;
            document.getElementById('last-updated').innerText = `Macau • Updated: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

            const weatherInfo = weatherCodes[current.weather_code] || { label: "Fair", icon: "fa-sun text-amber-400" };
            document.getElementById('weather-desc').innerText = weatherInfo.label;
            document.getElementById('weather-icon').innerHTML = `<i class="fa-solid ${weatherInfo.icon}"></i>`;

            // Tomorrow High (Index 2 if past_days=1 and index 0 is yesterday, index 1 is today, index 2 is tomorrow)
            const tomorrowMax = daily.temperature_2m_max[2] ?? daily.temperature_2m_max[1];
            document.getElementById('tomorrow-high').innerText = `${Math.round(tomorrowMax)}°C`;

            // Daily List
            const forecastList = document.getElementById('forecast-list');
            forecastList.innerHTML = '';
            for (let i = 1; i < daily.time.length; i++) {
                const dateStr = daily.time[i];
                const max = Math.round(daily.temperature_2m_max[i]);
                const min = Math.round(daily.temperature_2m_min[i]);
                const code = daily.weather_code[i];
                const info = weatherCodes[code] || { label: "Normal", icon: "fa-cloud" };

                forecastList.innerHTML += `
                    <div class="flex items-center justify-between p-3 bg-slate-950/40 rounded-xl border border-slate-800/60">
                        <span class="text-sm font-medium w-28 text-slate-300">${dateStr}</span>
                        <span class="text-sm flex items-center gap-2"><i class="fa-solid ${info.icon}"></i> ${info.label}</span>
                        <span class="text-sm font-semibold">${max}°C / <span class="text-slate-400">${min}°C</span></span>
                    </div>
                `;
            }
        }

        // --- Notification Logic ---

        function checkNotificationStatus() {
            const btn = document.getElementById('notify-btn');
            if (!("Notification" in window)) {
                btn.innerText = "Unsupported Browser";
                btn.disabled = true;
                return;
            }
            if (Notification.permission === "granted") {
                btn.innerHTML = `<i class="fa-solid fa-bell-slash"></i> Notifications Active`;
                btn.classList.replace('bg-indigo-600', 'bg-emerald-600');
                btn.classList.replace('hover:bg-indigo-500', 'hover:bg-emerald-500');
                scheduleDailyNotification();
            }
        }

        async function toggleNotifications() {
            if (!("Notification" in window)) {
                alert("This browser does not support desktop notifications.");
                return;
            }

            let permission = await Notification.requestPermission();
            if (permission === "granted") {
                new Notification("Weather Alerts Enabled!", {
                    body: "You will receive tomorrow's weather forecast every day at 17:00, plus heat advisories.",
                    icon: "https://cdn-icons-png.flaticon.com/512/1163/1163624.png"
                });
                checkNotificationStatus();
            } else {
                alert("Notification permission was denied.");
            }
        }

        function testNotification() {
            if (Notification.permission === "granted") {
                sendWeatherNotification(true);
            } else {
                alert("Please enable notifications first!");
            }
        }

        function scheduleDailyNotification() {
            const now = new Date();
            const target = new Date();
            target.setHours(17, 0, 0, 0);

            if (now > target) {
                target.setDate(target.getDate() + 1); // If past 17:00, schedule for tomorrow
            }

            const diff = target.getTime() - now.getTime();
            setTimeout(() => {
                sendWeatherNotification(false);
                // Repeat every 24 hours
                setInterval(() => sendWeatherNotification(false), 24 * 60 * 60 * 1000);
            }, diff);
        }

        function sendWeatherNotification(isTest = false) {
            if (!weatherDataGlobal) return;

            const daily = weatherDataGlobal.daily;
            const tomorrowMax = daily.temperature_2m_max[2] ?? daily.temperature_2m_max[1];
            const tomorrowCode = daily.weather_code[2] ?? daily.weather_code[1];
            const info = weatherCodes[tomorrowCode] || { label: "Fair" };

            let title = isTest ? "🧪 Test Weather Alert (Macau)" : "🌤️ Macau Weather Update (17:00)";
            let body = `Tomorrow's Forecast: ${info.label}, High: ${Math.round(tomorrowMax)}°C.`;

            if (tomorrowMax >= 30) {
                body += ` ⚠️ High Temperature Warning: Expected to reach or exceed 30°C! Stay hydrated.`;
            }

            new Notification(title, {
                body: body,
                icon: "https://cdn-icons-png.flaticon.com/512/1163/1163624.png"
            });
        }

        // Initialize App
        fetchWeather();
    </script>
</body>
</html>
