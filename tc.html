<head>

    <!-- Tailwind CSS -->

    <!-- FontAwesome -->

    <!-- 引入自動農曆計算套件 -->

    <style>
        ::-webkit-scrollbar {

            width: 6px;

            border-radius: 4px;

        ::-webkit-scrollbar-thumb {

            border-radius: 4px;
        }

    <!-- 頁面載入前先執行主題判斷，避免畫面閃爍 -->
    <script>
        const currentHour = new Date().getHours();
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme) {
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } else {
            // 08:00 - 20:00 預設為亮色模式，其餘時間預設為暗色模式
            if (currentHour >= 8 && currentHour < 20) {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        }
    </script>

                <div class="warning-header flex flex-col md:flex-row justify-between items-start md:items-center mb-4 pb-3 border-b border-slate-100 dark:border-slate-800 gap-2">

                    <!-- 風速分級圖例 -->

                        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-[#DDDFE2]"></span>LPA</span>

    <!-- 底部固定導航欄 -->
    <nav class="bottom-fixed-bar fixed bottom-0 left-0 right-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 shadow-lg px-4 py-2 transition-colors">
        <div class="max-w-xl mx-auto flex justify-around items-center">
            <a href="index.html" class="bottom-bar-btn flex flex-col items-center gap-1 py-1 px-4 rounded-xl text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors" style="text-decoration: none;">
                <i class="fa-solid fa-cloud text-lg"></i>
                <span class="text-[11px]">天氣實況</span>

            <a href="tc.html" class="bottom-bar-btn active flex flex-col items-center gap-1 py-1 px-4 rounded-xl text-cyan-600 dark:text-cyan-400 font-semibold transition-colors" style="text-decoration: none;">
                <i class="fa-solid fa-hurricane text-lg"></i>

            <a href="forecast.html" class="bottom-bar-btn flex flex-col items-center gap-1 py-1 px-4 rounded-xl text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors" style="text-decoration: none;">

            </a>
            <a href="AQImap.html" class="bottom-bar-btn flex flex-col items-center gap-1 py-1 px-4 rounded-xl text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 transition-colors" style="text-decoration: none;">

    <!-- 引入獨立的 tc.js 邏輯 -->
    <script src="tc.js"></script>
    <script>
        // 主題切換邏輯
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        // 切換路徑圖顯示函數
        function switchTrackImage(imagePath, btnElement) {
            const imgEl = document.getElementById('tcTrackImageViewer');
            const mapContainer = document.getElementById('tcMapContainer');
            
            // 確保容器回復圖片檢視結構
            if (mapContainer && !document.getElementById('tcTrackImageViewer')) {
                mapContainer.innerHTML = `<img id="tcTrackImageViewer" src="${imagePath}" alt="熱帶氣旋路徑圖" class="w-full max-w-4xl h-auto object-contain rounded-xl shadow-md">`;
            } else if (imgEl) {
                imgEl.src = imagePath + '?' + new Date().getTime();
            }

            // 更新按鈕樣式狀態
            const buttons = document.querySelectorAll('#trackImageButtons button');
            buttons.forEach(btn => {
                btn.className = "px-3 py-1 text-xs bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl shadow-sm transition-colors";
            });
            if (btnElement) {
                btnElement.className = "px-3 py-1 text-xs bg-cyan-500 text-white rounded-xl shadow-sm transition-colors";
            }
        }

        // 動態加載氣旋按鈕與檢查圖片
        function initTrackButtons() {
            const container = document.getElementById('trackImageButtons');
            if (!container) return;

            // 保留「全部熱帶氣旋」按鈕
            container.innerHTML = `<button onclick="switchTrackImage('output/TC/all.png', this)" class="px-3 py-1 text-xs bg-cyan-500 text-white rounded-xl shadow-sm transition-colors">全部熱帶氣旋</button>`;

            if (typeof TC_WARNING_DATA === 'undefined' || !TC_WARNING_DATA || TC_WARNING_DATA.length === 0) {
                checkAllPngAndHandleMessage();
                return;
            }

            const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

            TC_WARNING_DATA.forEach((tc, index) => {
                const letter = tc.id || tc.letter || letters[index] || String.fromCharCode(65 + index);
                const name = tc.name || tc.stormName || `氣旋 ${letter}`;
                const imgPath = `output/TC/${letter}.png`;

                // 檢查圖片是否存在
                const img = new Image();
                img.src = imgPath;
                img.onload = function() {
                    const btn = document.createElement('button');
                    btn.className = "px-3 py-1 text-xs bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl shadow-sm transition-colors";
                    btn.textContent = name;
                    btn.onclick = function() { switchTrackImage(imgPath, this); };
                    container.appendChild(btn);
                };
            });

            setTimeout(checkAllPngAndHandleMessage, 400);
        }

        function checkAllPngAndHandleMessage() {
            const mapContainer = document.getElementById('tcMapContainer');
            const allImg = new Image();
            allImg.src = 'output/TC/all.png';
            allImg.onload = function() {
                // all.png 存在，正常顯示
            };
            allImg.onerror = function() {
                // 如果 all.png 不存在或沒有活躍氣旋
                if (mapContainer) {
                    mapContainer.innerHTML = '<div class="text-slate-400 py-12 text-center text-sm">現時沒有熱帶氣旋活躍</div>';
                }
            };
        }

        // 農曆簡體轉繁體
        function toTraditionalLunar(text) {
            if (!text) return '';
            const map = { '龙': '龍', '腊': '臘', '闰': '閏', '惊': '驚', '体': '體', '万': '萬', '时': '時', '后': '後', '发': '發', '马': '馬', '鸡': '雞', '猪': '豬' };
            return text.replace(/[龙腊闰惊体万时后发马鸡猪]/g, match => map[match] || match);
        }

        function updateDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekday = weekdays[now.getDay()];
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('current-datetime').textContent = `${year}年${month}月${day}日 (${weekday}) ${hours}:${minutes}`;

            const lunarEl = document.getElementById('lunar-date');
            if (lunarEl && typeof Solar !== 'undefined') {
                try {
                    const solar = Solar.fromDate(now);
                    const lunar = solar.getLunar();
                    lunarEl.textContent = `${lunar.getYearInGanZhi()}${toTraditionalLunar(lunar.getYearShengXiao())}年${toTraditionalLunar(lunar.getMonthInChinese())}月${toTraditionalLunar(lunar.getDayInChinese())}日`;
                } catch (e) {
                    lunarEl.textContent = '';
                }
            }
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);

        // 頁面載入後自動套用條件邏輯與排版渲染
        window.addEventListener('DOMContentLoaded', () => {
            const tcCard = document.getElementById('tcCard');
            if (typeof tcText === 'undefined' || !tcText || tcText.trim() === '') {
                if (tcCard) tcCard.style.display = 'none';
            } else {
                if (tcCard) tcCard.style.display = 'block';
                const tcContentEl = document.getElementById('tcContent');
                if (tcContentEl) tcContentEl.innerHTML = formatTextToHtml(tcText);
            }

            const tcNewsContentEl = document.getElementById('tcNewsContent');
            if (tcNewsContentEl) {
                if (typeof tcWarnings === 'undefined' || !tcWarnings || tcWarnings.trim() === '') {
                    tcNewsContentEl.innerHTML = '<p class="text-slate-500 dark:text-slate-400">現時沒有熱帶氣旋資訊及警報。</p>';
                } else {
                    tcNewsContentEl.innerHTML = formatTextToHtml(tcWarnings);
                }
            }

            if (typeof TC_WARNING_DATA !== 'undefined' && typeof renderTcForecastTable === 'function') {
                renderTcForecastTable(TC_WARNING_DATA);
            }

            // 初始化動態氣旋按鈕與檢查
            initTrackButtons();
        });
    </script>
