<!DOCTYPE html>
<html lang="zh-TW" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSSO GIS 颱風監控與氣旋檔案系統 - v4.1.3</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        terminal: {
                            bg: '#090d14',
                            surface: '#0f1722',
                            border: '#1e293b',
                            lightBg: '#f8fafc',
                            lightSurface: '#ffffff',
                            lightBorder: '#cbd5e1',
                            mint: '#10b981',
                            mintLight: '#34d399',
                            teal: '#0ea5e9'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- Turf.js Spatial Analysis Library for Cone Envelopes -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        #echarts-map {
            width: 100%;
            height: 100%;
            min-height: 450px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.6);
        }

        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-view-fade {
            animation: viewFadeIn 0.25s ease-out forwards;
        }

        /* Terminal Flat Panels & Borders */
        .term-panel {
            background: #ffffff;
            border: 1px solid #cbd5e1;
        }
        .dark .term-panel {
            background: #0f1722;
            border: 1px solid #1e293b;
        }

        .term-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .dark .term-card {
            background: #090d14;
            border: 1px solid #1e293b;
        }

        /* Active Nav Tab Indicator */
        .nav-tab {
            position: relative;
            transition: all 0.15s ease;
        }
        .nav-tab.active {
            color: #10b981;
            font-weight: 700;
        }
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: #10b981;
        }
    </style>
</head>

    <script>
        function updateClock() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const gmt8 = new Date(utc + (3600000 * 8));
            const hours = String(gmt8.getHours()).padStart(2, '0');
            const minutes = String(gmt8.getMinutes()).padStart(2, '0');
            const seconds = String(gmt8.getSeconds()).padStart(2, '0');
            const clockEl = document.getElementById('utc-clock');
            if (clockEl) {
                clockEl.innerText = `${hours}:${minutes}:${seconds}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('-translate-x-full');
        }

        // 初始化主題（預設 dark）
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        // 主題切換邏輯
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                renderChart(false);
                if (currentView === 'stats') renderLargeIntensityGraph();
            });
        }

        const TC_INTENSITY_TABLE = [
            {"code": "Ex",   "name": "溫帶氣旋",         "engName": "Extra-tropical Cyclone", "max_wind": -1,   "rangeText": "-",            "color": "#64748b"},
            {"code": "LPA",  "name": "低壓區",           "engName": "Low Pressure Area",      "max_wind": 40,   "rangeText": "≤ 40 km/h",    "color": "#64748b"},
            {"code": "TD",   "name": "熱帶低氣壓",       "engName": "Tropical Depression",    "max_wind": 62,   "rangeText": "41 - 62 km/h", "color": "#0ea5e9"},
            {"code": "TS",   "name": "熱帶風暴",         "engName": "Tropical Storm",         "max_wind": 87,   "rangeText": "63 - 87 km/h", "color": "#10b981"},
            {"code": "STS",  "name": "強烈熱帶風暴",     "engName": "Severe Tropical Storm",  "max_wind": 117,  "rangeText": "88 - 117 km/h","color": "#eab308"},
            {"code": "TY",   "name": "颱風",             "engName": "Typhoon",                "max_wind": 149,  "rangeText": "118 - 149 km/h","color": "#f97316"},
            {"code": "STY",  "name": "強颱風",           "engName": "Severe Typhoon",         "max_wind": 184,  "rangeText": "150 - 184 km/h","color": "#ef4444"},
            {"code": "SuTY", "name": "超強颱風",         "engName": "Super Typhoon",          "max_wind": 9999, "rangeText": "≥ 185 km/h",   "color": "#a855f7"},
        ];

        function getIntensity(windInput, isEx) {
            if (isEx || (typeof windInput === 'string' && windInput.toUpperCase() === 'EX')) {
                return TC_INTENSITY_TABLE[0];
            }
            const windKmh = parseFloat(windInput) || 0;
            for (let i = 1; i < TC_INTENSITY_TABLE.length; i++) {
                let item = TC_INTENSITY_TABLE[i];
                if (windKmh <= item.max_wind) return item;
            }
            return TC_INTENSITY_TABLE[TC_INTENSITY_TABLE.length - 1];
        }

        const legendContainer = document.getElementById('intensity-legend');
        if (legendContainer) {
            legendContainer.innerHTML = '';
            TC_INTENSITY_TABLE.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between space-x-3 font-mono";
                div.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-none inline-block shrink-0" style="background-color: ${item.color};"></span>
                        <span class="text-slate-700 dark:text-slate-300 font-semibold text-[11px]">${item.code} - ${item.name}</span>
                    </div>
                    <span class="text-slate-500 dark:text-slate-400 text-[10px] shrink-0">${item.rangeText}</span>
                `;
                legendContainer.appendChild(div);
            });
        }

        const MACAU_COORDS = [113.5685, 22.1595];

        function getDistanceAndDirectionToMacau(tLon, tLat) {
            if (tLon === undefined || tLat === undefined || isNaN(tLon) || isNaN(tLat)) {
                return "未知距離";
            }
            const R = 6371;
            const dLat = (tLat - MACAU_COORDS[1]) * Math.PI / 180;
            const dLon = (tLon - MACAU_COORDS[0]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(MACAU_COORDS[1] * Math.PI / 180) * Math.cos(tLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            let dist = R * c;
            dist = Math.round(dist / 10) * 10;

            const lat1Rad = MACAU_COORDS[1] * Math.PI / 180;
            const lat2Rad = tLat * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;

            const directions = [
                "N", "NNE", "NE", "ENE",
                "E", "ESE", "SE", "SSE",
                "S", "SSW", "SW", "WSW",
                "W", "WNW", "NW", "NNW"
            ];
            const index = Math.round((brng % 360) / 22.5) % 16;
            return `${directions[index]} ${dist} km`;
        }

        function getDirection(lon1, lat1, lon2, lat2) {
            if (lon1 === undefined || lat1 === undefined || lon2 === undefined || lat2 === undefined) {
                return "靜止";
            }
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const lat2Rad = lat2 * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;
            const directions = [
                "N", "NNE", "NE", "ENE",
                "E", "ESE", "SE", "SSE",
                "S", "SSW", "SW", "WSW",
                "W", "WNW", "NW", "NNW"
            ];
            return directions[Math.round((brng % 360) / 22.5) % 16];
        }

        function calculatePastMovement(pastNodes, currentIndex) {
            const curr = pastNodes[currentIndex];
            if (!curr || !curr.time) return "-";
            const currTime = new Date(curr.time).getTime();
            if (isNaN(currTime)) return "-";

            let targetNode = null;
            for (let j = currentIndex + 1; j < pastNodes.length; j++) {
                const nextTime = new Date(pastNodes[j].time).getTime();
                if (!isNaN(nextTime)) {
                    const diffHours = (nextTime - currTime) / (3600 * 1000);
                    if (Math.abs(diffHours - 6) < 0.5) {
                        targetNode = pastNodes[j];
                        break;
                    }
                }
            }

            if (!targetNode) {
                for (let j = currentIndex + 1; j < pastNodes.length; j++) {
                    const nextTime = new Date(pastNodes[j].time).getTime();
                    if (!isNaN(nextTime)) {
                        const diffHours = (nextTime - currTime) / (3600 * 1000);
                        if (diffHours > 0 && diffHours <= 9) {
                            targetNode = pastNodes[j];
                            break;
                        }
                    }
                }
            }

            if (!targetNode && currentIndex >= 2) {
                for (let j = currentIndex - 1; j >= 0; j--) {
                    const prevTime = new Date(pastNodes[j].time).getTime();
                    if (!isNaN(prevTime)) {
                        const diffHours = (currTime - prevTime) / (3600 * 1000);
                        if (Math.abs(diffHours - 6) < 0.5) {
                            const dist = turf.distance(turf.point([pastNodes[j].lon, pastNodes[j].lat]), turf.point([curr.lon, curr.lat]), { units: 'kilometers' });
                            const direction = getDirection(pastNodes[j].lon, pastNodes[j].lat, curr.lon, curr.lat);
                            const speed = Math.round(dist / 6);
                            return `${direction} ${speed} km/h`;
                        }
                    }
                }
            }

            if (targetNode) {
                const dist = turf.distance(turf.point([curr.lon, curr.lat]), turf.point([targetNode.lon, targetNode.lat]), { units: 'kilometers' });
                const currTimeNum = new Date(curr.time).getTime();
                const targetTimeNum = new Date(targetNode.time).getTime();
                const hoursDiff = (targetTimeNum - currTimeNum) / (3600 * 1000);
                const actualHours = hoursDiff > 0 ? hoursDiff : 6;
                const direction = getDirection(curr.lon, curr.lat, targetNode.lon, targetNode.lat);
                const speed = Math.round(dist / actualHours);
                return `${direction} ${speed} km/h`;
            }

            return "-";
        }

        function generateCircleCoords(centerLon, centerLat, radiusKm, numPoints = 64) {
            const coords = [];
            const R = 6371;
            for (let i = 0; i <= numPoints; i++) {
                const angle = (i / numPoints) * 2 * Math.PI;
                const dLat = (radiusKm / R) * (180 / Math.PI);
                const dLon = (radiusKm / R) * (180 / Math.PI) / Math.cos(centerLat * Math.PI / 180);
                const lon = centerLon + dLon * Math.cos(angle);
                const lat = centerLat + dLat * Math.sin(angle);
                coords.push([lon, lat]);
            }
            return coords;
        }

        function smoothLineCatmullRom(coords, samplesPerSegment = 20) {
            if (!coords || coords.length < 2) return coords;
            
            let pts = [coords[0], ...coords, coords[coords.length - 1]];
            let smooth = [];

            for (let i = 1; i < pts.length - 2; i++) {
                let p0 = pts[i - 1];
                let p1 = pts[i];
                let p2 = pts[i + 1];
                let p3 = pts[i + 2];

                for (let t = 0; t < samplesPerSegment; t++) {
                    let st = t / samplesPerSegment;
                    let t2 = st * st;
                    let t3 = t2 * st;

                    let x = 0.5 * ((2 * p1[0]) +
                        (-p0[0] + p2[0]) * st +
                        (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
                        (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);

                    let y = 0.5 * ((2 * p1[1]) +
                        (-p0[1] + p2[1]) * st +
                        (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
                        (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);

                    smooth.push([x, y]);
                }
            }
            smooth.push(coords[coords.length - 1]);
            return smooth;
        }

        const ERROR_HOURS = [0, 3, 6, 12, 18, 24, 36, 48, 60, 72, 96, 120];
        const ERROR_RADII_KM = [15, 26, 36, 58, 79, 100, 135, 170, 212.5, 255, 345, 465];

        function getRadiusForHour(hour) {
            if (hour <= ERROR_HOURS[0]) return ERROR_RADII_KM[0];
            if (hour >= ERROR_HOURS[ERROR_HOURS.length - 1]) return ERROR_RADII_KM[ERROR_RADII_KM.length - 1];

            for (let i = 0; i < ERROR_HOURS.length - 1; i++) {
                if (hour >= ERROR_HOURS[i] && hour <= ERROR_HOURS[i + 1]) {
                    const h1 = ERROR_HOURS[i], h2 = ERROR_HOURS[i + 1];
                    const r1 = ERROR_RADII_KM[i], r2 = ERROR_RADII_KM[i + 1];
                    const factor = (hour - h1) / (h2 - h1);
                    return r1 + factor * (r2 - r1);
                }
            }
            return ERROR_RADII_KM[ERROR_RADII_KM.length - 1];
        }

        function safeUnion(p1, p2) {
            if (!p1) return p2;
            if (!p2) return p1;
            try {
                return turf.union(turf.featureCollection([p1, p2]));
            } catch (e) {
                try { return turf.union(p1, p2); } catch (err) { return p1; }
            }
        }

        function makeSplitCone(points, forecastCoords) {
            if (!forecastCoords || forecastCoords.length < 2) return { fullCone: null };

            const smoothCoords = smoothLineCatmullRom(forecastCoords, 30);

            let origDistances = [0];
            for (let i = 1; i < points.length; i++) {
                const d = turf.distance(turf.point([points[i-1].lon, points[i-1].lat]), turf.point([points[i].lon, points[i].lat]), {units: 'kilometers'});
                origDistances.push(origDistances[i-1] + d);
            }
            const totalOrigDist = origDistances[origDistances.length - 1] || 1;

            let smoothDistances = [0];
            for (let i = 1; i < smoothCoords.length; i++) {
                const d = turf.distance(turf.point(smoothCoords[i-1]), turf.point(smoothCoords[i]), {units: 'kilometers'});
                smoothDistances.push(smoothDistances[i-1] + d);
            }
            const totalSmoothDist = smoothDistances[smoothDistances.length - 1] || 1;

            let circlesFull = [];

            for (let i = 0; i < smoothCoords.length; i++) {
                const coord = smoothCoords[i];
                const distAlong = smoothDistances[i];
                const fraction = totalSmoothDist === 0 ? 0 : distAlong / totalSmoothDist;
                const correspondingOrigDist = fraction * totalOrigDist;

                let hour = 0;
                for (let j = 0; j < points.length - 1; j++) {
                    if (correspondingOrigDist >= origDistances[j] && correspondingOrigDist <= origDistances[j+1]) {
                        const segDist = origDistances[j+1] - origDistances[j];
                        const segFactor = segDist === 0 ? 0 : (correspondingOrigDist - origDistances[j]) / segDist;
                        hour = points[j].hour + segFactor * (points[j+1].hour - points[j].hour);
                        break;
                    } else if (j === points.length - 2 && correspondingOrigDist > origDistances[j+1]) {
                        hour = points[points.length - 1].hour;
                    }
                }

                const radius = getRadiusForHour(hour);
                if (radius > 0) {
                    const circle = turf.buffer(turf.point(coord), radius, { units: "kilometers", steps: 64 });
                    circlesFull.push(circle);
                }
            }

            if (circlesFull.length === 0) return { fullCone: null };

            let fullCone = circlesFull[0];
            for (let i = 1; i < circlesFull.length; i++) {
                fullCone = safeUnion(fullCone, circlesFull[i]);
            }

            return { fullCone };
        }

        function calculateMovementStr(forecastPoints, forecastCoords, pastCoordsOnly) {
            let coordsToUse = forecastCoords;
            let pointsToUse = forecastPoints;

            if (!coordsToUse || coordsToUse.length < 2) {
                if (pastCoordsOnly && pastCoordsOnly.length >= 2) {
                    coordsToUse = pastCoordsOnly.slice(-2);
                    pointsToUse = null;
                } else {
                    return "-";
                }
            }
            
            let h24Coords = [];
            let h24Hours = 24;

            if (pointsToUse && pointsToUse.length >= 2) {
                let startH = pointsToUse[0].hour || 0;
                let ptsUpTo24 = [];
                for (let i = 0; i < pointsToUse.length; i++) {
                    ptsUpTo24.push([pointsToUse[i].lon, pointsToUse[i].lat]);
                    if (pointsToUse[i].hour >= startH + 24) {
                        h24Hours = pointsToUse[i].hour - startH;
                        break;
                    }
                }
                if (ptsUpTo24.length >= 2) {
                    h24Coords = ptsUpTo24;
                }
            }

            if (h24Coords.length < 2) {
                if (coordsToUse.length >= 2) {
                    h24Coords = coordsToUse.slice(0, 2);
                } else {
                    return "靜止 0 km/h";
                }
            }

            const pStart = h24Coords[0];
            const pEnd = h24Coords[1] || h24Coords[0];
            const direction = getDirection(pStart[0], pStart[1], pEnd[0], pEnd[1]);

            const samplesPerSegment = 30;
            const smoothCoords = smoothLineCatmullRom(h24Coords, samplesPerSegment);
            let curveDist = 0;
            for (let i = 0; i < smoothCoords.length - 1; i++) {
                curveDist += turf.distance(turf.point(smoothCoords[i]), turf.point(smoothCoords[i+1]), {units: 'kilometers'});
            }
            
            if (h24Hours <= 0) h24Hours = 24;
            const speed = Math.round(curveDist / h24Hours);
            return `${direction} ${speed} km/h`;
        }

        let typhoons = {};
        let currentStormKey = 'all';
        let currentSelectedYear = 'current';
        let myChart = null;
        let mapLoaded = false;
        let activeIntensityFilter = 'all';
        let currentView = 'map';

        function getHourFromCategory(cat) {
            const catLower = String(cat).toLowerCase();
            if (catLower === 'current' || catLower === '0h' || catLower === '0') return 0;
            return parseFloat(catLower.replace(/h/g, '')) || 0;
        }

        function parseCSVToTyphoon(csvText, letter) {
            const lines = csvText.split('\n');
            let currentMeta = null;
            let rows = [];

            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#') || line.toLowerCase().startsWith('category')) continue;
                const cols = line.split(',').map(c => c.trim());
                if (cols.length < 6) continue;

                const category = cols[0].toLowerCase();
                const time = cols[1];
                const rowName = cols[2];
                const lat = parseFloat(cols[3]);
                const lon = parseFloat(cols[4]);
                const rawWind = cols[5];

                if (isNaN(lat) || isNaN(lon)) continue;

                let isEx = false;
                let windVal = 0;
                if (rawWind && rawWind.toUpperCase() === 'EX') {
                    isEx = true;
                } else {
                    windVal = parseFloat(rawWind) || 0;
                }

                if (category === 'current' || category === '0h' || category === '0') {
                    currentMeta = { name: rowName || `Typhoon ${letter.toUpperCase()}`, time, lat, lon, wind: windVal, isEx };
                }

                rows.push({ category, time, name: rowName, lat, lon, wind: windVal, isEx, rawWind });
            }

            if (rows.length === 0) return null;

            if (!currentMeta) {
                const anchor = rows.find(r => r.category === '0h' || r.category === 'current' || r.category === '0') || rows[0];
                currentMeta = { name: anchor.name || `Typhoon ${letter.toUpperCase()}`, time: anchor.time, lat: anchor.lat, lon: anchor.lon, wind: anchor.wind, isEx: anchor.isEx };
            }

            const name = currentMeta.name;
            const intensityObj = getIntensity(currentMeta.wind, currentMeta.isEx);
            const categoryDesc = `${intensityObj.name}`;

            let past = [];
            let pastCoordsOnly = [];
            let forecastCoords = [];
            let forecastPoints = [];
            let pastNodes = [];
            let forecastNodes = [];

            let tempForecastRows = rows.filter(r => {
                const cat = r.category.toLowerCase();
                return cat === 'current' || cat === '0h' || cat === '0' || cat.includes('h') || !isNaN(parseInt(cat));
            });

            if (tempForecastRows.length === 0 && rows.length > 0) {
                tempForecastRows = rows;
            }

            let fPointsForCalc = [];
            let fCoordsForCalc = [];
            tempForecastRows.forEach(fr => {
                let hour = getHourFromCategory(fr.category);
                fCoordsForCalc.push([fr.lon, fr.lat]);
                fPointsForCalc.push({
                    lon: fr.lon,
                    lat: fr.lat,
                    hour: hour,
                    radius: getRadiusForHour(hour)
                });
            });

            let pastRows = rows.filter(r => r.category === 'past' || r.category === 'current' || r.category === '0h' || r.category === '0');
            if (pastRows.length === 0 && rows.length > 0) {
                pastRows = [rows[0]];
            }

            pastRows.forEach((r) => {
                const intensity = getIntensity(r.wind, r.isEx);
                pastNodes.push({
                    category: r.category,
                    time: r.time,
                    categoryCode: intensity.code,
                    categoryName: intensity.name,
                    color: intensity.color,
                    wind: r.isEx ? '-' : `${r.wind} km/h`,
                    windVal: r.wind,
                    isEx: r.isEx,
                    coordStr: `${r.lat.toFixed(1)}°N, ${r.lon.toFixed(1)}°E`,
                    lat: r.lat,
                    lon: r.lon,
                    coord: [r.lon, r.lat],
                    movementDir: '-',
                    distToMacau: getDistanceAndDirectionToMacau(r.lon, r.lat),
                    isPast: true
                });
            });

            pastNodes.forEach((node, idx) => {
                node.movementDir = calculatePastMovement(pastNodes, idx);
            });

            rows.forEach((r) => {
                const intensity = getIntensity(r.wind, r.isEx);
                let movementStr = '-';
                const catLower = String(r.category).toLowerCase();
                const isPast = catLower === 'past';
                
                if (!isPast) {
                    const fIndex = tempForecastRows.findIndex(fr => fr === r);
                    if (fIndex !== -1) {
                        let nextFr = tempForecastRows[fIndex + 1];
                        let prevFr = (fIndex + 1 >= tempForecastRows.length && fIndex > 0) ? tempForecastRows[fIndex - 1] : null;
                        
                        if (nextFr) {
                            let hA = getHourFromCategory(r.category);
                            let hB = getHourFromCategory(nextFr.category);
                            let dt = hB - hA;
                            if (dt <= 0) dt = 3; 
                            
                            let dist = turf.distance(
                                turf.point([r.lon, r.lat]),
                                turf.point([nextFr.lon, nextFr.lat]),
                                { units: 'kilometers' }
                            );
                            let direction = getDirection(r.lon, r.lat, nextFr.lon, nextFr.lat);
                            let speed = Math.round(dist / dt);
                            movementStr = `${direction} ${speed} km/h`;
                        } else if (prevFr) {
                            let hA = getHourFromCategory(prevFr.category);
                            let hB = getHourFromCategory(r.category);
                            let dt = hB - hA;
                            if (dt <= 0) dt = 3;
                            
                            let dist = turf.distance(
                                turf.point([prevFr.lon, prevFr.lat]),
                                turf.point([r.lon, r.lat]),
                                { units: 'kilometers' }
                            );
                            let direction = getDirection(prevFr.lon, prevFr.lat, r.lon, r.lat);
                            let speed = Math.round(dist / dt);
                            movementStr = `${direction} ${speed} km/h`;
                        }
                    }
                }

                if (isPast) return;

                const nodeInfo = {
                    category: r.category,
                    time: r.time,
                    categoryCode: intensity.code,
                    categoryName: intensity.name,
                    color: intensity.color,
                    wind: r.isEx ? '-' : `${r.wind} km/h`,
                    windVal: r.wind,
                    isEx: r.isEx,
                    coordStr: `${r.lat.toFixed(1)}°N, ${r.lon.toFixed(1)}°E`,
                    lat: r.lat,
                    lon: r.lon,
                    coord: [r.lon, r.lat],
                    movementDir: movementStr,
                    distToMacau: getDistanceAndDirectionToMacau(r.lon, r.lat),
                    isPast: false
                };
                forecastNodes.push(nodeInfo);
            });

            pastRows.forEach(pt => {
                past.push({ coord: [pt.lon, pt.lat], wind: pt.wind, isEx: pt.isEx });
                pastCoordsOnly.push([pt.lon, pt.lat]);
            });

            forecastCoords = fCoordsForCalc;
            forecastPoints = fPointsForCalc;

            const lastCoord = pastCoordsOnly[pastCoordsOnly.length - 1] || forecastCoords[0] || [currentMeta.lon, currentMeta.lat];
            const coordsStr = lastCoord ? `${lastCoord[1].toFixed(1)}°N, ${lastCoord[0].toFixed(1)}°E` : `${currentMeta.lat.toFixed(1)}°N, ${currentMeta.lon.toFixed(1)}°E`;
            const fCoordsForStorm = forecastCoords.length > 0 ? forecastCoords : [lastCoord];
            const movementStr = calculateMovementStr(forecastPoints, fCoordsForStorm, pastCoordsOnly);

            let nodeMap = new Map();
            [...pastNodes, ...forecastNodes].forEach(node => {
                nodeMap.set(node.time + "_" + node.coordStr, node);
            });
            let nodes = Array.from(nodeMap.values());

            return {
                name,
                category: categoryDesc,
                intensityObj,
                wind: currentMeta.isEx ? '-' : `${currentMeta.wind} km/h`,
                time: currentMeta.time,
                movement: movementStr,
                coords: coordsStr,
                past,
                pastCoordsOnly,
                forecast: forecastCoords.length > 0 ? forecastCoords : [lastCoord],
                forecastPoints,
                nodes,
                pastNodes,
                forecastNodes
            };
        }

        function parseHistoricalCSVToTyphoon(csvText, fileId, year) {
            const lines = csvText.split('\n');
            let rows = [];
            let currentStormName = `Typhoon ${fileId.toUpperCase()} (${year})`;

            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#') || line.toLowerCase().startsWith('time')) continue;
                const cols = line.split(',').map(c => c.trim());
                if (cols.length < 5) continue;

                const time = cols[0];
                const rowName = cols[1];
                const lat = parseFloat(cols[2]);
                const lon = parseFloat(cols[3]);
                const rawWind = cols[4];

                if (isNaN(lat) || isNaN(lon)) continue;
                if (rowName && rowName !== '') {
                    currentStormName = rowName;
                }

                let isEx = false;
                let windVal = 0;
                if (rawWind && rawWind.toUpperCase() === 'EX') {
                    isEx = true;
                } else {
                    windVal = parseFloat(rawWind) || 0;
                }

                rows.push({ time, name: currentStormName, lat, lon, wind: windVal, isEx });
            }

            if (rows.length === 0) return null;

            const name = rows.find(r => r.name && r.name !== `Typhoon ${fileId.toUpperCase()} (${year})`)?.name || currentStormName;
            const lastRow = rows[rows.length - 1];
            const maxWind = Math.max(...rows.map(r => r.wind));
            const intensityObj = getIntensity(maxWind, false);
            const categoryDesc = `${intensityObj.name}`;

            let past = [];
            let pastCoordsOnly = [];
            let pastNodes = [];

            rows.forEach((r) => {
                const intensity = getIntensity(r.wind, r.isEx);
                pastNodes.push({
                    category: 'past',
                    time: r.time,
                    categoryCode: intensity.code,
                    categoryName: intensity.name,
                    color: intensity.color,
                    wind: r.isEx ? '-' : `${r.wind} km/h`,
                    windVal: r.wind,
                    isEx: r.isEx,
                    coordStr: `${r.lat.toFixed(1)}°N, ${r.lon.toFixed(1)}°E`,
                    lat: r.lat,
                    lon: r.lon,
                    coord: [r.lon, r.lat],
                    movementDir: '-',
                    distToMacau: getDistanceAndDirectionToMacau(r.lon, r.lat),
                    isPast: true
                });
            });

            pastNodes.forEach((node, idx) => {
                node.movementDir = calculatePastMovement(pastNodes, idx);
            });

            pastNodes.forEach(node => {
                past.push({ coord: [node.lon, node.lat], wind: node.windVal, isEx: node.isEx });
                pastCoordsOnly.push([node.lon, node.lat]);
            });

            let closestDist = "-";
            let closestCoords = "-";
            let closestTime = "-";
            let minDist = Infinity;
            let closestNode = null;
            pastNodes.forEach(node => {
                const d = turf.distance(turf.point([node.lon, node.lat]), turf.point(MACAU_COORDS), { units: 'kilometers' });
                if (d < minDist) {
                    minDist = d;
                    closestNode = node;
                }
            });
            if (closestNode) {
                closestDist = closestNode.distToMacau;
                closestCoords = closestNode.coordStr;
                closestTime = closestNode.time;
            }

            const lastCoord = pastCoordsOnly[pastCoordsOnly.length - 1] || [113.5685, 22.1595];
            const coordsStr = `${lastCoord[1].toFixed(1)}°N, ${lastCoord[0].toFixed(1)}°E`;

            return {
                name,
                category: categoryDesc,
                intensityObj,
                wind: `${maxWind} km/h`,
                time: lastRow.time,
                movement: "-",
                coords: coordsStr,
                past,
                pastCoordsOnly,
                forecast: [lastCoord],
                forecastPoints: [],
                nodes: pastNodes,
                pastNodes,
                forecastNodes: [],
                closestDist,
                closestCoords,
                closestTime
            };
        }

        async function loadTyphoonCSVsForYear(year) {
            let loaded = {};
            
            if (year === 'current') {
                const files = ['A', 'B', 'C', 'D', 'E', 'F'];
                const promises = files.map(async (f) => {
                    try {
                        const response = await fetch(`TCdata/${f}.csv`);
                        if (!response.ok) return null;
                        const text = await response.text();
                        if (!text || text.trim() === '') return null;
                        const stormData = parseCSVToTyphoon(text, f);
                        return { key: f.toLowerCase(), data: stormData };
                    } catch (err) {
                        return null;
                    }
                });

                const results = await Promise.all(promises);
                results.forEach(res => {
                    if (res && res.data) {
                        loaded[res.key] = res.data;
                    }
                });
            } else {
                const yy = year.slice(2);
                let files = [];
                for (let i = 1; i <= 40; i++) {
                    files.push(yy + String(i).padStart(2, '0'));
                }
                for (let i = 1; i <= 15; i++) {
                    files.push(yy + 'TD' + i);
                }

                const promises = files.map(async (f) => {
                    try {
                        const response = await fetch(`TCdata/pastTC/${year}/${f}.csv`);
                        if (!response.ok) return null;
                        const text = await response.text();
                        if (!text || text.trim() === '') return null;
                        const stormData = parseHistoricalCSVToTyphoon(text, f, year);
                        return { key: f.toLowerCase(), data: stormData };
                    } catch (err) {
                        return null;
                    }
                });

                const results = await Promise.all(promises);
                results.forEach(res => {
                    if (res && res.data) {
                        loaded[res.key] = res.data;
                    }
                });
            }
            return loaded;
        }

                });

                if (!matchedInCurrent) {
                    let targetYear = null;
                    if (keyword.startsWith('26') || keyword.includes('2026')) targetYear = '2026';
                    else if (keyword.startsWith('25') || keyword.includes('2025')) targetYear = '2025';
                    else if (keyword.startsWith('24') || keyword.includes('2024')) targetYear = '2024';
                    else if (['a', 'b', 'c', 'd', 'e', 'f'].includes(keyword)) targetYear = 'current';

                    if (targetYear && targetYear !== currentSelectedYear) {

        function addTurfPolygonSeries(turfPoly, seriesList, styleOpts) {
            if (!turfPoly || !turfPoly.geometry) return;
            const geom = turfPoly.geometry;
            const coordsList = geom.type === 'Polygon' ? [geom.coordinates[0]] : 
                               geom.type === 'MultiPolygon' ? geom.coordinates.map(poly => poly[0]) : [];
            
            coordsList.forEach(ring => {
                seriesList.push({
                    type: 'custom',
                    coordinateSystem: 'geo',
                    z: 2.5,
                    data: [[0]],
                    renderItem: function(params, api) {
                        const points = ring.map(coord => api.coord(coord));
                        if (!points || points.some(p => !p || isNaN(p[0]) || isNaN(p[1]))) {
                            return { type: 'group', silent: true };
                        }
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: styleOpts,
                            silent: true
                        };
                    },
                    silent: true
                });
            });
        }

                    return;

                const stormKey = (currentStormKey === 'all' || !typhoons[currentStormKey]) ? keys[0] : currentStormKey;
                const storm = typhoons[stormKey];
                if (!storm) return;

                let pastNodes = storm.pastNodes || [];
                let forecastNodes = (storm.forecastNodes || []).filter(n => {
                    const cat = String(n.category).toLowerCase();
                    return cat !== 'current' && cat !== '0h' && cat !== '0';
                });

                let chartTimes = [];
                pastNodes.forEach(n => chartTimes.push(n.time));
                forecastNodes.forEach(n => {
                    if (!chartTimes.includes(n.time)) {
                        chartTimes.push(n.time);
                    }
                });

                let pastData = pastNodes.map(n => {
                    let wNum = parseFloat(n.wind) || 0;

                    return {
                        value: wNum,
                        itemStyle: { color: intensity.color },
                        intensityObj: intensity,
                        nodeInfo: n
                    };
                });

                for (let i = pastNodes.length; i < chartTimes.length; i++) {
                    pastData.push(null);
                }

                let forecastData = [];

                    forecastData.push(null);

                            type: 'line',
                            showAllSymbol: true,
                            symbolSize: 6,
                            symbol: 'square',
                            smooth: false,
                            lineStyle: { width: 2, color: '#10b981' },
                            itemStyle: { color: '#10b981' }
                        },
                        {
                            name: '預報強度',
                            data: forecastData,
                            type: 'line',
                            showAllSymbol: true,
                            symbolSize: 6,
                            symbol: 'square',
                            smooth: false,
                            lineStyle: { width: 2, type: 'dashed', color: '#0ea5e9' },
                            itemStyle: { color: '#0ea5e9' }
                        }
                    ],
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: isDark ? '#0f1722' : '#ffffff',
                        borderColor: isDark ? '#1e293b' : '#cbd5e1',
                        borderRadius: 0,
                        padding: [8, 12],
                        textStyle: { color: isDark ? '#f8fafc' : '#0f172a', fontSize: 11, fontFamily: 'JetBrains Mono' },
                        formatter: function(params) {
                            if (!params || params.length === 0) return '';
                            let validParam = params.find(p => p.data !== null && p.data !== undefined);
                            if (!validParam) return params[0].name;
                            const d = validParam.data;
                            if (!d) return validParam.name;
                            return `<div style="font-weight:bold; margin-bottom:2px;">[${validParam.axisValue}]</div>
                                    <div>風速: <span style="font-weight:bold;">${validParam.value} km/h</span> <span style="color:${d.intensityObj.color}; font-weight:bold;">(${d.intensityObj.code} - ${d.intensityObj.name})</span></div>`;
                        }
                    }
                }, true);
                chartInstance.resize();
            }, 50);
        }

        function renderDataTablesView() {
            const container = document.getElementById('data-tables-content');
            if (!container) return;

            const keys = Object.keys(typhoons);
            if (keys.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 py-12 text-xs font-mono">無可用的氣旋數據列表</div>';
                return;
            }

            const stormKey = (currentStormKey === 'all' || !typhoons[currentStormKey]) ? keys[0] : currentStormKey;
            const storm = typhoons[stormKey];
            if (!storm) return;

            const buildRows = (nodes) => {
                if (!nodes || nodes.length === 0) return `<tr><td colspan="6" class="text-center py-4 text-slate-400 font-mono">無數據</td></tr>`;
                return nodes.map(n => {
                    const dist = n.distToMacau || getDistanceAndDirectionToMacau(n.lon, n.lat);
                    const speed = n.movementDir || '-';
                    const windStr = n.isEx ? '-' : n.wind;
                    return `
                        <tr class="hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-colors border-b border-slate-100 dark:border-slate-800/60 text-xs font-mono">
                            <td class="py-2 px-2">${n.time || '-'}</td>
                            <td class="hidden sm:table-cell py-2 px-2">${n.lat !== undefined ? n.lat.toFixed(1) + '°N' : '-'}</td>
                            <td class="hidden sm:table-cell py-2 px-2">${n.lon !== undefined ? n.lon.toFixed(1) + '°E' : '-'}</td>
                            <td class="py-2 px-2">${dist}</td>
                            <td class="hidden sm:table-cell py-2 px-2">${speed}</td>
                            <td class="py-2 px-2">
                                <span class="px-1.5 py-0.5 text-[10px] font-bold border rounded-none" style="background-color: ${n.color}15; border-color: ${n.color}40; color: ${n.color};">${n.categoryCode}</span>
                            </td>
                            <td class="py-2 px-2 font-bold">${windStr}</td>
                        </tr>
                    `;
                }).join('');
            };

            const buildForecastRows = (nodes) => {
                const filteredNodes = nodes ? nodes.filter(n => {
                    const cat = String(n.category).toLowerCase();
                    return cat !== 'current' && cat !== '0h' && cat !== '0';
                }) : [];

                if (filteredNodes.length === 0) return `<tr><td colspan="6" class="text-center py-4 text-slate-400 font-mono">無預報數據</td></tr>`;
                return filteredNodes.map(n => {
                    const dist = n.distToMacau || getDistanceAndDirectionToMacau(n.lon, n.lat);
                    const speed = n.movementDir || '-';
                    const windStr = n.isEx ? '-' : n.wind;
                    return `
                        <tr class="hover:bg-slate-100 dark:hover:bg-slate-800/50 transition-colors border-b border-slate-100 dark:border-slate-800/60 text-xs font-mono">
                            <td class="py-2 px-2">${n.time || '-'}</td>
                            <td class="hidden sm:table-cell py-2 px-2">${n.lat !== undefined ? n.lat.toFixed(1) + '°N' : '-'}</td>
                            <td class="hidden sm:table-cell py-2 px-2">${n.lon !== undefined ? n.lon.toFixed(1) + '°E' : '-'}</td>
                            <td class="py-2 px-2">${dist}</td>
                            <td class="hidden sm:table-cell py-2 px-2">${speed}</td>
                            <td class="py-2 px-2">
                                <span class="px-1.5 py-0.5 text-[10px] font-bold border rounded-none" style="background-color: ${n.color}15; border-color: ${n.color}40; color: ${n.color};">${n.categoryCode}</span>
                            </td>
                            <td class="py-2 px-2 font-bold">${windStr}</td>
                        </tr>
                    `;
                }).join('');
            };

            let html = `<div class="font-bold text-xs sm:text-sm mb-2 font-mono flex items-center gap-2 uppercase" style="color: ${storm.intensityObj.color};">
                <i class="fa-solid fa-square text-[10px]"></i> ${storm.category} // ${storm.name}
            </div>`;

            if (currentSelectedYear === 'current') {
                const currentNodes = storm.nodes ? storm.nodes.filter(n => n.category === 'current' || n.category === '0h' || n.category === '0') : [];
                html += `
                    <div class="term-card rounded-none p-3 shadow-sm space-y-2 border font-mono">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">
                            // 實時資訊
                        </h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead>
                                    <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-400 text-[11px]">
                                        <th class="pb-2 px-2">時間</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">北緯</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">東經</th>
                                        <th class="pb-2 px-2">距離澳門</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">移動速度</th>
                                        <th class="pb-2 px-2">強度</th>
                                        <th class="pb-2 px-2">風速</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${buildRows(currentNodes.length > 0 ? currentNodes : (storm.pastNodes ? [storm.pastNodes[storm.pastNodes.length-1]] : []))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                html += `
                    <div class="term-card rounded-none p-3 shadow-sm space-y-2 border font-mono">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">
                            // 預報路徑
                        </h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead>
                                    <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-400 text-[11px]">
                                        <th class="pb-2 px-2">時間</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">北緯</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">東經</th>
                                        <th class="pb-2 px-2">距離澳門</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">移動速度</th>
                                        <th class="pb-2 px-2">強度</th>
                                        <th class="pb-2 px-2">風速</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${buildForecastRows(storm.forecastNodes)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                html += `
                    <div class="term-card rounded-none p-3 shadow-sm space-y-2 border font-mono">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">
                            // 過去路徑
                        </h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead>
                                    <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-400 text-[11px]">
                                        <th class="pb-2 px-2">時間</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">北緯</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">東經</th>
                                        <th class="pb-2 px-2">距離澳門</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">移動速度</th>
                                        <th class="pb-2 px-2">強度</th>
                                        <th class="pb-2 px-2">風速</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${buildRows(storm.pastNodes)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="term-card rounded-none p-3 shadow-sm space-y-2 border font-mono">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">
                            // 歷史路徑檔案
                        </h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead>
                                    <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-400 text-[11px]">
                                        <th class="pb-2 px-2">時間</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">北緯</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">東經</th>
                                        <th class="pb-2 px-2">距離澳門</th>
                                        <th class="hidden sm:table-cell pb-2 px-2">移動速度</th>
                                        <th class="pb-2 px-2">強度</th>
                                        <th class="pb-2 px-2">風速</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${buildRows(storm.pastNodes)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function renderChart(isStormSwitch = false) {
            renderSidebar();
            if (!myChart || currentView !== 'map') return;
            
            const isDark = document.documentElement.classList.contains('dark');
            
            const mapBgColor = isDark ? '#090d14' : '#f1f5f9';
            const areaColor = isDark ? '#101d2c' : '#e2e8f0';
            const borderColor = isDark ? '#1e293b' : '#cbd5e1';
            const emphAreaColor = isDark ? '#17283c' : '#cbd5e1';
            const emphBorderColor = isDark ? '#334155' : '#64748b';
            
            const gridMinorColor = isDark ? 'rgba(255, 255, 255, 0.03)' : 'rgba(0, 0, 0, 0.04)';
            const gridMajorColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.12)';
            const gridLabelColor = isDark ? 'rgba(255, 255, 255, 0.35)' : 'rgba(0, 0, 0, 0.4)';
            
            const ringColor = isDark ? '#475569' : '#94a3b8';
            const ringLabelColor = isDark ? '#94a3b8' : '#64748b';

            const showPast = true;
            const showForecast = true;
            const showEnvelope = true;
            const showNodes = true;
            const showRings = true;
            const showGrid = true;

            const seriesList = [];
            let keys = Object.keys(typhoons);

            const searchInput = document.getElementById('storm-search');
            const keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';

            let filteredKeys = keys.filter(k => {
                const st = typhoons[k];
                if (!st) return false;
                if (keyword && !st.name.toLowerCase().includes(keyword) && !k.toLowerCase().includes(keyword)) {
                    return false;
                }
                if (activeIntensityFilter !== 'all' && currentSelectedYear !== 'current') {
                    if (st.intensityObj.code !== activeIntensityFilter) return false;
                }
                return true;
            });

            if (showGrid) {
                const minorLines = [];
                for (let lon = -180; lon <= 180; lon += 5) {
                    minorLines.push({ coords: [[lon, -90], [lon, 90]] });
                }
                for (let lat = -90; lat <= 90; lat += 5) {
                    minorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 1,
                    polyline: true,
                    lineStyle: { color: gridMinorColor, width: 0.15, type: 'dashed' },
                    data: minorLines,
                    silent: true
                });

                const majorLines = [];
                for (let lon = -180; lon <= 180; lon += 30) {
                    majorLines.push({ coords: [[lon, -90], [lon, 90]] });
                }
                for (let lat = -90; lat <= 90; lat += 15) {
                    majorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    lineStyle: { color: gridMajorColor, width: 0.5, type: 'dashed' },
                    data: majorLines,
                    silent: true
                });

                const gridLabels = [];
                for (let lon = -180; lon <= 180; lon += 30) {
                    if (lon === 180 || lon === -180) continue;
                    gridLabels.push({ name: `${Math.abs(lon)}°${lon < 0 ? 'W' : 'E'}`, value: [lon, 0, 1], itemStyle: { opacity: 0 } });
                }
                for (let lat = -90; lat <= 90; lat += 15) {
                    if (lat === 0 || lat === 90 || lat === -90) continue;
                    gridLabels.push({ name: `${Math.abs(lat)}°${lat < 0 ? 'S' : 'N'}`, value: [0, lat, 1], itemStyle: { opacity: 0 } });
                }
                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 3,
                    data: gridLabels,
                    label: { show: true, formatter: '{b}', color: gridLabelColor, fontSize: 9, fontFamily: 'JetBrains Mono' },
                    silent: true
                });
            }

            if (showRings) {
                const ringDistances = [100, 200, 400, 800];
                const ringLines = [];
                const ringLabels = [];

                ringDistances.forEach(dist => {
                    const coords = generateCircleCoords(MACAU_COORDS[0], MACAU_COORDS[1], dist, 64);
                    ringLines.push({
                        coords: coords,
                        lineStyle: { color: ringColor, width: 0.8, type: 'dashed', opacity: 0.6 }
                    });

                    const latOffset = (dist / 6371) * (180 / Math.PI);
                    ringLabels.push({
                        name: `${dist} km`,
                        value: [MACAU_COORDS[0], MACAU_COORDS[1] - latOffset, 1],
                        itemStyle: { opacity: 0 }
                    });
                });

                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    data: ringLines,
                    silent: true
                });

                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 3,
                    data: ringLabels,
                    label: { show: true, formatter: '{b}', color: ringLabelColor, opacity: 0.8, fontSize: 9, fontFamily: 'JetBrains Mono', position: 'bottom' },
                    silent: true
                });
            }

            const renderTyphoonTracks = (st) => {
                if (!st.pastCoordsOnly) return;

                const smoothForecastCoords = smoothLineCatmullRom(st.forecast, 30);

                if (showEnvelope && st.forecastPoints && st.forecastPoints.length > 1) {
                    const cones = makeSplitCone(st.forecastPoints, st.forecast);
                    if (cones.fullCone) {
                        addTurfPolygonSeries(cones.fullCone, seriesList, {
                            fill: isDark ? 'rgba(14, 165, 233, 0.1)' : 'rgba(14, 165, 233, 0.08)',
                            stroke: isDark => 'rgba(14, 165, 233, 0.4)',
                            lineWidth: 1,
                            lineDash: [2, 2]
                        });
                    }
                }

                if (showPast && st.pastCoordsOnly && st.pastCoordsOnly.length >= 2) {
                    const validPastCoords = st.pastCoordsOnly.filter(c => c && !isNaN(c[0]) && !isNaN(c[1]));
                    if (validPastCoords.length >= 2) {
                        seriesList.push({
                            type: 'lines',
                            coordinateSystem: 'geo',
                            z: 3,
                            polyline: true,
                            lineStyle: { color: isDark ? '#ffffff' : '#0f172a', width: 1.5, opacity: 0.9 },
                            data: [{ coords: validPastCoords }],
                            silent: true
                        });
                    }
                }

                const pastScatterData = st.past.map(pt => {
                    const intensity = getIntensity(pt.wind, pt.isEx);
                    return {
                        name: `${st.name} 軌跡點`,
                        value: pt.coord ? [...pt.coord, 1] : [MACAU_COORDS[0], MACAU_COORDS[1], 1],
                        itemStyle: { color: intensity.color },
                        symbolSize: 6,
                        symbol: 'square',
                        windVal: pt.wind,
                        isEx: pt.isEx,
                        stormName: st.name,
                        intensityObj: intensity
                    };
                });

                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 4,
                    data: pastScatterData
                });

                if (showForecast && smoothForecastCoords && smoothForecastCoords.length >= 2 && currentSelectedYear === 'current') {
                    const validForecastCoords = smoothForecastCoords.filter(c => c && !isNaN(c[0]) && !isNaN(c[1]));
                    if (validForecastCoords.length >= 2) {
                        seriesList.push({
                            type: 'lines',
                            coordinateSystem: 'geo',
                            z: 3,
                            polyline: true,
                            lineStyle: { color: isDark ? '#cbd5e1' : '#475569', width: 1.5, type: 'dashed', opacity: 0.8 },
                            data: [{ coords: validForecastCoords }],
                            silent: true
                        });
                    }
                }

                if (showNodes && st.nodes) {
                    const scatterData = st.nodes.map((node) => {
                        const intensity = getIntensity(node.windVal, node.isEx);
                        const isEye = (currentSelectedYear === 'current') && (node.time === st.time || (st.pastNodes && st.pastNodes.length > 0 && node.time === st.pastNodes[st.pastNodes.length - 1].time));

                        return {
                            name: `${st.name} - ${node.time}`,
                            value: node.coord ? [...node.coord, 1] : [MACAU_COORDS[0], MACAU_COORDS[1], 1],
                            itemStyle: { color: intensity.color },
                            symbolSize: isEye ? 10 : 6,
                            symbol: 'square',
                            nodeInfo: node,
                            stormName: st.name,
                            intensityObj: intensity,
                            isEye: isEye
                        };
                    });

                    seriesList.push({
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        z: 5,
                        data: scatterData,
                        label: {
                            show: true,
                            formatter: function(params) {
                                if (params.data && params.data.isEye) {
                                    return `{bg| ${params.data.stormName} }`;
                                }
                                return '';
                            },
                            backgroundColor: isDark ? 'rgba(9, 13, 20, 0.85)' : 'rgba(255, 255, 255, 0.9)',
                            borderColor: isDark ? '#334155' : '#cbd5e1',
                            borderWidth: 1,
                            padding: [2, 4],
                            borderRadius: 0,
                            position: 'right',
                            color: isDark ? '#f8fafc' : '#0f172a',
                            fontSize: 10,
                            fontFamily: 'JetBrains Mono',
                            rich: {
                                bg: { fontWeight: 'bold' }
                            }
                        }
                    });
                }
            };

            if (currentStormKey === 'all') {
                filteredKeys.forEach(k => {
                    const st = typhoons[k];
                    if (st) renderTyphoonTracks(st);
                });
            } else {
                const st = typhoons[currentStormKey];
                if (st) renderTyphoonTracks(st);
            }

            if (showMacau) {
                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 6,
                    data: [{
                        name: '澳門',
                        value: [...MACAU_COORDS, 1]
                    }],
                    symbol: 'square',
                    symbolSize: 8,
                    itemStyle: { color: '#10b981' },
                    label: {
                        show: true,
                        formatter: ' MACAU',
                        position: 'right',
                        color: isDark ? '#10b981' : '#059669',
                        fontSize: 10,
                        fontWeight: 'bold',
                        fontFamily: 'JetBrains Mono'
                    }
                });
            }

            let mapCenter = [130, 15];
            let mapZoom = 4.2;
            if (currentStormKey !== 'all') {
                const bounds = getStormBounds(currentStormKey);
                mapCenter = bounds.center;
                mapZoom = bounds.zoom;
            } else if (filteredKeys.length === 1) {
                const bounds = getStormBounds(filteredKeys[0]);
                mapCenter = bounds.center;
                mapZoom = bounds.zoom;
            }

            myChart.setOption({
                backgroundColor: mapBgColor,
                geo: {
                    map: 'world50m',
                    roam: true,
                    zoom: mapZoom,
                    center: mapCenter,
                    scaleLimit: { min: 2, max: 25 },
                    itemStyle: {
                        areaColor: areaColor,
                        borderColor: borderColor,
                        borderWidth: 0.5
                    },
                    emphasis: {
                        itemStyle: {
                            areaColor: emphAreaColor,
                            borderColor: emphBorderColor,
                            borderWidth: 1
                        },
                        label: { show: false }
                    },
                    select: { disabled: true }
                },
                series: seriesList,
                tooltip: {
                    trigger: 'item',
                    backgroundColor: isDark ? '#0f1722' : '#ffffff',
                    borderColor: isDark ? '#1e293b' : '#cbd5e1',
                    borderRadius: 0,
                    padding: [8, 12],
                    textStyle: { color: isDark ? '#f8fafc' : '#0f172a', fontSize: 11, fontFamily: 'JetBrains Mono' },
                    formatter: function(params) {
                        if (!params || !params.data) return '';
                        const d = params.data;
                        if (d.nodeInfo) {
                            const n = d.nodeInfo;
                            const dist = n.distToMacau || getDistanceAndDirectionToMacau(n.lon, n.lat);
                            return `<div style="font-weight:bold; margin-bottom:3px;">[${d.stormName}] ${n.time}</div>
                                    <div>強度: <span style="color:${d.intensityObj.color}; font-weight:bold;">${d.intensityObj.code} - ${d.intensityObj.name}</span></div>
                                    <div>風速: <span style="font-weight:bold;">${n.wind}</span></div>
                                    <div>位置: <span style="font-weight:bold;">${n.coordStr}</span></div>
                                    <div>距離澳門: <span style="font-weight:bold;">${dist}</span></div>
                                    <div>移動: <span style="font-weight:bold;">${n.movementDir || '-'}</span></div>`;
                        } else if (d.intensityObj) {
                            return `<div style="font-weight:bold; margin-bottom:3px;">[${d.stormName}] 軌跡點</div>
                                    <div>強度: <span style="color:${d.intensityObj.color}; font-weight:bold;">${d.intensityObj.code} - ${d.intensityObj.name}</span></div>
                                    <div>風速: <span style="font-weight:bold;">${d.isEx ? '-' : d.windVal + ' km/h'}</span></div>`;
                        } else if (params.name === '澳門') {
                            return `<div style="font-weight:bold;">澳門特別行政區</div><div style="font-size:10px; color:#10b981;">[113.57°E, 22.16°N]</div>`;
                        }
                        return params.name || '';
                    }
                }
            }, true);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initVectorMap();
        });
    </script>
</body>
</html>
