<!DOCTYPE html>
<html lang="zh-TW" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MSSO GIS 颱風監控與氣旋檔案系統 - v4.1.4</title>

    <!-- Google Fonts : monospace terminal aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- Turf.js Spatial Analysis Library for Cone Envelopes -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        /* ===== 設計令牌（終端／儀表板風格）===== */
        html.dark {
            --bg-page: #0b1013;
            --bg:      #0e1418;
            --bg-2:    #121a1f;
            --line:    #1f282e;
            --line-strong: #2b373e;
            --text:    #e6e9e9;
            --muted:   #93a0a6;
            --faint:   #5f6b72;
            --accent:  #3fd9a4;
            --cream:   #e7e2d2;
            --cream-text: #12181b;
            --c-red-rgb:    255,107,107;
            --c-orange-rgb: 255,150,90;
            --c-amber-rgb:  255,200,87;
            --c-yellow-rgb: 230,225,130;
            --c-green-rgb:  63,217,164;
            --c-sky-rgb:    96,185,235;
            --c-blue-rgb:   96,155,235;
            --c-indigo-rgb: 130,140,250;
            --c-purple-rgb: 180,150,255;
            --c-rose-rgb:   255,110,150;
            --c-cyan-rgb:   105,225,240;
            --c-slate-rgb:  150,165,170;
        }
        html:not(.dark) {
            --bg-page: #edebe2;
            --bg:      #f4f2ea;
            --bg-2:    #eae8dc;
            --line:    #d6d3c4;
            --line-strong: #bfbcab;
            --text:    #1a1e20;
            --muted:   #5c6663;
            --faint:   #8b948f;
            --accent:  #0b9a6b;
            --cream:   #181d20;
            --cream-text: #f1eee2;
            --c-red-rgb:    190,40,45;
            --c-orange-rgb: 200,90,20;
            --c-amber-rgb:  170,120,10;
            --c-yellow-rgb: 140,130,20;
            --c-green-rgb:  11,154,107;
            --c-sky-rgb:    20,120,180;
            --c-blue-rgb:   30,90,190;
            --c-indigo-rgb: 70,80,200;
            --c-purple-rgb: 110,70,200;
            --c-rose-rgb:   190,40,90;
            --c-cyan-rgb:   10,130,150;
            --c-slate-rgb:  90,100,105;
        }

        /* ===== 基礎 ===== */
        html, body { height: 100%; }
        body {
            background: var(--bg-page);
            color: var(--text);
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Noto Sans TC', monospace;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: rgba(var(--c-green-rgb), .28); }
        .num { font-variant-numeric: tabular-nums; }
        .micro { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
        .dim { color: var(--faint); }
        .mut { color: var(--muted); }
        .accent { color: var(--accent); }
        .t-rose { color: rgb(var(--c-rose-rgb)); }
        .t-cyan { color: rgb(var(--c-cyan-rgb)); }
        .t-blue { color: rgb(var(--c-blue-rgb)); }
        .t-amber { color: rgb(var(--c-amber-rgb)); }
        .t-slate { color: rgb(var(--c-slate-rgb)); }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ===== 滾動條 ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-strong); }
        ::-webkit-scrollbar-thumb:hover { background: var(--faint); }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

        #echarts-map {
            width: 100%;
            height: 100%;
            min-height: 450px;
        }

        /* ===== 頂欄 ===== */
        .topbar {
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }
        .brand-mark {
            position: relative;
            width: 28px; height: 28px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--line-strong); color: var(--accent); font-size: 13px;
        }
        .brand-title { font-size: 13px; font-weight: 700; letter-spacing: .14em; white-space: nowrap; }
        .brand-sub { color: var(--faint); font-size: 10px; letter-spacing: .18em; margin-left: 8px; }
        .head-pill {
            display: flex; align-items: center; gap: 8px;
            border: 1px solid var(--line); background: var(--bg-2);
            padding: 6px 10px;
        }

        /* ===== 導航分頁 ===== */
        .nav-tab {
            padding: 8px 14px; font-size: 11px; letter-spacing: .08em; font-weight: 600;
            color: var(--muted); background: transparent; border: none; cursor: pointer;
            font-family: inherit; transition: color .15s ease, background .15s ease;
        }
        .nav-tab:hover { color: var(--text); }
        .nav-tab.active {
            color: var(--accent);
            background: var(--bg-2);
            box-shadow: inset 0 -2px 0 var(--accent);
        }

        /* ===== 圖示按鈕 ===== */
        .icon-btn {
            width: 32px; height: 32px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border: 1px solid var(--line); background: transparent; color: var(--muted);
            cursor: pointer; text-decoration: none; font-size: 13px;
            transition: border-color .15s ease, color .15s ease;
        }
        .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
        html.dark .ic-moon { display: none; }
        html:not(.dark) .ic-sun { display: none; }

        /* ===== 側邊欄 ===== */
        .side-panel { background: var(--bg); border-right: 1px solid var(--line); }
        .side-foot { border-top: 1px solid var(--line); }

        /* ===== 面板 ===== */
        .panel { background: var(--bg); border: 1px solid var(--line); }
        .panel-title { font-size: 13px; font-weight: 700; letter-spacing: .12em; }
        .panel-num { color: var(--accent); }
        .view-head { padding-bottom: 12px; border-bottom: 1px solid var(--line); }

        /* ===== 徽章 / 標籤 ===== */
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 7px; font-size: 10px; font-weight: 700; letter-spacing: .08em;
            color: rgb(var(--bc-rgb, var(--c-slate-rgb)));
            background: rgba(var(--bc-rgb, var(--c-slate-rgb)), .13);
            border: 1px solid rgba(var(--bc-rgb, var(--c-slate-rgb)), .3);
            white-space: nowrap;
        }
        .b-green { --bc-rgb: var(--c-green-rgb); }
        .b-slate { --bc-rgb: var(--c-slate-rgb); }
        .tag {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 7px; font-size: 10px; font-weight: 700; letter-spacing: .08em;
            white-space: nowrap;
        }

        /* ===== 按鈕 ===== */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .06em;
            padding: 9px 14px; border: 1px solid var(--line);
            background: transparent; color: var(--text); cursor: pointer;
            transition: border-color .15s ease, color .15s ease, background .15s ease, filter .15s ease;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn:active { transform: translateY(1px); }
        .btn-primary { background: var(--cream); color: var(--cream-text); border-color: var(--cream); }
        .btn-primary:hover { filter: brightness(1.06); color: var(--cream-text); border-color: var(--cream); }
        .btn-ghost { border-color: var(--line-strong); }
        .btn-xs { padding: 6px 10px; font-size: 10px; letter-spacing: .08em; }

        /* ===== 過濾標籤 ===== */
        .chip {
            padding: 6px 10px; font-size: 10px; font-weight: 700; letter-spacing: .08em;
            white-space: nowrap; color: var(--muted); background: var(--bg-2);
            border: 1px solid var(--line); cursor: pointer; font-family: inherit;
            transition: color .15s ease, border-color .15s ease, background .15s ease;
        }
        .chip:hover { color: var(--text); }
        .chip:active { transform: scale(0.97); }
        .chip-active,
        .dark .chip-active {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(var(--c-green-rgb), .12);
        }

        /* ===== 表單控制 ===== */
        .form-control {
            width: 100%; background: var(--bg-2);
            border: 1px solid var(--line); border-radius: 0;
            color: var(--text); font-family: inherit; font-size: 12px;
            transition: border-color .15s ease;
        }
        .form-control::placeholder { color: var(--faint); }
        .form-control:focus { outline: none; border-color: var(--accent); }
        .form-control option { background: var(--bg-2); color: var(--text); }
        select.form-control { cursor: pointer; }

        /* ===== 氣旋卡片 / 統計列 / 圖例列 ===== */
        .storm-card {
            background: var(--bg-2); border: 1px solid var(--line);
            transition: border-color .15s ease;
        }
        .storm-card:hover { border-color: var(--accent); }
        .stat-row {
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            padding: 8px 10px; background: var(--bg-2); border: 1px solid var(--line);
        }
        .stat-accent {
            border-color: rgba(var(--c-green-rgb), .45);
            background: rgba(var(--c-green-rgb), .07);
        }
        .legend-row { background: var(--bg-2); border: 1px solid var(--line); }

        /* ===== 數據表格 ===== */
        .data-table thead th {
            font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
            color: var(--muted); font-weight: 700;
            border-bottom: 1px solid var(--line);
        }
        .data-table tbody tr td { border-top: 1px solid var(--line); }
        .data-table tbody tr:first-child td { border-top: none; }
        .data-table tbody tr { transition: background .12s ease; }
        .data-table tbody tr:hover { background: rgba(var(--c-green-rgb), .05); }

        /* ===== 底部行動導航 ===== */
        .mobile-nav {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
            background: var(--bg);
            border-top: 1px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .mnav-btn {
            flex: 1; position: relative;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 9px 0 7px; font-size: 10px; letter-spacing: .14em; font-weight: 600;
            color: var(--faint); background: none; border: none; cursor: pointer;
            font-family: inherit; transition: color .15s ease;
        }
        .mnav-btn:hover { color: var(--muted); }
        .mnav-btn.active { color: var(--accent); }
        .mnav-btn.active::after {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 18px; height: 2px; background: var(--accent);
        }

        /* ===== 動畫 ===== */
        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: .3; }
        }
        .pulse-dot { animation: pulseDot 2s infinite ease-in-out; }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.5); opacity: 0.15; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }
        .pulse-beacon { animation: pulse-ring 2s infinite ease-in-out; }

        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(6px) scale(0.995); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-view-fade { animation: viewFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden">

    <!-- 頂部導航欄 -->
    <header class="topbar h-14 flex items-center justify-between px-3 sm:px-5 z-40 shrink-0 gap-3">
        <div class="flex items-center gap-3 min-w-0">
            <span class="brand-mark">
                <i class="fa-solid fa-hurricane animate-spin" style="animation-duration: 9s; animation-direction: reverse;"></i>
                <span class="dot pulse-dot" style="position:absolute; top:-3px; right:-3px; width:5px; height:5px; border-radius:50%; background:var(--accent);"></span>
            </span>
            <div class="min-w-0 leading-tight">
                <h1 class="brand-title truncate">MSSO 熱帶氣旋 GIS<span class="brand-sub">v4.1.4</span></h1>
                <p class="micro dim hidden lg:block">實時及歷史熱帶氣旋 GIS 監控系統</p>
            </div>
        </div>

        <!-- 導航分頁選項 -->
        <div class="hidden xl:flex items-center gap-1 pl-4 border-l" style="border-color: var(--line);">
            <button id="nav-btn-map" onclick="switchView('map')" class="nav-tab active">
                <i class="fa-solid fa-map-location-dot mr-1.5 opacity-80"></i>地圖
            </button>
            <button id="nav-btn-stats" onclick="switchView('stats')" class="nav-tab">
                <i class="fa-solid fa-chart-line mr-1.5 opacity-80"></i>統計圖表
            </button>
            <button id="nav-btn-tables" onclick="switchView('tables')" class="nav-tab">
                <i class="fa-solid fa-table-list mr-1.5 opacity-80"></i>數據列表
            </button>
        </div>

        <div class="flex items-center gap-2 shrink-0">
            <!-- 年份與洋區選擇快捷標籤 -->
            <div class="hidden lg:flex head-pill">
                <span class="micro dim">年份</span>
                <span id="header-year-label" class="micro accent">即時監控</span>
                <span class="dim">|</span>
                <span class="micro dim">洋區</span>
                <span class="micro" style="color:var(--text);">西北太平洋</span>
            </div>

            <!-- 系統時間 -->
            <div class="hidden md:flex head-pill">
                <span class="dot pulse-dot" style="width:5px; height:5px; border-radius:50%; background:var(--accent); display:inline-block;"></span>
                <span class="num micro" style="color:var(--text);"><span id="utc-clock" class="accent">00:00:00</span> MST</span>
            </div>

            <!-- 行動裝置選單觸發按鈕 -->
            <button onclick="toggleMobileSidebar()" aria-label="開啟選單" class="icon-btn md:hidden">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- 主頁連結 -->
            <a href="https://macaosso.github.io/MSSO/index.html" class="icon-btn" title="返回首頁">
                <i class="fa-solid fa-house"></i>
            </a>

            <!-- 主題切換按鈕 -->
            <button id="theme-toggle" class="icon-btn" title="切換主題">
                <i class="fa-solid fa-moon ic-moon"></i>
                <i class="fa-solid fa-sun ic-sun"></i>
            </button>
        </div>
    </header>

    <!-- 主內容區塊 -->
    <div class="flex-1 flex relative overflow-hidden">

        <!-- 左側檔案庫控制與側邊欄 -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 z-30 w-[86%] max-w-[20rem] sm:w-[22rem] sm:max-w-none side-panel flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0 shrink-0">

            <!-- 搜尋與控制表單區 -->
            <div class="p-4 space-y-3.5" style="border-bottom: 1px solid var(--line);">
                <div class="flex items-center justify-between">
                    <h2 class="panel-title"><span class="panel-num">01</span> / 熱帶氣旋檔案庫</h2>
                    <button onclick="toggleMobileSidebar()" aria-label="關閉選單" class="icon-btn md:hidden">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- 搜尋框 -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none dim">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="storm-search" placeholder="搜尋編號或名稱..." oninput="filterStormList()" class="form-control pl-9 pr-3 py-2.5">
                </div>

                <!-- 下拉選單：年份與系統 -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div class="space-y-1.5">
                        <label class="micro dim block">年份選擇</label>
                        <select id="year-select" onchange="switchYear(this.value)" class="form-control px-3 py-2.5">
                            <option value="current" selected>即時監控</option>
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="micro dim block">活動颱風系統</label>
                        <select id="storm-select" onchange="switchStorm(this.value)" class="form-control px-3 py-2.5">
                            <option value="all" selected>載入中...</option>
                        </select>
                    </div>
                </div>

                <!-- 強度快捷過濾標籤列 (即時監控預設隱藏) -->
                <div id="intensity-filter-bar" class="hidden items-center gap-1.5 overflow-x-auto pb-1 pt-1 scrollbar-none">
                    <button onclick="filterByIntensity('all')" class="chip chip-active shrink-0">全部</button>
                    <button onclick="filterByIntensity('SuTY')" class="chip shrink-0">SuTY</button>
                    <button onclick="filterByIntensity('STY')" class="chip shrink-0">STY</button>
                    <button onclick="filterByIntensity('TY')" class="chip shrink-0">TY</button>
                    <button onclick="filterByIntensity('STS')" class="chip shrink-0">STS</button>
                    <button onclick="filterByIntensity('TS')" class="chip shrink-0">TS</button>
                    <button onclick="filterByIntensity('TD')" class="chip shrink-0">TD</button>
                </div>
            </div>

            <!-- 颱風詳情統計與動態清單卡片區 -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 overscroll-contain">
                <div id="storm-stats-content">
                    <!-- 動態填充統計或清單 -->
                </div>
            </div>

            <div class="side-foot flex items-center justify-between px-4 py-2.5">
                <span class="micro dim">MSSO GIS 向量引擎</span>
                <span class="micro accent">v4.1.4</span>
            </div>
        </aside>

        <!-- 主內容畫布區 (包含 地圖、統計圖表、數據列表 檢視切換) -->
        <main class="flex-1 relative h-full bg-transparent min-h-0 min-w-0 flex flex-col">
            <!-- 1. 地圖檢視 -->
            <div id="map-view-container" class="w-full h-full flex-1 relative flex flex-col animate-view-fade">
                <div id="echarts-map" class="w-full h-full flex-1"></div>

                <!-- 強度分級圖例 (右下角，行動端可摺疊) -->
                <div class="absolute bottom-20 xl:bottom-6 right-3 sm:right-6 z-20 w-[min(92vw,17rem)] pointer-events-none flex flex-col items-end">
                    <button onclick="toggleLegend()" class="md:hidden pointer-events-auto mb-2 btn btn-ghost btn-xs">
                        <i class="fa-solid fa-palette"></i> 強度分級
                    </button>
                    <div id="legend-panel" class="hidden md:block pointer-events-auto panel p-4 text-xs space-y-2 max-w-xs">
                        <div class="flex items-center justify-between mb-1.5" style="font-size:11px; font-weight:700; letter-spacing:.12em;">
                            <span><i class="fa-solid fa-palette accent mr-1.5"></i>強度分級</span>
                            <span class="micro dim">km/h</span>
                        </div>
                        <div id="intensity-legend" class="grid grid-cols-1 gap-1 text-[11px]"></div>
                    </div>
                </div>
            </div>

            <!-- 2. 統計圖表放大檢視 -->
            <div id="stats-view-container" class="w-full h-full flex-1 p-4 sm:p-6 pb-24 xl:pb-6 overflow-y-auto hidden flex-col space-y-4 animate-view-fade overscroll-contain">
                <div class="view-head flex items-center justify-between">
                    <h2 class="panel-title"><span class="panel-num">02</span> / 風速變化歷史圖表</h2>
                    <button onclick="switchView('map')" class="btn btn-ghost btn-xs">
                        <i class="fa-solid fa-arrow-left"></i> 返回地圖
                    </button>
                </div>
                <div class="panel p-4 sm:p-6 flex-1 flex flex-col min-h-[420px]">
                    <div id="large-wind-speed-chart" class="w-full flex-1 min-h-[380px]"></div>
                </div>
            </div>

            <!-- 3. 數據列表檢視 -->
            <div id="tables-view-container" class="w-full h-full flex-1 p-4 sm:p-6 pb-24 xl:pb-6 overflow-y-auto hidden flex-col space-y-6 animate-view-fade overscroll-contain">
                <div class="view-head flex items-center justify-between">
                    <h2 class="panel-title"><span class="panel-num">03</span> / 氣旋詳細數據列表</h2>
                    <button onclick="switchView('map')" class="btn btn-ghost btn-xs">
                        <i class="fa-solid fa-arrow-left"></i> 返回地圖
                    </button>
                </div>
                <div id="data-tables-content" class="space-y-6">
                    <!-- 動態填入表格 -->
                </div>
            </div>
        </main>
    </div>

    <!-- 側邊欄遮罩 (行動裝置) -->

    <script>
        function updateClock() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const gmt8 = new Date(utc + (3600000 * 8));
            const hours = String(gmt8.getHours()).padStart(2, '0');
            const minutes = String(gmt8.getMinutes()).padStart(2, '0');
            const seconds = String(gmt8.getSeconds()).padStart(2, '0');
            const clockEl = document.getElementById('utc-clock');
            if (clockEl) {
                clockEl.innerText = `${hours}:${minutes}:${seconds}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar) sidebar.classList.toggle('-translate-x-full');
            if (backdrop) backdrop.classList.toggle('hidden');
        }

        function toggleLegend() {
            const panel = document.getElementById('legend-panel');
            if (panel) panel.classList.toggle('hidden');
        }

        // 初始化主題（預設 dark）
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        // 主題切換邏輯
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {

                    localStorage.setItem('theme', 'dark');

                renderChart(false);
                if (currentView === 'stats') renderLargeIntensityGraph();

        }

        function loadingOpts(text) {
            const isDark = document.documentElement.classList.contains('dark');
            return {
                text: text,
                color: isDark ? '#3fd9a4' : '#0b9a6b',
                textColor: isDark ? '#e6e9e9' : '#1a1e20',
                maskColor: isDark ? 'rgba(11, 16, 19, 0.92)' : 'rgba(244, 242, 234, 0.92)',
                zlevel: 0
            };
        }

        const TC_INTENSITY_TABLE = [
            {"code": "Ex",   "name": "溫帶氣旋",         "engName": "Extra-tropical Cyclone", "max_wind": -1,   "rangeText": "-",            "color": "#64748b"},
            {"code": "LPA",  "name": "低壓區",           "engName": "Low Pressure Area",      "max_wind": 40,   "rangeText": "≤ 40 km/h",    "color": "#64748b"},
            {"code": "TD",   "name": "熱帶低氣壓",       "engName": "Tropical Depression",    "max_wind": 62,   "rangeText": "41 - 62 km/h", "color": "#0284c7"},
            {"code": "TS",   "name": "熱帶風暴",         "engName": "Tropical Storm",         "max_wind": 87,   "rangeText": "63 - 87 km/h", "color": "#16a34a"},
            {"code": "STS",  "name": "強烈熱帶風暴",     "engName": "Severe Tropical Storm",  "max_wind": 117,  "rangeText": "88 - 117 km/h","color": "#ca8a04"},
            {"code": "TY",   "name": "颱風",             "engName": "Typhoon",                "max_wind": 149,  "rangeText": "118 - 149 km/h","color": "#ea580c"},
            {"code": "STY",  "name": "強颱風",           "engName": "Severe Typhoon",         "max_wind": 184,  "rangeText": "150 - 184 km/h","color": "#dc2626"},
            {"code": "SuTY", "name": "超強颱風",         "engName": "Super Typhoon",          "max_wind": 9999, "rangeText": "≥ 185 km/h",   "color": "#9333ea"},
        ];

        function getIntensity(windInput, isEx) {
            if (isEx || (typeof windInput === 'string' && windInput.toUpperCase() === 'EX')) {
                return TC_INTENSITY_TABLE[0];
            }
            const windKmh = parseFloat(windInput) || 0;
            for (let i = 1; i < TC_INTENSITY_TABLE.length; i++) {
                let item = TC_INTENSITY_TABLE[i];
                if (windKmh <= item.max_wind) return item;
            }
            return TC_INTENSITY_TABLE[TC_INTENSITY_TABLE.length - 1];
        }

        const legendContainer = document.getElementById('intensity-legend');
        if (legendContainer) {
            legendContainer.innerHTML = '';
            TC_INTENSITY_TABLE.forEach(item => {
                const div = document.createElement('div');
                div.className = "legend-row flex items-center justify-between gap-3 px-2.5 py-1.5";
                div.innerHTML = `
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="w-2.5 h-2.5 inline-block shrink-0" style="background-color: ${item.color};"></span>
                        <span class="font-semibold text-[11px] truncate">${item.code} · ${item.name}</span>
                    </div>
                    <span class="num micro dim shrink-0">${item.rangeText}</span>
                `;
                legendContainer.appendChild(div);
            });
        }

        const MACAU_COORDS = [113.5685, 22.1595];

        function generateCircleCoords(lon, lat, radiusKm, steps = 64) {
            const coords = [];
            const R = 6371.0;
            const latRad = lat * Math.PI / 180;
            const lonRad = lon * Math.PI / 180;
            const angularDist = radiusKm / R;

            for (let i = 0; i <= steps; i++) {
                const angle = (i / steps) * 2 * Math.PI;
                const latI = Math.asin(
                    Math.sin(latRad) * Math.cos(angularDist) +
                    Math.cos(latRad) * Math.sin(angular_dist || angularDist) * Math.cos(angle)
                );
                const lonI = lonRad + Math.atan2(
                    Math.sin(angle) * Math.sin(angularDist) * Math.cos(latRad),
                    Math.cos(angularDist) - Math.sin(latRad) * Math.sin(latI)
                );
                coords.push([lonI * 180 / Math.PI, latI * 180 / Math.PI]);
            }
            return coords;
        }

        function getDistanceAndDirectionToMacau(tLon, tLat) {
            if (tLon === undefined || tLat === undefined || isNaN(tLon) || isNaN(tLat)) {
                return "未知距離";
            }
            const R = 6371;
            const dLat = (tLat - MACAU_COORDS[1]) * Math.PI / 180;
            const dLon = (tLon - MACAU_COORDS[0]) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(MACAU_COORDS[1] * Math.PI / 180) * Math.cos(tLat * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            let dist = R * c;
            dist = Math.round(dist / 10) * 10;

            const lat1Rad = MACAU_COORDS[1] * Math.PI / 180;
            const lat2Rad = tLat * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;

            const directions = [
                "N", "NNE", "NE", "ENE",
                "E", "ESE", "SE", "SSE",
                "S", "SSW", "SW", "WSW",
                "W", "WNW", "NW", "NNW"
            ];
            const index = Math.round((brng % 360) / 22.5) % 16;
            return `${directions[index]} ${dist} km`;
        }

        function getDirection(lon1, lat1, lon2, lat2) {
            if (lon1 === undefined || lat1 === undefined || lon2 === undefined || lat2 === undefined) {
                return "靜止";
            }
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const lat2Rad = lat2 * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            brng = (brng + 360) % 360;
            const directions = [
                "N", "NNE", "NE", "ENE",
                "E", "ESE", "SE", "SSE",
                "S", "SSW", "SW", "WSW",
                "W", "WNW", "NW", "NNW"
            ];
            return directions[Math.round((brng % 360) / 22.5) % 16];
        }

        function calculatePastMovement(pastNodes, currentIndex) {
            const curr = pastNodes[currentIndex];
            if (!curr || !curr.time) return "-";
            const currTime = new Date(curr.time).getTime();
            if (isNaN(currTime)) return "-";

            let targetNode = null;
            for (let j = currentIndex + 1; j < pastNodes.length; j++) {
                const nextTime = new Date(pastNodes[j].time).getTime();
                if (!isNaN(nextTime)) {
                    const diffHours = (nextTime - currTime) / (3600 * 1000);
                    if (Math.abs(diffHours - 6) < 0.5) {
                        targetNode = pastNodes[j];
                        break;
                    }
                }
            }

            if (!targetNode) {
                for (let j = currentIndex + 1; j < pastNodes.length; j++) {
                    const nextTime = new Date(pastNodes[j].time).getTime();
                    if (!isNaN(nextTime)) {
                        const diffHours = (nextTime - currTime) / (3600 * 1000);
                        if (diffHours > 0 && diffHours <= 9) {
                            targetNode = pastNodes[j];
                            break;
                        }
                    }
                }
            }

            if (!targetNode && currentIndex >= 2) {
                for (let j = currentIndex - 1; j >= 0; j--) {
                    const prevTime = new Date(pastNodes[j].time).getTime();
                    if (!isNaN(prevTime)) {
                        const diffHours = (currTime - prevTime) / (3600 * 1000);
                        if (Math.abs(diffHours - 6) < 0.5) {
                            const dist = turf.distance(turf.point([pastNodes[j].lon, pastNodes[j].lat]), turf.point([curr.lon, curr.lat]), { units: 'kilometers' });
                            const direction = getDirection(pastNodes[j].lon, pastNodes[j].lat, curr.lon, curr.lat);
                            const speed = Math.round(dist / 6);
                            return `${direction} ${speed} km/h`;
                        }
                    }
                }
            }

            if (targetNode) {
                const dist = turf.distance(turf.point([curr.lon, curr.lat]), turf.point([targetNode.lon, targetNode.lat]), { units: 'kilometers' });
                const currTimeNum = new Date(curr.time).getTime();
                const targetTimeNum = new Date(targetNode.time).getTime();
                const hoursDiff = (targetTimeNum - currTimeNum) / (3600 * 1000);
                const actualHours = hoursDiff > 0 ? hoursDiff : 6;
                const direction = getDirection(curr.lon, curr.lat, targetNode.lon, targetNode.lat);
                const speed = Math.round(dist / actualHours);
                return `${direction} ${speed} km/h`;
            }

            return "-";
        }

        function smoothLineCatmullRom(coords, samplesPerSegment = 20) {
            if (!coords || coords.length < 2) return coords;

            let uniqueCoords = [coords[0]];
            for (let i = 1; i < coords.length; i++) {
                const prev = uniqueCoords[uniqueCoords.length - 1];
                const curr = coords[i];
                if (prev[0] !== curr[0] || prev[1] !== curr[1]) {
                    uniqueCoords.push(curr);
                }
            }
            if (uniqueCoords.length < 2) return uniqueCoords;

            let pts = [uniqueCoords[0], ...uniqueCoords, uniqueCoords[uniqueCoords.length - 1]];
            let smooth = [];

            for (let i = 1; i < pts.length - 2; i++) {
                let p0 = pts[i - 1];
                let p1 = pts[i];
                let p2 = pts[i + 1];
                let p3 = pts[i + 2];

                for (let t = 0; t < samplesPerSegment; t++) {
                    let st = t / samplesPerSegment;
                    let t2 = st * st;
                    let t3 = t2 * st;

                    let x = 0.5 * ((2 * p1[0]) +
                        (-p0[0] + p2[0]) * st +
                        (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
                        (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);

                    let y = 0.5 * ((2 * p1[1]) +
                        (-p0[1] + p2[1]) * st +
                        (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - 3 * p3[1]) * t2 +
                        (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);

                    smooth.push([x, y]);
                }
            }
            smooth.push(uniqueCoords[uniqueCoords.length - 1]);
            return smooth;
        }

        const ERROR_HOURS = [0, 3, 6, 12, 18, 24, 36, 48, 60, 72, 96, 120];
        const ERROR_RADII_KM = [15, 26, 36, 58, 79, 100, 135, 170, 212.5, 255, 345, 465];

        function getRadiusForHour(hour) {
            if (hour <= ERROR_HOURS[0]) return ERROR_RADII_KM[0];
            if (hour >= ERROR_HOURS[ERROR_HOURS.length - 1]) return ERROR_RADII_KM[ERROR_RADII_KM.length - 1];

            for (let i = 0; i < ERROR_HOURS.length - 1; i++) {
                if (hour >= ERROR_HOURS[i] && hour <= ERROR_HOURS[i + 1]) {
                    const h1 = ERROR_HOURS[i], h2 = ERROR_HOURS[i + 1];
                    const r1 = ERROR_RADII_KM[i], r2 = ERROR_RADII_KM[i + 1];
                    const factor = (hour - h1) / (h2 - h1);
                    return r1 + factor * (r2 - r1);
                }
            }
            return ERROR_RADII_KM[ERROR_RADII_KM.length - 1];
        }

        function safeUnion(p1, p2) {
            if (!p1) return p2;
            if (!p2) return p1;
            try {
                return turf.union(turf.featureCollection([p1, p2]));
            } catch (e) {
                try { return turf.union(p1, p2); } catch (err) { return p1; }
            }
        }

        function makeSplitCone(points, forecastCoords) {
            if (!forecastCoords || forecastCoords.length < 2) return { fullCone: null };

            const smoothCoords = smoothLineCatmullRom(forecastCoords, 30);

            let origDistances = [0];
            for (let i = 1; i < points.length; i++) {
                const d = turf.distance(turf.point([points[i-1].lon, points[i-1].lat]), turf.point([points[i].lon, points[i].lat]), {units: 'kilometers'});
                origDistances.push(origDistances[i-1] + d);
            }
            const totalOrigDist = origDistances[origDistances.length - 1] || 1;

            let smoothDistances = [0];
            for (let i = 1; i < smoothCoords.length; i++) {
                const d = turf.distance(turf.point(smoothCoords[i-1]), turf.point(smoothCoords[i]), {units: 'kilometers'});
                smoothDistances.push(smoothDistances[i-1] + d);
            }
            const totalSmoothDist = smoothDistances[smoothDistances.length - 1] || 1;

            let circlesFull = [];

            for (let i = 0; i < smoothCoords.length; i++) {
                const coord = smoothCoords[i];
                const distAlong = smoothDistances[i];
                const fraction = totalSmoothDist === 0 ? 0 : distAlong / totalSmoothDist;
                const correspondingOrigDist = fraction * totalOrigDist;

                let hour = 0;
                for (let j = 0; j < points.length - 1; j++) {
                    if (correspondingOrigDist >= origDistances[j] && correspondingOrigDist <= origDistances[j+1]) {
                        const segDist = origDistances[j+1] - origDistances[j];
                        const segFactor = segDist === 0 ? 0 : (correspondingOrigDist - origDistances[j]) / segDist;
                        hour = points[j].hour + segFactor * (points[j+1].hour - points[j].hour);
                        break;
                    } else if (j === points.length - 2 && correspondingOrigDist > origDistances[j+1]) {
                        hour = points[points.length - 1].hour;
                    }
                }

                const radius = getRadiusForHour(hour);
                if (radius > 0) {
                    const circle = turf.buffer(turf.point(coord), radius, { units: "kilometers", steps: 64 });
                    circlesFull.push(circle);
                }
            }

            if (circlesFull.length === 0) return { fullCone: null };

            let fullCone = circlesFull[0];
            for (let i = 1; i < circlesFull.length; i++) {
                fullCone = safeUnion(fullCone, circlesFull[i]);
            }

            return { fullCone };
        }

        function calculateMovementStr(forecastPoints, forecastCoords, pastCoordsOnly) {
            let coordsToUse = forecastCoords;
            let pointsToUse = forecastPoints;

            if (!coordsToUse || coordsToUse.length < 2) {
                if (pastCoordsOnly && pastCoordsOnly.length >= 2) {
                    coordsToUse = pastCoordsOnly.slice(-2);
                    pointsToUse = null;
                } else {
                    return "-";
                }
            }

            let h24Coords = [];
            let h24Hours = 24;

            if (pointsToUse && pointsToUse.length >= 2) {
                let startH = pointsToUse[0].hour || 0;
                let ptsUpTo24 = [];
                for (let i = 0; i < pointsToUse.length; i++) {
                    ptsUpTo24.push([pointsToUse[i].lon, pointsToUse[i].lat]);
                    if (pointsToUse[i].hour >= startH + 24) {
                        h24Hours = pointsToUse[i].hour - startH;
                        break;
                    }
                }
                if (ptsUpTo24.length >= 2) {
                    h24Coords = ptsUpTo24;
                }
            }

            if (h24Coords.length < 2) {
                if (coordsToUse.length >= 2) {
                    h24Coords = coordsToUse.slice(0, 2);
                } else {
                    return "靜止 0 km/h";
                }
            }

            const pStart = h24Coords[0];
            const pEnd = h24Coords[1] || h24Coords[0];
            const direction = getDirection(pStart[0], pStart[1], pEnd[0], pEnd[1]);

            const samplesPerSegment = 30;
            const smoothCoords = smoothLineCatmullRom(h24Coords, samplesPerSegment);
            let curveDist = 0;
            for (let i = 0; i < smoothCoords.length - 1; i++) {
                curveDist += turf.distance(turf.point(smoothCoords[i]), turf.point(smoothCoords[i+1]), {units: 'kilometers'});
            }

            if (h24Hours <= 0) h24Hours = 24;
            const speed = Math.round(curveDist / h24Hours);
            return `${direction} ${speed} km/h`;
        }

        let typhoons = {};
        let currentStormKey = 'all';
        let currentSelectedYear = 'current';
        let myChart = null;
        let mapLoaded = false;
        let activeIntensityFilter = 'all';
        let currentView = 'map';

        function getHourFromCategory(cat) {
            const catLower = String(cat).toLowerCase();
            if (catLower === 'current' || catLower === '0h' || catLower === '0') return 0;
            return parseFloat(catLower.replace(/h/g, '')) || 0;
        }

        function parseCSVToTyphoon(csvText, letter) {
            const lines = csvText.split('\n');
            let currentMeta = null;
            let rows = [];

            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#') || line.toLowerCase().startsWith('category')) continue;
                const cols = line.split(',').map(c => c.trim());
                if (cols.length < 6) continue;

                const category = cols[0].toLowerCase();
                const time = cols[1];
                const rowName = cols[2];
                const lat = parseFloat(cols[3]);
                const lon = parseFloat(cols[4]);
                const rawWind = cols[5];

                if (isNaN(lat) || isNaN(lon)) continue;

                let isEx = false;
                let windVal = 0;
                if (rawWind && rawWind.toUpperCase() === 'EX') {
                    isEx = true;
                } else {
                    windVal = parseFloat(rawWind) || 0;
                }

                if (category === 'current' || category === '0h' || category === '0') {
                    currentMeta = { name: rowName || `Typhoon ${letter.toUpperCase()}`, time, lat, lon, wind: windVal, isEx };
                }

                rows.push({ category, time, name: rowName, lat, lon, wind: windVal, isEx, rawWind });
            }

            if (rows.length === 0) return null;

            if (!currentMeta) {
                const anchor = rows.find(r => r.category === '0h' || r.category === 'current' || r.category === '0') || rows[0];
                currentMeta = { name: anchor.name || `Typhoon ${letter.toUpperCase()}`, time: anchor.time, lat: anchor.lat, lon: anchor.lon, wind: anchor.wind, isEx: anchor.isEx };
            }

            const name = currentMeta.name;
            const intensityObj = getIntensity(currentMeta.wind, currentMeta.isEx);
            const categoryDesc = `${intensityObj.name}`;

            let past = [];
            let pastCoordsOnly = [];
            let forecastCoords = [];
            let forecastPoints = [];
            let pastNodes = [];
            let forecastNodes = [];

            let tempForecastRows = rows.filter(r => {
                const cat = r.category.toLowerCase();
                return cat === 'current' || cat === '0h' || cat === '0' || cat.includes('h') || !isNaN(parseInt(cat));
            });

            if (tempForecastRows.length === 0 && rows.length > 0) {
                tempForecastRows = rows;
            }

            tempForecastRows.sort((a, b) => getHourFromCategory(a.category) - getHourFromCategory(b.category));

            let fPointsForCalc = [];
            let fCoordsForCalc = [];
            tempForecastRows.forEach(fr => {
                let hour = getHourFromCategory(fr.category);
                fCoordsForCalc.push([fr.lon, fr.lat]);
                fPointsForCalc.push({
                    lon: fr.lon,
                    lat: fr.lat,
                    hour: hour,
                    radius: getRadiusForHour(hour)
                });
            });

            let pastRows = rows.filter(r => r.category === 'past' || r.category === 'current' || r.category === '0h' || r.category === '0');
            if (pastRows.length === 0 && rows.length > 0) {
                pastRows = [rows[0]];
            }

            pastRows.forEach((r) => {
                const intensity = getIntensity(r.wind, r.isEx);
                pastNodes.push({
                    category: r.category,
                    time: r.time,
                    categoryCode: intensity.code,
                    categoryName: intensity.name,
                    color: intensity.color,
                    wind: r.isEx ? '-' : `${r.wind} km/h`,
                    windVal: r.wind,
                    isEx: r.isEx,
                    coordStr: `${r.lat.toFixed(1)}°N, ${r.lon.toFixed(1)}°E`,
                    lat: r.lat,
                    lon: r.lon,
                    coord: [r.lon, r.lat],
                    movementDir: '-',
                    distToMacau: getDistanceAndDirectionToMacau(r.lon, r.lat),
                    isPast: true
                });
            });

            pastNodes.forEach((node, idx) => {
                node.movementDir = calculatePastMovement(pastNodes, idx);
            });

            rows.forEach((r) => {
                const intensity = getIntensity(r.wind, r.isEx);
                let movementStr = '-';
                const catLower = String(r.category).toLowerCase();
                const isPast = catLower === 'past';

                if (!isPast) {
                    const fIndex = tempForecastRows.findIndex(fr => fr === r);
                    if (fIndex !== -1) {
                        let nextFr = tempForecastRows[fIndex + 1];
                        let prevFr = (fIndex + 1 >= tempForecastRows.length && fIndex > 0) ? tempForecastRows[fIndex - 1] : null;

                        if (nextFr) {
                            let hA = getHourFromCategory(r.category);
                            let hB = getHourFromCategory(nextFr.category);
                            let dt = hB - hA;
                            if (dt <= 0) dt = 3;

                            let dist = turf.distance(
                                turf.point([r.lon, r.lat]),
                                turf.point([nextFr.lon, nextFr.lat]),
                                { units: 'kilometers' }
                            );
                            let direction = getDirection(r.lon, r.lat, nextFr.lon, nextFr.lat);
                            let speed = Math.round(dist / dt);
                            movementStr = `${direction} ${speed} km/h`;
                        } else if (prevFr) {
                            let hA = getHourFromCategory(prevFr.category);
                            let hB = getHourFromCategory(r.category);
                            let dt = hB - hA;
                            if (dt <= 0) dt = 3;

                            let dist = turf.distance(
                                turf.point([prevFr.lon, prevFr.lat]),
                                turf.point([r.lon, r.lat]),
                                { units: 'kilometers' }
                            );
                            let direction = getDirection(prevFr.lon, prevFr.lat, r.lon, r.lat);
                            let speed = Math.round(dist / dt);
                            movementStr = `${direction} ${speed} km/h`;
                        }
                    }
                }

                if (isPast) return;

                const nodeInfo = {
                    category: r.category,
                    time: r.time,
                    categoryCode: intensity.code,
                    categoryName: intensity.name,
                    color: intensity.color,
                    wind: r.isEx ? '-' : `${r.wind} km/h`,
                    windVal: r.wind,
                    isEx: r.isEx,
                    coordStr: `${r.lat.toFixed(1)}°N, ${r.lon.toFixed(1)}°E`,
                    lat: r.lat,
                    lon: r.lon,
                    coord: [r.lon, r.lat],
                    movementDir: movementStr,
                    distToMacau: getDistanceAndDirectionToMacau(r.lon, r.lat),
                    isPast: false,
                    hour: getHourFromCategory(r.category)
                };
                forecastNodes.push(nodeInfo);
            });

            forecastNodes.sort((a, b) => a.hour - b.hour);

            pastRows.forEach(pt => {
                past.push({ coord: [pt.lon, pt.lat], wind: pt.wind, isEx: pt.isEx });
                pastCoordsOnly.push([pt.lon, pt.lat]);
            });

            forecastCoords = fCoordsForCalc;
            forecastPoints = fPointsForCalc;

            const lastCoord = pastCoordsOnly[pastCoordsOnly.length - 1] || forecastCoords[0] || [currentMeta.lon, currentMeta.lat];
            const coordsStr = lastCoord ? `${lastCoord[1].toFixed(1)}°N, ${lastCoord[0].toFixed(1)}°E` : `${currentMeta.lat.toFixed(1)}°N, ${currentMeta.lon.toFixed(1)}°E`;
            const fCoordsForStorm = forecastCoords.length > 0 ? forecastCoords : [lastCoord];
            const movementStr = calculateMovementStr(forecastPoints, fCoordsForStorm, pastCoordsOnly);

            let nodeMap = new Map();
            [...pastNodes, ...forecastNodes].forEach(node => {
                nodeMap.set(node.time + "_" + node.coordStr, node);
            });
            let nodes = Array.from(nodeMap.values());

            return {
                name,
                category: categoryDesc,
                intensityObj,
                wind: currentMeta.isEx ? '-' : `${currentMeta.wind} km/h`,
                time: currentMeta.time,
                movement: movementStr,
                coords: coordsStr,
                past,
                pastCoordsOnly,
                forecast: forecastCoords.length > 0 ? forecastCoords : [lastCoord],
                forecastPoints,
                nodes,
                pastNodes,
                forecastNodes
            };
        }

        function parseHistoricalCSVToTyphoon(csvText, fileId, year) {
            const lines = csvText.split('\n');
            let rows = [];
            let currentStormName = `Typhoon ${fileId.toUpperCase()} (${year})`;

            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#') || line.toLowerCase().startsWith('time')) continue;
                const cols = line.split(',').map(c => c.trim());
                if (cols.length < 5) continue;

                const time = cols[0];
                const rowName = cols[1];
                const lat = parseFloat(cols[2]);
                const lon = parseFloat(cols[3]);
                const rawWind = cols[4];

                if (isNaN(lat) || isNaN(lon)) continue;
                if (rowName && rowName !== '') {
                    currentStormName = rowName;
                }

                let isEx = false;
                let windVal = 0;
                if (rawWind && rawWind.toUpperCase() === 'EX') {
                    isEx = true;
                } else {
                    windVal = parseFloat(rawWind) || 0;
                }

                rows.push({ time, name: currentStormName, lat, lon, wind: windVal, isEx });
            }

            if (rows.length === 0) return null;

            const name = rows.find(r => r.name && r.name !== `Typhoon ${fileId.toUpperCase()} (${year})`)?.name || currentStormName;
            const lastRow = rows[rows.length - 1];
            const maxWind = Math.max(...rows.map(r => r.wind));
            const intensityObj = getIntensity(maxWind, false);
            const categoryDesc = `${intensityObj.name}`;

            let past = [];
            let pastCoordsOnly = [];
            let pastNodes = [];

            rows.forEach((r) => {
                const intensity = getIntensity(r.wind, r.isEx);
                pastNodes.push({
                    category: 'past',
                    time: r.time,
                    categoryCode: intensity.code,
                    categoryName: intensity.name,
                    color: intensity.color,
                    wind: r.isEx ? '-' : `${r.wind} km/h`,
                    windVal: r.wind,
                    isEx: r.isEx,
                    coordStr: `${r.lat.toFixed(1)}°N, ${r.lon.toFixed(1)}°E`,
                    lat: r.lat,
                    lon: r.lon,
                    coord: [r.lon, r.lat],
                    movementDir: '-',
                    distToMacau: getDistanceAndDirectionToMacau(r.lon, r.lat),
                    isPast: true
                });
            });

            pastNodes.forEach((node, idx) => {
                node.movementDir = calculatePastMovement(pastNodes, idx);
            });

            pastNodes.forEach(node => {
                past.push({ coord: [node.lon, node.lat], wind: node.windVal, isEx: node.isEx });
                pastCoordsOnly.push([node.lon, node.lat]);
            });

            let closestDist = "-";
            let closestCoords = "-";
            let closestTime = "-";
            let minDist = Infinity;
            let closestNode = null;
            pastNodes.forEach(node => {
                const d = turf.distance(turf.point([node.lon, node.lat]), turf.point(MACAU_COORDS), { units: 'kilometers' });
                if (d < minDist) {
                    minDist = d;
                    closestNode = node;
                }
            });
            if (closestNode) {
                closestDist = closestNode.distToMacau;
                closestCoords = closestNode.coordStr;
                closestTime = closestNode.time;
            }

            const lastCoord = pastCoordsOnly[pastCoordsOnly.length - 1] || [113.5685, 22.1595];
            const coordsStr = `${lastCoord[1].toFixed(1)}°N, ${lastCoord[0].toFixed(1)}°E`;

            return {
                name,
                category: categoryDesc,
                intensityObj,
                wind: `${maxWind} km/h`,
                time: lastRow.time,
                movement: "-",
                coords: coordsStr,
                past,
                pastCoordsOnly,
                forecast: [lastCoord],
                forecastPoints: [],
                nodes: pastNodes,
                pastNodes,
                forecastNodes: [],
                closestDist,
                closestCoords,
                closestTime
            };
        }

        async function loadTyphoonCSVsForYear(year) {
            let loaded = {};

            if (year === 'current') {
                const files = ['A', 'B', 'C', 'D', 'E', 'F'];
                const promises = files.map(async (f) => {
                    try {
                        const response = await fetch(`TCdata/${f}.csv`);
                        if (!response.ok) return null;
                        const text = await response.text();
                        if (!text || text.trim() === '') return null;
                        const stormData = parseCSVToTyphoon(text, f);
                        return { key: f.toLowerCase(), data: stormData };
                    } catch (err) {
                        return null;
                    }
                });

                const results = await Promise.all(promises);
                results.forEach(res => {
                    if (res && res.data) {
                        loaded[res.key] = res.data;
                    }
                });
            } else {
                const yy = year.slice(2);
                let files = [];
                for (let i = 1; i <= 40; i++) {
                    files.push(yy + String(i).padStart(2, '0'));
                }
                for (let i = 1; i <= 15; i++) {
                    files.push(yy + 'TD' + i);
                }

                const promises = files.map(async (f) => {
                    try {
                        const response = await fetch(`TCdata/pastTC/${year}/${f}.csv`);
                        if (!response.ok) return null;
                        const text = await response.text();
                        if (!text || text.trim() === '') return null;
                        const stormData = parseHistoricalCSVToTyphoon(text, f, year);
                        return { key: f.toLowerCase(), data: stormData };
                    } catch (err) {
                        return null;
                    }
                });

                const results = await Promise.all(promises);
                results.forEach(res => {
                    if (res && res.data) {
                        loaded[res.key] = res.data;
                    }
                });
            }
            return loaded;
        }

        async function filterStormList() {
            const searchInput = document.getElementById('storm-search');
            const keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';

            if (keyword.length > 0) {
                const keys = Object.keys(typhoons);
                const matchedInCurrent = keys.some(k => {
                    const st = typhoons[k];
                    return st && (st.name.toLowerCase().includes(keyword) || k.toLowerCase().includes(keyword));
                });

                if (!matchedInCurrent) {
                    let targetYear = null;
                    if (keyword.startsWith('26') || keyword.includes('2026')) targetYear = '2026';
                    else if (keyword.startsWith('25') || keyword.includes('2025')) targetYear = '2025';
                    else if (keyword.startsWith('24') || keyword.includes('2024')) targetYear = '2024';
                    else if (['a', 'b', 'c', 'd', 'e', 'f'].includes(keyword)) targetYear = 'current';

                    if (targetYear && targetYear !== currentSelectedYear) {
                        await switchYear(targetYear);
                        const searchInputAfter = document.getElementById('storm-search');
                        if (searchInputAfter) searchInputAfter.value = keyword;
                        renderSidebar();
                        renderChart(false);
                        return;
                    }
                }
            }

            renderSidebar();
            renderChart(false);
        }

        function addTurfPolygonSeries(turfPoly, seriesList, styleOpts) {
            if (!turfPoly || !turfPoly.geometry) return;
            const geom = turfPoly.geometry;
            const coordsList = geom.type === 'Polygon' ? [geom.coordinates[0]] :
                               geom.type === 'MultiPolygon' ? geom.coordinates.map(poly => poly[0]) : [];

            coordsList.forEach(ring => {
                seriesList.push({
                    type: 'custom',
                    coordinateSystem: 'geo',
                    z: 2.5,
                    data: [[0]],
                    renderItem: function(params, api) {
                        const points = ring.map(coord => api.coord(coord));
                        if (!points || points.some(p => !p || isNaN(p[0]) || isNaN(p[1]))) {
                            return { type: 'group', silent: true };
                        }
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: styleOpts,
                            silent: true
                        };
                    },
                    silent: true
                });
            });
        }

                let pastData = pastNodes.map(n => {
                    let wNum = parseFloat(n.wind) || 0;
                    if (n.isEx) wNum = 0;
                    let intensity = getIntensity(n.wind, n.isEx);
                    return {
                        value: wNum,
                        itemStyle: { color: intensity.color },
                        intensityObj: intensity,
                        nodeInfo: n
                    };
                });

                for (let i = pastNodes.length; i < chartTimes.length; i++) {
                    pastData.push(null);
                }

                let forecastData = [];
                for (let i = 0; i < pastNodes.length - 1; i++) {
                    forecastData.push(null);
                }

                if (pastNodes.length > 0) {
                    let lastPast = pastNodes[pastNodes.length - 1];
                    let wNum = parseFloat(lastPast.wind) || 0;
                    if (lastPast.isEx) wNum = 0;
                    let intensity = getIntensity(lastPast.wind, lastPast.isEx);
                    forecastData.push({
                        value: wNum,
                        itemStyle: { color: intensity.color },
                        intensityObj: intensity,
                        nodeInfo: lastPast
                    });

                forecastNodes.forEach(n => {

                    let intensity = getIntensity(n.wind, n.isEx);

                        value: wNum,
                        itemStyle: { color: intensity.color },
                        intensityObj: intensity,
                        nodeInfo: n

                            { min: 63, max: 87, color: '#16a34a' },
                            { min: 88, max: 117, color: '#ca8a04' },
                            { min: 118, max: 149, color: '#ea580c' },
                            { min: 150, max: 184, color: '#dc2626' },

                    },
                    xAxis: {

                    },
                    series: [

                html += `
                    <div class="panel p-4 sm:p-5 space-y-3">

                        <div class="overflow-x-auto scrollbar-none -mx-1 px-1">
                            <table class="w-full text-left text-[12px] data-table">
                                ${tableHeadHtml}
                                <tbody>
                                    ${buildRows(storm.pastNodes)}

                            <i class="fa-solid fa-clock-rotate-left t-cyan"></i> 過去路徑
                        </h3>
                        <div class="overflow-x-auto scrollbar-none -mx-1 px-1">
                            <table class="w-full text-left text-[12px] data-table">
                                ${tableHeadHtml}
                                <tbody>
                                    ${buildRows(storm.pastNodes)}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function renderChart(isStormSwitch = false) {
            renderSidebar();
            if (!myChart || currentView !== 'map') return;

            const isDark = document.documentElement.classList.contains('dark');
            const isMobile = window.innerWidth < 768;
            const monoFont = '"JetBrains Mono", monospace';

            const mapBgColor = isDark ? '#0b1013' : '#edebe2';
            const areaColor = isDark ? '#121a1f' : '#e3e0d3';
            const borderColor = isDark ? '#2b373e' : '#b8b4a4';
            const emphAreaColor = isDark ? '#182229' : '#d8d4c4';
            const emphBorderColor = isDark ? '#3fd9a4' : '#0b9a6b';

            const gridMinorColor = isDark ? 'rgba(255, 255, 255, 0.04)' : 'rgba(0, 0, 0, 0.05)';
            const gridMajorColor = isDark ? 'rgba(255, 255, 255, 0.10)' : 'rgba(0, 0, 0, 0.12)';
            const gridLabelColor = isDark ? 'rgba(255, 255, 255, 0.4)' : 'rgba(0, 0, 0, 0.4)';

            const ringColor = isDark ? '#5f6b72' : '#8b948f';
            const ringLabelColor = isDark ? '#93a0a6' : '#5c6663';

            const trackColor = isDark ? '#e6e9e9' : '#1a1e20';
            const coneFill = isDark ? 'rgba(63, 217, 164, 0.10)' : 'rgba(11, 154, 107, 0.10)';
            const coneStroke = isDark ? 'rgba(63, 217, 164, 0.40)' : 'rgba(11, 154, 107, 0.40)';
            const eyeColor = isDark ? '#ff6b6b' : '#dc2626';

            const tooltipBg = isDark ? 'rgba(14, 20, 24, 0.95)' : 'rgba(244, 242, 234, 0.98)';
            const tooltipBorder = isDark ? '#2b373e' : '#bfbcab';
            const tooltipText = isDark ? '#e6e9e9' : '#1a1e20';

            const showPast = true;
            const showForecast = true;
            const showEnvelope = true;
            const showNodes = true;
            const showRings = true;
            const showMacau = true;
            const showGrid = true;

            const seriesList = [];
            let keys = Object.keys(typhoons);

            const searchInput = document.getElementById('storm-search');
            const keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';

            let filteredKeys = keys.filter(k => {
                const st = typhoons[k];
                if (!st) return false;
                if (keyword && !st.name.toLowerCase().includes(keyword) && !k.toLowerCase().includes(keyword)) {
                    return false;
                }
                if (activeIntensityFilter !== 'all' && currentSelectedYear !== 'current') {
                    if (st.intensityObj.code !== activeIntensityFilter) return false;
                }
                return true;
            });

            if (showGrid) {
                const minorLines = [];
                for (let lon = -180; lon <= 180; lon += 5) {
                    minorLines.push({ coords: [[lon, -90], [lon, 90]] });
                }
                for (let lat = -90; lat <= 90; lat += 5) {
                    minorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 1,
                    polyline: true,
                    lineStyle: { color: gridMinorColor, width: 0.15, type: 'dashed' },
                    data: minorLines,
                    silent: true
                });

                const majorLines = [];
                for (let lon = -180; lon <= 180; lon += 30) {
                    majorLines.push({ coords: [[lon, -90], [lon, 90]] });
                }
                for (let lat = -90; lat <= 90; lat += 15) {
                    majorLines.push({ coords: [[-180, lat], [180, lat]] });
                }
                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    lineStyle: { color: gridMajorColor, width: 0.6, type: 'dashed' },
                    data: majorLines,
                    silent: true
                });

                const gridLabels = [];
                for (let lon = -180; lon <= 180; lon += 30) {
                    if (lon === 180 || lon === -180) continue;
                    gridLabels.push({ name: `${Math.abs(lon)}°${lon < 0 ? 'W' : 'E'}`, value: [lon, 0, 1], itemStyle: { opacity: 0 } });
                }
                for (let lat = -90; lat <= 90; lat += 15) {
                    if (lat === 0 || lat === 90 || lat === -90) continue;
                    gridLabels.push({ name: `${Math.abs(lat)}°${lat < 0 ? 'S' : 'N'}`, value: [0, lat, 1], itemStyle: { opacity: 0 } });
                }
                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 3,
                    data: gridLabels,
                    label: { show: true, formatter: '{b}', color: gridLabelColor, fontSize: 9, fontFamily: monoFont },
                    silent: true
                });
            }

            if (showRings) {
                const ringDistances = [100, 200, 400, 800];
                const ringLines = [];
                const ringLabels = [];

                ringDistances.forEach(dist => {
                    const coords = generateCircleCoords(MACAU_COORDS[0], MACAU_COORDS[1], dist, 64);
                    ringLines.push({
                        coords: coords,
                        lineStyle: { color: ringColor, width: 0.8, type: 'dashed', opacity: 0.7 }
                    });

                    const latOffset = (dist / 6371) * (180 / Math.PI);
                    ringLabels.push({
                        name: `${dist} km`,
                        value: [MACAU_COORDS[0], MACAU_COORDS[1] - latOffset, 1],
                        itemStyle: { opacity: 0 }
                    });
                });

                seriesList.push({
                    type: 'lines',
                    coordinateSystem: 'geo',
                    z: 2,
                    polyline: true,
                    data: ringLines,
                    silent: true
                });

                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 3,
                    data: ringLabels,
                    label: { show: true, formatter: '{b}', color: ringLabelColor, opacity: 0.9, fontSize: 9, fontFamily: monoFont, position: 'bottom' },
                    silent: true
                });
            }

            const renderTyphoonTracks = (st) => {
                if (!st.pastCoordsOnly) return;

                const smoothForecastCoords = smoothLineCatmullRom(st.forecast, 30);

                if (showEnvelope && st.forecastPoints && st.forecastPoints.length > 1) {
                    const cones = makeSplitCone(st.forecastPoints, st.forecast);
                    if (cones.fullCone) {
                        addTurfPolygonSeries(cones.fullCone, seriesList, {
                            fill: coneFill,
                            stroke: coneStroke,
                            lineWidth: 1.2,
                            lineDash: [3, 3]
                        });
                    }
                }

                if (showPast && st.pastCoordsOnly && st.pastCoordsOnly.length >= 2) {
                    const validPastCoords = st.pastCoordsOnly.filter(c => c && !isNaN(c[0]) && !isNaN(c[1]));
                    if (validPastCoords.length >= 2) {
                        seriesList.push({
                            type: 'lines',
                            coordinateSystem: 'geo',
                            z: 4,
                            polyline: true,
                            lineStyle: { color: trackColor, width: 2.5, opacity: 0.85 },
                            data: [{ coords: validPastCoords }]
                        });
                    }
                }

                if (showForecast && st.forecast && st.forecast.length >= 2) {
                    const validForecastCoords = st.forecast.filter(c => c && !isNaN(c[0]) && !isNaN(c[1]));
                    if (validForecastCoords.length >= 2) {
                        seriesList.push({
                            type: 'lines',
                            coordinateSystem: 'geo',
                            z: 4,
                            polyline: true,
                            lineStyle: { color: trackColor, width: 2, type: 'dashed', opacity: 0.85 },
                            data: [{ coords: validForecastCoords }]
                        });
                    }
                }

                if (showNodes && st.nodes) {
                    const scatterData = st.nodes.map(n => {
                        let isCurrent = (n.category === 'current' || n.category === '0h' || n.category === '0');
                        return {
                            name: st.name,
                            value: [n.lon, n.lat, n.windVal || 0],
                            itemStyle: { color: n.color },
                            symbolSize: isCurrent ? 12 : 7,
                            nodeInfo: n,
                            isCurrent: isCurrent
                        };
                    });

                    seriesList.push({
                        type: 'scatter',
                        coordinateSystem: 'geo',
                        z: 5,
                        data: scatterData,
                        symbol: 'circle',
                        emphasis: {
                            scale: true,
                            itemStyle: { borderColor: '#fff', borderWidth: 2 }
                        }
                    });

                    const currentNodes = st.nodes.filter(n => n.category === 'current' || n.category === '0h' || n.category === '0');
                    currentNodes.forEach(n => {
                        seriesList.push({
                            type: 'effectScatter',
                            coordinateSystem: 'geo',
                            z: 6,
                            data: [[n.lon, n.lat]],
                            symbolSize: 16,
                            rippleEffect: { brushType: 'stroke', scale: 3, period: 2 },
                            itemStyle: { color: eyeColor, shadowBlur: 10, shadowColor: eyeColor },
                            silent: true
                        });
                    });
                }
            };

            if (currentStormKey === 'all') {
                filteredKeys.forEach(k => {
                    const st = typhoons[k];
                    if (st) renderTyphoonTracks(st);
                });
            } else {
                const st = typhoons[currentStormKey];
                if (st) renderTyphoonTracks(st);
            }

            if (showMacau) {
                seriesList.push({
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    z: 7,
                    data: [{ name: '澳門', value: [MACAU_COORDS[0], MACAU_COORDS[1]] }],
                    symbol: 'pin',
                    symbolSize: 22,
                    itemStyle: { color: '#ef4444' },
                    label: {
                        show: true,
                        position: 'right',
                        formatter: '澳門 MSSO',
                        color: isDark ? '#e6e9e9' : '#1a1e20',
                        fontSize: 11,
                        fontWeight: 'bold',
                        fontFamily: monoFont
                    }
                });
            }

            const mapOption = {
                backgroundColor: mapBgColor,
                geo: {
                    map: 'world50m',
                    roam: true,
                    zoom: 4.8,
                    center: [122.0, 20.0],
                    scaleLimit: { min: 1.5, max: 25 },
                    itemStyle: {
                        areaColor: areaColor,
                        borderColor: borderColor,
                        borderWidth: 0.8
                    },
                    emphasis: {
                        itemStyle: {
                            areaColor: emphAreaColor,
                            borderColor: emphBorderColor,
                            borderWidth: 1.2
                        },
                        label: { show: false }
                    },
                    blur: {
                        itemStyle: { areaColor: areaColor, borderColor: borderColor }
                    }
                },
                tooltip: {
                    trigger: 'item',
                    backgroundColor: tooltipBg,
                    borderColor: tooltipBorder,
                    borderRadius: 0,
                    padding: [12, 16],
                    textStyle: { color: tooltipText, fontSize: 12, fontFamily: monoFont },
                    formatter: function(params) {
                        if (params.seriesType === 'scatter' && params.data && params.data.nodeInfo) {
                            const n = params.data.nodeInfo;
                            return `
                                <div style="font-weight:bold; font-size:13px; margin-bottom:6px; color:${n.color};">${params.data.name} (${n.categoryCode} - ${n.categoryName})</div>
                                <div style="display:grid; grid-template-columns: auto 1fr; gap:4px 12px; font-size:12px;">
                                    <span style="color:${isDark ? '#93a0a6' : '#5c6663'};">時間</span><span style="font-weight:bold;">${n.time || '-'}</span>
                                    <span style="color:${isDark ? '#93a0a6' : '#5c6663'};">位置</span><span style="font-weight:bold;">${n.coordStr}</span>
                                    <span style="color:${isDark ? '#93a0a6' : '#5c6663'};">風速</span><span style="font-weight:bold;">${n.wind}</span>
                                    <span style="color:${isDark ? '#93a0a6' : '#5c6663'};">移動</span><span style="font-weight:bold;">${n.movementDir || '-'}</span>
                                    <span style="color:${isDark ? '#93a0a6' : '#5c6663'};">距澳門</span><span style="font-weight:bold;">${n.distToMacau || '-'}</span>
                                </div>
                            `;
                        }
                        if (params.seriesType === 'scatter' && params.name === '澳門') {
                            return `<div style="font-weight:bold;">澳門特別行政區氣象監控中心</div>`;
                        }
                        return params.name || '';
                    }
                },
                series: seriesList
            };

            myChart.setOption(mapOption, true);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initVectorMap();
        });
    </script>
</body>
</html>
