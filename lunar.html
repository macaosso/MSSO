<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Records with Lunar Calendar & Festival Filter</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load lunar-javascript for precise astronomical lunar conversion -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">香港 / 華南氣象歷史數據與農曆節日對照</h1>
            <p class="text-sm text-slate-600 mt-1">結合天文農曆轉換、傳統節日篩選與自訂農曆日檢索功能 (1952–2026)</p>
        </header>

        <!-- Filter Controls Card -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6 mb-6">
            <h2 class="text-base font-semibold text-slate-700 mb-3">篩選模式與節日 / 日期選擇</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <!-- Preset Festival Filter -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">傳統節日與重要農曆日</label>
                    <select id="festivalFilter" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="all">顯示全部記錄 (All Records)</option>
                        <optgroup label="新年與除夕系列">
                            <option value="ny_28">年廿八 (臘月廿八)</option>
                            <option value="ny_29">年廿九 (臘月廿九)</option>
                            <option value="ny_eve">年三十 / 除夕 (若無30則取廿九)</option>
                            <option value="cny_1">正月初一 (春節)</option>
                            <option value="cny_2">正月初二</option>
                            <option value="cny_3">正月初三</option>
                        </optgroup>
                        <optgroup label="傳統大節">
                            <option value="dragon_boat">五月初五 (端午節)</option>
                            <option value="mid_autumn">八月十五 (中秋節)</option>
                            <option value="double_ninth">九月初九 (重陽節)</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Custom Lunar Date Selector -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">自訂農曆月份與日期</label>
                    <div class="flex gap-2">
                        <select id="customMonth" class="w-1/2 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">選擇月份</option>
                            <option value="1">正月份 (1月)</option>
                            <option value="2">二月份 (2月)</option>
                            <option value="3">三月份 (3月)</option>
                            <option value="4">四月份 (4月)</option>
                            <option value="5">五月份 (5月)</option>
                            <option value="6">六月份 (6月)</option>
                            <option value="7">七月份 (7月)</option>
                            <option value="8">八月份 (8月)</option>
                            <option value="9">九月份 (9月)</option>
                            <option value="10">十月份 (10月)</option>
                            <option value="11">冬月份 (11月)</option>
                            <option value="12">臘月份 (12月)</option>
                        </select>
                        <select id="customDay" class="w-1/2 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">選擇日期</option>
                            <!-- Options 1 to 30 populated via JS or static -->
                        </select>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-2">
                    <button id="applyCustomBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-4 py-2 rounded-lg transition shadow-sm">
                        查詢自訂農曆
                    </button>
                    <button id="resetBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium text-sm px-4 py-2 rounded-lg transition">
                        重設
                    </button>
                </div>
            </div>
            
            <div id="filterStatus" class="mt-3 text-xs text-slate-500 font-medium">
                目前顯示：全部共計 <span id="totalCount" class="text-slate-900 font-bold">0</span> 筆記錄
            </div>
        </div>

        <!-- Data Table Container -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table id="dataTable" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs font-semibold uppercase tracking-wider border-b border-slate-200">
                            <th class="py-3 px-4 text-center">公曆日期 (Gregorian)</th>
                            <th class="py-3 px-4 text-center">農曆日期 (Lunar Date)</th>
                            <th class="py-3 px-4 text-center">最高氣溫 (°C)</th>
                            <th class="py-3 px-4 text-center">最低氣溫 (°C)</th>
                            <th class="py-3 px-4 text-center">平均氣溫 (°C)</th>
                            <th class="py-3 px-4 text-center">雨量 (mm)</th>
                            <th class="py-3 px-4 text-center">最高相對濕度 (%)</th>
                            <th class="py-3 px-4 text-center">最低相對濕度 (%)</th>
                            <th class="py-3 px-4 text-center">節氣 (Solar Term)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Rows injected via JavaScript -->
                    </tbody>
                </table>
            </div>
            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12 text-slate-400">
                沒有找到符合該農曆條件或節日的氣象記錄。
            </div>
        </div>
    </div>

    <script>
        // Populate custom day dropdown from 1 to 30
        const daySelect = document.getElementById('customDay');
        for (let d = 1; d <= 30; d++) {
            const opt = document.createElement('option');

            // Use traditional Chinese day names for better user experience
            const dayNames = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
                              "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
                              "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
            opt.textContent = `${dayNames[d-1]} (${d}日)`;
            daySelect.appendChild(opt);
        }

        // Expanded Sample Realistic Historical Weather Dataset spanning across festivals for multiple years (1952-2026)

        let parsedRecords = [];

        function parseData() {
            const lines = csvData.trim().split("\n");
            const rows = lines.slice(1);
            parsedRecords = rows.map(row => {
                const [dateStr, maxT, minT, avgT, rain, maxRH, minRH, solarTerm] = row.split(",");
                const [year, month, day] = dateStr.split("-").map(Number);
                const solar = Solar.fromYmd(year, month, day);
                const lunar = solar.getLunar();

                // Requirement 1: Replace 冬月 and 臘月 with numeric 11 and 12
                let monthStr = lunar.getMonthInChinese(); // e.g. "正月", "冬月", "臘月"
                if (monthStr === '冬月') monthStr = '11';
                else if (monthStr === '臘月') monthStr = '12';
                else {
                    // Convert other Chinese months like 正月->1, 二月->2, etc.
                    const mapChinNum = {'正月':'1','二月':'2','三月':'3','四月':'4','五月':'5','六月':'6','七月':'7','八月':'8','九月':'9','十月':'10'};
                    if (mapChinNum[monthStr]) {
                        monthStr = mapChinNum[monthStr];
                    }
                }

                const dayStr = lunar.getDayInChinese(); // e.g. "初五", "三十"
                const lunarNumericMonth = Math.abs(lunar.getMonth()); // 1 to 12 (supports negative for leap months if any)
                const lunarDayNum = lunar.getDay(); // 1 to 30

                const lunarFormatted = `${lunar.getYearInGanZhi()}年${monthStr}月${dayStr}`;

                return {
                    dateStr,
                    year,
                    month,
                    day,
                    maxT,
                    minT,
                    avgT,
                    rain,
                    maxRH,
                    minRH,
                    solarTerm,
                    lunarFormatted,
                    lunarNumericMonth,
                    lunarDayNum,
                    lunarLeap: lunar.getMonth() < 0
                };
            });
        }

        function renderTable(records) {
            const tbody = document.getElementById("tableBody");
            const emptyState = document.getElementById("emptyState");
            tbody.innerHTML = "";

            document.getElementById("totalCount").textContent = records.length;

            if (records.length === 0) {
                emptyState.classList.remove("hidden");
                return;
            } else {
                emptyState.classList.add("hidden");
            }

            records.forEach(rec => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                tr.innerHTML = `
                    <td class="py-3 px-4 text-center font-medium text-slate-700">${rec.dateStr}</td>
                    <td class="py-3 px-4 text-center text-red-700 font-semibold">${rec.lunarFormatted}</td>
                    <td class="py-3 px-4 text-center text-slate-600">${rec.maxT}</td>
                    <td class="py-3 px-4 text-center text-slate-600">${rec.minT}</td>
                    <td class="py-3 px-4 text-center text-slate-600">${rec.avgT}</td>
                    <td class="py-3 px-4 text-center text-slate-600">${rec.rain}</td>
                    <td class="py-3 px-4 text-center text-slate-600">${rec.maxRH}</td>
                    <td class="py-3 px-4 text-center text-slate-600">${rec.minRH}</td>
                    <td class="py-3 px-4 text-center text-slate-600">${rec.solarTerm === '-' ? '-' : '<span class="px-2 py-1 bg-amber-50 text-amber-700 rounded text-xs font-medium">' + rec.solarTerm + '</span>'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Helper to get all lunar days for a specific year to handle New Year's Eve / Year 30 vs Year 29 rule
        function getLunarDaysMapForYear(year) {
            // Group our records by year and check lunar days
            // For precise festival matching (especially New Year Eve where lunar month 12 can end on day 29 or 30)
            return parsedRecords.filter(r => r.year === year);
        }

        // Filter Logic Implementation
        function applyFilters() {
            const festivalVal = document.getElementById("festivalFilter").value;
            const customMonthVal = document.getElementById("customMonth").value;
            const customDayVal = document.getElementById("customDay").value;

            let filtered = parsedRecords;

            if (festivalVal !== "all") {
                // Group by year to handle dynamic lunar calculation for New Year Eve
                const years = [...new Set(parsedRecords.map(r => r.year))];
                let matchingDates = new Set();

                years.forEach(y => {
                    const yearRecs = parsedRecords.filter(r => r.year === y);
                    
                    if (festivalVal === "ny_28") {
                        // 臘月廿八 (Lunar Month 12, Day 28)
                        yearRecs.forEach(r => {
                            if (r.lunarNumericMonth === 12 && r.lunarDayNum === 28) matchingDates.add(r.dateStr);
                        });
                    } else if (festivalVal === "ny_29") {
                        // 臘月廿九 (Lunar Month 12, Day 29)
                        yearRecs.forEach(r => {
                            if (r.lunarNumericMonth === 12 && r.lunarDayNum === 29) matchingDates.add(r.dateStr);
                        });
                    } else if (festivalVal === "ny_eve") {
                        // 年三十 / 除夕: if year has 30 in month 12, take 30, otherwise take 29
                        const month12Recs = yearRecs.filter(r => r.lunarNumericMonth === 12);
                        const has30 = month12Recs.some(r => r.lunarDayNum === 30);
                        const targetDay = has30 ? 30 : 29;
                        month12Recs.forEach(r => {
                            if (r.lunarDayNum === targetDay) matchingDates.add(r.dateStr);
                        });
                    } else if (festivalVal === "cny_1") {
                        yearRecs.forEach(r => { if (r.lunarNumericMonth === 1 && r.lunarDayNum === 1) matchingDates.add(r.dateStr); });
                    } else if (festivalVal === "cny_2") {
                        yearRecs.forEach(r => { if (r.lunarNumericMonth === 1 && r.lunarDayNum === 2) matchingDates.add(r.dateStr); });
                    } else if (festivalVal === "cny_3") {
                        yearRecs.forEach(r => { if (r.lunarNumericMonth === 1 && r.lunarDayNum === 3) matchingDates.add(r.dateStr); });
                    } else if (festivalVal === "dragon_boat") {
                        yearRecs.forEach(r => { if (r.lunarNumericMonth === 5 && r.lunarDayNum === 5) matchingDates.add(r.dateStr); });
                    } else if (festivalVal === "mid_autumn") {
                        yearRecs.forEach(r => { if (r.lunarNumericMonth === 8 && r.lunarDayNum === 15) matchingDates.add(r.dateStr); });
                    } else if (festivalVal === "double_ninth") {
                        yearRecs.forEach(r => { if (r.lunarNumericMonth === 9 && r.lunarDayNum === 9) matchingDates.add(r.dateStr); });
                    }
                });

                filtered = parsedRecords.filter(r => matchingDates.has(r.dateStr));
            } else if (customMonthVal !== "" || customDayVal !== "") {
                // Custom Lunar Month & Day filter
                filtered = parsedRecords.filter(r => {
                    let matchM = true;
                    let matchD = true;
                    if (customMonthVal !== "") {
                        matchM = (r.lunarNumericMonth === parseInt(customMonthVal));
                    }
                    if (customDayVal !== "") {
                        matchD = (r.lunarDayNum === parseInt(customDayVal));
                    }
                    return matchM && matchD;
                });
            }

            renderTable(filtered);
        }

        // Event Listeners
        document.getElementById("festivalFilter").addEventListener("change", (e) => {
            if (e.target.value !== "all") {
                // Clear custom selectors when choosing a festival preset
                document.getElementById("customMonth").value = "";
                document.getElementById("customDay").value = "";
            }
            applyFilters();
        });

        document.getElementById("applyCustomBtn").addEventListener("click", () => {
            // Reset festival dropdown when custom filtering
            document.getElementById("festivalFilter").value = "all";
            applyFilters();
        });

        document.getElementById("resetBtn").addEventListener("click", () => {
            document.getElementById("festivalFilter").value = "all";
            document.getElementById("customMonth").value = "";
            document.getElementById("customDay").value = "";
            renderTable(parsedRecords);
        });

        // Initialize application on load
        window.onload = function() {
            parseData();
            renderTable(parsedRecords);
        };
    </script>
