<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳門民間氣象台 MSSO - 7天天氣預報與風向風速統計</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(100, 116, 139, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.4);
            border-radius: 4px;
        }
    </style>
    <!-- 頁面載入前先執行主題判斷，避免畫面閃爍 -->
    <script>
        const currentHour = new Date().getHours();
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme) {
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } else {
            if (currentHour >= 8 && currentHour < 20) {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        }
    </script>
</head>
<body class="bg-sky-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center p-4 md:p-8 pb-12 transition-colors duration-200">

    <!-- 容器 -->
    <div class="w-full max-w-6xl space-y-6 flex-grow">
        
        <!-- 標頭 -->
        <header class="flex justify-between items-center bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-purple-500 dark:text-purple-400"></i> 澳門 7天天氣預報
                </h1>
                <div class="mt-2 text-sm text-slate-500 dark:text-slate-400" id="update-time">載入中...</div>
            </div>
            <div class="flex items-center gap-4">
                <!-- 主題切換按鈕 -->
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors shadow-sm" title="切換主題">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
            </div>
        </header>

        <!-- 載入狀態 -->
        <div id="loading" class="text-center py-20 text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-cyan-500 dark:text-cyan-400 mb-3"></i>
            <p>正在取得最新天氣預報數據...</p>
        </div>

        <!-- 主要內容 -->
        <div id="dashboard-content" class="space-y-6 hidden">
            <!-- 7天天氣預報 -->
            <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-purple-500 dark:text-purple-400"></i> 7天天氣預報
                    </h2>
                    <a href="https://macaosso.github.io/MSSO/symbol.html" target="_blank" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium transition-colors flex items-center gap-1.5 shadow-sm" style="text-decoration: none;">
                        天氣符號說明 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                    </a>
                </div>
                <div id="daily-container" class="overflow-x-auto pb-2"></div>
            </section>

            <!-- 9大天氣分組時數統計 -->
            <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-cyan-500 dark:text-cyan-400"></i> 每日 9 大天氣分組時數統計 (7天)
                    </h2>
                </div>
                <div id="weather-groups-container" class="overflow-x-auto pb-2"></div>
            </section>

            <!-- 新增區段：風向與風速統計 -->
            <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-wind text-teal-500 dark:text-teal-400"></i> 每日每小時風向與風速級別統計 (7天)
                    </h2>
                </div>
                <div id="wind-stats-container" class="space-y-6"></div>
            </section>
        </div>
    </div>

    <!-- 頁尾免責聲明與版權 -->
    <footer class="w-full max-w-6xl mt-10 pt-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400 space-y-1.5">
        <p><strong class="font-semibold text-slate-600 dark:text-slate-300">免責聲明：</strong>本數據由 AI 分析並直接發佈，使用前請自行核實。(Data analysed by AI and directly published, please check before using.)</p>
        <p>Copyright &copy; 2026 澳門民間氣象台 MSSO. All rights reserved.</p>
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        const LAT = 22.214016;
        const LON = 113.546198;
        let globalWeatherData = null;

        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        function getWeatherDetails(code, isNight = false) {
            const symbols = {
                0: { text: '天晴', codeNum: 0, icon: isNight ? 'fas fa-moon text-indigo-400' : 'fas fa-sun text-yellow-500' },
                1: { text: '天晴', codeNum: 1, icon: isNight ? 'fas fa-moon text-indigo-300' : 'fas fa-sun text-yellow-400' },
                2: { text: '多雲', codeNum: 2, icon: isNight ? 'fas fa-cloud-moon text-indigo-200' : 'fas fa-cloud-sun text-yellow-400' },
                3: { text: '密雲', codeNum: 3, icon: 'fas fa-cloud text-slate-300' },
                45: { text: '薄霧/霧', codeNum: 45, icon: 'fas fa-smog text-slate-400' },
                48: { text: '霧凇霧', codeNum: 48, icon: 'fas fa-icicles text-slate-300' },
                51: { text: '微雨', codeNum: 51, icon: 'fas fa-cloud-rain text-blue-200' },
                53: { text: '微雨', codeNum: 53, icon: 'fas fa-cloud-rain text-blue-300' },
                55: { text: '雨', codeNum: 55, icon: 'fas fa-cloud-rain text-blue-400' },
                56: { text: '輕凍毛毛雨', codeNum: 56, icon: 'fas fa-icicles text-cyan-200' },
                57: { text: '密凍毛毛雨', codeNum: 57, icon: 'fas fa-icicles text-cyan-400' },
                61: { text: '輕雨', codeNum: 61, icon: 'fas fa-cloud-rain text-blue-300' },
                63: { text: '中雨', codeNum: 63, icon: 'fas fa-cloud-rain text-blue-400' },
                65: { text: '重雨', codeNum: 65, icon: 'fas fa-cloud-showers-heavy text-blue-600' },
                66: { text: '輕凍雨', codeNum: 66, icon: 'fas fa-snowflake text-cyan-300' },
                67: { text: '重凍雨', codeNum: 67, icon: 'fas fa-icicles text-cyan-500' },
                71: { text: '輕雪', codeNum: 71, icon: 'fas fa-snowflake text-sky-200' },
                73: { text: '中雪', codeNum: 73, icon: 'fas fa-snowflake text-sky-300' },
                75: { text: '重雪', codeNum: 75, icon: 'fas fa-snowflake text-sky-400' },
                77: { text: '雪粒', codeNum: 77, icon: 'fas fa-snowflake text-cyan-200' },
                80: { text: '驟雨', codeNum: 80, icon: 'fas fa-cloud-sun-rain text-blue-400' },
                81: { text: '驟雨', codeNum: 81, icon: 'fas fa-cloud-showers-heavy text-blue-400' },
                82: { text: '大驟雨', codeNum: 82, icon: 'fas fa-cloud-showers-water text-blue-600' },
                85: { text: '輕陣雪', codeNum: 85, icon: 'fas fa-snowflake text-sky-200' },
                86: { text: '重陣雪', codeNum: 86, icon: 'fas fa-snowflake text-sky-400' },
                95: { text: '雷雨', codeNum: 95, icon: 'fas fa-cloud-bolt text-blue-400' },
                96: { text: '強雷雨', codeNum: 96, icon: 'fas fa-cloud-bolt text-amber-600' },
                99: { text: '超強雷雨', codeNum: 99, icon: 'fas fa-cloud-bolt text-red-600' }
            };
            return symbols[code] || { text: '未知天氣', codeNum: code, icon: 'fas fa-question-circle text-slate-400' };
        }

        function getWeatherGroup(code) {
            if ([0, 1].includes(code)) return { group: 'A', name: 'SUN (天晴)' };
            if ([2, 3].includes(code)) return { group: 'B', name: 'Cloud (多雲/密雲)' };
            if ([45, 48].includes(code)) return { group: 'C', name: 'Fog (霧)' };
            if ([51, 53, 55].includes(code)) return { group: 'D', name: 'Light Rain (微雨)' };
            if ([61, 63, 65].includes(code)) return { group: 'E', name: 'Rain (雨)' };
            if ([56, 57, 66, 67].includes(code)) return { group: 'F', name: 'Freezing Rain (凍雨)' };
            if ([71, 73, 75, 77, 85, 86].includes(code)) return { group: 'G', name: 'Snow (雪)' };
            if ([80, 81, 82].includes(code)) return { group: 'H', name: 'Showers (驟雨)' };
            if ([95, 96, 99].includes(code)) return { group: 'I', name: 'Thunderstorm (雷雨)' };
            return { group: 'B', name: 'Cloud (多雲/密雲)' };
        }

        // 根據風向角度 (degrees) 換算 16 方位
        function getWindDirection(deg) {
            if (deg === null || deg === undefined) return 'N';
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            const val = Math.floor((deg / 22.5) + 0.5);
            return directions[(val % 16)];
        }

        // 根據風速 (km/h) 換算 0-12 級別
        function getWindSpeedLevel(speedKmh) {
            if (speedKmh <= 1.5) return 0;
            if (speedKmh <= 6.4) return 1;
            if (speedKmh <= 12.4) return 2;
            if (speedKmh <= 19.4) return 3;
            if (speedKmh <= 29.4) return 4;
            if (speedKmh <= 39.4) return 5;
            if (speedKmh <= 50.4) return 6;
            if (speedKmh <= 61.4) return 7;
            if (speedKmh <= 74.4) return 8;
            if (speedKmh <= 87.4) return 9;
            if (speedKmh <= 102.4) return 10;
            if (speedKmh <= 117.4) return 11;
            return 12;
        }

        const windSpeedNames = {
            0: '靜止 (<=1.5)',
            1: '微風 (1.6-6.4)',
            2: '輕微 (6.5-12.4)',
            3: '溫和 (12.5-19.4)',
            4: '和緩 (19.5-29.4)',
            5: '清新 (29.5-39.4)',
            6: '清勁 (39.5-50.4)',
            7: '強勁 (50.5-61.4)',
            8: '疾勁 (61.5-74.4)',
            9: '烈風 (74.5-87.4)',
            10: '狂風 (87.5-102.4)',
            11: '暴風 (102.5-117.4)',
            12: '颶風 (>=117.5)'
        };

        async function fetchWeatherData() {
            try {
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=weather_code,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,weather_code,precipitation_probability_max&timezone=Asia/Macau&past_days=1`;
                const res = await fetch(weatherUrl);
                globalWeatherData = await res.json();

                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                document.getElementById('update-time').textContent = `更新時間：${year}-${month}-${day} ${hours}:${minutes}`;

                renderDailySection();
                renderWeatherGroupsSection();
                renderWindStatsSection();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
            } catch (error) {
                console.error("無法載入天氣數據：", error);
                document.getElementById('loading').innerHTML = `<p class="text-red-500 dark:text-red-400">無法載入天氣數據，請檢查網絡連線。</p>`;
            }
        }

        function renderDailySection() {
            const data = globalWeatherData;
            const dailyContainer = document.getElementById('daily-container');
            dailyContainer.innerHTML = '';

            const startIndex = 1; 
            const maxTemps = data.daily.temperature_2m_max.slice(startIndex, startIndex + 7).map(t => Math.round(t));
            const minTemps = data.daily.temperature_2m_min.slice(startIndex, startIndex + 7).map(t => Math.round(t));
            const popMaxs = data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max.slice(startIndex, startIndex + 7) : Array(7).fill(0);
            
            const allVals = [...maxTemps, ...minTemps];
            const chartMax = Math.max(...allVals) + 1;
            const chartMin = Math.min(...allVals) - 1;
            const range = chartMax - chartMin || 1;
            const svgHeight = 60;

            function getY(val) {
                return svgHeight - ((val - chartMin) / range) * (svgHeight - 20) - 10;
            }

            const tableWrapper = document.createElement('div');
            tableWrapper.className = "min-w-[620px]";

            let daysHtml = '<div class="grid grid-cols-7 gap-2 text-center pb-3 border-b border-slate-200 dark:border-slate-800">';
            let iconsHtml = '<div class="grid grid-cols-7 gap-2 text-center py-3">';
            let maxTempHtml = '<div class="grid grid-cols-7 gap-2 text-center">';
            let minTempHtml = '<div class="grid grid-cols-7 gap-2 text-center">';
            let popRowHtml = '<div class="grid grid-cols-7 gap-2 text-center pt-3 border-t border-slate-200 dark:border-slate-800">';

            let maxPoints = [];
            let minPoints = [];

            for (let i = 0; i < 7; i++) {
                const dateStr = data.daily.time[startIndex + i];
                const code = data.daily.weather_code[startIndex + i];
                const dayIcon = getWeatherDetails(code, false);

                const popVal = Math.round(popMaxs[i]);
                let popLevel = '極低';
                let popBadgeClass = 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
                
                if (popVal >= 95) {
                    popLevel = '極高';
                    popBadgeClass = 'bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300 font-bold';
                } else if (popVal >= 75) {
                    popLevel = '高';
                    popBadgeClass = 'bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 font-bold';
                } else if (popVal >= 60) {
                    popLevel = '偏高';
                    popBadgeClass = 'bg-orange-100 text-orange-800 dark:bg-orange-950 dark:text-orange-300 font-semibold';
                } else if (popVal >= 40) {
                    popLevel = '中等';
                    popBadgeClass = 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 font-semibold';
                } else if (popVal >= 25) {
                    popLevel = '偏低';
                    popBadgeClass = 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300';
                } else if (popVal >= 10) {
                    popLevel = '低';
                    popBadgeClass = 'bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300';
                }

                const dateObj = new Date(dateStr);
                const dayName = i === 0 ? '今日' : i === 1 ? '明日' : dateObj.toLocaleDateString('zh-TW', { weekday: 'short' });
                const monthDay = `${dateObj.getMonth() + 1}-${dateObj.getDate()}`;

                const xCenter = i * 100 + 50;
                maxPoints.push(`${xCenter},${getY(maxTemps[i])}`);
                minPoints.push(`${xCenter},${getY(minTemps[i])}`);

                daysHtml += `
                    <div>
                        <div class="font-bold text-sm text-slate-800 dark:text-slate-100">${dayName}</div>
                        <div class="text-xs text-slate-400 mt-0.5">${monthDay}</div>
                    </div>
                `;

                // 根據要求：顯示文字與下方的符號編號 (symbol number)
                iconsHtml += `
                    <div class="flex flex-col items-center justify-center">
                        <i class="fa-solid ${dayIcon.icon} text-xl mb-1"></i>
                        <span class="text-[11px] text-slate-700 dark:text-slate-300">${dayIcon.text}</span>
                        <span class="text-[10px] text-slate-400 mt-0.5">#${dayIcon.codeNum}</span>
                    </div>
                `;

                maxTempHtml += `<div class="text-sm font-semibold text-amber-600 dark:text-amber-400">${maxTemps[i]}°C</div>`;
                minTempHtml += `<div class="text-sm font-semibold text-blue-500 dark:text-blue-400">${minTemps[i]}°C</div>`;

                popRowHtml += `
                    <div class="flex flex-col items-center justify-center gap-1">
                        <span class="text-xs font-medium text-slate-700 dark:text-slate-200">${popVal}%</span>
                        <span class="px-2 py-0.5 rounded text-[10px] ${popBadgeClass}">${popLevel}</span>
                    </div>
                `;
            }

            daysHtml += '</div>';
            iconsHtml += '</div>';
            maxTempHtml += '</div>';
            minTempHtml += '</div>';
            popRowHtml += '</div>';

            const maxPolyline = maxPoints.join(' ');
            const minPolyline = minPoints.join(' ');

            let svgChartHtml = `
                <div class="relative py-2">
                    <svg viewBox="0 0 700 ${svgHeight}" class="w-full h-[60px] overflow-visible">
                        <polyline fill="none" stroke="#f59e0b" stroke-width="2.5" points="${maxPolyline}" />
                        ${maxTemps.map((t, i) => `<circle cx="${i * 100 + 50}" cy="${getY(t)}" r="4" fill="#f59e0b" />`).join('')}
                        
                        <polyline fill="none" stroke="#3b82f6" stroke-width="2.5" points="${minPolyline}" />
                        ${minTemps.map((t, i) => `<circle cx="${i * 100 + 50}" cy="${getY(t)}" r="4" fill="#3b82f6" />`).join('')}
                    </svg>
                </div>
            `;

            tableWrapper.innerHTML = `
                ${daysHtml}
                ${iconsHtml}
                <div class="bg-slate-100/60 dark:bg-slate-900/40 p-3 rounded-xl border border-slate-200 dark:border-slate-800/80 space-y-2">
                    <div class="text-xs font-medium text-slate-400 px-1">溫度趨勢圖</div>
                    ${maxTempHtml}
                    ${svgChartHtml}
                    ${minTempHtml}
                </div>
                <div class="mt-3">
                    <div class="text-xs font-medium text-slate-400 mb-2 px-1">降雨機率</div>
                    ${popRowHtml}
                </div>
            `;

            dailyContainer.appendChild(tableWrapper);
        }

        function renderWeatherGroupsSection() {
            const data = globalWeatherData;
            const container = document.getElementById('weather-groups-container');
            container.innerHTML = '';

            const startIndex = 1;
            const groupKeys = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
            const groupNames = {
                'A': 'SUN (天晴)',
                'B': 'Cloud (多雲)',
                'C': 'Fog (霧)',
                'D': 'Light Rain (微雨)',
                'E': 'Rain (雨)',
                'F': 'Freezing Rain (凍雨)',
                'G': 'Snow (雪)',
                'H': 'Showers (驟雨)',
                'I': 'Thunderstorm (雷雨)'
            };

            const groupIcons = {
                'A': 'fas fa-sun text-yellow-500',
                'B': 'fas fa-cloud text-slate-300',
                'C': 'fas fa-smog text-slate-400',
                'D': 'fas fa-cloud-rain text-blue-200',
                'E': 'fas fa-cloud-rain text-blue-400',
                'F': 'fas fa-icicles text-cyan-400',
                'G': 'fas fa-snowflake text-sky-300',
                'H': 'fas fa-cloud-showers-heavy text-blue-500',
                'I': 'fas fa-cloud-bolt text-blue-400'
            };

            const dailyStats = [];

            for (let i = 0; i < 7; i++) {
                const dateStr = data.daily.time[startIndex + i];
                const counts = { A:0, B:0, C:0, D:0, E:0, F:0, G:0, H:0, I:0 };

                data.hourly.time.forEach((tStr, idx) => {
                    if (tStr.startsWith(dateStr)) {
                        const code = data.hourly.weather_code[idx];
                        const gObj = getWeatherGroup(code);
                        counts[gObj.group]++;
                    }
                });

                dailyStats.push({ dateStr, counts });
            }

            const table = document.createElement('div');
            table.className = "min-w-[700px] overflow-x-auto";

            let headerHtml = `<div class="grid grid-cols-8 gap-2 pb-3 border-b border-slate-200 dark:border-slate-800 text-center font-bold text-xs text-slate-500 dark:text-slate-400">
                <div class="text-left pl-2">天氣分組</div>`;
            
            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(data.daily.time[startIndex + i]);
                const dayName = i === 0 ? '今日' : i === 1 ? '明日' : dateObj.toLocaleDateString('zh-TW', { weekday: 'short' });
                const monthDay = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                headerHtml += `<div>${dayName}<br><span class="text-[10px] text-slate-400">${monthDay}</span></div>`;
            }
            headerHtml += `</div>`;

            let bodyHtml = `<div class="divide-y divide-slate-100 dark:divide-slate-800/60 text-xs">`;

            groupKeys.forEach(gKey => {
                bodyHtml += `<div class="grid grid-cols-8 gap-2 py-2.5 items-center text-center">
                    <div class="text-left pl-2 font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1.5 truncate">
                        <i class="${groupIcons[gKey]}"></i> <span class="truncate">${groupNames[gKey]}</span>
                    </div>`;

                dailyStats.forEach(day => {
                    const val = day.counts[gKey];
                    const badgeClass = val > 0 
                        ? 'bg-cyan-50 text-cyan-700 dark:bg-cyan-950/50 dark:text-cyan-300 font-bold' 
                        : 'text-slate-300 dark:text-slate-600';
                    bodyHtml += `<div><span class="px-2 py-1 rounded-md ${badgeClass}">${val} 小時</span></div>`;
                });

                bodyHtml += `</div>`;
            });
            bodyHtml += `</div>`;

            table.innerHTML = headerHtml + bodyHtml;
            container.appendChild(table);
        }

        // 新增函數：風向與風速統計渲染
        function renderWindStatsSection() {
            const data = globalWeatherData;
            const container = document.getElementById('wind-stats-container');
            container.innerHTML = '';

            const startIndex = 1;
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];

            // 準備 7 天的資料結構
            const dailyWindData = [];

            for (let i = 0; i < 7; i++) {
                const dateStr = data.daily.time[startIndex + i];
                
                // 初始化風向計數 (16方位)
                const dirCounts = {};
                directions.forEach(d => dirCounts[d] = 0);

                // 初始化風速級別計數 (0-12級)
                const speedCounts = {};
                for (let s = 0; s <= 12; s++) speedCounts[s] = 0;

                data.hourly.time.forEach((tStr, idx) => {
                    if (tStr.startsWith(dateStr)) {
                        const speed = data.hourly.wind_speed_10m[idx];
                        const deg = data.hourly.wind_direction_10m[idx];

                        const dName = getWindDirection(deg);
                        if (dirCounts[dName] !== undefined) dirCounts[dName]++;

                        const sLevel = getWindSpeedLevel(speed);
                        if (speedCounts[sLevel] !== undefined) speedCounts[sLevel]++;
                    }
                });

                dailyWindData.push({ dateStr, dirCounts, speedCounts });
            }

            // 1. 風向統計表 (16方位 x 7天)
            const dirWrapper = document.createElement('div');
            dirWrapper.className = "space-y-3";
            dirWrapper.innerHTML = `<h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1.5"><i class="fa-solid fa-compass text-teal-500"></i> 風向時數統計 (16方位)</h3>`;

            const dirTable = document.createElement('div');
            dirTable.className = "min-w-[700px] overflow-x-auto";

            let dirHeaderHtml = `<div class="grid grid-cols-9 gap-2 pb-3 border-b border-slate-200 dark:border-slate-800 text-center font-bold text-xs text-slate-500 dark:text-slate-400">
                <div class="text-left pl-2 col-span-2">風向</div>`;
            
            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(data.daily.time[startIndex + i]);
                const dayName = i === 0 ? '今日' : i === 1 ? '明日' : dateObj.toLocaleDateString('zh-TW', { weekday: 'short' });
                const monthDay = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                dirHeaderHtml += `<div>${dayName}<br><span class="text-[10px] text-slate-400">${monthDay}</span></div>`;
            }
            dirHeaderHtml += `</div>`;

            let dirBodyHtml = `<div class="divide-y divide-slate-100 dark:divide-slate-800/60 text-xs">`;

            directions.forEach(d => {
                dirBodyHtml += `<div class="grid grid-cols-9 gap-2 py-2 items-center text-center">
                    <div class="text-left pl-2 font-semibold text-slate-700 dark:text-slate-300 col-span-2 flex items-center gap-1.5">
                        <i class="fa-solid fa-location-arrow text-teal-500"></i> ${d}
                    </div>`;

                dailyWindData.forEach(day => {
                    const val = day.dirCounts[d];
                    const badgeClass = val > 0 
                        ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-300 font-bold' 
                        : 'text-slate-300 dark:text-slate-600';
                    dirBodyHtml += `<div><span class="px-2 py-0.5 rounded-md ${badgeClass}">${val}h</span></div>`;
                });

                dirBodyHtml += `</div>`;
            });
            dirBodyHtml += `</div>`;

            dirTable.innerHTML = dirHeaderHtml + dirBodyHtml;
            dirWrapper.appendChild(dirTable);
            container.appendChild(dirWrapper);

            // 2. 風速級別統計表 (0-12級 x 7天)
            const speedWrapper = document.createElement('div');
            speedWrapper.className = "space-y-3 pt-4 border-t border-slate-200 dark:border-slate-800";
            speedWrapper.innerHTML = `<h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1.5"><i class="fa-solid fa-gauge-high text-teal-500"></i> 風速級別時數統計 (0-12 級)</h3>`;

            const speedTable = document.createElement('div');
            speedTable.className = "min-w-[700px] overflow-x-auto";

            let speedHeaderHtml = `<div class="grid grid-cols-9 gap-2 pb-3 border-b border-slate-200 dark:border-slate-800 text-center font-bold text-xs text-slate-500 dark:text-slate-400">
                <div class="text-left pl-2 col-span-2">風速級別</div>`;
            
            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(data.daily.time[startIndex + i]);
                const dayName = i === 0 ? '今日' : i === 1 ? '明日' : dateObj.toLocaleDateString('zh-TW', { weekday: 'short' });
                const monthDay = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                speedHeaderHtml += `<div>${dayName}<br><span class="text-[10px] text-slate-400">${monthDay}</span></div>`;
            }
            speedHeaderHtml += `</div>`;

            let speedBodyHtml = `<div class="divide-y divide-slate-100 dark:divide-slate-800/60 text-xs">`;

            for (let s = 0; s <= 12; s++) {
                speedBodyHtml += `<div class="grid grid-cols-9 gap-2 py-2 items-center text-center">
                    <div class="text-left pl-2 font-semibold text-slate-700 dark:text-slate-300 col-span-2 flex items-center gap-1.5 truncate">
                        <span class="px-1.5 py-0.5 rounded bg-teal-100 dark:bg-teal-950 text-teal-700 dark:text-teal-300 text-[10px] font-bold">L${s}</span> 
                        <span class="truncate">${windSpeedNames[s]}</span>
                    </div>`;

                dailyWindData.forEach(day => {
                    const val = day.speedCounts[s];
                    const badgeClass = val > 0 
                        ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-300 font-bold' 
                        : 'text-slate-300 dark:text-slate-600';
                    speedBodyHtml += `<div><span class="px-2 py-0.5 rounded-md ${badgeClass}">${val}h</span></div>`;
                });

                speedBodyHtml += `</div>`;
            }
            speedBodyHtml += `</div>`;

            speedTable.innerHTML = speedHeaderHtml + speedBodyHtml;
            speedWrapper.appendChild(speedTable);
            container.appendChild(speedWrapper);
        }

        fetchWeatherData();
    </script>
</body>
</html>
