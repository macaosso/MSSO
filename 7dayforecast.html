<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳門民間氣象台 MSSO - 7天天氣預報與自動天氣報文系統</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(100, 116, 139, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.4);
            border-radius: 4px;
        }
    </style>
    <!-- 頁面載入前先執行主題判斷，避免畫面閃爍 -->
    <script>
        const currentHour = new Date().getHours();
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme) {
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } else {
            if (currentHour >= 8 && currentHour < 20) {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        }
    </script>
</head>
<body class="bg-sky-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center p-4 md:p-8 pb-12 transition-colors duration-200">

    <!-- 容器 -->
    <div class="w-full max-w-6xl space-y-6 flex-grow">
        
        <!-- 標頭 -->
        <header class="flex justify-between items-center bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-bullhorn text-teal-500"></i> 澳門 7天天氣預報與自動天氣報文
                </h1>
                <div class="mt-2 text-sm text-slate-500 dark:text-slate-400" id="update-time">載入中...</div>
            </div>
            <div class="flex items-center gap-4">
                <!-- 主題切換按鈕 -->
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors shadow-sm" title="切換主題">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
            </div>
        </header>

        <!-- 載入狀態 -->
        <div id="loading" class="text-center py-20 text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-teal-500 mb-3"></i>
            <p>正在取得最新天氣預報數據...</p>
        </div>

        <!-- 主要內容 -->
        <div id="dashboard-content" class="space-y-6 hidden">
            <!-- 7天天氣預報 (橫向滾動) -->
            <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-teal-500"></i> 7天天氣預報與詳細狀況
                    </h2>
                    <a href="https://macaosso.github.io/MSSO/symbol.html" target="_blank" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium transition-colors flex items-center gap-1.5 shadow-sm" style="text-decoration: none;">
                        天氣符號說明 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                    </a>
                </div>
                <!-- 橫向滾動容器 (items-stretch 確保所有卡片等高) -->
                <div id="daily-container" class="flex overflow-x-auto gap-4 pb-3 pt-1 items-stretch snap-x"></div>
            </section>

            <!-- 9大天氣分組時數統計 -->
            <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-teal-500"></i> 每日 9 大天氣分組時數統計 (7天)
                    </h2>
                </div>
                <div id="weather-groups-container" class="overflow-x-auto pb-2"></div>
            </section>

            <!-- 8方位風向與風速統計區段 -->
            <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-wind text-teal-500"></i> 每日每小時 8 方位風向與風速級別統計 (7天)
                    </h2>
                </div>
                <div id="wind-stats-container" class="overflow-x-auto pb-2"></div>
            </section>
        </div>
    </div>

    <!-- 頁尾免責聲明與版權 -->
    <footer class="w-full max-w-6xl mt-10 pt-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400 space-y-1.5">
        <p><strong class="font-semibold text-slate-600 dark:text-slate-300">免責聲明：</strong>本數據由 AI 分析並直接發佈，使用前請自行核實。(Data analysed by AI and directly published, please check before using.)</p>
        <p>Copyright &copy; 2026 澳門民間氣象台 MSSO. All rights reserved.</p>
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        const LAT = 22.214016;
        const LON = 113.546198;
        let globalWeatherData = null;

        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        function getWeatherGroup(code) {
            if ([0, 1].includes(code)) return { group: 'A', name: '天晴' };
            if ([2, 3, 51].includes(code)) return { group: 'B', name: '多雲' };
            if ([45, 48].includes(code)) return { group: 'C', name: '霧' };
            if ([53, 55].includes(code)) return { group: 'D', name: '微雨' };
            if ([61, 63, 65].includes(code)) return { group: 'E', name: '雨' };
            if ([56, 57, 66, 67].includes(code)) return { group: 'F', name: '凍雨' };
            if ([71, 73, 75, 77, 85, 86].includes(code)) return { group: 'G', name: '雪' };
            if ([80, 81, 82].includes(code)) return { group: 'H', name: '驟雨' };
            if ([95, 96, 99].includes(code)) return { group: 'I', name: '雷雨' };
            return { group: 'B', name: '多雲' };
        }

        function getWindDirection(deg) {
            if (deg === null || deg === undefined) return 'N';
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const adjustedDeg = (deg + 22.5) % 360;
            const index = Math.floor(adjustedDeg / 45);
            return directions[index];
        }

        function getWindDirectionText(hourlyDirs) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const dirMapFull = { 'N': '北', 'NE': '東北', 'E': '東', 'SE': '東南', 'S': '南', 'SW': '西南', 'W': '西', 'NW': '西北' };
            
            let dirCounts = {};
            directions.forEach(d => dirCounts[d] = 0);
            hourlyDirs.forEach(d => { if (dirCounts[d] !== undefined) dirCounts[d]++; });
            
            // 找出 >= 10 小時的風向
            let qualifiedDirs = directions.filter(d => dirCounts[d] >= 10);
            
            if (qualifiedDirs.length > 0) {
                if (qualifiedDirs.length === 1) {
                    let d = qualifiedDirs[0];
                    if (['N', 'E', 'S', 'W'].includes(d)) {
                        return '偏' + dirMapFull[d] + '風';
                    } else {
                        return dirMapFull[d] + '風';
                    }
                } else {
                    let indices = qualifiedDirs.map(d => directions.indexOf(d)).sort((a,b) => a - b);
                    let firstDir = directions[indices[0]];
                    let lastDir = directions[indices[indices.length - 1]];
                    return `${dirMapFull[firstDir]}至${dirMapFull[lastDir]}風`;
                }
            } else {
                // 如果全部都未達到 10 小時，找出時數最多的風向
                let maxCount = -1;
                let maxDir = 'N';
                directions.forEach(d => {
                    if (dirCounts[d] > maxCount) {
                        maxCount = dirCounts[d];
                        maxDir = d;
                    }
                });
                if (['N', 'E', 'S', 'W'].includes(maxDir)) {
                    return '偏' + dirMapFull[maxDir] + '風';
                } else {
                    return dirMapFull[maxDir] + '風';
                }
            }
        }

        function getWindSpeedLevel(speedKmh) {
            if (speedKmh <= 1.5) return 0;
            if (speedKmh <= 6.4) return 1;
            if (speedKmh <= 12.4) return 2;
            if (speedKmh <= 19.4) return 3;
            if (speedKmh <= 29.4) return 4;
            if (speedKmh <= 39.4) return 5;
            if (speedKmh <= 50.4) return 6;
            if (speedKmh <= 61.4) return 7;
            if (speedKmh <= 74.4) return 8;
            if (speedKmh <= 87.4) return 9;
            if (speedKmh <= 102.4) return 10;
            if (speedKmh <= 117.4) return 11;
            return 12;
        }

        const windSpeedNames = { 0: '靜止', 1: '微風', 2: '輕微', 3: '溫和', 4: '和緩', 5: '清新', 6: '清勁', 7: '強勁', 8: '疾勁', 9: '烈風', 10: '狂風', 11: '暴風', 12: '颶風' };

        async function fetchWeatherData() {
            try {
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max,uv_index_max&timezone=Asia/Macau&past_days=1`;
                const res = await fetch(weatherUrl);
                globalWeatherData = await res.json();

                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                document.getElementById('update-time').textContent = `更新時間：${year}-${month}-${day} ${hours}:${minutes}`;

                renderDailySection();
                renderWeatherGroupsSection();
                renderWindStatsSection();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
            } catch (error) {
                console.error("無法載入天氣數據：", error);
                document.getElementById('loading').innerHTML = `<p class="text-red-500 dark:text-red-400">無法載入天氣數據，請檢查網絡連線。</p>`;
            }
        }

        function renderDailySection() {
            const data = globalWeatherData;
            const dailyContainer = document.getElementById('daily-container');
            dailyContainer.innerHTML = '';

            const currentHour = new Date().getHours();
            const isNight = currentHour < 6 || currentHour >= 18;
            const startIndex = 1; 

            for (let i = 0; i < 7; i++) {
                const dateStr = data.daily.time[startIndex + i];
                const maxTemp = Math.round(data.daily.temperature_2m_max[startIndex + i]);
                const minTemp = Math.round(data.daily.temperature_2m_min[startIndex + i]);
                const maxUv = data.daily.uv_index_max ? data.daily.uv_index_max[startIndex + i] : 5;
                const code = data.daily.weather_code[startIndex + i];
                const precipProb = data.daily.precipitation_probability_max ? Math.round(data.daily.precipitation_probability_max[startIndex + i]) : 0;

                let hourlyHumids = [];
                let hourlyWindSpeeds = [];
                let hourlyWindDirs = [];
                let groupCounts = { A:0, B:0, C:0, D:0, E:0, F:0, G:0, H:0, I:0 };

                data.hourly.time.forEach((tStr, idx) => {
                    if (tStr.startsWith(dateStr)) {
                        hourlyHumids.push(data.hourly.relative_humidity_2m ? data.hourly.relative_humidity_2m[idx] : 70);
                        hourlyWindSpeeds.push(data.hourly.wind_speed_10m[idx]);
                        hourlyWindDirs.push(getWindDirection(data.hourly.wind_direction_10m[idx]));
                        
                        const c = data.hourly.weather_code[idx];
                        const gObj = getWeatherGroup(c);
                        groupCounts[gObj.group]++;
                    }
                });

                const minH = hourlyHumids.length > 0 ? Math.min(...hourlyHumids) : 60;
                const maxH = hourlyHumids.length > 0 ? Math.max(...hourlyHumids) : 90;
                const meanH = hourlyHumids.length > 0 ? hourlyHumids.reduce((a,b)=>a+b,0)/hourlyHumids.length : 70;

                let tempHumidConditions = [];
                if (maxTemp >= 37.5) tempHumidConditions.push('極為酷熱');
                else if (maxTemp >= 35.5) tempHumidConditions.push('非常酷熱');
                else if (maxTemp >= 32.5) tempHumidConditions.push('酷熱');
                else if (maxTemp >= 27.5) tempHumidConditions.push('炎熱');

                if (minTemp <= 4.4) tempHumidConditions.push('極為寒冷');
                else if (minTemp <= 7.4) tempHumidConditions.push('非常寒冷');
                else if (minTemp <= 12.4) tempHumidConditions.push('寒冷');
                else if (minTemp <= 14.4) tempHumidConditions.push('相當清涼');

                if (minH < 30.5) tempHumidConditions.push('非常乾燥');
                else if (minH <= 40) tempHumidConditions.push('乾燥');

                if (meanH >= 95) tempHumidConditions.push('非常潮濕');
                else if (meanH >= 80) tempHumidConditions.push('潮濕');

                let part1 = tempHumidConditions.length >= 2 ? `天氣${tempHumidConditions[0]}及${tempHumidConditions[1]}` : (tempHumidConditions.length === 1 ? `天氣${tempHumidConditions[0]}` : '');

                let skyDescs = [];
                if (groupCounts['A'] >= 18) {
                    skyDescs.push('大致天晴');
                } else if (groupCounts['B'] >= 18) {
                    skyDescs.push('大致多雲');
                } else {
                    let hasSun = groupCounts['A'] >= 2;
                    let hasCloud = groupCounts['B'] >= 2;
                    if (hasSun && hasCloud) {
                        if (groupCounts['A'] > groupCounts['B']) {
                            skyDescs.push('天晴，部份時間多雲');
                        } else {
                            skyDescs.push('多雲，部份時間有陽光');
                        }
                    } else if (groupCounts['A'] >= 2) {
                        skyDescs.push('部份時間有陽光');
                    } else if (groupCounts['B'] >= 2) {
                        skyDescs.push('多雲');
                    } else {
                        if (groupCounts['A'] > 0) skyDescs.push('天晴');
                        else skyDescs.push('多雲');
                    }
                }

                let weatherDescs = [];
                if (skyDescs.length > 0) {
                    weatherDescs.push(skyDescs.join('，'));
                }

                if (groupCounts['C'] >= 16) weatherDescs.push('有霧或薄霧');
                else if (groupCounts['C'] >= 2) weatherDescs.push('有時有霧');

                let precipDesc = null;
                for (let g of ['I', 'H', 'E', 'D', 'G']) {
                    let hours = groupCounts[g];
                    if (hours >= 16) {
                        if (g === 'I') precipDesc = '有雷雨';
                        else if (g === 'H') precipDesc = '有驟雨';
                        else if (g === 'E') precipDesc = '有雨';
                        else if (g === 'D') precipDesc = '有微雨';
                        else if (g === 'G') precipDesc = '有雪';
                        break;
                    } else if (hours >= 2) {
                        if (g === 'I') precipDesc = '間中有雷雨';
                        else if (g === 'H') precipDesc = '間中有驟雨';
                        else if (g === 'E') precipDesc = '間中有雨';
                        else if (g === 'D') precipDesc = '間中有微雨';
                        else if (g === 'G') precipDesc = '間中有雪';
                        break;
                    }
                }
                if (precipDesc) weatherDescs.push(precipDesc);

                if (weatherDescs.length === 0) weatherDescs.push('多雲');
                let weatherDescStr = weatherDescs.join('。');

                let windLevels = hourlyWindSpeeds.map(s => getWindSpeedLevel(s));
                let minWindL = Math.min(...windLevels);
                let maxWindL = Math.max(...windLevels);
                let windDirText = getWindDirectionText(hourlyWindDirs);

                let windStr = (minWindL === maxWindL) ? `吹${minWindL}級${windDirText}。` : `吹${minWindL}-${maxWindL}級${windDirText}。`;

                let uvStr = '';
                if (i === 0) {
                    let roundedUv = Math.round(maxUv);
                    let uvLevelName = roundedUv >= 11 ? '極高' : roundedUv >= 8 ? '甚高' : roundedUv >= 6 ? '高' : roundedUv >= 3 ? '中等' : '低';
                    uvStr = `預測最高紫外線指數為${roundedUv}，級別屬於${uvLevelName}。`;
                }

                let fullReport = `${part1 ? part1 + '。' : ''}${weatherDescStr}。${windStr}${uvStr}`;

                const symbols = {
                    0: isNight ? { icon: 'fas fa-moon text-indigo-400' } : { icon: 'fas fa-sun text-yellow-500 dark:text-yellow-400' },
                    1: isNight ? { icon: 'fas fa-moon text-indigo-300' } : { icon: 'fas fa-sun text-yellow-400' },
                    2: isNight ? { icon: 'fas fa-cloud-moon text-indigo-200' } : { icon: 'fas fa-cloud-sun text-yellow-400' },
                    3: { icon: 'fas fa-cloud text-slate-300' },
                    45: { icon: 'fas fa-smog text-slate-400' },
                    51: { icon: 'fas fa-cloud-sun text-yellow-400' },
                    53: { icon: 'fas fa-cloud-sun-rain text-blue-400' },
                    61: { icon: 'fas fa-cloud-rain text-blue-400' },
                    80: { icon: 'fas fa-cloud-showers-heavy text-blue-400' },
                    95: { icon: 'fas fa-cloud-bolt text-blue-400' }
                };
                let dayIcon = symbols[code] || { icon: 'fas fa-cloud text-slate-300' };

                const hasThunderstormOrShowers = groupCounts['I'] > 0 || groupCounts['H'] > 0;
                const hasSnowOrFreezingRain = groupCounts['G'] > 0 || groupCounts['F'] > 0;
                const rainHours = groupCounts['D'] + groupCounts['E'] + groupCounts['H'] + groupCounts['I'];

                if (maxTemp >= 32.5 && !hasThunderstormOrShowers) {
                    dayIcon = { icon: 'fas fa-temperature-high text-orange-500' };
                } else if (minTemp <= 12.5 && !hasThunderstormOrShowers && !hasSnowOrFreezingRain) {
                    dayIcon = { icon: 'fas fa-temperature-low text-blue-400' };
                } else if (dayIcon.icon.includes('fa-cloud-sun-rain')) {
                    if (rainHours < 8) {
                        dayIcon = { icon: 'fas fa-cloud-sun text-yellow-400' };
                    }
                }

                const dateObj = new Date(dateStr);
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const dayStr = String(dateObj.getDate()).padStart(2, '0');
                const weekday = ['日', '一', '二', '三', '四', '五', '六'][dateObj.getDay()];
                const dateDisplay = `${month}/${dayStr} (${weekday})`;

                let popVal = precipProb;
                let popLevel = '極低';
                let popBadgeClass = 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
                
                if (popVal >= 95) {
                    popLevel = '極高';
                    popBadgeClass = 'bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300 font-bold';
                } else if (popVal >= 85) {
                    popLevel = '高';
                    popBadgeClass = 'bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 font-bold';
                } else if (popVal >= 70) {
                    popLevel = '偏高';
                    popBadgeClass = 'bg-orange-100 text-orange-800 dark:bg-orange-950 dark:text-orange-300 font-semibold';
                } else if (popVal >= 40) {
                    popLevel = '中等';
                    popBadgeClass = 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 font-semibold';
                } else if (popVal >= 25) {
                    popLevel = '偏低';
                    popBadgeClass = 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300';
                } else if (popVal >= 10) {
                    popLevel = '低';
                    popBadgeClass = 'bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300';
                }

                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 flex flex-col shadow-sm w-[170px] sm:w-[190px] flex-shrink-0 snap-start";
                card.innerHTML = `
                    <!-- 1. 日期 -->
                    <div class="font-bold text-sm text-teal-600 dark:text-teal-400 text-center pb-2">${dateDisplay}</div>
                    
                    <!-- 2. 圖標 (大小設為 text-5xl) -->
                    <div class="flex flex-col items-center justify-center py-3">
                        <i class="fa-solid ${dayIcon.icon} text-5xl"></i>
                    </div>

                    <hr class="border-slate-100 dark:border-slate-800 my-2">

                    <!-- 3. 溫度範圍 -->
                    <div class="py-1 text-center text-lg">
                        <span class="text-blue-500 dark:text-blue-400 font-bold">${minTemp}°C</span>
                        <span class="text-slate-400 mx-1 font-normal">/</span>
                        <span class="text-orange-500 dark:text-orange-400 font-bold">${maxTemp}°C</span>
                    </div>

                    <hr class="border-slate-100 dark:border-slate-800 my-2">

                    <!-- 4. 降雨機率 -->
                    <div class="py-1 text-center space-y-1">
                        <div class="text-[11px] font-semibold text-slate-400">降雨機率</div>
                        <div class="flex items-center justify-center gap-1.5">
                            <span class="text-sm font-bold text-slate-700 dark:text-slate-200">${precipProb}%</span>
                            <span class="px-2 py-0.5 rounded text-[10px] ${popBadgeClass}">${popLevel}</span>
                        </div>
                    </div>

                    <hr class="border-slate-100 dark:border-slate-800 my-2">

                    <!-- 5. 報文文字 -->
                    <div class="flex-grow flex flex-col justify-start text-xs text-slate-600 dark:text-slate-400 text-left leading-relaxed pt-1">
                        ${fullReport}
                    </div>
                `;
                dailyContainer.appendChild(card);
            }
        }

        function renderWeatherGroupsSection() {
            const data = globalWeatherData;
            const container = document.getElementById('weather-groups-container');
            container.innerHTML = '';

            const startIndex = 1;
            const groupKeys = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
            const groupNames = { 'A': '天晴', 'B': '多雲', 'C': '霧', 'D': '微雨', 'E': '雨', 'F': '凍雨', 'G': '雪', 'H': '驟雨', 'I': '雷雨' };

            const dailyStats = [];
            for (let i = 0; i < 7; i++) {
                const dateStr = data.daily.time[startIndex + i];
                const counts = { A:0, B:0, C:0, D:0, E:0, F:0, G:0, H:0, I:0 };
                data.hourly.time.forEach((tStr, idx) => {
                    if (tStr.startsWith(dateStr)) {
                        const code = data.hourly.weather_code[idx];
                        counts[getWeatherGroup(code).group]++;
                    }
                });
                dailyStats.push({ dateStr, counts });
            }

            const table = document.createElement('div');
            table.className = "min-w-[700px] overflow-x-auto";
            let headerHtml = `<div class="grid grid-cols-8 gap-2 pb-3 border-b border-slate-200 dark:border-slate-800 text-center font-bold text-xs text-slate-500 dark:text-slate-400"><div class="text-left pl-2">天氣分組</div>`;
            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(data.daily.time[startIndex + i]);
                headerHtml += `<div>${i === 0 ? '今日' : i === 1 ? '明日' : dateObj.toLocaleDateString('zh-TW', { weekday: 'short' })}<br><span class="text-[10px] text-slate-400">${dateObj.getMonth() + 1}/${dateObj.getDate()}</span></div>`;
            }
            headerHtml += `</div>`;

            let bodyHtml = `<div class="divide-y divide-slate-100 dark:divide-slate-800/60 text-xs">`;
            groupKeys.forEach(gKey => {
                bodyHtml += `<div class="grid grid-cols-8 gap-2 py-2.5 items-center text-center"><div class="text-left pl-2 font-semibold text-slate-700 dark:text-slate-300 truncate">${groupNames[gKey]}</div>`;
                dailyStats.forEach(day => {
                    const val = day.counts[gKey];
                    bodyHtml += `<div><span class="px-2 py-1 rounded-md ${val > 0 ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-300 font-bold' : 'text-slate-300 dark:text-slate-600'}">${val} 小時</span></div>`;
                });
                bodyHtml += `</div>`;
            });
            bodyHtml += `</div>`;
            table.innerHTML = headerHtml + bodyHtml;
            container.appendChild(table);
        }

        function renderWindStatsSection() {
            const data = globalWeatherData;
            const container = document.getElementById('wind-stats-container');
            container.innerHTML = '';

            const startIndex = 1;
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const dailyWindData = [];

            for (let i = 0; i < 7; i++) {
                const dateStr = data.daily.time[startIndex + i];
                const dirCounts = {}; directions.forEach(d => dirCounts[d] = 0);
                const speedCounts = {}; for (let s = 0; s <= 12; s++) speedCounts[s] = 0;

                data.hourly.time.forEach((tStr, idx) => {
                    if (tStr.startsWith(dateStr)) {
                        dirCounts[getWindDirection(data.hourly.wind_direction_10m[idx])]++;
                        speedCounts[getWindSpeedLevel(data.hourly.wind_speed_10m[idx])]++;
                    }
                });
                dailyWindData.push({ dateStr, dirCounts, speedCounts });
            }

            const dirWrapper = document.createElement('div');
            dirWrapper.className = "space-y-3";
            dirWrapper.innerHTML = `<h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300"><i class="fa-solid fa-compass text-teal-500"></i> 風向時數統計 (8方位)</h3>`;
            const dirTable = document.createElement('div');
            dirTable.className = "min-w-[700px] overflow-x-auto";
            let dirHeaderHtml = `<div class="grid grid-cols-9 gap-2 pb-3 border-b border-slate-200 dark:border-slate-800 text-center font-bold text-xs text-slate-500 dark:text-slate-400"><div class="text-left pl-2 col-span-2">風向</div>`;
            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(data.daily.time[startIndex + i]);
                dirHeaderHtml += `<div>${i === 0 ? '今日' : i === 1 ? '明日' : dateObj.toLocaleDateString('zh-TW', { weekday: 'short' })}</div>`;
            }
            dirHeaderHtml += `</div>`;
            let dirBodyHtml = `<div class="divide-y divide-slate-100 dark:divide-slate-800/60 text-xs">`;
            const dirMapFull = { 'N': '北', 'NE': '東北', 'E': '東', 'SE': '東南', 'S': '南', 'SW': '西南', 'W': '西', 'NW': '西北' };
            directions.forEach(d => {
                dirBodyHtml += `<div class="grid grid-cols-9 gap-2 py-2 items-center text-center"><div class="text-left pl-2 font-semibold text-slate-700 dark:text-slate-300 col-span-2">${dirMapFull[d]}風</div>`;
                dailyWindData.forEach(day => {
                    const val = day.dirCounts[d];
                    dirBodyHtml += `<div><span class="px-2 py-0.5 rounded-md ${val > 0 ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-300 font-bold' : 'text-slate-300 dark:text-slate-600'}">${val}h</span></div>`;
                });
                dirBodyHtml += `</div>`;
            });
            dirBodyHtml += `</div>`;
            dirTable.innerHTML = dirHeaderHtml + dirBodyHtml;
            dirWrapper.appendChild(dirTable);
            container.appendChild(dirWrapper);

            const speedWrapper = document.createElement('div');
            speedWrapper.className = "space-y-3 mt-6";
            speedWrapper.innerHTML = `<h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300"><i class="fa-solid fa-gauge-high text-teal-500"></i> 風速級別時數統計 (0-12級)</h3>`;
            const speedTable = document.createElement('div');
            speedTable.className = "min-w-[700px] overflow-x-auto";
            let speedHeaderHtml = `<div class="grid grid-cols-9 gap-2 pb-3 border-b border-slate-200 dark:border-slate-800 text-center font-bold text-xs text-slate-500 dark:text-slate-400"><div class="text-left pl-2 col-span-2">風速級別</div>`;
            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(data.daily.time[startIndex + i]);
                speedHeaderHtml += `<div>${i === 0 ? '今日' : i === 1 ? '明日' : dateObj.toLocaleDateString('zh-TW', { weekday: 'short' })}</div>`;
            }
            speedHeaderHtml += `</div>`;
            let speedBodyHtml = `<div class="divide-y divide-slate-100 dark:divide-slate-800/60 text-xs">`;
            for (let s = 0; s <= 12; s++) {
                speedBodyHtml += `<div class="grid grid-cols-9 gap-2 py-2 items-center text-center"><div class="text-left pl-2 font-semibold text-slate-700 dark:text-slate-300 col-span-2">${s}級 (${windSpeedNames[s] || ''})</div>`;
                dailyWindData.forEach(day => {
                    const val = day.speedCounts[s];
                    speedBodyHtml += `<div><span class="px-2 py-0.5 rounded-md ${val > 0 ? 'bg-teal-50 text-teal-700 dark:bg-teal-950/50 dark:text-teal-300 font-bold' : 'text-slate-300 dark:text-slate-600'}">${val}h</span></div>`;
                });
                speedBodyHtml += `</div>`;
            }
            speedBodyHtml += `</div>`;
            speedTable.innerHTML = speedHeaderHtml + speedBodyHtml;
            speedWrapper.appendChild(speedTable);
            container.appendChild(speedWrapper);
        }

        fetchWeatherData();
    </script>
</body>
</html>
