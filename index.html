<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 气象中心 - 澳门</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(13, 17, 28, 0.75);
            --border-glow: rgba(0, 240, 255, 0.25);
            --border-hover: rgba(0, 240, 255, 0.6);
            --accent-cyan: #00f0ff;
            --accent-purple: #9d00ff;
            --accent-green: #00ff66;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(157, 0, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 顶部标题栏 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 16px;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .location-tag {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: rgba(0, 240, 255, 0.05);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-glow);
        }

        /* 通用卡片样式 (Glassmorphism + HUD Border) */
        .hud-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }

        .hud-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        /* 装饰性角标 */
        .hud-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 6px; height: 6px;
            border-top: 2px solid var(--accent-cyan);
            border-left: 2px solid var(--accent-cyan);
        }
        .hud-card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 6px; height: 6px;
            border-bottom: 2px solid var(--accent-cyan);
            border-right: 2px solid var(--accent-cyan);
        }

        /* 当前天气大卡片 */
        .current-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media(max-width: 768px) {
            .current-section { grid-template-columns: 1fr; }
        }

        .current-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .temp-display {
            font-size: 4rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .condition-text {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .sub-info {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .metric-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .metric-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.4rem;
            font-family: 'Courier New', monospace;
            color: var(--text-main);
        }

        /* 区块标题 */
        .section-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '■';
            font-size: 0.7rem;
        }

        /* 24小时逐小时横向滚动 */
        .hourly-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 24px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-cyan) var(--card-bg);
        }

        .hourly-container::-webkit-scrollbar {
            height: 6px;
        }
        .hourly-container::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 3px;
        }

        .hourly-item {
            flex: 0 0 90px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 12px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hourly-time {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
        }

        .hourly-icon {
            font-size: 1.5rem;
        }

        .hourly-temp {
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .hourly-rain {
            font-size: 0.75rem;
            color: var(--accent-cyan);
        }

        /* 7天预报网格 */
        .daily-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .daily-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 18px;
            border-radius: 8px;
        }

        .daily-date {
            font-family: 'Courier New', monospace;
            width: 120px;
        }

        .daily-condition {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 140px;
        }

        .daily-rain {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            width: 90px;
            text-align: right;
        }

        .daily-temp-range {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-align: right;
            width: 100px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--accent-cyan);
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-area">
                <h1>AI Weather Terminal</h1>
            </div>
            <div class="location-tag">
                LAT: 22.1595° N | LON: 113.5685° E (澳门)
            </div>
        </header>

        <div id="loading" class="loading">正在连接卫星气象矩阵...</div>

        <div id="app-content" style="display: none;">
            <!-- 当前天气总览 -->
            <div class="current-section">
                <div class="hud-card current-main">
                    <div>
                        <div id="curr-condition" class="condition-text">加载中...</div>
                        <div id="curr-sub" class="sub-info">体感温度: --°C</div>
                    </div>
                    <div id="curr-temp" class="temp-display">--°C</div>
                </div>

                <div class="hud-card metrics-grid">
                    <div class="metric-box">
                        <span class="metric-title">空气湿度</span>
                        <span id="curr-humidity" class="metric-value">--%</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-title">风速 / 风向</span>
                        <span id="curr-wind" class="metric-value">-- km/h</span>
                    </div>
                </div>
            </div>

            <!-- 24小时逐小时预报 -->
            <div class="hud-card" style="margin-bottom: 24px;">
                <div class="section-title">24小时趋势预测 (HOURLY)</div>
                <div id="hourly-container" class="hourly-container">
                    <!-- 动态插入 -->
                </div>
            </div>

            <!-- 7天预报 -->
            <div class="hud-card">
                <div class="section-title">7天长效气象预测 (7-DAY FORECAST)</div>
                <div id="daily-list" class="daily-list">
                    <!-- 动态插入 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // WMO 天气代码映射成中文和图标
        function getWeatherInfo(code) {
            const map = {
                0: { text: '晴', icon: '☀️' },
                1: { text: '大部晴朗', icon: '🌤️' },
                2: { text: '局部多云', icon: '⛅' },
                3: { text: '阴天', icon: '☁️' },
                45: { text: '有雾', icon: '🌫️' },
                48: { text: '雾凇', icon: '🌫️' },
                51: { text: '小毛毛雨', icon: '🌧️' },
                53: { text: '毛毛雨', icon: '🌧️' },
                55: { text: '大毛毛雨', icon: '🌧️' },
                61: { text: '小雨', icon: '🌦️' },
                63: { text: '中雨', icon: '🌧️' },
                65: { text: '大雨', icon: '🌧️' },
                71: { text: '小雪', icon: '🌨️' },
                73: { text: '中雪', icon: '🌨️' },
                75: { text: '大雪', icon: '❄️' },
                95: { text: '雷阵雨', icon: '⚡' },
                96: { text: '雷暴伴冰雹', icon: '⚡' },
                99: { text: '强雷暴', icon: '⚡' }
            };
            return map[code] || { text: '未知', icon: '✨' };
        }

        async function fetchWeatherData() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=22.1595&longitude=113.5685&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto');
                const data = await response.json();
                
                renderWeather(data);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
            } catch (error) {
                console.error('获取天气数据失败:', error);
                document.getElementById('loading').innerText = '数据同步失败，请检查网络连接。';
            }
        }

        function renderWeather(data) {
            // 1. 当前天气
            const curr = data.current;
            const weatherInfo = getWeatherInfo(curr.weather_code);
            document.getElementById('curr-temp').innerText = `${curr.temperature_2m}${data.current_units.temperature_2m}`;
            document.getElementById('curr-condition').innerText = `${weatherInfo.icon} ${weatherInfo.text}`;
            document.getElementById('curr-sub').innerText = `体感温度: ${curr.apparent_temperature}${data.current_units.temperature_2m}`;
            document.getElementById('curr-humidity').innerText = `${curr.relative_humidity_2m}${data.current_units.relative_humidity_2m}`;
            document.getElementById('curr-wind').innerText = `${curr.wind_speed_10m} ${data.current_units.wind_speed_10m}`;

            // 2. 24小时天气 (查找当前时间所在的索引，向后截取24条)
            const hourlyContainer = document.getElementById('hourly-container');
            hourlyContainer.innerHTML = '';
            
            const nowIso = new Date().toISOString().slice(0, 13); // 获取当前小时的近似前缀
            let startIndex = data.hourly.time.findIndex(t => t.startsWith(nowIso));
            if (startIndex === -1) startIndex = 0;

            for (let i = startIndex; i < startIndex + 24 && i < data.hourly.time.length; i++) {
                const timeStr = data.hourly.time[i].split('T')[1]; // 取 "HH:00"
                const temp = data.hourly.temperature_2m[i];
                const rainProb = data.hourly.precipitation_probability[i];
                const code = data.hourly.weather_code[i];
                const info = getWeatherInfo(code);

                const item = document.createElement('div');
                item.className = 'hourly-item';
                item.innerHTML = `
                    <div class="hourly-time">${timeStr}</div>
                    <div class="hourly-icon">${info.icon}</div>
                    <div class="hourly-temp">${temp}°</div>
                    <div class="hourly-rain">💧${rainProb}%</div>
                `;
                hourlyContainer.appendChild(item);
            }

            // 3. 7天天气预报
            const dailyList = document.getElementById('daily-list');
            dailyList.innerHTML = '';

            for (let i = 0; i < data.daily.time.length; i++) {
                const dateStr = data.daily.time[i];
                const maxTemp = data.daily.temperature_2m_max[i];
                const minTemp = data.daily.temperature_2m_min[i];
                const rainMax = data.daily.precipitation_probability_max[i];
                const code = data.daily.weather_code[i];
                const info = getWeatherInfo(code);

                // 格式化日期显示为 星期几 / 月-日
                const dateObj = new Date(dateStr);
                const options = { weekday: 'short', month: 'numeric', day: 'numeric' };
                const formattedDate = dateObj.toLocaleDateString('zh-CN', options);

                const item = document.createElement('div');
                item.className = 'daily-item';
                item.innerHTML = `
                    <div class="daily-date">${formattedDate}</div>
                    <div class="daily-condition">
                        <span>${info.icon}</span>
                        <span>${info.text}</span>
                    </div>
                    <div class="daily-rain">降雨: ${rainMax}%</div>
                    <div class="daily-temp-range">${minTemp}° ~ ${maxTemp}°</div>
                `;
                dailyList.appendChild(item);
            }
        }

        // 初始化加载
        fetchWeatherData();
    </script>
</body>
</html>
