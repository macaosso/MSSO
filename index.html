<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳門天氣即時資訊</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#e6fffa', 500: '#319795', 600: '#2c7a7b' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300">

    <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Header 區塊 -->
        <header class="flex justify-between items-start border-b border-gray-200 dark:border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-cyan-500 dark:text-cyan-400"></i> 澳門天氣
                </h1>
                <!-- 日期、星期、24H時間與農曆日期 -->
                <div id="current-datetime" class="text-sm md:text-base text-gray-600 dark:text-gray-400 mt-1.5 leading-relaxed">
                    2026年09月18日 (五) 01:00<br>
                    <span class="text-xs md:text-sm text-cyan-600 dark:text-cyan-400 font-medium">丙午馬年八月初八日</span>
                </div>
            </div>
            
            <!-- 設定 / 主題切換按鈕 -->
            <div class="flex items-center gap-3">
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline"></i>
                </button>
            </div>
        </header>

        <!-- 即時天氣摘要卡片 -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-100 dark:border-gray-700">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex items-center gap-4">
                    <div class="text-5xl text-amber-500">
                        <i class="fa-solid fa-cloud-sun"></i>
                    </div>
                    <div>
                        <div class="text-4xl font-extrabold tracking-tight">28°C</div>
                        <div class="text-gray-500 dark:text-gray-400 text-sm mt-1">多雲時晴 · 體感溫度 31°C</div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 w-full md:w-auto text-sm">
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl">
                        <div class="text-gray-400 text-xs">相對濕度</div>
                        <div class="font-semibold mt-0.5">78%</div>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl">
                        <div class="text-gray-400 text-xs">空氣質量</div>
                        <div class="font-semibold text-emerald-500 mt-0.5">良好 (AQI 35)</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 日出日落區塊 (移除上中天，加入上下箭頭) -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-100 dark:border-gray-700">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-sun text-amber-500"></i> 日出日落
            </h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- 日出 -->
                <div class="bg-amber-50/60 dark:bg-gray-700/50 p-4 rounded-xl flex items-center gap-3">
                    <div class="relative text-amber-500 text-2xl flex items-center">
                        <i class="fa-solid fa-sun"></i>
                        <i class="fa-solid fa-arrow-up text-xs absolute -top-1 -right-2"></i>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">日出</div>
                        <div class="text-sm font-bold text-gray-800 dark:text-white">06:05</div>
                    </div>
                </div>
                <!-- 日落 -->
                <div class="bg-amber-50/60 dark:bg-gray-700/50 p-4 rounded-xl flex items-center gap-3">
                    <div class="relative text-amber-600 text-2xl flex items-center">
                        <i class="fa-solid fa-sun"></i>
                        <i class="fa-solid fa-arrow-down text-xs absolute -bottom-1 -right-2"></i>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">日落</div>
                        <div class="text-sm font-bold text-gray-800 dark:text-white">18:25</div>
                    </div>
                </div>
                <!-- 月出 -->
                <div class="bg-indigo-50/60 dark:bg-gray-700/50 p-4 rounded-xl flex items-center gap-3">
                    <div class="relative text-indigo-500 text-2xl flex items-center">
                        <i class="fa-solid fa-moon"></i>
                        <i class="fa-solid fa-arrow-up text-xs absolute -top-1 -right-2"></i>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">月出</div>
                        <div class="text-sm font-bold text-gray-800 dark:text-white">09:12</div>
                    </div>
                </div>
                <!-- 月落 -->
                <div class="bg-indigo-50/60 dark:bg-gray-700/50 p-4 rounded-xl flex items-center gap-3">
                    <div class="relative text-indigo-600 text-2xl flex items-center">
                        <i class="fa-solid fa-moon"></i>
                        <i class="fa-solid fa-arrow-down text-xs absolute -bottom-1 -right-2"></i>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">月落</div>
                        <div class="text-sm font-bold text-gray-800 dark:text-white">21:45</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 新增：潮汐高度區塊 -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-100 dark:border-gray-700">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-water text-blue-500"></i> 澳門潮汐高度
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div class="bg-blue-50/60 dark:bg-gray-700/50 p-4 rounded-xl">
                    <div class="text-xs text-gray-500 dark:text-gray-400">當前潮位</div>
                    <div class="text-xl font-bold text-blue-600 dark:text-blue-400 mt-1">1.8米 <span class="text-xs font-normal text-gray-500">(漲潮中)</span></div>
                </div>
                <div class="bg-blue-50/60 dark:bg-gray-700/50 p-4 rounded-xl">
                    <div class="text-xs text-gray-500 dark:text-gray-400">最高潮位預報</div>
                    <div class="text-sm font-bold text-gray-800 dark:text-white mt-1">2.3米 (13:40)</div>
                </div>
                <div class="bg-blue-50/60 dark:bg-gray-700/50 p-4 rounded-xl">
                    <div class="text-xs text-gray-500 dark:text-gray-400">最低潮位預報</div>
                    <div class="text-sm font-bold text-gray-800 dark:text-white mt-1">0.6米 (07:15)</div>
                </div>
            </div>
            <!-- 今日潮汐時間序列預報 -->
            <div class="bg-blue-50/30 dark:bg-gray-700/30 rounded-xl p-4 flex items-center justify-between text-xs md:text-sm text-gray-700 dark:text-gray-300">
                <div class="flex flex-col items-center">
                    <span class="text-gray-400 text-xs">03:20</span>
                    <span class="font-semibold mt-1">0.8m (低潮)</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-gray-400 text-xs">09:15</span>
                    <span class="font-semibold mt-1">2.1m (高潮)</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-gray-400 text-xs">15:30</span>
                    <span class="font-semibold mt-1">0.9m (低潮)</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-gray-400 text-xs">22:10</span>
                    <span class="font-semibold mt-1">2.4m (高潮)</span>
                </div>
            </div>
        </div>

    </div>

    <!-- 頁面動態時鐘與主題切換 Script -->
    <script>
        // 動態更新 24H 時間格式與星期
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekday = weekdays[now.getDay()];
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            const dateStr = `${year}年${month}月${day}日 (${weekday}) ${hours}:${minutes}`;
            const lunarStr = "丙午馬年八月初八日";
            
            const datetimeEl = document.getElementById('current-datetime');
            if (datetimeEl) {
                datetimeEl.innerHTML = `${dateStr}<br><span class="text-xs md:text-sm text-cyan-600 dark:text-cyan-400 font-medium">${lunarStr}</span>`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 深色模式切換邏輯
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });
    </script>
</body>
</html>
