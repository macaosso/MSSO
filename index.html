<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳門天氣儀表板</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(100, 116, 139, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.4);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center p-4 md:p-8 transition-colors duration-200">

    <!-- 容器 (電腦版擴寬為 max-w-7xl) -->
    <div class="w-full max-w-7xl space-y-6">
        
        <!-- 標頭 -->
        <header class="flex justify-between items-center bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-cyan-500 dark:text-cyan-400"></i> 澳門天氣
                </h1>
            </div>
            <div class="flex items-center gap-4">
                <div id="current-time" class="text-right text-xs md:text-sm text-cyan-600 dark:text-cyan-300 font-medium">
                    載入中...
                </div>
                <!-- 主題切換按鈕 -->
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors shadow-sm" title="切換主題">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
            </div>
        </header>

        <!-- 載入狀態 -->
        <div id="loading" class="text-center py-20 text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-cyan-500 dark:text-cyan-400 mb-3"></i>
            <p>正在取得最新天氣數據...</p>
        </div>

        <!-- 主要內容 (電腦版採用 3 欄式網格排版，左側2欄，右側1欄) -->
        <div id="dashboard-content" class="space-y-6 hidden">

            <!-- 天氣提示區塊 (全寬顯示) -->
            <div id="alerts-container" class="space-y-3">
                <!-- 動態注入提示框 -->
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- 左側兩欄：即時天氣、24小時預報、7天預報 -->
                <div class="lg:col-span-2 space-y-6">

                    <!-- 即時天氣 -->
                    <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
                        <h2 class="text-lg font-semibold mb-4 text-slate-700 dark:text-slate-300 flex items-center gap-2">
                            <i class="fa-solid fa-cloud-sun text-yellow-500 dark:text-yellow-400"></i> 即時天氣
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                            <div class="flex items-center gap-6">
                                <div id="current-icon" class="text-6xl md:text-7xl"></div>
                                <div>
                                    <div class="text-5xl md:text-6xl font-extrabold tracking-tight dark:text-white" id="current-temp">--°C</div>
                                    <div class="text-slate-500 dark:text-slate-400 font-medium text-lg mt-1" id="current-condition">--</div>
                                    <div class="text-sm mt-2 flex gap-3" id="current-high-low">
                                        <span class="dark:text-white font-medium">高: --°</span>
                                        <span class="text-slate-400 dark:text-slate-500 font-medium">低: --°</span>
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4 border-t md:border-t-0 md:border-l border-slate-200 dark:border-slate-800 pt-4 md:pt-0 md:pl-6">
                                <div class="bg-slate-50 dark:bg-slate-950/50 p-4 rounded-xl border border-slate-200 dark:border-slate-800/65">
                                    <div class="text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider flex items-center gap-1.5">
                                        <!-- 改良版相對濕度 SVG 圖標 (內建 %) -->
                                        <svg class="w-4 h-4 text-blue-500 dark:text-blue-400 inline-block" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                                            <text x="12" y="15.5" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">%</text>
                                        </svg>
                                        相對濕度
                                    </div>
                                    <div class="text-xl font-bold mt-1 text-slate-800 dark:text-slate-100" id="current-humidity">--%</div>
                                </div>
                                <div class="bg-slate-50 dark:bg-slate-950/50 p-4 rounded-xl border border-slate-200 dark:border-slate-800/65">
                                    <div class="text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider flex items-center gap-1.5">
                                        <i class="fa-solid fa-wind text-teal-500 dark:text-teal-400"></i> 風速
                                    </div>
                                    <div class="text-xl font-bold mt-1 text-slate-800 dark:text-slate-100" id="current-wind-speed">-- km/h</div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- 24小時天氣預報 -->
                    <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
                        <h2 class="text-lg font-semibold mb-4 text-slate-700 dark:text-slate-300 flex items-center gap-2">
                            <i class="fa-solid fa-clock text-cyan-500 dark:text-cyan-400"></i> 24小時天氣預報
                        </h2>
                        <div id="hourly-container" class="flex gap-4 overflow-x-auto pb-2 pt-1"></div>
                    </section>

                    <!-- 7天天氣預報 -->
                    <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
                        <h2 class="text-lg font-semibold mb-4 text-slate-700 dark:text-slate-300 flex items-center gap-2">
                            <i class="fa-solid fa-calendar-days text-purple-500 dark:text-purple-400"></i> 7天天氣預報
                        </h2>
                        <div id="daily-container" class="overflow-x-auto pb-2">
                            <!-- 動態載入 7 天預報圖表排版 -->
                        </div>
                    </section>

                </div>

                <!-- 右側一欄：分區天氣等輔助資訊 -->
                <div class="lg:col-span-1 space-y-6">

                    <!-- 分區天氣 -->
                    <section class="bg-white border border-slate-200 dark:bg-slate-900 dark:border-slate-800 p-6 rounded-2xl shadow-lg dark:shadow-xl transition-colors">
                        <h2 class="text-lg font-semibold mb-4 text-slate-700 dark:text-slate-300 flex items-center gap-2">
                            <i class="fa-solid fa-map-location-dot text-emerald-500 dark:text-emerald-400"></i> 分區天氣
                        </h2>
                        <div class="space-y-3" id="district-container">
                            <!-- 動態載入分區天氣 -->
                        </div>
                    </section>

                </div>

            </div>

        </div>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const LAT = 22.1595;
        const LON = 113.5685;

        // 主題切換邏輯
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        function getWeatherDetails(code, isNight = false) {
            switch (code) {
                case 0: 
                    return isNight 
                        ? { text: '晴朗', icon: 'fa-moon text-indigo-400' } 
                        : { text: '晴朗', icon: 'fa-sun text-yellow-500 dark:text-yellow-400' };
                case 1: 
                case 2: 
                    return isNight 
                        ? { text: '多雲', icon: 'fa-cloud-moon text-indigo-300' } 
                        : { text: '局部多雲', icon: 'fa-cloud-sun text-yellow-300 dark:text-yellow-200' };
                case 3: return { text: '陰天', icon: 'fa-cloud text-slate-400' };
                case 45:
                case 48: return { text: '有霧', icon: 'fa-smog text-slate-400' };
                case 51:
                case 53:
                case 55:
                case 56:
                case 57: return { text: '毛毛雨', icon: 'fa-cloud-rain text-blue-400 dark:text-blue-300' };
                case 61:
                case 63:
                case 65:
                case 66:
                case 67: return { text: '下雨', icon: 'fa-cloud-showers-heavy text-blue-500 dark:text-blue-400' };
                case 71:
                case 73:
                case 75:
                case 77: return { text: '下雪', icon: 'fa-snowflake text-blue-300 dark:text-blue-200' };
                case 80:
                case 81:
                case 82: return { text: '驟雨', icon: 'fa-cloud-rain text-blue-500 dark:text-blue-400' };
                case 95:
                case 96:
                case 99: return { text: '雷暴', icon: 'fa-bolt text-yellow-500' };
                default: return { text: '未知', icon: 'fa-cloud text-slate-400' };
            }
        }

        function checkIfNight(dateObj, dailyData, dayIndex = 0) {
            if (dailyData && dailyData.sunrise && dailyData.sunset && dailyData.sunrise[dayIndex] && dailyData.sunset[dayIndex]) {
                const sunrise = new Date(dailyData.sunrise[dayIndex]);
                const sunset = new Date(dailyData.sunset[dayIndex]);
                return dateObj < sunrise || dateObj > sunset;
            }
            const hour = dateObj.getHours();
            return hour < 6 || hour >= 18;
        }

        async function fetchWeatherData() {
            try {
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max&timezone=Asia/Macau`;
                const districtUrl = `https://api.open-meteo.com/v1/forecast?latitude=22.1957537,22.1595,22.1178268&longitude=113.5443291,113.5685,113.5524237&current=temperature_2m,weather_code&timezone=Asia/Macau`;

                const [weatherRes, districtRes] = await Promise.all([
                    fetch(weatherUrl),
                    fetch(districtUrl)
                ]);

                const data = await weatherRes.json();
                const districtData = await districtRes.json();

                renderDashboard(data, districtData);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');

            } catch (error) {
                console.error("無法載入天氣數據：", error);
                document.getElementById('loading').innerHTML = `<p class="text-red-500 dark:text-red-400">無法載入天氣數據，請檢查網絡連線。</p>`;
            }
        }

        function renderDashboard(data, districtData) {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleString('zh-TW', { timeZone: 'Asia/Macau', dateStyle: 'medium', timeStyle: 'short' });

            const curr = data.current;
            const isNight = checkIfNight(now, data.daily, 0);
            const weatherInfo = getWeatherDetails(curr.weather_code, isNight);
            
            const todayMax = Math.round(data.daily.temperature_2m_max[0]);
            const todayMin = Math.round(data.daily.temperature_2m_min[0]);

            // 1. 即時天氣
            document.getElementById('current-icon').innerHTML = `<i class="fa-solid ${weatherInfo.icon}"></i>`;
            document.getElementById('current-temp').innerText = `${Math.round(curr.temperature_2m)}°C`;
            document.getElementById('current-condition').innerText = weatherInfo.text;
            document.getElementById('current-high-low').innerHTML = `
                <span class="text-slate-800 dark:text-white font-medium">高: ${todayMax}°</span>
                <span class="text-slate-500 dark:text-slate-400 font-medium">低: ${todayMin}°</span>
            `;
            document.getElementById('current-humidity').innerText = `${curr.relative_humidity_2m}%`;
            document.getElementById('current-wind-speed').innerText = `${curr.wind_speed_10m} km/h`;

            // 檢查提示條件
            const currentHourIndex = data.hourly.time.findIndex(timeStr => new Date(timeStr) >= new Date()) || 0;
            const next24Temps = data.hourly.temperature_2m.slice(currentHourIndex, currentHourIndex + 24);
            const next24Pops = data.hourly.precipitation_probability.slice(currentHourIndex, currentHourIndex + 24);

            const isHot = curr.temperature_2m > 28 || next24Temps.some(t => t > 28);
            const isCold = curr.temperature_2m < 14 || next24Temps.some(t => t < 14);
            const isRainy = next24Pops.some(p => p > 60);

            const alertsContainer = document.getElementById('alerts-container');
            alertsContainer.innerHTML = '';

            if (isHot) {
                const alertBox = document.createElement('div');
                alertBox.className = "flex items-center gap-3 bg-orange-500/10 border border-orange-500/30 text-orange-600 dark:text-orange-400 p-4 rounded-2xl shadow-sm transition-colors";
                alertBox.innerHTML = `
                    <i class="fa-solid fa-fire text-xl"></i>
                    <div><span class="font-bold">炎熱提示：</span>氣溫偏高（超過28°C），請注意防暑降溫及補充水分。</div>
                `;
                alertsContainer.appendChild(alertBox);
            }

            if (isCold) {
                const alertBox = document.createElement('div');
                alertBox.className = "flex items-center gap-3 bg-cyan-500/10 border border-cyan-500/30 text-cyan-600 dark:text-cyan-400 p-4 rounded-2xl shadow-sm transition-colors";
                alertBox.innerHTML = `
                    <i class="fa-solid fa-snowflake text-xl"></i>
                    <div><span class="font-bold">寒冷提示：</span>氣溫偏低（低於14°C），請注意適時添衣保暖。</div>
                `;
                alertsContainer.appendChild(alertBox);
            }

            if (isRainy) {
                const alertBox = document.createElement('div');
                alertBox.className = "flex items-center gap-3 bg-blue-500/10 border border-blue-500/30 text-blue-600 dark:text-blue-400 p-4 rounded-2xl shadow-sm transition-colors";
                alertBox.innerHTML = `
                    <i class="fa-solid fa-cloud-showers-heavy text-xl"></i>
                    <div><span class="font-bold">降雨提示：</span>未來24小時內降雨機率高於60%，請外出時記得攜帶雨具。</div>
                `;
                alertsContainer.appendChild(alertBox);
            }

            // 2. 分區天氣
            const districtContainer = document.getElementById('district-container');
            districtContainer.innerHTML = '';
            const districtNames = ['澳門', '氹仔', '路環'];

            districtData.forEach((loc, index) => {
                const dName = districtNames[index];
                const dTemp = Math.round(loc.current.temperature_2m);
                const dWeather = getWeatherDetails(loc.current.weather_code, isNight);

                const card = document.createElement('div');
                card.className = "bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800/65 p-3.5 rounded-xl flex items-center justify-between transition-colors";
                card.innerHTML = `
                    <div>
                        <div class="text-slate-500 dark:text-slate-400 text-xs">${dName}</div>
                        <div class="text-lg font-bold text-slate-800 dark:text-white mt-0.5">${dTemp}°C</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-600 dark:text-slate-300">${dWeather.text}</span>
                        <i class="fa-solid ${dWeather.icon} text-2xl"></i>
                    </div>
                `;
                districtContainer.appendChild(card);
            });

            // 3. 24小時天氣預報
            const hourlyContainer = document.getElementById('hourly-container');
            hourlyContainer.innerHTML = '';
            
            const limit = currentHourIndex + 24;

            for (let i = currentHourIndex; i < limit && i < data.hourly.time.length; i++) {
                const timeStr = data.hourly.time[i];
                const temp = Math.round(data.hourly.temperature_2m[i]);
                const pop = data.hourly.precipitation_probability[i];
                const code = data.hourly.weather_code[i];
                
                const hourDate = new Date(timeStr);
                const dateStr = hourDate.toISOString().split('T')[0];
                const dayIdx = data.daily.time.indexOf(dateStr);
                const hourIsNight = checkIfNight(hourDate, data.daily, dayIdx !== -1 ? dayIdx : 0);
                const hourIcon = getWeatherDetails(code, hourIsNight);
                
                const hourLabel = hourDate.toLocaleTimeString('zh-TW', { hour: 'numeric', hour12: true });

                const card = document.createElement('div');
                card.className = "flex flex-col items-center justify-between bg-slate-50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-800/80 rounded-xl p-3 min-w-[85px] flex-shrink-0 text-center transition-colors";
                card.innerHTML = `
                    <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">${hourLabel}</span>
                    <i class="fa-solid ${hourIcon.icon} text-xl my-2"></i>
                    <span class="text-base font-bold text-slate-800 dark:text-white">${temp}°C</span>
                    <div class="text-[11px] text-blue-600 dark:text-blue-400 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-droplet text-[9px]"></i> ${pop}%
                    </div>
                `;
                hourlyContainer.appendChild(card);
            }

            // 4. 7天天氣預報 (包含降雨機率分類：>90% 高, >45% 中, 低)
            const dailyContainer = document.getElementById('daily-container');
            dailyContainer.innerHTML = '';

            const maxTemps = data.daily.temperature_2m_max.slice(0, 7).map(t => Math.round(t));
            const minTemps = data.daily.temperature_2m_min.slice(0, 7).map(t => Math.round(t));
            const popMaxs = data.daily.precipitation_probability_max ? data.daily.precipitation_probability_max.slice(0, 7) : Array(7).fill(0);
            
            const allVals = [...maxTemps, ...minTemps];
            const chartMax = Math.max(...allVals) + 1;
            const chartMin = Math.min(...allVals) - 1;
            const range = chartMax - chartMin || 1;
            const svgHeight = 60;

            function getY(val) {
                return svgHeight - ((val - chartMin) / range) * (svgHeight - 20) - 10;
            }

            const tableWrapper = document.createElement('div');
            tableWrapper.className = "min-w-[620px]";

            let daysHtml = '<div class="grid grid-cols-7 gap-2 text-center pb-3 border-b border-slate-200 dark:border-slate-800">';
            let iconsHtml = '<div class="grid grid-cols-7 gap-2 text-center py-3">';
            let maxTempHtml = '<div class="grid grid-cols-7 gap-2 text-center">';
            let minTempHtml = '<div class="grid grid-cols-7 gap-2 text-center">';
            let popRowHtml = '<div class="grid grid-cols-7 gap-2 text-center pt-3 border-t border-slate-200 dark:border-slate-800">';

            let maxPoints = [];
            let minPoints = [];

            for (let i = 0; i < 7; i++) {
                const dateStr = data.daily.time[i];
                const code = data.daily.weather_code[i];
                const dayIcon = getWeatherDetails(code, false);

                // 降雨機率分類邏輯
                const popVal = Math.round(popMaxs[i]);
                let popLevel = '低';
                let popBadgeClass = 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400';
                if (popVal > 90) {
                    popLevel = '高';
                    popBadgeClass = 'bg-blue-500/15 text-blue-600 dark:text-blue-400 font-bold';
                } else if (popVal > 45) {
                    popLevel = '中';
                    popBadgeClass = 'bg-cyan-500/15 text-cyan-600 dark:text-cyan-400 font-semibold';
                }

                const dateObj = new Date(dateStr);
                const dayName = i === 0 ? '今日' : i === 1 ? '明日' : dateObj.toLocaleDateString('zh-TW', { weekday: 'short' });
                const monthDay = `${dateObj.getMonth() + 1}-${dateObj.getDate()}`;

                const xCenter = i * 100 + 50;
                maxPoints.push(`${xCenter},${getY(maxTemps[i])}`);
                minPoints.push(`${xCenter},${getY(minTemps[i])}`);

                daysHtml += `
                    <div>
                        <div class="font-bold text-sm text-slate-800 dark:text-slate-100">${dayName}</div>
                        <div class="text-xs text-slate-400 mt-0.5">${monthDay}</div>
                    </div>
                `;

                iconsHtml += `
                    <div class="flex flex-col items-center justify-center">
                        <i class="fa-solid ${dayIcon.icon} text-xl mb-1"></i>
                        <span class="text-[11px] text-slate-500 dark:text-slate-400">${dayIcon.text}</span>
                    </div>
                `;

                maxTempHtml += `
                    <div class="text-sm font-semibold text-amber-600 dark:text-amber-400">
                        ${maxTemps[i]}°C
                    </div>
                `;

                minTempHtml += `
                    <div class="text-sm font-semibold text-blue-500 dark:text-blue-400">
                        ${minTemps[i]}°C
                    </div>
                `;

                popRowHtml += `
                    <div class="flex flex-col items-center justify-center gap-1">
                        <span class="text-xs font-medium text-slate-700 dark:text-slate-200">${popVal}%</span>
                        <span class="px-2 py-0.5 rounded text-[10px] ${popBadgeClass}">${popLevel}</span>
                    </div>
                `;
            }

            daysHtml += '</div>';
            iconsHtml += '</div>';
            maxTempHtml += '</div>';
            minTempHtml += '</div>';
            popRowHtml += '</div>';

            const maxPolyline = maxPoints.join(' ');
            const minPolyline = minPoints.join(' ');

            let svgChartHtml = `
                <div class="relative py-2">
                    <svg viewBox="0 0 700 ${svgHeight}" class="w-full h-[60px] overflow-visible">
                        <polyline fill="none" stroke="#f59e0b" stroke-width="2.5" points="${maxPolyline}" />
                        ${maxTemps.map((t, i) => `<circle cx="${i * 100 + 50}" cy="${getY(t)}" r="4" fill="#f59e0b" />`).join('')}
                        
                        <polyline fill="none" stroke="#3b82f6" stroke-width="2.5" points="${minPolyline}" />
                        ${minTemps.map((t, i) => `<circle cx="${i * 100 + 50}" cy="${getY(t)}" r="4" fill="#3b82f6" />`).join('')}
                    </svg>
                </div>
            `;

            tableWrapper.innerHTML = `
                ${daysHtml}
                ${iconsHtml}

            `;

            dailyContainer.appendChild(tableWrapper);
        }

        fetchWeatherData();
    </script>
