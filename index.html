<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macau Weather Dashboard</title>
    <!-- Tailwind CSS for modern dark-themed layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for weather icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar for horizontal hourly forecast */
        ::-webkit-scrollbar {
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center p-4 md:p-8">

    <!-- App Container -->
    <div class="w-full max-w-4xl space-y-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-cyan-400"></i> Macau Weather
                </h1>
                <p class="text-xs md:text-sm text-slate-400 mt-1">Lat: 22.1595, Lon: 113.5685 • GMT+8</p>
            </div>
            <div id="current-time" class="text-right text-xs md:text-sm text-cyan-300 font-medium">
                Loading time...
            </div>
        </header>

        <!-- Loading State -->
        <div id="loading" class="text-center py-20 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-cyan-400 mb-3"></i>
            <p>Fetching latest weather data...</p>
        </div>

        <!-- Main Content (Hidden until loaded) -->
        <div id="dashboard-content" class="space-y-6 hidden">

            <!-- Current Weather Section -->
            <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <h2 class="text-lg font-semibold mb-4 text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-sun text-yellow-400"></i> Current Weather
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                    <!-- Temp & Condition -->
                    <div class="flex items-center gap-6">
                        <div id="current-icon" class="text-6xl md:text-7xl">
                            <!-- Icon injected via JS -->
                        </div>
                        <div>
                            <div class="text-5xl md:text-6xl font-extrabold tracking-tight text-white" id="current-temp">--°C</div>
                            <div class="text-slate-400 font-medium text-lg mt-1" id="current-condition">--</div>
                        </div>
                    </div>
                    <!-- Details Grid -->
                    <div class="grid grid-cols-2 gap-4 border-t md:border-t-0 md:border-l border-slate-800 pt-4 md:pt-0 md:pl-6">
                        <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/60">
                            <div class="text-slate-400 text-xs uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-droplet text-blue-400"></i> Humidity
                            </div>
                            <div class="text-xl font-bold mt-1 text-slate-100" id="current-humidity">--%</div>
                        </div>
                        <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/60">
                            <div class="text-slate-400 text-xs uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-wind text-teal-400"></i> Wind Speed
                            </div>
                            <div class="text-xl font-bold mt-1 text-slate-100" id="current-wind-speed">-- km/h</div>
                        </div>
                        <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/60">
                            <div class="text-slate-400 text-xs uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-compass text-indigo-400"></i> Wind Direction
                            </div>
                            <div class="text-xl font-bold mt-1 text-slate-100" id="current-wind-dir">--</div>
                        </div>
                        <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/60">
                            <div class="text-slate-400 text-xs uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-wind text-emerald-400"></i> Air Quality (AQI)
                            </div>
                            <div class="text-xl font-bold mt-1 text-slate-100" id="current-aqi">--</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 24-Hour Hourly Forecast Section -->
            <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <h2 class="text-lg font-semibold mb-4 text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-clock text-cyan-400"></i> 24-Hour Forecast
                </h2>
                <div id="hourly-container" class="flex gap-4 overflow-x-auto pb-2 pt-1">
                    <!-- Hourly items dynamically injected here -->
                </div>
            </section>

            <!-- 7-Day Forecast Section -->
            <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <h2 class="text-lg font-semibold mb-4 text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-purple-400"></i> 7-Day Forecast
                </h2>
                <div id="daily-container" class="space-y-3">
                    <!-- Daily items dynamically injected here -->
                </div>
            </section>

        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        const LAT = 22.1595;
        const LON = 113.5685;

        // WMO Weather interpretation codes mapping to text & icons
        function getWeatherDetails(code) {
            switch (code) {
                case 0: return { text: 'Clear Sky', icon: 'fa-sun text-yellow-400' };
                case 1: 
                case 2: return { text: 'Partly Cloudy', icon: 'fa-cloud-sun text-yellow-200' };
                case 3: return { text: 'Overcast', icon: 'fa-cloud text-slate-400' };
                case 45:
                case 48: return { text: 'Foggy', icon: 'fa-smog text-slate-400' };
                case 51:
                case 53:
                case 55:
                case 56:
                case 57: return { text: 'Drizzle', icon: 'fa-cloud-rain text-blue-300' };
                case 61:
                case 63:
                case 65:
                case 66:
                case 67: return { text: 'Rain', icon: 'fa-cloud-showers-heavy text-blue-400' };
                case 71:
                case 73:
                case 75:
                case 77: return { text: 'Snow', icon: 'fa-snowflake text-blue-200' };
                case 80:
                case 81:
                case 82: return { text: 'Rain Showers', icon: 'fa-cloud-rain text-blue-400' };
                case 95:
                case 96:
                case 99: return { text: 'Thunderstorm', icon: 'fa-bolt text-yellow-500' };
                default: return { text: 'Unknown', icon: 'fa-cloud text-slate-400' };
            }
        }

        // Convert degrees to cardinal wind directions
        function getWindDirection(degrees) {
            const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            const index = Math.round((degrees % 360) / 22.5);
            return directions[index % 16];
        }

        // AQI color formatting
        function getAqiDescription(aqi) {
            if (aqi <= 50) return `<span class="text-green-400">${aqi} (Good)</span>`;
            if (aqi <= 100) return `<span class="text-yellow-400">${aqi} (Moderate)</span>`;
            if (aqi <= 150) return `<span class="text-orange-400">${aqi} (Sensitive)</span>`;
            if (aqi <= 200) return `<span class="text-red-400">${aqi} (Unhealthy)</span>`;
            return `<span class="text-purple-400">${aqi} (Hazardous)</span>`;
        }

        async function fetchWeatherData() {
            try {
                // Open-Meteo Weather API + Air Quality API
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia/Macau`;
                const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=us_aqi`;

                const [weatherRes, aqiRes] = await Promise.all([
                    fetch(weatherUrl),
                    fetch(aqiUrl).catch(() => null)
                ]);

                const data = await weatherRes.json();
                const aqiData = aqiRes ? await aqiRes.json() : null;

                renderDashboard(data, aqiData);

                // Show content and hide loading spinner
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');

            } catch (error) {
                console.error("Failed to fetch weather data:", error);
                document.getElementById('loading').innerHTML = `<p class="text-red-400">Failed to load weather data. Please check your network connection.</p>`;
            }
        }

        function renderDashboard(data, aqiData) {
            // Clock info setup for GMT+8
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleString('en-US', { timeZone: 'Asia/Macau', dateStyle: 'medium', timeStyle: 'short' });

            // 1. Current Weather
            const curr = data.current;
            const weatherInfo = getWeatherDetails(curr.weather_code);
            
            document.getElementById('current-icon').innerHTML = `<i class="fa-solid ${weatherInfo.icon}"></i>`;
            document.getElementById('current-temp').innerText = `${Math.round(curr.temperature_2m)}°C`;
            document.getElementById('current-condition').innerText = weatherInfo.text;
            document.getElementById('current-humidity').innerText = `${curr.relative_humidity_2m}%`;
            document.getElementById('current-wind-speed').innerText = `${curr.wind_speed_10m} km/h`;
            document.getElementById('current-wind-dir').innerText = getWindDirection(curr.wind_direction_10m);
            
            const aqiValue = aqiData && aqiData.current ? aqiData.current.us_aqi : null;
            document.getElementById('current-aqi').innerHTML = aqiValue !== null ? getAqiDescription(aqiValue) : 'N/A';

            // 2. 24-Hour Forecast
            const hourlyContainer = document.getElementById('hourly-container');
            hourlyContainer.innerHTML = '';
            
            // Find current hour index to start from now
            const currentHourIndex = data.hourly.time.findIndex(timeStr => new Date(timeStr) >= new Date()) || 0;
            const limit = currentHourIndex + 24;

            for (let i = currentHourIndex; i < limit && i < data.hourly.time.length; i++) {
                const timeStr = data.hourly.time[i];
                const temp = Math.round(data.hourly.temperature_2m[i]);
                const pop = data.hourly.precipitation_probability[i];
                const code = data.hourly.weather_code[i];
                const hourIcon = getWeatherDetails(code);
                
                const hourLabel = new Date(timeStr).toLocaleTimeString([], { hour: 'numeric', hour12: true });

                const card = document.createElement('div');
                card.className = "flex flex-col items-center justify-between bg-slate-950/40 border border-slate-800/80 rounded-xl p-3 min-w-[85px] flex-shrink-0 text-center";
                card.innerHTML = `
                    <span class="text-xs text-slate-400 font-medium">${hourLabel}</span>
                    <i class="fa-solid ${hourIcon.icon} text-xl my-2"></i>
                    <span class="text-base font-bold text-white">${temp}°C</span>
                    <div class="text-[11px] text-blue-400 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-droplet text-[9px]"></i> ${pop}%
                    </div>
                `;
                hourlyContainer.appendChild(card);
            }

            // 3. 7-Day Forecast
            const dailyContainer = document.getElementById('daily-container');
            dailyContainer.innerHTML = '';

            for (let i = 0; i < 7; i++) {
                const dateStr = data.daily.time[i];
                const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
                const minTemp = Math.round(data.daily.temperature_2m_min[i]);
                const code = data.daily.weather_code[i];
                const dayIcon = getWeatherDetails(code);

                const dateObj = new Date(dateStr);
                const dayLabel = i === 0 ? 'Today' : dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-slate-950/40 border border-slate-800/80 px-4 py-3 rounded-xl";
                row.innerHTML = `
                    <div class="w-28 text-sm font-medium text-slate-300">${dayLabel}</div>
                    <div class="flex items-center gap-2 text-sm text-slate-200">
                        <i class="fa-solid ${dayIcon.icon} w-6 text-center"></i>
                        <span class="hidden md:inline">${dayIcon.text}</span>
                    </div>
                    <div class="text-sm font-semibold flex gap-3 text-right">
                        <span class="text-white">${maxTemp}°</span>
                        <span class="text-slate-500">${minTemp}°</span>
                    </div>
                `;
                dailyContainer.appendChild(row);
            }
        }

        // Initialize on load
        fetchWeatherData();
    </script>
</body>
</html>
