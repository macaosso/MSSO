<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實時天氣 | Real-Time Weather Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .glow-cyan {
            text-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
        }
        .badge-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-gray-950 to-black">

    <div class="w-full max-w-5xl glass-card rounded-2xl p-6 sm:p-8 relative overflow-hidden">
        
        <div class="absolute -top-24 -right-24 w-72 h-72 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-72 h-72 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-5 mb-6 gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 badge-pulse"></span>
                    <h1 class="text-xs uppercase tracking-widest text-emerald-400 font-semibold mono">實時天氣</h1>
                </div>
                <p id="pub-date" class="text-xl sm:text-2xl font-bold tracking-tight text-white">載入中</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="px-3 py-1 rounded-full text-xs font-medium bg-slate-800/80 text-cyan-400 border border-cyan-500/20 mono" id="valid-time"></span>
                
                <span class="px-3 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20 font-semibold" id="weather-status-badge"></span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
            
            <div class="lg:col-span-4 flex items-center gap-6 bg-slate-900/50 p-6 rounded-xl border border-slate-800/80">
                <img id="weather-icon" src="" alt="Weather Icon" class="w-20 h-20 drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                <div>
                    <div class="flex items-baseline">
                        <span id="temp-value" class="text-6xl sm:text-7xl font-extrabold text-white tracking-tighter glow-cyan">--</span>
                        <span class="text-2xl font-semibold text-cyan-400 ml-1" id="temp-unit">°C</span>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 grid grid-cols-2 sm:grid-cols-4 gap-4">
                
                <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-800/60 flex flex-col justify-between">
                    <div class="flex items-center justify-between text-slate-400 mb-2">
                        <span class="text-xs uppercase tracking-wider font-semibold">相對濕度</span>
                        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                    </div>
                    <div>
                        <span id="humidity-value" class="text-2xl sm:text-3xl font-bold text-white mono">--</span>
                        <span id="humidity-unit" class="text-slate-400 text-sm"></span>
                    </div>
                </div>

                <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-800/60 flex flex-col justify-between">
                    <div class="flex items-center justify-between text-slate-400 mb-2">
                        <span class="text-xs uppercase tracking-wider font-semibold">風速</span>
                        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.59 4.59A2 2 0 1111 8H2m10.59 11.41A2 2 0 1014 16H2m15.73-8.27A2.5 2.5 0 1119 12H2"></path></svg>
                    </div>
                    <div>
                        <span id="wind-speed-value" class="text-2xl sm:text-3xl font-bold text-white mono">--</span>
                        <span id="wind-speed-unit" class="text-slate-400 text-sm"></span>
                    </div>
                </div>

                <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-800/60 flex flex-col justify-between">
                    <div class="flex items-center justify-between text-slate-400 mb-2">
                        <span class="text-xs uppercase tracking-wider font-semibold">風向</span>
                        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </div>
                    <div>
                        <span id="wind-desc" class="text-xl sm:text-2xl font-bold text-white">--</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-1 mono" id="wind-dir-val">--</p>
                </div>

                <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-800/60 flex flex-col justify-between">
                    <div class="flex items-center justify-between text-slate-400 mb-2">
                        <span class="text-xs uppercase tracking-wider font-semibold">紫外線</span>
                        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </div>
                    <div class="flex items-baseline gap-2">
                        <span id="feels-like-level" class="text-2xl sm:text-3xl font-bold text-white mono">--</span>
                        <span id="feels-like-desc" class="px-2 py-0.5 rounded text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30">--</span>
                    </div>
                </div>

            </div>

        </div>

        <div class="mt-6 pt-4 border-t border-slate-800/80 flex flex-col sm:flex-row justify-between items-center text-xs text-slate-500 font-mono">
            <span>數據來源：地球物理氣象局</span>
        </div>

    </div>

    <script>
        async function fetchWeatherData() {
            try {
                // Fetch the auto-saved XML file from your repository data directory (No CORS issues!)
                const response = await fetch('./data/actual_brief.xml?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Failed to load local XML telemetry');
                
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");

                // Extract values based on the SMG schema
                const sysPubdate = xmlDoc.querySelector("SysPubdate")?.textContent || "";
                const validFor = xmlDoc.querySelector("ValidFor")?.textContent || "";
                
                const tempVal = xmlDoc.querySelector("Temperature Value")?.textContent || "--";
                const tempUnit = xmlDoc.querySelector("Temperature MeasureUnit")?.textContent || "°C";

                const humidityVal = xmlDoc.querySelector("Humidity Value")?.textContent || "--";
                const humidityUnit = xmlDoc.querySelector("Humidity MeasureUnit")?.textContent || "%";

                const windSpeedVal = xmlDoc.querySelector("WindSpeed Value")?.textContent || "--";
                const windSpeedUnit = xmlDoc.querySelector("WindSpeed MeasureUnit")?.textContent || "km/h";
                const windSpeedDesc = xmlDoc.querySelector("WindSpeedDescription")?.textContent || "";

                const windDirVal = xmlDoc.querySelector("WindDirection Value")?.textContent || "--";
                const windDesc = xmlDoc.querySelector("WindDescription")?.textContent || "--";

                const iconUrl = xmlDoc.querySelector("IconURL")?.textContent || "";
                
                const feelsLevel = xmlDoc.querySelector("FeelsLikeLevel")?.textContent || "--";
                const feelsDesc = xmlDoc.querySelector("FeelsLikeDescription")?.textContent || "--";

                // Populate UI Elements
                document.getElementById("pub-date").textContent = validFor;
                document.getElementById("valid-time").textContent = `Valid: ${validFor}`;
                
                document.getElementById("temp-value").textContent = tempVal;
                document.getElementById("temp-unit").textContent = tempUnit;

                document.getElementById("humidity-value").textContent = humidityVal;
                document.getElementById("humidity-unit").textContent = humidityUnit;

                document.getElementById("wind-speed-value").textContent = windSpeedVal;
                document.getElementById("wind-speed-unit").textContent = windSpeedUnit;
                document.getElementById("wind-speed-desc").textContent = windSpeedDesc;

                document.getElementById("wind-desc").textContent = windDesc;

                if (iconUrl) {
                    document.getElementById("weather-icon").src = iconUrl;
                }

                document.getElementById("feels-like-level").textContent = feelsLevel;
                document.getElementById("feels-like-desc").textContent = feelsDesc;
                
                if(feelsDesc) {
                    document.getElementById("weather-status-badge").textContent = `體感：${feelsDesc}`;
                }

            } catch (error) {
                console.error("Telemetry sync error:", error);
                document.getElementById("pub-date").textContent = "Telemetry Synchronization Error";
                document.getElementById("sync-status").textContent = "STATUS: OFFLINE // CHECK REPO PATH";
            }
        }

        // Initialize on load
        fetchWeatherData();
    </script>
</body>
</html>
