<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>澳門天氣儀表板</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center p-4 md:p-8">

    <!-- 容器 -->
    <div class="w-full max-w-4xl space-y-6">
        
        <!-- 標頭 -->
        <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-cyan-400"></i> 澳門天氣
                </h1>
            </div>
            <div id="current-time" class="text-right text-xs md:text-sm text-cyan-300 font-medium">
                載入中...
            </div>
        </header>

        <!-- 載入狀態 -->
        <div id="loading" class="text-center py-20 text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-cyan-400 mb-3"></i>
            <p>正在取得最新天氣數據...</p>
        </div>

        <!-- 主要內容 -->
        <div id="dashboard-content" class="space-y-6 hidden">

            <!-- 即時天氣 -->
            <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <h2 class="text-lg font-semibold mb-4 text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-sun text-yellow-400"></i> 即時天氣
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                    <div class="flex items-center gap-6">
                        <div id="current-icon" class="text-6xl md:text-7xl"></div>
                        <div>
                            <div class="text-5xl md:text-6xl font-extrabold tracking-tight text-white" id="current-temp">--°C</div>
                            <div class="text-slate-400 font-medium text-lg mt-1" id="current-condition">--</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 border-t md:border-t-0 md:border-l border-slate-800 pt-4 md:pt-0 md:pl-6">
                        <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/60">
                            <div class="text-slate-400 text-xs uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-droplet text-blue-400"></i> 相對濕度
                            </div>
                            <div class="text-xl font-bold mt-1 text-slate-100" id="current-humidity">--%</div>
                        </div>
                        <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/60">
                            <div class="text-slate-400 text-xs uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-wind text-teal-400"></i> 風速
                            </div>
                            <div class="text-xl font-bold mt-1 text-slate-100" id="current-wind-speed">-- km/h</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 分區天氣 -->
            <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <h2 class="text-lg font-semibold mb-4 text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-map-location-dot text-emerald-400"></i> 分區天氣
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="district-container">
                    <!-- 動態載入分區天氣 -->
                </div>
            </section>

            <!-- 24小時天氣預報 -->
            <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <h2 class="text-lg font-semibold mb-4 text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-clock text-cyan-400"></i> 24小時天氣預報
                </h2>
                <div id="hourly-container" class="flex gap-4 overflow-x-auto pb-2 pt-1"></div>
            </section>

            <!-- 7天天氣預報 -->
            <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <h2 class="text-lg font-semibold mb-4 text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-purple-400"></i> 7天天氣預報
                </h2>
                <div id="daily-container" class="space-y-3"></div>
            </section>

        </div>

    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const LAT = 22.1595;
        const LON = 113.5685;

        function getWeatherDetails(code) {
            switch (code) {
                case 0: return { text: '晴朗', icon: 'fa-sun text-yellow-400' };
                case 1: 
                case 2: return { text: '局部多雲', icon: 'fa-cloud-sun text-yellow-200' };
                case 3: return { text: '陰天', icon: 'fa-cloud text-slate-400' };
                case 45:
                case 48: return { text: '有霧', icon: 'fa-smog text-slate-400' };
                case 51:
                case 53:
                case 55:
                case 56:
                case 57: return { text: '毛毛雨', icon: 'fa-cloud-rain text-blue-300' };
                case 61:
                case 63:
                case 65:
                case 66:
                case 67: return { text: '下雨', icon: 'fa-cloud-showers-heavy text-blue-400' };
                case 71:
                case 73:
                case 75:
                case 77: return { text: '下雪', icon: 'fa-snowflake text-blue-200' };
                case 80:
                case 81:
                case 82: return { text: '驟雨', icon: 'fa-cloud-rain text-blue-400' };
                case 95:
                case 96:
                case 99: return { text: '雷暴', icon: 'fa-bolt text-yellow-500' };
                default: return { text: '未知', icon: 'fa-cloud text-slate-400' };
            }
        }

        async function fetchWeatherData() {
            try {
                // 主氣象數據 (氹仔/通用)
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia/Macau`;
                
                // 分區天氣數據：澳門、氹仔、路環
                const districtUrl = `https://api.open-meteo.com/v1/forecast?latitude=22.1957537,22.1595,22.1178268&longitude=113.5443291,113.5685,113.5524237&current=temperature_2m,weather_code&timezone=Asia/Macau`;

                const [weatherRes, districtRes] = await Promise.all([
                    fetch(weatherUrl),
                    fetch(districtUrl)
                ]);

                const data = await weatherRes.json();
                const districtData = await districtRes.json();

                renderDashboard(data, districtData);

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');

            } catch (error) {
                console.error("無法載入天氣數據：", error);
                document.getElementById('loading').innerHTML = `<p class="text-red-400">無法載入天氣數據，請檢查網絡連線。</p>`;
            }
        }

        function renderDashboard(data, districtData) {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleString('zh-TW', { timeZone: 'Asia/Macau', dateStyle: 'medium', timeStyle: 'short' });

            // 1. 即時天氣
            const curr = data.current;
            const weatherInfo = getWeatherDetails(curr.weather_code);
            
            document.getElementById('current-icon').innerHTML = `<i class="fa-solid ${weatherInfo.icon}"></i>`;
            document.getElementById('current-temp').innerText = `${Math.round(curr.temperature_2m)}°C`;
            document.getElementById('current-condition').innerText = weatherInfo.text;
            document.getElementById('current-humidity').innerText = `${curr.relative_humidity_2m}%`;
            document.getElementById('current-wind-speed').innerText = `${curr.wind_speed_10m} km/h`;

            // 2. 分區天氣
            const districtContainer = document.getElementById('district-container');
            districtContainer.innerHTML = '';
            const districtNames = ['澳門', '氹仔', '路環'];

            districtData.forEach((loc, index) => {
                const dName = districtNames[index];
                const dTemp = Math.round(loc.current.temperature_2m);
                const dWeather = getWeatherDetails(loc.current.weather_code);

                const card = document.createElement('div');
                card.className = "bg-slate-950/50 border border-slate-800/60 p-4 rounded-xl flex items-center justify-between";
                card.innerHTML = `
                    <div>
                        <div class="text-slate-400 text-xs">${dName}</div>
                        <div class="text-lg font-bold text-white mt-0.5">${dTemp}°C</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-300 hidden sm:inline">${dWeather.text}</span>
                        <i class="fa-solid ${dWeather.icon} text-2xl"></i>
                    </div>
                `;
                districtContainer.appendChild(card);
            });

            // 3. 24小時天氣預報
            const hourlyContainer = document.getElementById('hourly-container');
            hourlyContainer.innerHTML = '';
            
            const currentHourIndex = data.hourly.time.findIndex(timeStr => new Date(timeStr) >= new Date()) || 0;
            const limit = currentHourIndex + 24;

            for (let i = currentHourIndex; i < limit && i < data.hourly.time.length; i++) {
                const timeStr = data.hourly.time[i];
                const temp = Math.round(data.hourly.temperature_2m[i]);
                const pop = data.hourly.precipitation_probability[i];
                const code = data.hourly.weather_code[i];
                const hourIcon = getWeatherDetails(code);
                
                const hourLabel = new Date(timeStr).toLocaleTimeString('zh-TW', { hour: 'numeric', hour12: true });

                const card = document.createElement('div');
                card.className = "flex flex-col items-center justify-between bg-slate-950/40 border border-slate-800/80 rounded-xl p-3 min-w-[85px] flex-shrink-0 text-center";
                card.innerHTML = `
                    <span class="text-xs text-slate-400 font-medium">${hourLabel}</span>
                    <i class="fa-solid ${hourIcon.icon} text-xl my-2"></i>
                    <span class="text-base font-bold text-white">${temp}°C</span>
                    <div class="text-[11px] text-blue-400 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-droplet text-[9px]"></i> ${pop}%
                    </div>
                `;
                hourlyContainer.appendChild(card);
            }

            // 4. 7天天氣預報 (含濕度)
            const dailyContainer = document.getElementById('daily-container');
            dailyContainer.innerHTML = '';

            for (let i = 0; i < 7; i++) {
                const dateStr = data.daily.time[i];
                const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
                const minTemp = Math.round(data.daily.temperature_2m_min[i]);
                const code = data.daily.weather_code[i];
                const dayIcon = getWeatherDetails(code);

                // 計算當天每小時濕度的平均值
                const dayHumidities = data.hourly.relative_humidity_2m.slice(i * 24, (i + 1) * 24);
                const avgHum = Math.round(dayHumidities.reduce((a, b) => a + b, 0) / dayHumidities.length);

                const dateObj = new Date(dateStr);
                const dayLabel = i === 0 ? '今天' : dateObj.toLocaleDateString('zh-TW', { weekday: 'short', month: 'numeric', day: 'numeric' });

                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-slate-950/40 border border-slate-800/80 px-4 py-3 rounded-xl";
                row.innerHTML = `
                    <div class="w-28 text-sm font-medium text-slate-300">${dayLabel}</div>
                    <div class="flex items-center gap-2 text-sm text-slate-200">
                        <i class="fa-solid ${dayIcon.icon} w-6 text-center"></i>
                        <span class="hidden md:inline">${dayIcon.text}</span>
                    </div>
                    <div class="flex items-center gap-4 text-sm">
                        <span class="text-blue-400 text-xs flex items-center gap-1"><i class="fa-solid fa-droplet text-[10px]"></i> ${avgHum}%</span>
                        <div class="font-semibold flex gap-3 text-right">
                            <span class="text-white">${maxTemp}°</span>
                            <span class="text-slate-500">${minTemp}°</span>
                        </div>
                    </div>
                `;
                dailyContainer.appendChild(row);
            }
        }

        fetchWeatherData();
    </script>
</body>
</html>
